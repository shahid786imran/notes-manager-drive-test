<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OAuth Multi-Page Test — Page A</title>

<script src="https://accounts.google.com/gsi/client"></script>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  padding:30px;
}
.box{
  max-width:700px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,.1);
}
.status{
  margin-top:20px;
  padding:15px;
  background:#f1f3f4;
  border-radius:8px;
  white-space:pre-wrap;
}
.success{color:#188038;font-weight:bold}
.warning{color:#b06000;font-weight:bold}
button{
  padding:12px 18px;
  border:0;
  border-radius:7px;
  background:#1a73e8;
  color:white;
  cursor:pointer;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h1>OAuth Multi-Page Test — Page A</h1>

<p>
<strong>Code Updated:</strong>
10 September 2026 — 01:00:00 PKT
</p>

<p>
یہ Page A ہے۔
</p>

<div id="status" class="status">
Google authorization system load ہو رہا ہے...
</div>

<button id="driveBtn" style="display:none;">
Test Drive Access
</button>

<script>

const CLIENT_ID =
"262106898132-tsn94p3vvpf34do0ommc6rai2mtc5sh6.apps.googleusercontent.com";

const DRIVE_SCOPE =
"https://www.googleapis.com/auth/drive";

let tokenClient = null;
let accessToken = null;

const status =
document.getElementById("status");

const driveBtn =
document.getElementById("driveBtn");

function setStatus(text,type=""){
  status.className="status "+type;
  status.textContent=text;
}

function tokenCallback(response){

  console.log("OAuth response:",response);

  if(!response || response.error){

    setStatus(
      "Authorization failed.\n\n"+
      JSON.stringify(response,null,2),
      "warning"
    );

    return;
  }

  accessToken=response.access_token;

  driveBtn.style.display="inline-block";

  setStatus(
    "Google Drive Authorization کامیاب! ✓\n\n"+
    "Page A کو Access Token مل گیا۔\n\n"+
    "اب Test Drive Access دبائیں۔",
    "success"
  );
}

function startOAuth(){

  if(
    !window.google ||
    !google.accounts ||
    !google.accounts.oauth2
  ){

    setStatus(
      "Google Identity Services load نہیں ہوئی۔"
    );

    return;
  }

  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id:CLIENT_ID,

      scope:DRIVE_SCOPE,

      callback:tokenCallback

    });

  setStatus(
    "Google Account Selection کھولی جا رہی ہے..."
  );

  setTimeout(function(){

    tokenClient.requestAccessToken({
      prompt:""
    });

  },500);
}

driveBtn.addEventListener(
"click",
async function(){

  if(!accessToken)return;

  driveBtn.disabled=true;

  try{

    const response=await fetch(
      "https://www.googleapis.com/drive/v3/files"+
      "?pageSize=10"+
      "&fields=files(id,name,mimeType)",
      {
        headers:{
          "Authorization":
          "Bearer "+accessToken
        }
      }
    );

    const data=await response.json();

    if(!response.ok){
      throw new Error(
        JSON.stringify(data,null,2)
      );
    }

    let text=
      "Google Drive API ACCESS کامیاب! ✓\n\n";

    data.files.forEach(function(file,index){

      text+=
        (index+1)+". "+
        file.name+
        "\nID: "+
        file.id+
        "\n\n";

    });

    setStatus(text,"success");

  }
  catch(error){

    setStatus(
      "Drive API Error:\n\n"+
      error.message,
      "warning"
    );

  }
  finally{

    driveBtn.disabled=false;

  }

});

window.addEventListener(
"load",
startOAuth
);

</script>

</div>

</body>
</html>
