<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OAuth Version Test — Version 1</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f5f5f5;
    }

    .box {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    h1 {
      margin-top: 0;
    }

    .version {
      font-size: 22px;
      font-weight: bold;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      background: #eee;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Google OAuth Version Test</h1>

  <div class="version">
    VERSION 1 — STABLE TEST
  </div>

  <p>
    یہ Version 1 ہے۔
  </p>

  <p>
    اگر یہ page صحیح چل رہا ہے تو ہم اسی file میں
    Version 2 بنائیں گے۔
  </p>

  <div id="status">
    Loading...
  </div>

</div>

<script>

const CLIENT_ID =
"262106898132-tsn94p3vvpf34do0ommc6rai2mtc5sh6.apps.googleusercontent.com";

const DRIVE_SCOPE =
"https://www.googleapis.com/auth/drive";

let accessToken = null;

let tokenClient = null;


function setStatus(text) {
  document.getElementById("status").textContent = text;
}


function tokenCallback(response) {

  if (!response || response.error) {

    setStatus(
      "Authorization failed: " +
      (response?.error || "Unknown error")
    );

    return;
  }

  accessToken = response.access_token;

  setStatus(
    "Google Authorization Successful — Version 1"
  );
}


function startOAuth() {

  tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id: CLIENT_ID,

      scope: DRIVE_SCOPE,

      callback: tokenCallback

    });


  setStatus(
    "Google Account Selection..."
  );


  setTimeout(function() {

    tokenClient.requestAccessToken({
      prompt: ""
    });

  }, 500);

}


window.addEventListener(
  "load",
  startOAuth
);

</script>

<script
  src="https://accounts.google.com/gsi/client"
  async
  defer>
</script>

</body>
</html>
