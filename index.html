<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Google Drive Authorization Test</title>

  <!--
  ============================================================
  GOOGLE DRIVE OAUTH TEST
  ============================================================

  TEST VERSION:
  Account Selection Auto-Authorization

  CODE UPDATED:
  10 September 2026 — 00:53:00 PKT

  EXPECTED FLOW:

  PAGE OPEN
       ↓
  GOOGLE ACCOUNT SELECTION
       ↓
  USER CLICKS ACCOUNT
       ↓
  GOOGLE WINDOW CLOSES
       ↓
  ACCESS TOKEN RECEIVED
       ↓
  DRIVE AUTHORIZATION READY

  No:
  - Continue button
  - Allow button
  - Authorize button
  after account selection.

  IMPORTANT:
  No Client Secret is used in this frontend.
  ============================================================
  -->

  <script src="https://accounts.google.com/gsi/client"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
      background: #f5f5f5;
      color: #222;
    }

    .box {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.10);
    }

    h1 {
      margin-top: 0;
    }

    .version {
      background: #eef3ff;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .status {
      margin-top: 20px;
      padding: 16px;
      background: #f1f3f4;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .success {
      color: #188038;
      font-weight: bold;
    }

    .warning {
      color: #b06000;
      font-weight: bold;
    }

    .error {
      color: #d93025;
      font-weight: bold;
    }

    button {
      padding: 12px 18px;
      margin-top: 15px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 15px;
      background: #188038;
      color: white;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #driveResult {
      margin-top: 20px;
      padding: 15px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-x: auto;
    }

    .hidden {
      display: none;
    }

  </style>
</head>


<body>

<div class="box">

  <h1>Google Drive Authorization Test</h1>

  <div class="version">

    <strong>Test:</strong>
    Account Selection Auto-Authorization
    <br>

    <strong>Code Updated:</strong>
    10 September 2026 — 00:53:00 PKT
    <br>

    <strong>Runtime:</strong>
    <span id="runtime"></span>

  </div>


  <p>
    Page کھلنے کے بعد Google Account Selection خودکار طور پر
    کھلنے کی کوشش کرے گی۔
  </p>


  <div id="status" class="status">
    Google Identity Services load ہو رہی ہے...
  </div>


  <button
    id="driveButton"
    class="hidden"
  >
    Test Drive Access
  </button>


  <div id="driveResult"></div>

</div>


<script>

  /*
  ============================================================
  CONFIGURATION
  ============================================================
  */

  const CLIENT_ID =
    "262106898132-tsn94p3vvpf34do0ommc6rai2mtc5sh6.apps.googleusercontent.com";


  const DRIVE_SCOPE =
    "https://www.googleapis.com/auth/drive";


  /*
  ============================================================
  RUNTIME CLOCK
  ============================================================
  */

  function updateRuntime() {

    const now = new Date();

    const time =
      now.toLocaleString(
        "en-GB",
        {
          timeZone: "Asia/Karachi",

          year: "numeric",
          month: "2-digit",
          day: "2-digit",

          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",

          hour12: false
        }
      );

    document.getElementById("runtime").textContent =
      time + " PKT";
  }


  updateRuntime();

  setInterval(
    updateRuntime,
    1000
  );


  /*
  ============================================================
  VARIABLES
  ============================================================
  */

  let tokenClient = null;

  let accessToken = null;


  /*
  ============================================================
  ELEMENTS
  ============================================================
  */

  const status =
    document.getElementById("status");

  const driveButton =
    document.getElementById("driveButton");

  const driveResult =
    document.getElementById("driveResult");


  /*
  ============================================================
  STATUS FUNCTION
  ============================================================
  */

  function showStatus(
    message,
    className = ""
  ) {

    status.className =
      "status " + className;

    status.textContent =
      message;
  }


  /*
  ============================================================
  GOOGLE TOKEN CALLBACK
  ============================================================
  */

  function tokenCallback(response) {

    console.log(
      "Google OAuth callback:",
      response
    );


    /*
    ------------------------------------------------------------
    ERROR
    ------------------------------------------------------------
    */

    if (
      !response ||
      response.error
    ) {

      accessToken = null;

      driveButton.classList.add(
        "hidden"
      );


      showStatus(

        "Google authorization مکمل نہیں ہوئی۔\n\n" +

        "Google نے token واپس نہیں دیا۔\n\n" +

        "Error:\n" +

        JSON.stringify(
          response,
          null,
          2
        ),

        "warning"

      );

      return;
    }


    /*
    ------------------------------------------------------------
    SUCCESS
    ------------------------------------------------------------
    */

    accessToken =
      response.access_token;


    /*
    ------------------------------------------------------------
    IMPORTANT:
    We do NOT display the actual token.
    ------------------------------------------------------------
    */


    driveButton.classList.remove(
      "hidden"
    );


    showStatus(

      "Google Drive Authorization کامیاب! ✓\n\n" +

      "Google Account منتخب ہونے کے بعد OAuth window بند ہو گئی۔\n\n" +

      "Access Token کامیابی سے حاصل ہو گیا۔\n\n" +

      "اب Drive API test کیا جا سکتا ہے۔",

      "success"

    );

  }


  /*
  ============================================================
  INITIALIZE GOOGLE TOKEN CLIENT
  ============================================================
  */

  function initializeGoogle() {

    /*
    ------------------------------------------------------------
    Check Google Identity Services
    ------------------------------------------------------------
    */

    if (
      !window.google ||
      !google.accounts ||
      !google.accounts.oauth2
    ) {

      showStatus(

        "Google Identity Services load نہیں ہوئی۔\n\n" +

        "Page کو دوبارہ reload کریں۔",

        "error"

      );

      return;
    }


    /*
    ------------------------------------------------------------
    Create Token Client
    ------------------------------------------------------------
    */

    tokenClient =
      google.accounts.oauth2.initTokenClient({

        client_id:
          CLIENT_ID,

        scope:
          DRIVE_SCOPE,

        callback:
          tokenCallback

      });


    showStatus(

      "Google authorization system تیار ہے۔\n\n" +

      "Google Account Selection خودکار طور پر کھولی جا رہی ہے..."

    );


    /*
    ============================================================
    AUTOMATIC ACCOUNT SELECTION
    ============================================================

    prompt: ""

    مقصد:

    - Existing Google authorization استعمال کرنا
    - Consent دوبارہ force نہ کرنا
    - Account selection آنے کی صورت میں صرف account
      select کرنا
    - Account selection کے بعد Google window close ہونا
    - Token callback میں واپس آنا

    ============================================================
    */

    setTimeout(
      function() {

        try {

          tokenClient.requestAccessToken({

            prompt: ""

          });

        }
        catch (error) {

          console.error(
            "OAuth request error:",
            error
          );


          showStatus(

            "Google authorization window نہیں کھل سکی۔\n\n" +

            "Error:\n" +

            error.message,

            "error"

          );

        }

      },

      500
    );

  }


  /*
  ============================================================
  DRIVE API TEST
  ============================================================
  */

  driveButton.addEventListener(
    "click",
    async function() {

      if (!accessToken) {

        showStatus(

          "Access Token موجود نہیں ہے۔",

          "warning"

        );

        return;
      }


      driveButton.disabled =
        true;


      driveResult.textContent =
        "";


      showStatus(

        "Google Drive API سے data حاصل کیا جا رہا ہے..."

      );


      try {

        const response =
          await fetch(

            "https://www.googleapis.com/drive/v3/files" +

            "?pageSize=10" +

            "&fields=files(id,name,mimeType)",

            {

              method: "GET",

              headers: {

                "Authorization":
                  "Bearer " + accessToken

              }

            }

          );


        const data =
          await response.json();


        /*
        --------------------------------------------------------
        API ERROR
        --------------------------------------------------------
        */

        if (!response.ok) {

          throw new Error(

            JSON.stringify(
              data,
              null,
              2
            )

          );

        }


        /*
        --------------------------------------------------------
        SUCCESS
        --------------------------------------------------------
        */

        let output =
          "Google Drive API ACCESS کامیاب! ✓\n\n";


        if (
          data.files &&
          data.files.length
        ) {

          data.files.forEach(
            function(
              file,
              index
            ) {

              output +=

                (index + 1) +

                ". " +

                file.name +

                "\n" +

                "ID: " +

                file.id +

                "\n" +

                "Type: " +

                file.mimeType +

                "\n\n";

            }
          );

        }
        else {

          output +=
            "No files returned.";

        }


        driveResult.textContent =
          output;


        showStatus(

          "Google Drive Authorization کامیاب! ✓\n\n" +

          "Google Drive API بھی کامیابی سے access ہو گئی ہے۔",

          "success"

        );

      }
      catch (error) {

        console.error(
          error
        );


        driveResult.textContent =
          error.message;


        showStatus(

          "Google Drive API access ناکام ہوئی۔\n\n" +

          error.message,

          "error"

        );

      }
      finally {

        driveButton.disabled =
          false;

      }

    }
  );


  /*
  ============================================================
  PAGE START
  ============================================================
  */

  window.addEventListener(
    "load",
    function() {

      initializeGoogle();

    }
  );

</script>

</body>
</html>
