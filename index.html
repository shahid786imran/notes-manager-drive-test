<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Notes Manager — Google Drive</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#202124;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    display:flex;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:270px;
    background:#202124;
    color:white;
    z-index:1000;
    transform:translateX(-100%);
    transition:.25s ease;
    display:flex;
    flex-direction:column;
    box-shadow:3px 0 15px rgba(0,0,0,.25);
}

.sidebar.open{
    transform:translateX(0);
}

.sidebar-header{
    padding:16px;
    border-bottom:1px solid #444;
}

.sidebar-title{
    font-size:20px;
    font-weight:bold;
}

.sidebar-scroll{
    overflow-y:auto;
    flex:1;
    padding:8px;
}

.side-item{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 10px;
    margin:2px 0;
    border-radius:7px;
    color:#eee;
}

.side-item:hover{
    background:#303134;
}

.side-item.active{
    background:#3c4043;
}

.side-count{
    margin-left:auto;
    opacity:.7;
    font-size:12px;
}

.side-edit{
    display:none;
    margin-left:5px;
    background:none;
    border:0;
    color:white;
}

.side-item:hover .side-edit{
    display:block;
}

.section{
    margin-top:8px;
}

.section-title{
    padding:8px 10px;
    font-size:12px;
    color:#aaa;
    text-transform:uppercase;
}

.nested{
    padding-left:18px;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.35);
    z-index:999;
    display:none;
}

.overlay.show{
    display:block;
}

/* =========================
   MAIN
========================= */

.main{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
}

.topbar{
    min-height:64px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    z-index:10;
}

.menu-btn{
    width:44px;
    height:44px;
    border:0;
    border-radius:8px;
    background:#202124;
    color:white;
    font-size:20px;
}

.app-name{
    font-size:19px;
    font-weight:bold;
    white-space:nowrap;
}

.search{
    flex:1;
    min-width:100px;
    max-width:500px;
    margin-left:auto;
}

.search input{
    width:100%;
    padding:11px 14px;
    border:1px solid #ccc;
    border-radius:8px;
    outline:none;
}

.drive-status{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    white-space:nowrap;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#aaa;
}

.status-dot.connected{
    background:#0f9d58;
}

.status-dot.error{
    background:#d93025;
}

.toolbar{
    background:white;
    border-bottom:1px solid #ddd;
    padding:8px 10px;
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.btn{
    border:1px solid #c9cdd1;
    background:white;
    border-radius:7px;
    padding:8px 12px;
}

.btn:hover{
    background:#f1f3f4;
}

.btn.primary{
    background:#1a73e8;
    border-color:#1a73e8;
    color:white;
}

.btn.danger{
    background:#d93025;
    border-color:#d93025;
    color:white;
}

.btn.success{
    background:#188038;
    border-color:#188038;
    color:white;
}

.btn.warning{
    background:#f9ab00;
    border-color:#f9ab00;
    color:#202124;
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.sync-area{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:#5f6368;
}

/* =========================
   WORK AREA
========================= */

.workspace{
    flex:1;
    min-height:0;
    display:flex;
}

.note-list{
    width:340px;
    min-width:260px;
    background:white;
    border-right:1px solid #ddd;
    overflow-y:auto;
}

.list-header{
    padding:12px;
    border-bottom:1px solid #ddd;
    font-weight:bold;
    display:flex;
    justify-content:space-between;
}

.note-card{
    padding:12px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    position:relative;
}

.note-card:hover{
    background:#f8f9fa;
}

.note-card.selected{
    background:#e8f0fe;
}

.note-card-title{
    font-weight:bold;
    margin-bottom:6px;
    padding-left:10px;
}

.note-card-preview{
    color:#5f6368;
    font-size:13px;
    line-height:1.4;
    padding-left:10px;
}

.note-marker{
    position:absolute;
    left:4px;
    top:12px;
    width:4px;
    height:42px;
    border-radius:3px;
}

.note-card-meta{
    margin-top:7px;
    font-size:11px;
    color:#80868b;
    display:flex;
    gap:8px;
    padding-left:10px;
}

.detail{
    flex:1;
    min-width:0;
    overflow-y:auto;
    padding:20px;
}

.empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#777;
    text-align:center;
}

.detail-card{
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
    max-width:1000px;
    margin:auto;
}

.detail-title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:15px;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    font-size:12px;
    color:#5f6368;
    margin-bottom:5px;
}

.field input,
.field textarea,
.field select{
    width:100%;
    border:1px solid #ccc;
    border-radius:7px;
    padding:10px;
    outline:none;
}

.field textarea{
    min-height:260px;
    resize:vertical;
}

.readonly-box{
    white-space:pre-wrap;
    line-height:1.6;
    padding:12px;
    background:#fafafa;
    border:1px solid #eee;
    border-radius:7px;
    min-height:180px;
}

.action-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:12px 0;
}

.meta{
    background:#f8f9fa;
    border-radius:8px;
    padding:12px;
    font-size:12px;
    color:#5f6368;
}

.link-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}

.link-row input:first-child{
    width:35%;
}

.link-row input:last-child{
    flex:1;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.modal-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:15px;
}

/* =========================
   SETTINGS
========================= */

.setting-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.setting-row label{
    font-weight:bold;
}

.setting-row small{
    display:block;
    color:#777;
    font-weight:normal;
    margin-top:3px;
}

.setting-row select{
    width:180px;
    padding:7px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .app-name{
        display:none;
    }

    .topbar{
        flex-wrap:wrap;
    }

    .search{
        order:3;
        width:100%;
        max-width:none;
        margin:0;
    }

    .drive-status{
        margin-left:auto;
    }

    .workspace{
        flex-direction:column;
    }

    .note-list{
        width:100%;
        min-width:0;
        height:42%;
        border-right:0;
        border-bottom:1px solid #ddd;
    }

    .detail{
        height:58%;
        padding:10px;
    }

    .detail-title{
        font-size:20px;
    }
}
</style>
</head>

<script>
/* =========================================================
   NOTES MANAGER
   GOOGLE DRIVE DIRECT API BACKEND
========================================================= */


/* =========================================================
   GOOGLE CONFIG
========================================================= */

const CLIENT_ID =
"262106898132-tsn94p3vvpf34do0ommc6rai2mtc5sh6.apps.googleusercontent.com";

const DRIVE_SCOPE =
"https://www.googleapis.com/auth/drive";

const DATABASE_NAME =
"MasterDB.json";

/*
   Optional:
   اگر بعد میں ایک مخصوص Drive Folder استعمال کرنا ہو
   تو یہاں Folder ID رکھا جا سکتا ہے۔

   ابھی خالی رہنے دیں۔
   Code MasterDB.json کو Drive میں نام سے تلاش کرے گا۔
*/
const DATABASE_FOLDER_ID = "";


/* =========================================================
   GLOBAL STATE
========================================================= */

let tokenClient = null;
let accessToken = null;

let databaseFileId = null;

let db = {
    version: 1,
    notes: [],
    categories: [],
    tags: [],
    settings: {},
    checklistLink: "",
    lastSynchronizedTime: null
};

let selectedNoteId = null;
let currentView = "all";
let currentCategoryId = null;
let currentTag = null;
let searchText = "";

let editingNoteId = null;

let saveTimer = null;


/* =========================================================
   DEFAULT SETTINGS
========================================================= */

const defaultSettings = {

    sidebarView: "Normal",

    theme: "Day",

    fontSize: "Normal",

    noteListStyle: "Normal",

    sort: "Last Modified First",

    notesPerPage: "All",

    deleteConfirmation: true,

    autoSave: true

};


/* =========================================================
   HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}

function nowISO(){
    return new Date().toISOString();
}

function formatDate(value){

    if(!value){
        return "—";
    }

    const d = new Date(value);

    if(isNaN(d.getTime())){
        return value;
    }

    return d.toLocaleString();
}

function uid(prefix="id"){
    return prefix + "_" +
        Date.now().toString(36) +
        "_" +
        Math.random().toString(36).slice(2,8);
}

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function setStatus(text,type="normal"){

    $("driveStatusText").textContent = text;

    $("statusDot").className =
        "status-dot " +
        (type === "connected"
            ? "connected"
            : type === "error"
            ? "error"
            : "");

}

function setSaveStatus(text){
    $("saveStatus").textContent = text;
}


/* =========================================================
   GOOGLE AUTH
========================================================= */

function initGoogle(){

    if(
        !window.google ||
        !google.accounts ||
        !google.accounts.oauth2
    ){
        setTimeout(initGoogle,500);
        return;
    }

    tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id: CLIENT_ID,

            scope: DRIVE_SCOPE,

            callback: handleTokenResponse

        });

}

function handleTokenResponse(response){

    if(!response){
        setStatus("Authorization failed","error");
        return;
    }

    if(response.error){

        console.error(response);

        setStatus(
            "Authorization failed: " +
            response.error,
            "error"
        );

        return;
    }

    accessToken = response.access_token;

    setStatus(
        "Google Drive Connected",
        "connected"
    );

    $("connectBtn").textContent =
        "Google Drive Connected";

    setSaveStatus("Connected");

}

function connectGoogleDrive(){

    if(!tokenClient){

        alert(
            "Google authorization system ابھی load نہیں ہوا۔ چند سیکنڈ بعد دوبارہ کوشش کریں۔"
        );

        initGoogle();

        return;
    }

    setStatus(
        "Google Account Selection..."
    );

    tokenClient.requestAccessToken({
        prompt:""
    });

}


/* =========================================================
   DRIVE API
========================================================= */

async function driveFetch(
    url,
    options={}
){

    if(!accessToken){
        throw new Error(
            "Google Drive is not connected."
        );
    }

    const headers =
        options.headers || {};

    headers.Authorization =
        "Bearer " + accessToken;

    headers.Accept =
        "application/json";

    const response =
        await fetch(
            url,
            {
                ...options,
                headers
            }
        );

    if(!response.ok){

        let message =
            "Drive API Error " +
            response.status;

        try{

            const errorData =
                await response.json();

            if(
                errorData.error &&
                errorData.error.message
            ){
                message =
                    errorData.error.message;
            }

        }catch(e){}

        throw new Error(message);
    }

    return response;
}


/* =========================================================
   FIND MASTERDB.JSON
========================================================= */

async function findDatabaseFile(){

    let q =
        "name='" +
        DATABASE_NAME.replace(/'/g,"\\'") +
        "' and trashed=false";

    if(DATABASE_FOLDER_ID){

        q +=
            " and '" +
            DATABASE_FOLDER_ID +
            "' in parents";

    }

    const url =
        "https://www.googleapis.com/drive/v3/files" +
        "?q=" +
        encodeURIComponent(q) +
        "&pageSize=20" +
        "&fields=files(id,name,mimeType,modifiedTime,parents)";

    const response =
        await driveFetch(url);

    const data =
        await response.json();

    if(!data.files || !data.files.length){

        throw new Error(
            "MasterDB.json Google Drive میں نہیں ملی۔"
        );
    }

    if(data.files.length > 1){

        console.warn(
            "Multiple MasterDB.json files found.",
            data.files
        );

        /*
           پہلی matching file استعمال کی جائے گی۔
           اگر مستقبل میں multiple files ہوں تو
           DATABASE_FOLDER_ID set کیا جا سکتا ہے۔
        */
    }

    databaseFileId =
        data.files[0].id;

    return data.files[0];
}


/* =========================================================
   LOAD DATABASE
========================================================= */

async function loadDatabase(){

    try{

        if(!accessToken){

            await ensureConnected();

            if(!accessToken){
                return;
            }

        }

        setSaveStatus(
            "Finding MasterDB.json..."
        );

        const file =
            await findDatabaseFile();

        databaseFileId =
            file.id;

        const response =
            await driveFetch(
                "https://www.googleapis.com/drive/v3/files/" +
                encodeURIComponent(databaseFileId) +
                "?alt=media"
            );

        const text =
            await response.text();

        let loaded;

        try{

            loaded =
                JSON.parse(text);

        }catch(error){

            throw new Error(
                "MasterDB.json valid JSON نہیں ہے۔"
            );

        }

        db =
            normalizeDatabase(loaded);

        selectedNoteId = null;

        currentView = "all";

        currentCategoryId = null;

        currentTag = null;

        renderEverything();

        setSaveStatus(
            "Database Loaded"
        );

        setStatus(
            "Google Drive Connected",
            "connected"
        );

    }catch(error){

        console.error(error);

        setSaveStatus(
            "Load failed"
        );

        setStatus(
            "Database Load Error",
            "error"
        );

        alert(
            "Database Load Error:\n\n" +
            error.message
        );

    }

}


/* =========================================================
   NORMALIZE DATABASE
========================================================= */

function normalizeDatabase(data){

    const result = {

        version:
            data?.version || 1,

        notes:
            Array.isArray(data?.notes)
                ? data.notes
                : [],

        categories:
            Array.isArray(data?.categories)
                ? data.categories
                : [],

        tags:
            Array.isArray(data?.tags)
                ? data.tags
                : [],

        settings:
            {
                ...defaultSettings,
                ...(data?.settings || {})
            },

        checklistLink:
            data?.checklistLink || "",

        lastSynchronizedTime:
            data?.lastSynchronizedTime || null

    };

    result.notes =
        result.notes.map(note => {

            return {

                id:
                    note.id || uid("note"),

                title:
                    note.title || "",

                content:
                    note.content || "",

                categoryId:
                    note.categoryId || null,

                tags:
                    Array.isArray(note.tags)
                        ? note.tags
                        : [],

                links:
                    Array.isArray(note.links)
                        ? note.links
                        : [],

                color:
                    note.color || "#1a73e8",

                favorite:
                    !!note.favorite,

                pinned:
                    !!note.pinned,

                deleted:
                    !!note.deleted,

                createdAt:
                    note.createdAt || nowISO(),

                modifiedAt:
                    note.modifiedAt || nowISO(),

                lastViewedAt:
                    note.lastViewedAt || null,

                viewCount:
                    Number(note.viewCount || 0),

                binNumber:
                    note.binNumber || null

            };

        });

    return result;
}


/* =========================================================
   SAVE DATABASE
========================================================= */

async function saveDatabase(){

    if(!accessToken){

        alert(
            "پہلے Connect Google Drive کریں۔"
        );

        return false;
    }

    if(!databaseFileId){

        try{

            await findDatabaseFile();

        }catch(error){

            alert(error.message);

            return false;
        }

    }

    try{

        setSaveStatus(
            "Saving to Google Drive..."
        );

        const body =
            JSON.stringify(
                db,
                null,
                2
            );

        const response =
            await fetch(
                "https://www.googleapis.com/upload/drive/v3/files/" +
                encodeURIComponent(databaseFileId) +
                "?uploadType=media",
                {
                    method:"PATCH",

                    headers:{
                        Authorization:
                            "Bearer " + accessToken,

                        "Content-Type":
                            "application/json"
                    },

                    body
                }
            );

        if(!response.ok){

            const errorText =
                await response.text();

            throw new Error(
                "Save failed: " +
                errorText
            );

        }

        setSaveStatus(
            "Saved to Google Drive"
        );

        return true;

    }catch(error){

        console.error(error);

        setSaveStatus(
            "Save failed"
        );

        setStatus(
            "Drive Save Error",
            "error"
        );

        alert(
            "Google Drive Save Error:\n\n" +
            error.message
        );

        return false;
    }

}

async function ensureConnected(){

/* =========================================================
   SYNCHRONIZE TIME
========================================================= */

async function synchronizeTime(){

    if(!accessToken){

        alert(
            "پہلے Google Drive Connect کریں۔"
        );

        return;
    }

    if(!databaseFileId){

        const loaded =
            await loadDatabase();

        if(!loaded && !databaseFileId){

            /*
               loadDatabase itself handles error.
            */

            return;
        }

    }

    db.lastSynchronizedTime =
        nowISO();

    const saved =
        await saveDatabase();

    if(saved){

        renderEverything();

        alert(
            "Synchronization Time successfully save ہو گیا۔"
        );

    }

}

/* =========================================================
   NOTE FILTERING
========================================================= */

function getVisibleNotes(){

    let notes =
        db.notes.filter(
            note => !note.deleted
        );

    if(currentView === "favorites"){

        notes =
            notes.filter(
                note => note.favorite
            );

    }

    if(currentView === "trash"){

        notes =
            db.notes.filter(
                note => note.deleted
            );

    }

    if(currentCategoryId){

        notes =
            notes.filter(
                note =>
                    note.categoryId ===
                    currentCategoryId
            );

    }

    if(currentTag){

        notes =
            notes.filter(
                note =>
                    Array.isArray(note.tags) &&
                    note.tags.includes(currentTag)
            );

    }

    if(searchText){

        const query =
            searchText.toLowerCase();

        notes =
            notes.filter(note => {

                const text =
                    [
                        note.title,
                        note.content,
                        ...(note.tags || [])
                    ]
                    .join(" ")
                    .toLowerCase();

                return text.includes(query);

            });

    }

    notes.sort(
        getSortFunction()
    );

    return notes;
}


/* =========================================================
   SORT
========================================================= */

function getSortFunction(){

    const sort =
        db.settings.sort ||
        "Last Modified First";

    if(sort === "Alphabetical"){

        return (a,b) =>
            a.title.localeCompare(
                b.title
            );

    }

    if(sort === "Newest"){

        return (a,b) =>
            new Date(b.createdAt) -
            new Date(a.createdAt);

    }

    if(sort === "Oldest"){

        return (a,b) =>
            new Date(a.createdAt) -
            new Date(b.createdAt);

    }

    return (a,b) =>
        new Date(b.modifiedAt) -
        new Date(a.modifiedAt);

}

/* =========================================================
   CATEGORIES
========================================================= */

function renderCategories(){

    const container =
        $("categoryTree");

    container.innerHTML = "";

    const categories =
        db.categories;

    const roots =
        categories.filter(
            c => !c.parentId
        );

    roots.forEach(category => {

        renderCategoryNode(
            category,
            container,
            0
        );

    });

}

function renderCategoryNode(
    category,
    container,
    level
){

    const children =
        db.categories.filter(
            c =>
                c.parentId ===
                category.id
        );

    const count =
        db.notes.filter(
            note =>
                !note.deleted &&
                note.categoryId ===
                category.id
        ).length;

    const item =
        document.createElement("div");

    item.className =
        "side-item nested";

    item.style.paddingLeft =
        (10 + level * 15) + "px";

    item.innerHTML = `
        <span>📁</span>
        <span>${escapeHTML(category.name)}</span>
        <span class="side-count">${count}</span>
        <button class="side-edit">✎</button>
    `;

    item.addEventListener(
        "click",
        event => {

            if(
                event.target.classList.contains(
                    "side-edit"
                )
            ){
                return;
            }

            currentView = "category";

            currentCategoryId =
                category.id;

            currentTag = null;

            renderNoteList();

        }
    );

    item.querySelector(
        ".side-edit"
    ).addEventListener(
        "click",
        event => {

            event.stopPropagation();

            editCategory(category);

        }
    );

    container.appendChild(item);

    children.forEach(child => {

        renderCategoryNode(
            child,
            container,
            level + 1
        );

    });

}

            );

    }

/* =========================================================
   CATEGORY SELECT
========================================================= */

function populateCategorySelect(
    selectedId
){

    const select =
        $("noteCategory");

    select.innerHTML = `
        <option value="">
            Uncategorized
        </option>
    `;

    db.categories.forEach(
        category => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                category.id;

            option.textContent =
                getCategoryPath(
                    category.id
                );

            if(
                category.id ===
                selectedId
            ){
                option.selected =
                    true;
            }

            select.appendChild(
                option
            );

        }
    );

}

function getCategoryPath(id){

    const parts = [];

    let current =
        db.categories.find(
            c => c.id === id
        );

    while(current){

        parts.unshift(
            current.name
        );

        current =
            db.categories.find(
                c =>
                    c.id ===
                    current.parentId
            );

    }

    return parts.join(
        " / "
    );

}

/* =========================================================
   SAVE NOTE FROM MODAL
========================================================= */

async function saveNoteFromModal(){

    const title =
        $("noteTitle").value.trim();

    const content =
        $("noteContent").value;

    if(!title && !content){

        alert(
            "Title یا Content میں کچھ لکھیں۔"
        );

        return;
    }

    const tags =
        $("noteTags")
            .value
            .split(",")
            .map(
                tag => tag.trim()
            )
            .filter(Boolean);

    const links = [];

    document
        .querySelectorAll(
            "#linksContainer .link-row"
        )
        .forEach(row => {

            const inputs =
                row.querySelectorAll(
                    "input"
                );

            const linkTitle =
                inputs[0].value.trim();

            const url =
                inputs[1].value.trim();

            if(url){

                links.push({

                    title:
                        linkTitle,

                    url:
                        url

                });

            }

        });

    const categoryId =
        $("noteCategory").value ||
        null;

    const color =
        $("noteColor").value ||
        "#1a73e8";

    const timestamp =
        nowISO();

    if(editingNoteId){

        const note =
            db.notes.find(
                n =>
                    n.id ===
                    editingNoteId
            );

        if(!note){
            return;
        }

        note.title =
            title;

        note.content =
            content;

        note.categoryId =
            categoryId;

        note.tags =
            tags;

        note.links =
            links;

        note.color =
            color;

        note.modifiedAt =
            timestamp;

    }else{

        const note = {

            id:
                uid("note"),

            title:
                title,

            content:
                content,

            categoryId:
                categoryId,

            tags:
                tags,

            links:
                links,

            color:
                color,

            favorite:
                false,

            pinned:
                false,

            deleted:
                false,

            createdAt:
                timestamp,

            modifiedAt:
                timestamp,

            lastViewedAt:
                null,

            viewCount:
                0,

            binNumber:
                null

        };

        db.notes.unshift(
            note
        );

        selectedNoteId =
            note.id;

    }

    updateTagRegistry();

    $("noteModal")
        .classList.remove(
            "show"
        );

    renderEverything();

    await saveDatabase();

}


/* =========================================================
   TAG REGISTRY
========================================================= */

function updateTagRegistry(){

    const set =
        new Set();

    db.notes.forEach(
        note => {

            (note.tags || [])
                .forEach(
                    tag =>
                        set.add(tag)
                );

        }
    );

    db.tags =
        Array.from(set)
            .sort(
                (a,b) =>
                    a.localeCompare(b)
            );

}

    await saveDatabase();

}


/* =========================================================
   DELETE
========================================================= */

async function deleteNote(id){

    const note =
        db.notes.find(
            n => n.id === id
        );

    if(!note){
        return;
    }

    if(
        db.settings.deleteConfirmation
    ){

        const yes =
            confirm(
                "کیا آپ یہ note Trash میں بھیجنا چاہتے ہیں؟"
            );

        if(!yes){
            return;
        }

    }

    note.deleted =
        true;

    note.modifiedAt =
        nowISO();

    note.binNumber =
        getNextBinNumber();

    /*
       System Bin tag
    */

    note.tags =
        Array.from(
            new Set([
                ...(note.tags || []),
                "Bin",
                "Bin " + note.binNumber
            ])
        );

    updateTagRegistry();

    renderEverything();

    await saveDatabase();

}


/* =========================================================
   NEXT BIN NUMBER
========================================================= */

function getNextBinNumber(){

    let max =
        0;

    db.notes.forEach(
        note => {

            const match =
                String(
                    note.binNumber || ""
                ).match(
                    /^\d+$/
                );

            if(match){

                max =
                    Math.max(
                        max,
                        Number(
                            match[0]
                        )
                    );

            }

        }
    );

    return max + 1;
}


/* =========================================================
   RESTORE
========================================================= */

async function restoreNote(id){

    const note =

/* =========================================================
   EMPTY TRASH
   IMPORTANT:
   یہ permanent delete نہیں ہے۔
   Notes کو hide/archival state میں رکھا جاتا ہے۔
========================================================= */

async function emptyTrash(){

    const deleted =
        db.notes.filter(
            n => n.deleted
        );

    if(!deleted.length){

        alert(
            "Trash پہلے ہی خالی ہے۔"
        );

        return;
    }

    /*
       Permanent deletion intentionally نہیں۔
       Notes database میں رہیں گے۔
    */

    deleted.forEach(
        note => {

            note.trashHidden =
                true;

            note.modifiedAt =
                nowISO();

        }
    );

    renderEverything();

    await saveDatabase();

    alert(
        "Trash items normal Trash view سے hide کر دیے گئے ہیں۔ Permanent deletion نہیں ہوئی۔"
    );

}


/* =========================================================
   CATEGORY EDIT
========================================================= */

function editCategory(category){

    const action =
        prompt(
            "Category action:\n\n" +
            "1 = Rename\n" +
            "2 = Add Child\n" +
            "3 = Add Sister\n" +
            "4 = Remove\n\n" +
            "Action number:"
        );

    if(!action){
        return;
    }

    if(action === "1"){

        const name =
            prompt(
                "New category name:",
                category.name
            );

        if(
            name &&
            name.trim()
        ){

            category.name =
                name.trim();

            saveDatabase();
            renderEverything();

        }

        return;
    }

    if(action === "2"){

        const name =
            prompt(
                "Child category name:"
            );

        if(
            name &&
            name.trim()
        ){

            db.categories.push({

                id:
                    uid("cat"),

                name:
                    name.trim(),

                parentId:
                    category.id

            });

            saveDatabase();
            renderEverything();

        }

        return;
    }

    if(action === "3"){

        const name =
            prompt(
                "Sister category name:"
            );

        if(
            name &&
            name.trim()
        ){

            db.categories.push({

                id:
                    uid("cat"),

                name:
                    name.trim(),

                parentId:
                    category.parentId ||
                    null

            });

            saveDatabase();
            renderEverything();

        }

        return;
    }

    if(action === "4"){

        const yes =
            confirm(
                "Category remove کریں؟ Notes delete نہیں ہوں گے۔"
            );

        if(!yes){
            return;
        }

        /*
           Child categories کو parent کے ساتھ
           reassign کیا جاتا ہے۔
        */

        db.categories.forEach(
            c => {

                if(
                    c.parentId ===
                    category.id
                ){

                    c.parentId =
                        category.parentId ||
                        null;

                }

            }
        );

        db.notes.forEach(
            note => {

                if(
                    note.categoryId ===
                    category.id
                ){

                    note.categoryId =
                        category.parentId ||
                        null;

                }

            }
        );

        db.categories =
            db.categories.filter(
                c =>
                    c.id !==
                    category.id
            );

        saveDatabase();

        renderEverything();

    }

}

/* =========================================================
   APPLY SETTINGS
========================================================= */

function applySettings(){

    const theme =
        db.settings.theme;

    if(theme === "Night"){

        document.body.style.background =
            "#202124";

        document.body.style.color =
            "#e8eaed";

    }else{

        document.body.style.background =
            "#f4f6f8";

        document.body.style.color =
            "#202124";

    }

    const font =
        db.settings.fontSize;

    let size =
        "16px";

    if(font === "Small"){
        size = "14px";
    }

    if(font === "Large"){
        size = "18px";
    }

    if(font === "Extra Large"){
        size = "20px";
    }

    document.body.style.fontSize =
        size;

}
