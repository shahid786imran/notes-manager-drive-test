<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notes Manager</title>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://apis.google.com/js/api.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{
  --primary:#4f46e5;
  --primary-soft:#eef2ff;
  --bg:#f3f4f6;
  --card:#fff;
  --border:#e5e7eb;
  --text:#1f2937;
  --muted:#6b7280;
  --danger:#dc2626;
  --success:#15803d;
  --sidebar-width:270px;
  --radius:10px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

#app{min-height:100vh}

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:58px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
}

.menu-btn{
  border:1px solid var(--border);
  background:#fff;
  border-radius:8px;
  padding:8px 11px;
}

.app-title{
  font-weight:700;
  white-space:nowrap;
}

.connection{
  margin-left:auto;
  font-size:12px;
  color:var(--muted);
}

.connection.ok{color:var(--success)}
.connection.err{color:var(--danger)}

.add-note{
  border:0;
  background:var(--primary);
  color:#fff;
  border-radius:8px;
  padding:9px 13px;
  font-weight:600;
}

.layout{
  display:grid;
  grid-template-columns:minmax(250px,340px) minmax(300px,420px) minmax(0,1fr);
  min-height:calc(100vh - 58px);
}

/* SIDEBAR */
.sidebar{
  background:#fff;
  border-right:1px solid var(--border);
  overflow:auto;
  padding:12px;
}

.sidebar.closed{display:none}

.side-section{
  margin-bottom:7px;
}

.side-item{
  position:relative;
  display:flex;
  align-items:center;
  gap:8px;
  min-height:38px;
  padding:7px 9px;
  border-radius:7px;
  cursor:pointer;
}

.side-item:hover,
.side-item.active{
  background:#f3f4f6;
}

.side-count{
  margin-left:auto;
  color:var(--muted);
  font-size:12px;
}

.side-edit{
  display:none;
  border:0;
  background:transparent;
  padding:3px;
}

.side-item:hover .side-edit,
.side-item.selected .side-edit{
  display:block;
}

.tree{
  margin-left:10px;
  border-left:1px solid var(--border);
}

.tree-node{
  padding-left:8px;
}

.tree-row{
  display:flex;
  align-items:center;
  min-height:34px;
  border-bottom:1px solid #f1f1f1;
}

.tree-toggle{
  width:24px;
  border:0;
  background:transparent;
}

.tree-label{
  flex:1;
  padding:7px 4px;
  cursor:pointer;
}

.sidebar-tools{
  display:flex;
  gap:5px;
  margin:4px 0 8px;
}

.small-btn{
  border:1px solid var(--border);
  background:#fff;
  border-radius:7px;
  padding:6px 8px;
}

/* NOTE LIST */
.notes-panel{
  background:#f8f9fa;
  border-right:1px solid var(--border);
  overflow:auto;
}

.list-header{
  padding:14px;
  background:#fff;
  border-bottom:1px solid var(--border);
}

.list-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.list-title{
  font-size:18px;
  font-weight:700;
}

.search{
  width:100%;
  margin-top:10px;
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 11px;
  outline:none;
  background:#fff;
}

.bulk-bar{
  display:none;
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:8px;
  gap:5px;
  flex-wrap:wrap;
}

.bulk-bar.show{display:flex}

.bulk-bar button{
  border:1px solid var(--border);
  background:#fff;
  border-radius:7px;
  padding:7px 9px;
}

.note-list{padding:8px}

.note-row{
  background:#fff;
  border:1px solid var(--border);
  border-radius:9px;
  margin-bottom:7px;
  padding:9px 10px 9px 14px;
  position:relative;
  cursor:pointer;
}

.note-row::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  border-radius:9px 0 0 9px;
  background:var(--note-color,#9ca3af);
}

.note-row.selected{
  background:#eef2ff;
}

.note-row.pinned{
  background:#fffdf5;
}

.note-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:3px;
}

.note-preview{
  color:#4b5563;
  font-size:13px;
  line-height:1.35;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
}

.note-meta{
  margin-top:7px;
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
  color:#6b7280;
  font-size:12px;
}

.icon-action{
  color:#9ca3af;
  font-size:17px;
  cursor:pointer;
  border:0;
  background:transparent;
  padding:1px;
}

.icon-action.active-pin{color:#374151}
.icon-action.active-fav{color:#eab308}

.note-date{
  margin-top:4px;
  font-size:11px;
  color:#6b7280;
}

/* DATA PANEL */
.data-panel{
  background:#e5e7eb;
  overflow:auto;
  padding:14px;
}

.document{
  max-width:900px;
  margin:0 auto;
}

.color-line{
  height:8px;
  border-radius:6px 6px 0 0;
  background:var(--note-color,#4f46e5);
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:9px;
  margin-bottom:9px;
  padding:12px;
  box-shadow:0 1px 2px rgba(0,0,0,.03);
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.action-btn{
  border:1px solid var(--border);
  background:#fff;
  border-radius:7px;
  padding:7px 9px;
  color:#374151;
}

.action-btn:hover{background:#f9fafb}

.note-heading{
  font-size:23px;
  font-weight:700;
  line-height:1.2;
}

.content-editor{
  min-height:280px;
  outline:none;
  line-height:1.55;
  word-break:break-word;
}

.content-editor[contenteditable="false"]{
  cursor:default;
}

.toolbar{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-bottom:9px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
}

.toolbar button{
  border:1px solid var(--border);
  background:#fff;
  border-radius:6px;
  padding:5px 8px;
}

.link-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.link-title{
  font-weight:700;
}

.link-row{
  border-top:1px solid var(--border);
  padding:8px 0;
  display:flex;
  align-items:center;
  gap:8px;
}

.link-row a{
  color:#2563eb;
  text-decoration:none;
  font-weight:600;
}

.link-open{
  margin-left:auto;
  font-size:12px;
  color:#2563eb;
}

.meta-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px 14px;
  font-size:12px;
}

.meta-cell{
  padding:5px 0;
  border-bottom:1px solid #f0f0f0;
}

.meta-label{
  color:#6b7280;
}

.meta-value{
  font-weight:600;
}

/* MODAL */
.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.modal-backdrop.show{display:flex}

.modal{
  background:#fff;
  border-radius:11px;
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  padding:16px;
}

.modal h3{margin:0 0 12px}

.form-row{
  margin-bottom:10px;
}

.form-row label{
  display:block;
  font-size:12px;
  color:#6b7280;
  margin-bottom:4px;
}

.form-row input,
.form-row textarea,
.form-row select{
  width:100%;
  border:1px solid var(--border);
  border-radius:7px;
  padding:9px;
  outline:none;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:14px;
}

.primary{
  border:0;
  background:var(--primary);
  color:#fff;
  border-radius:7px;
  padding:8px 12px;
}

.secondary{
  border:1px solid var(--border);
  background:#fff;
  border-radius:7px;
  padding:8px 12px;
}

.danger{
  border:0;
  background:var(--danger);
  color:#fff;
  border-radius:7px;
  padding:8px 12px;
}

.empty{
  padding:35px 15px;
  text-align:center;
  color:#6b7280;
}

/* MOBILE */
@media(max-width:900px){
  .layout{
    display:block;
  }

  .sidebar{
    position:fixed;
    z-index:300;
    top:58px;
    left:0;
    bottom:0;
    width:min(86vw,310px);
    box-shadow:5px 0 20px rgba(0,0,0,.12);
  }

  .sidebar.closed{display:none}

  .notes-panel{
    border-right:0;
  }

  .data-panel{
    border-top:1px solid var(--border);
    min-height:500px;
  }
}

@media(max-width:560px){
  body{font-size:14px}

  .topbar{
    padding:7px;
  }

  .app-title{font-size:14px}

  .connection{display:none}

  .add-note{
    padding:8px 9px;
  }

  .data-panel{
    padding:8px;
  }

  .card{
    padding:10px;
  }

  .note-heading{
    font-size:20px;
  }

  .meta-grid{
    grid-template-columns:1fr;
  }

  .action-btn{
    padding:7px 8px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<div id="app">

<header class="topbar">
  <button class="menu-btn" id="sidebarBtn">☰ Show</button>
  <div class="app-title">Notes Manager</div>
  <div class="connection" id="connectionStatus">Not connected</div>
  <button class="add-note" id="addNoteBtn">＋ Add Note</button>
</header>

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar closed" id="sidebar">

  <div class="side-section">
    <div class="side-item active" data-section="all">
      <span>📝</span>
      <span>All Notes</span>
      <span class="side-count" id="allCount">0</span>
    </div>

    <div class="side-item" data-section="favorites">
      <span>⭐</span>
      <span>Favorites</span>
      <span class="side-count" id="favCount">0</span>
    </div>
  </div>

  <div class="side-section">

    <div class="side-item" id="categoriesToggle">
      <span>📁</span>
      <span>Categories</span>
      <span class="side-count" id="categoryCount">0</span>
      <button class="side-edit" id="categoryManage">✏️</button>
    </div>

    <div class="sidebar-tools" id="categoryTools" style="display:none">
      <button class="small-btn" id="addRootCategory">＋ Category</button>
      <button class="small-btn" id="categoryMenuBtn">Manage</button>
    </div>

    <div id="categoryTree" class="tree" style="display:none"></div>

  </div>

  <div class="side-section">

    <div class="side-item" id="tagsToggle">
      <span>🏷️</span>
      <span>Tags</span>
      <span class="side-count" id="tagCount">0</span>
      <button class="side-edit" id="tagManage">✏️</button>
    </div>

    <div class="sidebar-tools" id="tagTools" style="display:none">
      <button class="small-btn" id="addTag">＋ Tag</button>
    </div>

    <div id="tagList" style="display:none"></div>

  </div>

  <div class="side-section">
    <div class="side-item" data-section="checklist">
      <span>☑️</span>
      <span>Checklist</span>
    </div>
  </div>

  <div class="side-section">
    <div class="side-item" data-section="trash">
      <span>🗑️</span>
      <span id="trashLabel">Recycle Bin</span>
      <span class="side-count" id="trashCount">0</span>
    </div>
  </div>

  <div class="side-section">
    <div class="side-item" id="settingsBtn">
      <span>⚙️</span>
      <span>Settings</span>
    </div>
  </div>

</aside>

<!-- NOTE LIST -->
<section class="notes-panel">

  <div class="list-header">
    <div class="list-title-row">
      <div class="list-title" id="listTitle">All Notes</div>
      <div id="listCount">0 Notes</div>
    </div>

    <input
      id="searchInput"
      class="search"
      placeholder="Search notes..."
      autocomplete="off"
    >
  </div>

  <div class="bulk-bar" id="bulkBar">
    <span id="selectedCount" style="padding:7px">0 selected</span>
    <button id="bulkPin">📌 Pin</button>
    <button id="bulkFavorite">⭐ Favorite</button>
    <button id="bulkCategory">📁 Category</button>
    <button id="bulkTags">🏷️ Tags</button>
    <button id="bulkColor">🎨 Color</button>
    <button id="bulkDuplicate">📋 Duplicate</button>
    <button id="bulkDelete">🗑️ Delete</button>
  </div>

  <div class="note-list" id="noteList"></div>

</section>

<!-- DATA PANEL -->
<main class="data-panel">

  <div class="document" id="documentPanel">
    <div class="empty">
      Select a note.
    </div>
  </div>

</main>

</div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ============================================================
   GOOGLE DRIVE CONFIGURATION
   ============================================================ */

const CONFIG = {
  CLIENT_ID:
    "262106898132-tsn94p3vvpf34do0ommc6rai2mtc5sh6.apps.googleusercontent.com",

  FOLDER_ID:
    "1iFxVl1IH0PrEZw5uDUlnJuaablUI77nx",

  DB_FILE_ID:
    "1i3LtPybAqhvumBsy0HXJyUCjmFBIdGP7",

  DB_FILE_NAME:
    "MasterDB.json",

  SCOPES:
    "https://www.googleapis.com/auth/drive"
};


/* ============================================================
   STATE
   ============================================================ */

const DEFAULT_DB = {
  version: 1,

  settings: {
    sidebarDefault: "closed",
    sidebarDensity: "compact",
    categoryDefault: "collapsed",
    tagsDefault: "collapsed",
    dividerLines: true,
    categoryIndentation: "compact",

    noteDisplayStyle: "normal",
    notesPerPage: "20",

    sorting: "lastModified",
    searchMode: "all",

    autoSave: true,
    autoSaveInterval: 1500,

    saveConfirmation: true,
    notificationDuration: 1800,

    dateFormat: "DD MMM YYYY",
    timeFormat: "12",

    layoutMode: "automatic",

    confirmDelete: true,
    confirmEmptyTrash: true,
    confirmCategoryRemoval: true,
    confirmTagRemoval: true
  },

  categories: [],

  tags: [],

  notes: [],

  trashState: {
    label: "Recycle Bin",
    hidden: false
  },

  checklist: {
    url: ""
  },

  counters: {
    binSequence: 0
  }
};

let db = structuredClone(DEFAULT_DB);
let accessToken = null;
let tokenClient = null;
let gapiReady = false;

let currentSection = "all";
let selectedNoteId = null;
let selectedIds = new Set();

let searchText = "";
let currentPage = 1;

let saveTimer = null;
let saveInProgress = false;
let saveAgain = false;

let expandedCategories = new Set();


/* ============================================================
   HELPERS
   ============================================================ */

const $ = id => document.getElementById(id);

function uid(prefix="id"){
  return prefix + "_" +
    Date.now().toString(36) + "_" +
    Math.random().toString(36).slice(2,8);
}

function nowISO(){
  return new Date().toISOString();
}

function escapeHTML(value=""){
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function stripHTML(html=""){
  const d=document.createElement("div");
  d.innerHTML=html;
  return d.textContent || d.innerText || "";
}

function formatDate(value){
  if(!value) return "—";

  const d=new Date(value);

  if(Number.isNaN(d.getTime())) return "—";

  const date =
    String(d.getDate()).padStart(2,"0") + " " +
    d.toLocaleString("en-US",{month:"short"}) + " " +
    d.getFullYear();

  let time;

  if(db.settings.timeFormat==="24"){
    time=d.toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    });
  }else{
    time=d.toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit",
      hour12:true
    });
  }

  return date + " · " + time;
}

function showMessage(message, type="ok"){
  const el=$("connectionStatus");

  el.textContent=message;
  el.className="connection " + (type==="ok" ? "ok" : "err");

  if(db.settings.notificationDuration){
    setTimeout(()=>{
      if(el.textContent===message){
        el.textContent=accessToken ? "Google Drive connected" : "Not connected";
      }
    },db.settings.notificationDuration);
  }
}

function confirmAction(message, setting){
  if(db.settings[setting]===false) return true;
  return confirm(message);
}


/* ============================================================
   GOOGLE API
   ============================================================ */

async function initGoogle(){

  try{

    await new Promise((resolve,reject)=>{
      gapi.load("client",async()=>{
        try{
          await gapi.client.init({
            discoveryDocs:[
              "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"
            ]
          });

          gapiReady=true;
          resolve();
        }catch(e){
          reject(e);
        }
      });
    });

    tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:CONFIG.CLIENT_ID,
      scope:CONFIG.SCOPES,
      callback:async response=>{
        if(response.error){
          showMessage("Google authorization failed","err");
          return;
        }

        accessToken=response.access_token;

        gapi.client.setToken({
          access_token:accessToken
        });

        showMessage("Google Drive connected","ok");

        await loadDatabase();
      }
    });

    $("connectionStatus").textContent="Click Show → Connect";

  }catch(error){
    console.error(error);
    showMessage("Google API initialization failed","err");
  }
}

function connectGoogle(){

  if(!tokenClient){
    alert("Google API ابھی تیار نہیں ہوا۔");
    return;
  }

  tokenClient.requestAccessToken({
    prompt:"consent"
  });
}


/* ============================================================
   GOOGLE DRIVE JSON
   ============================================================ */

async function loadDatabase(){

  if(!accessToken){
    connectGoogle();
    return;
  }

  try{

    const response=await fetch(
      `https://www.googleapis.com/drive/v3/files/${CONFIG.DB_FILE_ID}?alt=media`,
      {
        headers:{
          Authorization:"Bearer "+accessToken
        }
      }
    );

    if(!response.ok){
      throw new Error("Drive JSON read failed: "+response.status);
    }

    const remote=await response.json();

    db={
      ...structuredClone(DEFAULT_DB),
      ...remote,
      settings:{
        ...DEFAULT_DB.settings,
        ...(remote.settings||{})
      }
    };

    db.notes=Array.isArray(db.notes)?db.notes:[];
    db.categories=Array.isArray(db.categories)?db.categories:[];
    db.tags=Array.isArray(db.tags)?db.tags:[];
    db.checklist=db.checklist||{url:""};
    db.trashState=db.trashState||{
      label:"Recycle Bin",
      hidden:false
    };

    renderAll();

    showMessage("MasterDB.json loaded","ok");

  }catch(error){

    console.error(error);

    alert(
      "Google Drive سے MasterDB.json read نہیں ہو سکی۔\n\n"+
      error.message
    );

    showMessage("Drive read failed","err");
  }
}

async function saveDatabase(){

  if(!accessToken){
    connectGoogle();
    return false;
  }

  if(saveInProgress){
    saveAgain=true;
    return false;
  }

  saveInProgress=true;

  try{

    const blob=new Blob(
      [JSON.stringify(db,null,2)],
      {type:"application/json"}
    );

    const metadata={
      name:CONFIG.DB_FILE_NAME,
      mimeType:"application/json"
    };

    const form=new FormData();

    form.append(
      "metadata",
      new Blob(
        [JSON.stringify(metadata)],
        {type:"application/json"}
      )
    );

    form.append("file",blob);

    const response=await fetch(
      `https://www.googleapis.com/upload/drive/v3/files/${CONFIG.DB_FILE_ID}?uploadType=multipart`,
      {
        method:"PATCH",
        headers:{
          Authorization:"Bearer "+accessToken
        },
        body:form
      }
    );

    if(!response.ok){
      throw new Error("Drive write failed: "+response.status);
    }

    showMessage("Saved to Google Drive","ok");

    if(saveAgain){
      saveAgain=false;
      saveInProgress=false;
      return await saveDatabase();
    }

    saveInProgress=false;

    return true;

  }catch(error){

    console.error(error);

    saveInProgress=false;

    showMessage("Drive save failed","err");

    alert("Google Drive میں save نہیں ہو سکا۔\n\n"+error.message);

    return false;
  }
}

function scheduleSave(){

  if(db.settings.autoSave===false) return;

  clearTimeout(saveTimer);

  saveTimer=setTimeout(
    ()=>saveDatabase(),
    Number(db.settings.autoSaveInterval)||1500
  );
}

async function deleteDatabaseFile(){

  if(!accessToken){
    connectGoogle();
    return;
  }

  if(!confirm("MasterDB.json کو Google Drive سے delete کرنا ہے؟")) return;

  try{

    const response=await fetch(
      `https://www.googleapis.com/drive/v3/files/${CONFIG.DB_FILE_ID}`,
      {
        method:"DELETE",
        headers:{
          Authorization:"Bearer "+accessToken
        }
      }
    );

    if(!response.ok){
      throw new Error("Delete failed: "+response.status);
    }

    alert("MasterDB.json deleted.");

  }catch(error){
    alert(error.message);
  }
}


/* ============================================================
   NOTE MODEL
   ============================================================ */

function createNote(){

  const t=nowISO();

  return {
    id:uid("note"),
    title:"New Note",
    content:"",
    links:[],

    createdAt:t,
    modifiedAt:t,
    lastViewedAt:"",
    lastSyncedAt:t,

    categoryId:null,
    previousCategoryId:null,

    tags:[],

    favorite:false,
    pinned:false,

    color:"#4f46e5",

    deleted:false,
    trashHidden:false,

    views:0,

    binHistory:[],

    attachments:[],
    status:"Active"
  };
}

function getNote(id){
  return db.notes.find(n=>n.id===id);
}

function activeNotes(){
  return db.notes.filter(n=>!n.deleted && !n.trashHidden);
}

function deletedNotes(){
  return db.notes.filter(n=>n.deleted && !n.trashHidden);
}

function allVisibleNotes(){

  let notes;

  if(currentSection==="favorites"){
    notes=activeNotes().filter(n=>n.favorite);

  }else if(currentSection==="trash"){
    notes=deletedNotes();

  }else if(currentSection.startsWith("category:")){

    const id=currentSection.slice(9);

    notes=activeNotes().filter(n=>
      n.categoryId===id ||
      isDescendantCategory(n.categoryId,id)
    );

  }else if(currentSection.startsWith("tag:")){

    const tag=currentSection.slice(4);

    notes=activeNotes().filter(n=>
      n.tags.includes(tag)
    );

  }else{
    notes=activeNotes();
  }

  if(searchText.trim()){
    const q=searchText.toLowerCase();

    notes=notes.filter(n=>{

      const title=n.title||"";
      const content=stripHTML(n.content||"");

      const cat=getCategory(n.categoryId);
      const categoryName=cat?.name||"";

      const tags=n.tags.join(" ");

      if(db.settings.searchMode==="title"){
        return title.toLowerCase().includes(q);
      }

      if(db.settings.searchMode==="titleContent"){
        return (
          title+" "+content
        ).toLowerCase().includes(q);
      }

      return (
        title+" "+content+" "+
        categoryName+" "+tags
      ).toLowerCase().includes(q);
    });
  }

  return sortNotes(notes);
}

function sortNotes(notes){

  const copy=[...notes];

  switch(db.settings.sorting){

    case "newest":
      return copy.sort((a,b)=>
        new Date(b.createdAt)-new Date(a.createdAt)
      );

    case "oldest":
      return copy.sort((a,b)=>
        new Date(a.createdAt)-new Date(b.createdAt)
      );

    case "alphabetical":
      return copy.sort((a,b)=>
        (a.title||"").localeCompare(
          b.title||"",
          undefined,
          {sensitivity:"base"}
        )
      );

    default:
      return copy.sort((a,b)=>
        new Date(b.modifiedAt)-new Date(a.modifiedAt)
      );
  }
}


/* ============================================================
   CATEGORIES
   ============================================================ */

function getCategory(id){
  return db.categories.find(c=>c.id===id);
}

function categoryChildren(parentId){
  return db.categories.filter(c=>
    (c.parentId||null)===(parentId||null)
  );
}

function isDescendantCategory(categoryId,ancestorId){

  let current=getCategory(categoryId);

  while(current){

    if(current.parentId===ancestorId) return true;

    current=getCategory(current.parentId);
  }

  return false;
}

function categoryPath(id){

  const parts=[];
  let c=getCategory(id);

  while(c){
    parts.unshift(c.name);
    c=getCategory(c.parentId);
  }

  return parts.join(" / ");
}

function categoryColor(id){

  const colors=[
    "#3b82f6",
    "#22c55e",
    "#f97316",
    "#8b5cf6",
    "#ec4899",
    "#06b6d4",
    "#eab308",
    "#ef4444"
  ];

  let c=getCategory(id);

  if(!c) return "#9ca3af";

  return c.color || colors[
    db.categories.findIndex(x=>x.id===c.id)%colors.length
  ];
}

function categoryNoteCount(id){

  return activeNotes().filter(n=>
    n.categoryId===id ||
    isDescendantCategory(n.categoryId,id)
  ).length;
}

function addCategory(name,parentId=null){

  name=name.trim();

  if(!name) return;

  if(db.categories.some(c=>
    c.name.toLowerCase()===name.toLowerCase() &&
    (c.parentId||null)===(parentId||null)
  )){
    alert("یہ Category پہلے سے موجود ہے۔");
    return;
  }

  const category={
    id:uid("cat"),
    name,
    parentId,
    color:categoryColor(null)
  };

  db.categories.push(category);

  if(parentId) expandedCategories.add(parentId);

  scheduleSave();
  renderAll();
}

function renameCategory(id){

  const c=getCategory(id);
  if(!c)return;

  const name=prompt("New Category Name",c.name);

  if(!name || !name.trim()) return;

  c.name=name.trim();
  scheduleSave();
  renderAll();
}

function removeCategory(id){

  const c=getCategory(id);
  if(!c)return;

  if(!confirmAction(
    `Category "${c.name}" remove کرنی ہے؟ Notes delete نہیں ہوں گی۔`,
    "confirmCategoryRemoval"
  ))return;

  const parent=c.parentId||null;

  db.notes.forEach(n=>{
    if(n.categoryId===id){
      n.categoryId=parent;
      n.modifiedAt=nowISO();
    }
  });

  db.categories.forEach(child=>{
    if(child.parentId===id){
      child.parentId=parent;
    }
  });

  db.categories=db.categories.filter(x=>x.id!==id);

  scheduleSave();
  renderAll();
}


/* ============================================================
   TAGS
   ============================================================ */

function usedTags(){

  const set=new Set();

  activeNotes().forEach(n=>{
    (n.tags||[]).forEach(t=>set.add(t));
  });

  return [...set].sort((a,b)=>
    a.localeCompare(b,undefined,{sensitivity:"base"})
  );
}

function addTag(){

  const name=prompt("New Tag");

  if(!name || !name.trim())return;

  const clean=name.trim();

  if(db.tags.some(t=>
    t.toLowerCase()===clean.toLowerCase()
  )){
    alert("یہ Tag پہلے سے موجود ہے۔");
    return;
  }

  db.tags.push(clean);

  scheduleSave();
  renderAll();
}

function renameTag(tag){

  const newName=prompt("Rename Tag",tag);

  if(!newName || !newName.trim())return;

  const clean=newName.trim();

  if(db.tags.some(t=>
    t!==tag &&
    t.toLowerCase()===clean.toLowerCase()
  )){
    alert("یہ Tag پہلے سے موجود ہے۔");
    return;
  }

  db.tags=db.tags.map(t=>t===tag?clean:t);

  db.notes.forEach(n=>{
    n.tags=(n.tags||[]).map(t=>t===tag?clean:t);
  });

  scheduleSave();
  renderAll();
}

function removeTag(tag){

  if(!confirmAction(
    `Tag "${tag}" remove کرنا ہے؟`,
    "confirmTagRemoval"
  ))return;

  db.tags=db.tags.filter(t=>t!==tag);

  db.notes.forEach(n=>{
    n.tags=(n.tags||[]).filter(t=>t!==tag);
  });

  scheduleSave();
  renderAll();
}


/* ============================================================
   DELETE / RESTORE / BIN
   ============================================================ */

function deleteNote(note){

  if(!confirmAction(
    "یہ Note Recycle Bin میں بھیجنا ہے؟",
    "confirmDelete"
  ))return;

  note.deleted=true;
  note.status="Deleted";
  note.modifiedAt=nowISO();

  /*
   IMPORTANT:
   Bin is permanent until manually removed.
  */

  if(!note.tags.includes("Bin")){
    note.tags.push("Bin");
  }

  if(!db.tags.includes("Bin")){
    db.tags.push("Bin");
  }

  db.counters.binSequence++;

  const binTag="Bin "+db.counters.binSequence;

  if(!note.tags.includes(binTag)){
    note.tags.push(binTag);
  }

  if(!db.tags.includes(binTag)){
    db.tags.push(binTag);
  }

  if(selectedNoteId===note.id){
    selectedNoteId=null;
  }

  scheduleSave();
  renderAll();
}

function restoreNote(note){

  note.deleted=false;
  note.trashHidden=false;
  note.status="Active";

  /*
   IMPORTANT:
   Bin / Bin N tags are NOT removed.
  */

  note.modifiedAt=nowISO();

  scheduleSave();
  renderAll();
}

function emptyTrash(){

  if(!confirmAction(
    "Recycle Bin empty کرنا ہے؟ Notes permanently delete نہیں ہوں گے، صرف hide ہوں گے۔",
    "confirmEmptyTrash"
  ))return;

  db.notes.forEach(n=>{
    if(n.deleted){
      n.trashHidden=true;
    }
  });

  db.trashState.hidden=true;

  scheduleSave();
  renderAll();
}

function restoreTrash(){

  db.notes.forEach(n=>{
    if(n.deleted){
      n.trashHidden=false;
    }
  });

  db.trashState.hidden=false;

  scheduleSave();
  renderAll();
}

function renderCategoryTree(){

  const container=$("categoryTree");

  container.innerHTML="";

  function build(parentId=null,level=0){

    const children=categoryChildren(parentId);

    children.forEach(c=>{

      const node=document.createElement("div");
      node.className="tree-node";

      const row=document.createElement("div");
      row.className="tree-row";

      const toggle=document.createElement("button");
      toggle.className="tree-toggle";

      const hasChildren=
        categoryChildren(c.id).length>0;

      toggle.textContent=
        hasChildren
          ? (expandedCategories.has(c.id)?"▾":"▸")
          : "";

      const label=document.createElement("div");
      label.className="tree-label";
      label.style.color=categoryColor(c.id);

      label.innerHTML=
        `📁 ${escapeHTML(c.name)}
         <span class="side-count">${categoryNoteCount(c.id)}</span>`;

      label.onclick=()=>{

        if(hasChildren){
          if(expandedCategories.has(c.id))
            expandedCategories.delete(c.id);
          else
            expandedCategories.add(c.id);

          renderCategoryTree();
        }

        currentSection="category:"+c.id;
        currentPage=1;
        renderAll();
      };

      toggle.onclick=()=>{

        if(!hasChildren)return;

        if(expandedCategories.has(c.id))
          expandedCategories.delete(c.id);
        else
          expandedCategories.add(c.id);

        renderCategoryTree();
      };

      row.append(toggle,label);

      const edit=document.createElement("button");
      edit.className="side-edit";
      edit.textContent="✏️";

      edit.onclick=e=>{
        e.stopPropagation();
        openCategoryMenu(c.id);
      };

      row.appendChild(edit);
      node.appendChild(row);

      if(hasChildren && expandedCategories.has(c.id)){
        const childWrap=document.createElement("div");
        childWrap.className="tree";
        childWrap.appendChild(
          buildFragment(c.id,level+1)
        );
        node.appendChild(childWrap);
      }

      container.appendChild(node);
    });
  }

  function buildFragment(parentId,level){

    const frag=document.createDocumentFragment();

    categoryChildren(parentId).forEach(c=>{

      const node=document.createElement("div");
      node.className="tree-node";

      const row=document.createElement("div");
      row.className="tree-row";

      const hasChildren=
        categoryChildren(c.id).length>0;

      const toggle=document.createElement("button");
      toggle.className="tree-toggle";
      toggle.textContent=
        hasChildren
        ? (expandedCategories.has(c.id)?"▾":"▸")
        : "";

      toggle.onclick=e=>{
        e.stopPropagation();

        if(expandedCategories.has(c.id))
          expandedCategories.delete(c.id);
        else
          expandedCategories.add(c.id);

        renderCategoryTree();
      };

      const label=document.createElement("div");
      label.className="tree-label";
      label.style.color=categoryColor(c.id);

      label.innerHTML=
        `📁 ${escapeHTML(c.name)}
         <span class="side-count">${categoryNoteCount(c.id)}</span>`;

      label.onclick=()=>{
        currentSection="category:"+c.id;
        currentPage=1;
        renderAll();
      };

      const edit=document.createElement("button");
      edit.className="side-edit";
      edit.textContent="✏️";

      edit.onclick=e=>{
        e.stopPropagation();
        openCategoryMenu(c.id);
      };

      row.append(toggle,label,edit);
      node.appendChild(row);

      if(hasChildren && expandedCategories.has(c.id)){
        const child=document.createElement("div");
        child.className="tree";
        child.appendChild(buildFragment(c.id,level+1));
        node.appendChild(child);
      }

      frag.appendChild(node);
    });

    return frag;
  }

  build();
}

function renderTags(){

  const container=$("tagList");

  container.innerHTML="";

  usedTags().forEach(tag=>{

    const row=document.createElement("div");
    row.className="side-item";

    row.innerHTML=
      `<span>🏷️</span>

       </span>`;

    row.onclick=()=>{
      currentSection="tag:"+tag;
      currentPage=1;
      renderAll();
    };

    const edit=document.createElement("button");
    edit.className="side-edit";
    edit.textContent="✏️";

    edit.onclick=e=>{
      e.stopPropagation();

      openTagMenu(tag);
    };

    row.appendChild(edit);

    container.appendChild(row);
  });
}

function renderNoteList(){

  const notes=allVisibleNotes();

  let title="All Notes";

  if(currentSection==="favorites")
    title="Favorites";

  else if(currentSection==="trash")
    title=db.trashState.label||"Recycle Bin";

  else if(currentSection.startsWith("category:"))
    title=getCategory(currentSection.slice(9))?.name||"Category";

  else if(currentSection.startsWith("tag:"))
    title=currentSection.slice(4);

  $("listTitle").textContent=title;
  $("listCount").textContent=
    `${notes.length} ${notes.length===1?"Note":"Notes"}`;

  const list=$("noteList");

  list.innerHTML="";

  if(!notes.length){

    list.innerHTML=
      `<div class="empty">No notes found.</div>`;

    return;
  }

  const fragment=document.createDocumentFragment();

  notes.forEach(note=>{

    const row=document.createElement("div");

    row.className=
      "note-row"+
      (selectedNoteId===note.id?" selected":"")+
      (note.pinned?" pinned":"");

    row.style.setProperty(
      "--note-color",
      note.color||"#9ca3af"
    );

    const check=document.createElement("input");
    check.type="checkbox";
    check.checked=selectedIds.has(note.id);

    check.onclick=e=>{
      e.stopPropagation();

      if(check.checked)
        selectedIds.add(note.id);
      else
        selectedIds.delete(note.id);

      renderBulkBar();
    };

    const title=document.createElement("div");
    title.className="note-title";
    title.textContent=
      note.title || "[No Heading]";

    const preview=document.createElement("div");
    preview.className="note-preview";
    preview.textContent=
      stripHTML(note.content||"") ||
      "[No Content]";

    const meta=document.createElement("div");
    meta.className="note-meta";

    const pin=document.createElement("button");
    pin.className=
      "icon-action "+
      (note.pinned?"active-pin":"");

    pin.textContent="📌";

    pin.title=note.pinned?"Unpin":"Pin";

    pin.onclick=e=>{
      e.stopPropagation();
      note.pinned=!note.pinned;
      note.modifiedAt=nowISO();
      scheduleSave();
      renderAll();
    };

    const fav=document.createElement("button");
    fav.className=
      "icon-action "+
      (note.favorite?"active-fav":"");

    fav.textContent="⭐";

    fav.title=
      note.favorite
      ?"Remove Favorite"
      :"Add Favorite";

    fav.onclick=e=>{
      e.stopPropagation();

      note.favorite=!note.favorite;
      note.modifiedAt=nowISO();

      scheduleSave();
      renderAll();
    };

    meta.append(pin,fav);

    const cat=getCategory(note.categoryId);

    if(cat){

      const catSpan=document.createElement("span");

      catSpan.style.color=categoryColor(cat.id);

      catSpan.textContent=
        `📁 ${cat.name}`;

      meta.appendChild(catSpan);
    }

    (note.tags||[]).forEach(tag=>{

      const span=document.createElement("span");

      span.textContent=`🏷️ ${tag}`;

      meta.appendChild(span);
    });

    const date=document.createElement("div");
    date.className="note-date";

    date.textContent=formatDate(
      note.modifiedAt||note.createdAt
    );

    row.append(check,title,preview,meta,date);

    row.onclick=()=>{
      selectNote(note.id);
    };

    fragment.appendChild(row);
  });

  list.appendChild(fragment);

  renderBulkBar();
}

function renderBulkBar(){

  const count=selectedIds.size;

  $("bulkBar").classList.toggle(
    "show",
    count>0
  );

  $("selectedCount").textContent=
    `${count} selected`;

  $("bulkPin").textContent=
    selectedIds.size &&
    [...selectedIds].every(id=>getNote(id)?.pinned)

  $("bulkFavorite").textContent=
    selectedIds.size &&
    [...selectedIds].every(id=>getNote(id)?.favorite)
    ? "⭐ Unfavorite"
    : "⭐ Favorite";
}

function metadataCell(label,value){

  return `
    <div class="meta-cell">
      <div class="meta-label">${escapeHTML(label)}</div>
      <div class="meta-value">${escapeHTML(String(value))}</div>
    </div>
  `;
}

function wordCount(note){

  const text=stripHTML(note.content||"").trim();

  if(!text)return 0;

  return text.split(/\s+/).length;
}

function noteSize(note){

  const bytes=
    new Blob([JSON.stringify(note)]).size;

  if(bytes<1024)return bytes+" B";

  if(bytes<1024*1024)
    return (bytes/1024).toFixed(1)+" KB";

  return (bytes/(1024*1024)).toFixed(1)+" MB";
}


/* ============================================================
   LINKS

function renderLinks(note){

function insertLinkAtCursor(){

  const selection=window.getSelection();

  const selectedText=
    selection && selection.toString();

  const url=prompt(
    "Link URL",
    "https://"
  );

  if(!url)return;

  if(!/^https?:\/\//i.test(url)){
    alert("Valid http/https URL دیں۔");
    return;
  }

  if(selectedText){

    document.execCommand(
      "createLink",
      false,
      url
    );

  }else{

    const title=prompt(
      "Link Text",
      url
    );

    if(!title)return;

    document.execCommand(
      "insertHTML",
      false,
      `<a href="${escapeHTML(url)}"
          target="_blank"
          rel="noopener noreferrer">
        ${escapeHTML(title)}
       </a>`
    );
  }

  const note=getNote(selectedNoteId);

  note.content=$("contentEditor").innerHTML;
  note.modifiedAt=nowISO();

  scheduleSave();
}

/* ============================================================
   PRINT
   ============================================================ */

function printCurrentNote(){

  const note=getNote(selectedNoteId);

  if(!note)return;

  const heading=
    note.title || "[No Heading]";

  const content=
    note.content || "[No Content]";

  const links=(note.links||[])
    .map(l=>
      `<p><a href="${escapeHTML(l.url)}">
        ${escapeHTML(l.title)}
       </a></p>`
    )
    .join("");

  const w=window.open("","_blank");

  if(!w)return;

  w.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>${escapeHTML(heading)}</title>
      <style>
        body{
          font-family:Arial;
          max-width:800px;
          margin:40px auto;
          line-height:1.6;
        }
        h1{font-size:28px}
      </style>
    </head>
    <body>
      <h1>${escapeHTML(heading)}</h1>
      <div>${content}</div>
      ${links}
    </body>
    </html>
  `);

  w.document.close();

  setTimeout(()=>{
    w.print();
  },300);
}

function qrText(note){

  const heading=
    note.title
      ? note.title
      : "[No Heading]";

  const content=
    stripHTML(note.content||"")
      .trim() || "[No Content]";

  /*
   No Heading: / Content: labels are deliberately used.
  */

  return (
    heading +
    "\n\n" +
    content
  );
}

/* ============================================================
   BULK ACTIONS
   ============================================================ */

function selectedNotes(){

  return [...selectedIds]
    .map(id=>getNote(id))
    .filter(Boolean);
}

function bulkToggle(field){

  const notes=selectedNotes();

  if(!notes.length)return;

  const all=notes.every(n=>n[field]);

  notes.forEach(n=>{
    n[field]=!all;
    n.modifiedAt=nowISO();
  });

  scheduleSave();
  renderAll();
}

$("bulkPin").onclick=()=>{
  bulkToggle("pinned");
};

$("bulkFavorite").onclick=()=>{
  bulkToggle("favorite");
};

$("bulkDelete").onclick=()=>{

  selectedNotes().forEach(n=>{
    if(!n.deleted) deleteNote(n);
  });

  selectedIds.clear();

  renderAll();
};

$("bulkDuplicate").onclick=()=>{

  selectedNotes().forEach(note=>{

    const copy=structuredClone(note);

    copy.id=uid("note");
    copy.title=(note.title||"Note")+" Copy";

    const t=nowISO();

    copy.createdAt=t;
    copy.modifiedAt=t;
    copy.lastViewedAt="";
    copy.views=0;

    copy.deleted=false;
    copy.trashHidden=false;
    copy.status="Active";

    db.notes.push(copy);
  });

  selectedIds.clear();

  scheduleSave();
  renderAll();
};

$("bulkCategory").onclick=()=>{

  const notes=selectedNotes();

  if(!notes.length)return;

  let options=

  db.categories.forEach(c=>{

      <button class="secondary" onclick="closeModal()">
        Cancel
      </button>

      <button class="primary" onclick="saveSettings()">
        Save Settings
      </button>
    </div>
  `);

  $("s_sidebarDefault").value=db.settings.sidebarDefault;
  $("s_sidebarDensity").value=db.settings.sidebarDensity;
  $("s_categoryDefault").value=db.settings.categoryDefault;
  $("s_tagsDefault").value=db.settings.tagsDefault;
  $("s_noteDisplayStyle").value=db.settings.noteDisplayStyle;
  $("s_sorting").value=db.settings.sorting;
  $("s_notesPerPage").value=db.settings.notesPerPage;
  $("s_searchMode").value=db.settings.searchMode;
  $("s_autoSave").value=String(db.settings.autoSave);
  $("s_autoSaveInterval").value=db.settings.autoSaveInterval;
  $("s_saveConfirmation").value=String(db.settings.saveConfirmation);
  $("s_notificationDuration").value=db.settings.notificationDuration;
  $("s_timeFormat").value=db.settings.timeFormat;
  $("s_layoutMode").value=db.settings.layoutMode;
  $("s_confirmDelete").value=String(db.settings.confirmDelete);
  $("s_confirmEmptyTrash").value=String(db.settings.confirmEmptyTrash);
}

function saveSettings(){

  db.settings.sidebarDefault=
    $("s_sidebarDefault").value;

  db.settings.sidebarDensity=
    $("s_sidebarDensity").value;

  db.settings.categoryDefault=
    $("s_categoryDefault").value;

  db.settings.tagsDefault=
    $("s_tagsDefault").value;

  db.settings.noteDisplayStyle=
    $("s_noteDisplayStyle").value;

  db.settings.sorting=
    $("s_sorting").value;

  db.settings.notesPerPage=
    $("s_notesPerPage").value;

  db.settings.searchMode=
    $("s_searchMode").value;

  db.settings.autoSave=
    $("s_autoSave").value==="true";

  db.settings.autoSaveInterval=
    Number($("s_autoSaveInterval").value)||1500;

  db.settings.saveConfirmation=
    $("s_saveConfirmation").value==="true";

  db.settings.notificationDuration=
    Number($("s_notificationDuration").value)||1800;

  db.settings.timeFormat=
    $("s_timeFormat").value;

  db.settings.layoutMode=
    $("s_layoutMode").value;

  db.settings.confirmDelete=
    $("s_confirmDelete").value==="true";

  db.settings.confirmEmptyTrash=
    $("s_confirmEmptyTrash").value==="true";

  closeModal();

  scheduleSave();
  renderAll();
}


/* ============================================================
   MODAL
   ============================================================ */

function openModal(html){

  $("modal").innerHTML=html;

  $("modalBackdrop")
    .classList.add("show");
}

function closeModal(){

  $("modalBackdrop")
    .classList.remove("show");

  $("modal").innerHTML="";
}

$("modalBackdrop").addEventListener("click",e=>{

  if(e.target===$("modalBackdrop")){
    closeModal();
  }
});


/* ============================================================
   ADD NOTE
   ============================================================ */

$("addNoteBtn").onclick=()=>{

  const note=createNote();

  db.notes.unshift(note);

  selectedNoteId=note.id;
  currentSection="all";

  scheduleSave();
  renderAll();

  setTimeout(()=>{
    editCurrentNote();
  },50);
};


/* ============================================================
   SIDEBAR CONTROLS
   ============================================================ */

function toggleSidebar(){

  const sidebar=$("sidebar");

  sidebar.classList.toggle("closed");

  const open=!sidebar.classList.contains("closed");

  $("sidebarBtn").textContent=
    open ? "✕ Hide" : "☰ Show";
}

$("sidebarBtn").onclick=toggleSidebar;

$("categoriesToggle").onclick=e=>{

  if(e.target.closest(".side-edit"))return;

  const tree=$("categoryTree");
  const tools=$("categoryTools");

  const open=
    tree.style.display==="none";

  tree.style.display=open?"block":"none";
  tools.style.display=open?"flex":"none";
};

$("tagsToggle").onclick=e=>{

  if(e.target.closest(".side-edit"))return;

  const list=$("tagList");
  const tools=$("tagTools");

  const open=
    list.style.display==="none";

  list.style.display=open?"block":"none";
  tools.style.display=open?"flex":"none";
};

$("categoryManage").onclick=e=>{
  e.stopPropagation();

  openModal(`
    <h3>Categories</h3>

    <div class="form-row">
      <button class="primary"
        onclick="closeModal();addRootCategory.click()">
        ＋ Add Category
      </button>
    </div>

    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">
        Close
      </button>
    </div>
  `);
};

$("tagManage").onclick=e=>{
  e.stopPropagation();

  openModal(`
    <h3>Tags</h3>

    <div class="form-row">
      <button class="primary"
        onclick="closeModal();addTag()">
        ＋ Add Tag
      </button>
    </div>

    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">
        Close
      </button>
    </div>
  `);
};

$("addRootCategory").onclick=()=>{

  const name=prompt("New Category Name");

  if(name)addCategory(name,null);
};

$("addTag").onclick=addTag;

$("settingsBtn").onclick=openSettings;


/* ============================================================
   SIDEBAR SECTION NAVIGATION
   ============================================================ */

document.querySelectorAll(
  ".side-item[data-section]"
).forEach(item=>{

  item.addEventListener("click",e=>{

    if(e.target.closest(".side-edit"))return;

    currentSection=item.dataset.section;

    currentPage=1;

    selectedIds.clear();

    renderAll();
  });
});


/* ============================================================
   SEARCH
   ============================================================ */

$("searchInput").addEventListener(
  "input",
  e=>{
    searchText=e.target.value;
    currentPage=1;
    renderNoteList();
  }
);


/* ============================================================
   CHECKLIST
   ============================================================ */

document.querySelector(
  '[data-section="checklist"]'
).addEventListener("click",()=>{

  const url=db.checklist.url;

  if(url){
    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );
  }else{

    openModal(`
      <h3>Checklist Web App</h3>

      <div class="form-row">
        <label>Web App URL</label>
        <input id="checklistURL"
          placeholder="https://script.google.com/...">
      </div>

      <div class="modal-actions">
        <button class="secondary" onclick="closeModal()">
          Cancel
        </button>

        <button class="primary"
          onclick="saveChecklistURL()">
          Save
        </button>
      </div>
    `);
  }
});

function saveChecklistURL(){

  const url=$("checklistURL").value.trim();

  if(!/^https?:\/\//i.test(url)){
    alert("Valid URL دیں۔");
    return;
  }

  db.checklist.url=url;

  closeModal();

  scheduleSave();
}


/* ============================================================
   TRASH CONTROLS
   ============================================================ */

document.querySelector(
  '[data-section="trash"]'
).addEventListener("dblclick",()=>{

  openModal(`
    <h3>${escapeHTML(db.trashState.label)}</h3>

    <div class="form-row">
      <button class="secondary"
        onclick="restoreTrash();closeModal()">
        Restore Recycle Bin
      </button>
    </div>

    <div class="form-row">
      <button class="danger"
        onclick="emptyTrash();closeModal()">
        Empty Recycle Bin
      </button>
    </div>

    <div class="modal-actions">
      <button class="secondary" onclick="closeModal()">
        Close
      </button>
    </div>
  `);
});


/* ============================================================
   RENDER ALL
   ============================================================ */

function renderAll(){

  renderSidebar();
  renderNoteList();
  renderDataPanel();

  $("sidebar").classList.toggle(
    "compact",
    db.settings.sidebarDensity==="compact"
  );

  document.documentElement.style.setProperty(
    "--primary",
    selectedNoteId && getNote(selectedNoteId)
      ? getNote(selectedNoteId).color || "#4f46e5"
      : "#4f46e5"
  );
}


/* ============================================================
   INITIALIZATION
   ============================================================ */

document.addEventListener("DOMContentLoaded",()=>{

  renderAll();

  initGoogle();

  /*
   The Sidebar remains CLOSED by default,
   according to the approved requirement.
  */
  $("sidebar").classList.add("closed");
  $("sidebarBtn").textContent="☰ Show";
});
