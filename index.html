<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Google Drive Database Test</title>

  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      padding: 25px;
      max-width: 800px;
      margin: auto;
    }

    h2 {
      margin-bottom: 20px;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      margin: 5px 5px 5px 0;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 14px;
      background: #f1f1f1;
      border-radius: 6px;
      white-space: pre-wrap;
    }

    #data {
      margin-top: 20px;
      padding: 15px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 6px;
      white-space: pre-wrap;
      overflow-x: auto;
    }

  </style>

</head>


<body>

  <h2>Google Drive Database Test</h2>


  <button id="connectBtn">
    Connect Google Drive
  </button>


  <button id="readBtn" disabled>
    Read Master.json
  </button>


  <button id="createBtn" disabled>
    Create Test File
  </button>


  <button id="updateBtn" disabled>
    Update Master.json
  </button>


  <button id="deleteBtn" disabled>
    Delete Test File
  </button>


  <div id="status">
    Not connected
  </div>


  <pre id="data"></pre>


<script>


/* =========================================================
   GOOGLE DRIVE CONFIGURATION
   ========================================================= */


const CLIENT_ID =
  "262106898132-tsn94p3vvpf34do0ommc6rai2mtc5sh6.apps.googleusercontent.com";


const DRIVE_SCOPE =
  "https://www.googleapis.com/auth/drive";


/* ---------------------------------------------------------
   MASTER DATABASE FILE
   --------------------------------------------------------- */


const MASTER_FILE_ID =
  "1dx0IrwUD0Is1GGOmfNsxkqpTD7fC4IW1";


/* ---------------------------------------------------------
   NOTES MANAGER TEST DATABASE FOLDER
   --------------------------------------------------------- */


const DATABASE_FOLDER_ID =
  "1iFxVl1IH0PrEZw5uDUlnJuaablUI77nx";


/* =========================================================
   VARIABLES
   ========================================================= */


let accessToken = null;


/*
   ID of the test file created during the current session.

   This is intentionally NOT hard-coded because every time
   we create a new test file, Google Drive gives it a new ID.
*/


let createdTestFileId = null;


/* =========================================================
   ELEMENTS
   ========================================================= */


const status =
  document.getElementById("status");


const data =
  document.getElementById("data");


const connectBtn =
  document.getElementById("connectBtn");


const readBtn =
  document.getElementById("readBtn");


const createBtn =
  document.getElementById("createBtn");


const updateBtn =
  document.getElementById("updateBtn");


const deleteBtn =
  document.getElementById("deleteBtn");


/* =========================================================
   STATUS FUNCTION
   ========================================================= */


function setStatus(message) {

  status.textContent = message;

}


/* =========================================================
   CONNECT GOOGLE DRIVE
   ========================================================= */


connectBtn.addEventListener(
  "click",
  function () {


    setStatus(
      "Connecting to Google..."
    );


    const tokenClient =
      google.accounts.oauth2.initTokenClient({

        client_id:
          CLIENT_ID,

        scope:
          DRIVE_SCOPE,


        callback:
          function (response) {


            if (response.error) {


              console.error(response);


              setStatus(

                "Google authorization failed:\n" +

                (
                  response.error_description ||
                  response.error
                )

              );


              return;

            }


            accessToken =
              response.access_token;


            setStatus(
              "SUCCESS! Google Drive connected."
            );


            readBtn.disabled =
              false;


            createBtn.disabled =
              false;


            updateBtn.disabled =
              false;


            deleteBtn.disabled =
              false;

          }

      });


    tokenClient.requestAccessToken({

      prompt:
        "consent"

    });

  }
);


/* =========================================================
   READ MASTER.JSON FUNCTION
   ========================================================= */


async function readMasterFile() {


  const response =
    await fetch(

      "https://www.googleapis.com/drive/v3/files/" +
      MASTER_FILE_ID +
      "?alt=media",

      {

        method:
          "GET",

        headers: {

          "Authorization":
            "Bearer " +
            accessToken

        }

      }

    );


  if (!response.ok) {


    const errorText =
      await response.text();


    throw new Error(

      "HTTP " +
      response.status +
      "\n" +
      errorText

    );

  }


  const text =
    await response.text();


  let json;


  try {

    json =
      JSON.parse(text);

  }

  catch {

    throw new Error(
      "Master.json contains invalid JSON."
    );

  }


  return json;

}


/* =========================================================
   READ BUTTON
   ========================================================= */


readBtn.addEventListener(
  "click",
  async function () {


    if (!accessToken) {

      setStatus(
        "Please connect Google Drive first."
      );

      return;

    }


    setStatus(
      "Reading Master.json..."
    );


    data.textContent =
      "";


    try {


      const json =
        await readMasterFile();


      setStatus(
        "SUCCESS! Master.json loaded."
      );


      data.textContent =
        JSON.stringify(
          json,
          null,
          2
        );


    }

    catch (error) {


      console.error(error);


      setStatus(

        "READ FAILED:\n" +
        error.message

      );

    }

  }
);


/* =========================================================
   CREATE TEST FILE
   ========================================================= */


createBtn.addEventListener(
  "click",
  async function () {


    if (!accessToken) {

      setStatus(
        "Please connect Google Drive first."
      );

      return;

    }


    setStatus(
      "Creating test file inside Notes Manager Test DB..."
    );


    try {


      const testData = {


        version:
          1,


        updatedAt:
          new Date().toISOString(),


        test:
          "Google Drive CREATE test successful",


        notes: [

          {

            id:
              1,

            title:
              "Create Test Note",

            content:
              "This file was created by the Notes Manager test web app."

          }

        ]

      };


      /* ---------------------------------------------------
         FILE METADATA
         --------------------------------------------------- */


      const metadata = {


        name:
          "Drive CRUD Test.json",


        mimeType:
          "application/json",


        /*
          IMPORTANT:
          This places the file inside the
          Notes Manager Test DB folder.
        */


        parents: [
          DATABASE_FOLDER_ID
        ]

      };


      /* ---------------------------------------------------
         MULTIPART FORM
         --------------------------------------------------- */


      const form =
        new FormData();


      form.append(

        "metadata",

        new Blob(

          [
            JSON.stringify(metadata)
          ],

          {
            type:
              "application/json"
          }

        )

      );


      form.append(

        "file",

        new Blob(

          [
            JSON.stringify(
              testData,
              null,
              2
            )
          ],

          {
            type:
              "application/json"
          }

        )

      );


      /* ---------------------------------------------------
         CREATE FILE
         --------------------------------------------------- */


      const response =
        await fetch(

          "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",

          {

            method:
              "POST",

            headers: {

              "Authorization":
                "Bearer " +
                accessToken

            },

            body:
              form

          }

        );


      if (!response.ok) {


        const errorText =
          await response.text();


        throw new Error(

          "HTTP " +
          response.status +
          "\n" +
          errorText

        );

      }


      const result =
        await response.json();


      /*
        IMPORTANT:
        Store the ID of the file we just created.
      */


      createdTestFileId =
        result.id;


      setStatus(

        "SUCCESS! Test file created inside Notes Manager Test DB.\n\n" +

        "File Name: " +
        result.name +

        "\nFile ID: " +
        result.id

      );


      data.textContent =
        JSON.stringify(
          testData,
          null,
          2
        );


      /*
        Delete is now enabled because we have
        the newly-created file ID.
      */


      deleteBtn.disabled =
        false;


    }

    catch (error) {


      console.error(error);


      setStatus(

        "CREATE FAILED:\n" +
        error.message

      );

    }

  }
);


/* =========================================================
   UPDATE MASTER.JSON
   ========================================================= */


updateBtn.addEventListener(
  "click",
  async function () {


    if (!accessToken) {

      setStatus(
        "Please connect Google Drive first."
      );

      return;

    }


    setStatus(
      "Reading Master.json before update..."
    );


    try {


      const json =
        await readMasterFile();


      /* ---------------------------------------------------
         TEST FIELDS
         --------------------------------------------------- */


      json.updatedAt =
        new Date().toISOString();


      json.writeTest =
        "Google Drive UPDATE test successful";


      json.writeTestTime =
        new Date().toLocaleString();


      /* ---------------------------------------------------
         CONVERT TO JSON
         --------------------------------------------------- */


      const jsonText =
        JSON.stringify(
          json,
          null,
          2
        );


      const fileBlob =
        new Blob(

          [
            jsonText
          ],

          {
            type:
              "application/json"
          }

        );


      /* ---------------------------------------------------
         UPDATE EXISTING MASTER FILE
         --------------------------------------------------- */


      const response =
        await fetch(

          "https://www.googleapis.com/upload/drive/v3/files/" +
          MASTER_FILE_ID +
          "?uploadType=media",

          {

            method:
              "PATCH",

            headers: {

              "Authorization":
                "Bearer " +
                accessToken,

              "Content-Type":
                "application/json"

            },

            body:
              fileBlob

          }

        );


      if (!response.ok) {


        const errorText =
          await response.text();


        throw new Error(

          "HTTP " +
          response.status +
          "\n" +
          errorText

        );

      }


      const result =
        await response.json();


      setStatus(

        "SUCCESS! Master.json UPDATED successfully.\n\n" +

        "File ID: " +
        (
          result.id ||
          MASTER_FILE_ID
        )

      );


      data.textContent =
        JSON.stringify(
          json,
          null,
          2
        );


    }

    catch (error) {


      console.error(error);


      setStatus(

        "UPDATE FAILED:\n" +
        error.message

      );

    }

  }
);


/* =========================================================
   DELETE TEST FILE
   ========================================================= */


deleteBtn.addEventListener(
  "click",
  async function () {


    if (!accessToken) {

      setStatus(
        "Please connect Google Drive first."
      );

      return;

    }


    /*
      Do not allow deletion if no test file was
      created during this session.
    */


    if (!createdTestFileId) {

      setStatus(

        "No newly created test file is available to delete.\n\n" +

        "Please click Create Test File first."

      );

      return;

    }


    const confirmed =
      confirm(

        "Delete the newly created test file only?\n\n" +

        "Master.json will NOT be deleted."

      );


    if (!confirmed) {

      setStatus(
        "Delete cancelled."
      );

      return;

    }


    setStatus(
      "Deleting test file..."
    );


    try {


      const fileIdToDelete =
        createdTestFileId;


      const response =
        await fetch(

          "https://www.googleapis.com/drive/v3/files/" +
          fileIdToDelete,

          {

            method:
              "DELETE",

            headers: {

              "Authorization":
                "Bearer " +
                accessToken

            }

          }

        );


      if (!response.ok) {


        const errorText =
          await response.text();


        throw new Error(

          "HTTP " +
          response.status +
          "\n" +
          errorText

        );

      }


      setStatus(

        "SUCCESS! Test file deleted.\n\n" +

        "Deleted File ID: " +
        fileIdToDelete +

        "\n\n" +

        "Master.json was NOT deleted."

      );


      data.textContent =
        "Delete operation successful.";


      /*
        Clear the stored ID so the same file
        cannot accidentally be deleted again.
      */


      createdTestFileId =
        null;


      deleteBtn.disabled =
        true;


    }

    catch (error) {


      console.error(error);


      setStatus(

        "DELETE FAILED:\n" +
        error.message

      );

    }

  }
);


</script>

</body>

</html>
