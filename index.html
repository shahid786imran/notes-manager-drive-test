<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Google Drive Notes Manager</title>

<style>
:root{
  --bg:#f4f6fa;
  --card:#fff;
  --text:#17202a;
  --muted:#687385;
  --border:#dce2ea;
  --accent:#2563eb;
  --danger:#dc2626;
  --favorite:#eab308;
  --success:#16a34a;
  --sidebar-width:250px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* =========================
   FIXED HEADER
========================= */

.top-header{
  position:sticky;
  top:0;
  z-index:5000;
  min-height:58px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 12px;
  background:var(--card);
  border-bottom:1px solid var(--border);
}

.top-header button{
  white-space:nowrap;
}

.status{
  margin-left:auto;
  color:var(--muted);
  font-size:13px;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:fixed;
  z-index:4000;
  top:58px;
  left:0;
  bottom:0;
  width:var(--sidebar-width);
  background:var(--card);
  border-right:1px solid var(--border);
  overflow-y:auto;
  transform:translateX(-105%);
  transition:transform .2s ease;
  padding:10px;
}

.sidebar.open{
  transform:translateX(0);
}

.sidebar-button{
  display:block;
  width:100%;
  text-align:left;
  margin-bottom:5px;
}

.sidebar-section{
  margin-top:12px;
}

.section-button{
  width:100%;
  text-align:left;
  font-weight:bold;
}

.section-content{
  padding:5px 2px 5px 8px;
}

.hidden{
  display:none!important;
}

.tree-row,
.tag-row{
  display:flex;
  align-items:center;
  gap:5px;
  min-height:30px;
  font-size:14px;
}

.tree-name,
.tag-name{
  flex:1;
  cursor:pointer;
}

.count{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   MAIN
========================= */

.main{
  display:grid;
  grid-template-columns:minmax(300px,40%) 1fr;
  gap:12px;
  padding:12px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
}

.search-row{
  display:flex;
  gap:7px;
  margin-bottom:9px;
}

.search-row input{
  flex:1;
  min-width:0;
}

input,
textarea,
select{
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px;
  background:white;
  color:var(--text);
}

/* =========================
   BUTTONS
========================= */

button{
  border:1px solid var(--border);
  background:white;
  color:var(--text);
  border-radius:8px;
  padding:8px 11px;
  cursor:pointer;
}

button:hover{
  filter:brightness(.97);
}

.btn-danger{
  color:white;
  background:var(--danger);
  border-color:var(--danger);
}

.btn-success{
  color:white;
  background:var(--success);
  border-color:var(--success);
}

/* =========================
   NOTES LIST
========================= */

.note-list{
  display:flex;
  flex-direction:column;
}

.note-row{
  position:relative;
  border:1px solid var(--border);
  border-left:6px solid #cbd5e1;
  border-radius:9px;
  padding:9px;
  margin:6px 0;
  cursor:pointer;
}

.note-row.selected{
  outline:2px solid var(--accent);
}

.note-actions{
  display:flex;
  gap:5px;
  margin-bottom:5px;
}

.mini-button{
  padding:3px 7px;
  font-size:13px;
}

.pin-active{
  background:var(--danger);
  color:white;
  border-color:var(--danger);
}

.favorite-active{
  background:var(--favorite);
  color:white;
  border-color:var(--favorite);
}

.note-title{
  font-weight:bold;
  font-size:16px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.note-description{
  color:var(--muted);
  font-size:13px;
  margin:4px 0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.note-meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  color:var(--muted);
  font-size:12px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
}

/* =========================
   PANEL
========================= */

.color-bar{
  height:15px;
  border-radius:9px;
  margin-bottom:10px;
}

.action-card{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  padding:10px;
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:12px;
}

.view-title{
  font-size:26px;
  font-weight:bold;
  margin:10px 0;
}

.body-view{
  min-height:220px;
  line-height:1.65;
  overflow-wrap:anywhere;
}

.body-view a{
  color:var(--accent);
}

.edit-title{
  width:100%;
  border:0;
  border-bottom:1px solid var(--border);
  border-radius:0;
  font-size:25px;
  font-weight:bold;
  padding:8px 2px;
  outline:none;
}

.editor-toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin:8px 0;
}

.editor-body{
  min-height:250px;
  border:1px solid var(--border);
  border-radius:9px;
  padding:12px;
  outline:none;
  line-height:1.65;
}

.links-card{
  margin-top:14px;
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
}

.link-inputs{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:7px;
  margin-top:8px;
}

.link-row{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px;
  margin-top:6px;
  cursor:pointer;
}

.link-row:hover{
  background:#f8fafc;
}

.link-title{
  flex:1;
  color:var(--accent);
  font-weight:500;
}

/* =========================
   METADATA
========================= */

.metadata{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:14px;
}

.metadata-item{
  border-bottom:1px solid var(--border);
  padding:7px 3px;
  font-size:13px;
}

.metadata-label{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-bottom:2px;
}

/* =========================
   SETTINGS
========================= */

.settings-box{
  padding:12px;
}

.setting-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){
  .main{
    grid-template-columns:1fr;
  }

  .status{
    display:none;
  }

  .link-inputs{
    grid-template-columns:1fr;
  }
}

@media(max-width:600px){
  .top-header{
    overflow-x:auto;
  }

  .top-header button{
    font-size:12px;
    padding:7px 8px;
  }

  .metadata{
    grid-template-columns:1fr;
  }

  .sidebar{
    width:280px;
  }
}
</style>
</head>

<body>

<!-- =====================================================
     FIXED TOP HEADER
===================================================== -->

<header class="top-header">

<button id="sidebarToggle">
☰ Show / Hide

<button id="connectGoogle">

<aside id="sidebar" class="sidebar">

<div class="sidebar-section">

<!-- =====================================================

<main class="main">

Select a note to view it.
</div>

</main>

<script>

/* =========================================================
   GOOGLE DRIVE CONFIGURATION
========================================================= */

const CONFIG = {

  CLIENT_ID:
  "262106898132-tsn94p3vvpf34do0ommc6rai2mtc5sh6.apps.googleusercontent.com",

  FOLDER_ID:
  "1iFxVl1IH0PrEZw5uDUlnJuaablUI77nx",

  DB_FILE_ID:
  "1i3LtPybAqhvumBsy0HXJyUCjmFBIdGP7",

  DB_FILE_NAME:
  "MasterDB.json",

  SCOPES:
  "https://www.googleapis.com/auth/drive"

};


/* =========================================================
   APPLICATION STATE
========================================================= */

let accessToken = null;

let database = null;

let currentNoteId = null;

let selectedNotes = new Set();

let currentView = "all";

let searchText = "";

let saveTimer = null;

let countdown = 10;

let changesPending = false;


/* =========================================================
   DEFAULT DATABASE
========================================================= */

function createEmptyDatabase(){

  return {

    version: 1,

    nextNoteId: 1,

    notes: [],

    categories: [

      {
        id: "root",
        name: "Uncategorized",
        parentId: null
      }

    ],

    tags: [],

    settings: {

      sidebarView: "compact",

      theme: "system",

      fontSize: "normal",

      notesPerPage: "all",

      confirmDelete: true,

      trashName: "Recycle Bin"

    }

  };

}


/* =========================================================
   INITIALIZE
========================================================= */

function ensureDatabase(){

  if(!database){
    database = createEmptyDatabase();
  }

  if(!Array.isArray(database.notes)){
    database.notes = [];
  }

  if(!Array.isArray(database.categories)){
    database.categories = [];
  }

  if(!database.categories.some(c => c.id === "root")){

    database.categories.unshift({

      id:"root",
      name:"Uncategorized",
      parentId:null

    });

  }

  if(!Array.isArray(database.tags)){
    database.tags = [];
  }

  if(!database.settings){
    database.settings = createEmptyDatabase().settings;
  }

}


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function getNow(){

  return new Date().toISOString();

}


function formatDate(value){

  if(!value){
    return "—";
  }

  return new Date(value).toLocaleString(
    undefined,
    {
      day:"2-digit",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function getCategoryName(categoryId){

  const category =
  database.categories.find(
    c => c.id === categoryId
  );

  return category
    ? category.name
    : "Uncategorized";

}


function getCategoryPath(categoryId){

  let result = [];

  let current =
  database.categories.find(
    c => c.id === categoryId
  );

  while(current){

    result.unshift(current.name);

    current =
    database.categories.find(
      c => c.id === current.parentId
    );

  }

  return result.length
    ? result.join(" / ")
    : "Uncategorized";

}


function getChildCategoryIds(categoryId){

  const result = [categoryId];

  let changed = true;

  while(changed){

    changed = false;

    database.categories.forEach(category => {

      if(
        result.includes(category.parentId) &&
        !result.includes(category.id)
      ){

        result.push(category.id);

        changed = true;

      }

    });

  }

  return result;

}


function getWordCount(html){

  const temporary =
  document.createElement("div");

  temporary.innerHTML = html || "";

  const text =
  temporary.innerText.trim();

  if(!text){
    return 0;
  }

  return text.split(/\s+/).length;

}


function getDescription(html){

  const temporary =
  document.createElement("div");

  temporary.innerHTML = html || "";

  return temporary.innerText
    .replace(/\s+/g," ")
    .trim()
    .slice(0,150);

}


function getObjectSize(object){

  return new Blob([
    JSON.stringify(object)
  ]).size;

}


/* =========================================================
   RENDER EVERYTHING
========================================================= */

function render(){

  ensureDatabase();

  renderNoteList();

  renderCategories();

  renderTags();

  renderTrash();

  renderCurrentPanel();

}


/* =========================================================
   NOTE LIST
========================================================= */

function getVisibleNotes(){

  let notes =
  database.notes.filter(
    note => !note.deleted
  );

  if(currentView === "favorites"){

    notes =
    notes.filter(
      note => note.favorite
    );

  }

  if(currentView === "pinned"){

    notes =
    notes.filter(
      note => note.pinned
    );

  }

  if(currentView.startsWith("category:")){

    const id =
    currentView.replace("category:","");

    const ids =
    getChildCategoryIds(id);

    notes =
    notes.filter(
      note => ids.includes(note.categoryId)
    );

  }

  if(currentView.startsWith("tag:")){

    const tag =
    currentView.replace("tag:","");

    notes =
    notes.filter(
      note => (note.tags || []).includes(tag)
    );

  }

  if(searchText){

    const query =
    searchText.toLowerCase();

    notes =
    notes.filter(note => {

      const text = [

        note.title,

        note.content,

        getCategoryName(note.categoryId),

        ...(note.tags || [])

      ].join(" ").toLowerCase();

      return text.includes(query);

    });

  }

  notes.sort((a,b) => {

    if(a.pinned !== b.pinned){

      return b.pinned - a.pinned;

    }

    return new Date(b.modified || 0)
      - new Date(a.modified || 0);

  });

  return notes;

}


function renderNoteList(){

  const container =
  document.getElementById("noteList");

  const notes =
  getVisibleNotes();

  if(!notes.length){

    container.innerHTML =
    `<div class="empty">
      No notes found.
    </div>`;

    updateBulkActions();

    return;

  }

  container.innerHTML =
  notes.map(note => {

    const tags =
    (note.tags || [])
    .map(tag =>
      `<span>🏷 ${escapeHTML(tag)}</span>`
    )
    .join(" ");

    return `

    <article

      class="note-row
      ${selectedNotes.has(note.id) ? "selected" : ""}"

      data-note-id="${escapeHTML(note.id)}"

      style="
        border-left-color:
        ${escapeHTML(note.color || "#cbd5e1")}
      "

    >

      <div class="note-actions">

        <button
          class="mini-button
          ${note.pinned ? "pin-active" : ""}"
          data-action="pin"
          data-id="${escapeHTML(note.id)}"
        >
          📌
        </button>

        <button
          class="mini-button
          ${note.favorite ? "favorite-active" : ""}"
          data-action="favorite"
          data-id="${escapeHTML(note.id)}"
        >
          ★
        </button>

      </div>

      <div class="note-title">

        ${escapeHTML(
          note.title || "[No Heading]"
        )}

      </div>

      <div class="note-description">

        ${escapeHTML(
          getDescription(note.content)
        )}

      </div>

      <div class="note-meta">

        <span>
          📁 ${escapeHTML(
            getCategoryName(note.categoryId)
          )}
        </span>

        <span>🏷</span>

        ${tags || "<span>None</span>"}

      </div>

    </article>

    `;

  }).join("");

  updateBulkActions();

}


/* =========================================================
   CATEGORIES
========================================================= */

function renderCategories(){

  const container =
  document.getElementById("categoryContainer");

  function draw(parentId, depth){

    return database.categories

      .filter(c => c.parentId === parentId)

      .map(category => {

        const ids =
        getChildCategoryIds(category.id);

        const count =
        database.notes.filter(
          note =>
          !note.deleted &&
          ids.includes(note.categoryId)
        ).length;

        return `

        <div>

          <div
            class="tree-row"
            style="padding-left:${depth * 14}px"
          >

            <span
              class="tree-name"
              data-category-id="${escapeHTML(category.id)}"
            >
              📁 ${escapeHTML(category.name)}
            </span>

            <span class="count">
              ${count}
            </span>

          </div>

          ${draw(category.id,depth+1)}

        </div>

        `;

      }).join("");

  }

  container.innerHTML =
  draw(null,0);

}


/* =========================================================
   TAGS
========================================================= */

function renderTags(){

  const container =
  document.getElementById("tagsContainer");

  const counts = {};

  database.notes
  .filter(note => !note.deleted)
  .forEach(note => {

    (note.tags || []).forEach(tag => {

      counts[tag] =
      (counts[tag] || 0) + 1;

    });

  });

  const tags =
  Object.keys(counts).sort();

  if(!tags.length){

    container.innerHTML =
    `<div class="empty">No tags</div>`;

    return;

  }

  container.innerHTML =
  tags.map(tag => `

    <div class="tag-row">

      <span
        class="tag-name"
        data-tag-name="${escapeHTML(tag)}"
      >
        🏷 ${escapeHTML(tag)}
      </span>

      <span class="count">
        ${counts[tag]}
      </span>

    </div>

  `).join("");

}


/* =========================================================
   TRASH
========================================================= */

function renderTrash(){

  const container =
  document.getElementById("trashContainer");

  const count =
  database.notes.filter(
    note => note.deleted
  ).length;

  container.innerHTML = `

    <div class="tree-row">

      <span>
        ♻ ${escapeHTML(
          database.settings.trashName ||
          "Recycle Bin"
        )}
      </span>

      <span class="count">
        ${count}
      </span>

    </div>

    <button
      id="restoreAll"
      style="margin-top:7px;width:100%"
    >
      Restore All
    </button>

  `;

  document.getElementById("restoreAll")
    .onclick = restoreAllDeleted;

}


/* =========================================================
   CURRENT NOTE PANEL
========================================================= */

function renderCurrentPanel(){

  const panel =
  document.getElementById("dataPanel");

  const note =
  database.notes.find(
    n => n.id === currentNoteId
  );

  if(!note){

    panel.innerHTML =
    `<div class="empty">
      Select a note to view it.
    </div>`;

    return;

  }

  /*
     Last Viewed is updated when the note
     is opened.
  */

  note.lastViewed = getNow();

  note.totalViews =
  Number(note.totalViews || 0) + 1;

  panel.innerHTML = `

    <div
      class="color-bar"
      style="
        background:
        ${escapeHTML(note.color || "#2563eb")}
      "
    ></div>

    <div class="action-card">

      <button id="editNoteButton">
        ✎ Edit
      </button>

      <button id="panelRecycle" class="btn-danger">
        ♻ Remove
      </button>

      <button id="changeColor">
        🎨 Color
      </button>

      <button id="restorePanel"
        class="${note.deleted ? "" : "hidden"}">
        Restore
      </button>

    </div>

    <div class="view-title">

      ${escapeHTML(
        note.title || "[No Heading]"
      )}

    </div>

    <div class="body-view">

      ${note.content || "<i>No content</i>"}

    </div>

    ${renderLinks(note)}

    ${renderMetadata(note)}

  `;

  document.getElementById("editNoteButton")
    .onclick = () => openEditor(note.id);

  document.getElementById("panelRecycle")
    .onclick = () => recycleNote(note.id);

  document.getElementById("changeColor")
    .onclick = () => changeNoteColor(note.id);

  document.getElementById("restorePanel")
    .onclick = () => restoreNote(note.id);

}


/* =========================================================
   LINKS DISPLAY
========================================================= */

function renderLinks(note){

  const links =
  note.links || [];

  return `

    <div class="links-card">

      <strong>Links</strong>

      ${
        links.length
        ?
        links.map((link,index) => `

          <div
            class="link-row"
            data-link-index="${index}"
          >

            <span class="link-title">
              🔗 ${escapeHTML(link.title)}
            </span>

            <button
              data-delete-link="${index}"
            >
              ×
            </button>

          </div>

        `).join("")
        :
        `<div class="empty">
          No links
        </div>`
      }

    </div>

  `;

}


/* =========================================================
   METADATA
========================================================= */

function renderMetadata(note){

  const tags =
  (note.tags || []).join(", ") || "None";

  const metadata = [

    ["Created",formatDate(note.created)],

    ["Last Modified",formatDate(note.modified)],

    ["Last Viewed",formatDate(note.lastViewed)],

    ["Last Synced",formatDate(note.lastSynced)],

    ["Category",getCategoryName(note.categoryId)],

    ["Category Path",getCategoryPath(note.categoryId)],

    ["Tags",tags],

    ["Status",note.deleted ? "Deleted" : "Active"],

    ["Favorite",note.favorite ? "Yes" : "No"],

    ["Pin",note.pinned ? "Yes" : "No"],

    ["Word Count",getWordCount(note.content)],

    ["Note Size",
      getObjectSize(note) + " B"
    ],

    ["Links Count",
      (note.links || []).length
    ],

    ["Attachment Count",
      (note.attachments || []).length
    ],

    ["Total Views",
      note.totalViews || 0
    ],

    ["Storage / Sync Status",
      note.lastSynced
      ? "Google Drive"
      : "Not Synced"
    ],

    ["Note ID",note.id]

  ];

  return `

    <div class="metadata">

      ${
        metadata.map(item => `

          <div class="metadata-item">

            <span class="metadata-label">
              ${escapeHTML(item[0])}
            </span>

            ${escapeHTML(String(item[1]))}

          </div>

        `).join("")
      }

    </div>

  `;

}


/* =========================================================
   EDITOR
========================================================= */

function openEditor(noteId){

  const note =
  database.notes.find(
    n => n.id === noteId
  );

  if(!note){
    return;
  }

  const panel =
  document.getElementById("dataPanel");

  panel.innerHTML = `

    <div
      class="color-bar"
      style="
        background:
        ${escapeHTML(note.color || "#2563eb")}
      "
    ></div>

    <div class="action-card">

      <button id="saveEditor" class="btn-success">
        💾 Save
      </button>

      <button id="cancelEditor">
        Cancel
      </button>

      <button id="editorColor">
        🎨 Color
      </button>

    </div>

    <input
      id="editorTitle"
      class="edit-title"
      value="${escapeHTML(note.title || "")}"
      placeholder="[No Heading]"
    >

    <div class="editor-toolbar">

      <button
        data-command="bold"
        title="Bold"
      >
        <b>B</b>
      </button>

      <button
        data-command="underline"
        title="Underline"
      >
        <u>U</u>
      </button>

      <button id="textColor">
        Text Color
      </button>

      <button id="insertLink">
        🔗 Insert Link
      </button>

    </div>

    <div
      id="editorBody"
      class="editor-body"
      contenteditable="true"
    >
      ${note.content || ""}
    </div>

    <div class="links-card">

      <strong>Links</strong>

      <div class="link-inputs">

        <input
          id="newLinkTitle"
          placeholder="Link Title"
        >

        <input
          id="newLinkAddress"
          placeholder="Link Address"
        >

        <button id="addLink">
          ＋ Add
        </button>

      </div>

      <div id="editorLinks"></div>

    </div>

  `;


  /*
     Rich text toolbar
  */

  document
  .querySelectorAll("[data-command]")
  .forEach(button => {

    button.onclick = () => {

      document.execCommand(
        button.dataset.command,
        false,
        null
      );

      document
      .getElementById("editorBody")
      .focus();

    };

  });


  /*
     Text color
  */

  document.getElementById("textColor")
    .onclick = () => {

      const color =
      prompt(
        "Enter text color:",
        "#000000"
      );

      if(color){

        document.execCommand(
          "foreColor",
          false,
          color
        );

      }

    };


  /*
     Cursor-position link
  */

  document.getElementById("insertLink")
    .onclick = () => {

      const address =
      prompt(
        "Enter Link Address:"
      );

      if(!address){
        return;
      }

      document.execCommand(
        "createLink",
        false,
        address
      );

    };


  /*
     Separate link card
  */

  function renderEditorLinks(){

    const box =
    document.getElementById("editorLinks");

    box.innerHTML =
    (note.links || []).map(
      (link,index) => `

        <div class="link-row">

          <span class="link-title">
            ${escapeHTML(link.title)}
          </span>

          <button
            data-remove-editor-link="${index}"
          >
            ×
          </button>

        </div>

      `
    ).join("");

    box
    .querySelectorAll(
      "[data-remove-editor-link]"
    )
    .forEach(button => {

      button.onclick = () => {

        note.links.splice(
          Number(
            button.dataset.removeEditorLink
          ),
          1
        );

        renderEditorLinks();

        markChanges();

      };

    });

  }

  renderEditorLinks();


  document.getElementById("addLink")
    .onclick = () => {

      const title =
      document
      .getElementById("newLinkTitle")
      .value.trim();

      const address =
      document
      .getElementById("newLinkAddress")
      .value.trim();

      if(!title || !address){

        alert(
          "Link Title and Link Address are required."
        );

        return;

      }

      note.links =
      note.links || [];

      note.links.push({

        title:title,

        url:address

      });

      document
      .getElementById("newLinkTitle")
      .value = "";

      document
      .getElementById("newLinkAddress")
      .value = "";

      renderEditorLinks();

      markChanges();

    };


  /*
     Save editor
  */

  document.getElementById("saveEditor")
    .onclick = () => {

      note.title =
      document
      .getElementById("editorTitle")
      .value.trim();

      note.content =
      document
      .getElementById("editorBody")
      .innerHTML;

      note.modified =
      getNow();

      markChanges();

      render();

    };


  /*
     Cancel
  */

  document.getElementById("cancelEditor")
    .onclick = () => {

      renderCurrentPanel();

    };


  document.getElementById("editorColor")
    .onclick = () => {

      changeNoteColor(note.id);

    };

}


/* =========================================================
   NOTE CREATION
========================================================= */

function createNote(){

  ensureDatabase();

  const id =
  String(database.nextNoteId++);

  const note = {

    id:id,

    title:"",

    content:"",

    color:"#2563eb",

    categoryId:"root",

    tags:[],

    favorite:false,

    pinned:false,

    deleted:false,

    created:getNow(),

    modified:getNow(),

    lastViewed:null,

    lastSynced:null,

    totalViews:0,

    links:[],

    attachments:[]

  };

  database.notes.push(note);

  currentNoteId = id;

  markChanges();

  render();

  openEditor(id);

}


/* =========================================================
   PIN / FAVORITE
========================================================= */

function toggleNoteProperty(id,property){

  const note =
  database.notes.find(
    n => n.id === id
  );

  if(!note){
    return;
  }

  note[property] =
  !note[property];

  note.modified =
  getNow();

  markChanges();

  render();

}


/* =========================================================
   RECYCLE
========================================================= */

function recycleNote(id){

  const note =
  database.notes.find(
    n => n.id === id
  );

  if(!note){
    return;
  }

  if(
    database.settings.confirmDelete &&
    !confirm(
      "Move this note to Recycle Bin?"
    )
  ){
    return;
  }

  note.deleted = true;

  /*
     Permanent Bin tag.
     It is not removed during restore.
  */

  note.tags =
  note.tags || [];

  if(!note.tags.includes("Bin")){

    note.tags.push("Bin");

  }

  note.modified =
  getNow();

  markChanges();

  render();

}


/* =========================================================
   RESTORE
========================================================= */

function restoreNote(id){

  const note =
  database.notes.find(
    n => n.id === id
  );

  if(!note){
    return;
  }

  note.deleted = false;

  /*
     Bin tag intentionally remains.
  */

  note.modified =
  getNow();

  markChanges();

  render();

}


function restoreAllDeleted(){

  database.notes
  .filter(note => note.deleted)
  .forEach(note => {

    note.deleted = false;

    note.modified =
    getNow();

  });

  markChanges();

  render();

}


/* =========================================================
   COLOR
========================================================= */

function changeNoteColor(id){

  const note =
  database.notes.find(
    n => n.id === id
  );

  if(!note){
    return;
  }

  const color =
  prompt(
    "Enter Note Color:",
    note.color || "#2563eb"
  );

  if(!color){
    return;
  }

  note.color = color;

  note.modified =
  getNow();

  markChanges();

  render();

}


/* =========================================================
   BULK ACTIONS
========================================================= */

function updateBulkActions(){

  document
  .getElementById("bulkActions")
  .classList.toggle(
    "hidden",
    selectedNotes.size === 0
  );

}


function bulkSet(property){

  selectedNotes.forEach(id => {

    const note =
    database.notes.find(
      n => n.id === id
    );

    if(note){

      note[property] = true;

      note.modified =
      getNow();

    }

  });

  markChanges();

  render();

}


function bulkRecycle(){

  selectedNotes.forEach(id => {

    const note =
    database.notes.find(
      n => n.id === id
    );

    if(note){

      note.deleted = true;

      note.tags =
      note.tags || [];

      if(!note.tags.includes("Bin")){
        note.tags.push("Bin");
      }

      note.modified =
      getNow();

    }

  });

  selectedNotes.clear();

  markChanges();

  render();

}


/* =========================================================
   CHANGES / COUNTDOWN
========================================================= */

function markChanges(){

  changesPending = true;

  document
  .getElementById("connectionStatus")
  .textContent =
  "Changes pending";

  startSaveCountdown();

}


function startSaveCountdown(){

  clearInterval(saveTimer);

  countdown = 10;

  document
  .getElementById("saveCountdown")
  .textContent =
  countdown + "s";

  saveTimer =
  setInterval(async () => {

    countdown--;

    document
    .getElementById("saveCountdown")
    .textContent =
    countdown + "s";

    if(countdown <= 0){

      clearInterval(saveTimer);

      await saveDatabase();

    }

  },1000);

}


/* =========================================================
   GOOGLE IDENTITY SERVICES
========================================================= */

function loadGoogleIdentityServices(){

  return new Promise(
    (resolve,reject) => {

      if(
        window.google &&
        google.accounts &&
        google.accounts.oauth2
      ){

        resolve();

        return;

      }

      const script =
      document.createElement("script");

      script.src =
      "https://accounts.google.com/gsi/client";

      script.onload =
      () => resolve();

      script.onerror =
      () =>
      reject(
        new Error(
          "Google Identity Services could not load."
        )
      );

      document.head.appendChild(script);

    }
  );

}


/* =========================================================
   CONNECT GOOGLE DRIVE
========================================================= */

async function connectGoogleDrive(){

  try{

    await loadGoogleIdentityServices();

    const tokenClient =
    google.accounts.oauth2.initTokenClient({

      client_id:
      CONFIG.CLIENT_ID,

      scope:
      CONFIG.SCOPES,

      callback:
      async response => {

        if(response.error){

          alert(
            "Google authorization failed."
          );

          return;

        }

        accessToken =
        response.access_token;

        document
        .getElementById("connectionStatus")
        .textContent =
        "Google Drive Connected";

        await reloadDatabase();

      }

    });

    tokenClient.requestAccessToken({
      prompt:"consent"
    });

  }
  catch(error){

    console.error(error);

    alert(
      "Google Drive connection failed:\n\n" +
      error.message
    );

  }

}


/* =========================================================
   DRIVE API REQUEST
========================================================= */

async function driveRequest(
  url,
  options={}
){

  if(!accessToken){

    throw new Error(
      "Google Drive is not connected."
    );

  }

  const response =
  await fetch(
    url,
    {

      ...options,

      headers:{

        ...(options.headers || {}),

        Authorization:
        "Bearer " + accessToken

      }

    }
  );

  if(!response.ok){

    const text =
    await response.text();

    throw new Error(
      response.status +
      " " +
      text
    );

  }

  return response;

}


/* =========================================================
   LOAD DATABASE
========================================================= */

async function reloadDatabase(){

  if(!accessToken){

    alert(
      "First click Connect to Google Drive."
    );

    return;

  }

  try{

    document
    .getElementById("connectionStatus")
    .textContent =
    "Loading Database...";


    const response =
    await driveRequest(

      "https://www.googleapis.com/drive/v3/files/" +
      encodeURIComponent(CONFIG.DB_FILE_ID) +
      "?alt=media"

    );


    const loaded =
    await response.json();

    database =
    loaded;

    ensureDatabase();

    changesPending = false;

    clearInterval(saveTimer);

    document
    .getElementById("saveCountdown")
    .textContent = "—";

    document
    .getElementById("connectionStatus")
    .textContent =
    "Database Loaded";

    selectedNotes.clear();

    render();

  }
  catch(error){

    console.error(error);

    document
    .getElementById("connectionStatus")
    .textContent =
    "Load Failed";

    alert(
      "Database load failed:\n\n" +
      error.message
    );

  }

}


/* =========================================================
   CREATE DATABASE FILE IF NECESSARY
========================================================= */

async function createDatabaseFile(){

  const metadata = {

    name:
    CONFIG.DB_FILE_NAME,

    parents:[
      CONFIG.FOLDER_ID
    ],

    mimeType:
    "application/json"

  };

  const boundary =
  "notes_manager_boundary";

  const body =
  "--" + boundary + "\r\n" +
  "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
  JSON.stringify(metadata) +
  "\r\n--" + boundary + "\r\n" +
  "Content-Type: application/json\r\n\r\n" +
  JSON.stringify(database,null,2) +
  "\r\n--" + boundary + "--";


  const response =
  await driveRequest(

    "https://www.googleapis.com/upload/drive/v3/files" +
    "?uploadType=multipart",

    {

      method:"POST",

      headers:{
        "Content-Type":
        "multipart/related; boundary=" +
        boundary
      },

      body:body

    }

  );


  return await response.json();

}


/* =========================================================
   SAVE / UPDATE DATABASE
========================================================= */

async function saveDatabase(){

  if(!changesPending){

    document
    .getElementById("saveCountdown")
    .textContent = "—";

    return;

  }

  if(!accessToken){

    document
    .getElementById("connectionStatus")
    .textContent =
    "Not Connected — Changes Pending";

    return;

  }


  try{

    document
    .getElementById("connectionStatus")
    .textContent =
    "Saving...";


    /*
       Last Synced is written BEFORE the
       database is serialized, so it is
       actually saved into Google Drive.
    */

    const syncTime =
    getNow();

    database.notes.forEach(note => {

      if(
        note.modified &&
        !note.deleted
      ){

        note.lastSynced =
        syncTime;

      }

    });


    const json =
    JSON.stringify(
      database,
      null,
      2
    );


    /*
       Existing DB_FILE_ID:
       update directly inside Drive.
    */

    const response =
    await driveRequest(

      "https://www.googleapis.com/upload/drive/v3/files/" +
      encodeURIComponent(CONFIG.DB_FILE_ID) +
      "?uploadType=media",

      {

        method:"PATCH",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:json

      }

    );


    if(response.ok){

      changesPending = false;

      document
      .getElementById("connectionStatus")
      .textContent =
      "Saved to Google Drive";

      document
      .getElementById("saveCountdown")
      .textContent =
      "—";

      renderCurrentPanel();

    }

  }
  catch(error){

    console.error(error);

    document
    .getElementById("connectionStatus")
    .textContent =
    "Save Failed";

    alert(
      "Google Drive save failed:\n\n" +
      error.message
    );

  }

}

/* =========================================================
   NOTE LIST CLICK
========================================================= */

document
.getElementById("noteList")
.onclick = event => {

  const action =
  event.target.closest(
    "[data-action]"
  );

  if(action){

    event.stopPropagation();

    const id =
    action.dataset.id;

    if(action.dataset.action === "pin"){

      toggleNoteProperty(
        id,
        "pinned"
      );

    }

    if(action.dataset.action === "favorite"){

      toggleNoteProperty(
        id,
        "favorite"
      );

    }

    return;

  }


  const row =
  event.target.closest(
    "[data-note-id]"
  );

  if(!row){
    return;
  }

  const id =
  row.dataset.noteId;

  /*
     Long/secondary selection:
     Ctrl/Meta click allows multiple selection.
  */

  if(event.ctrlKey || event.metaKey){

    if(selectedNotes.has(id)){

      selectedNotes.delete(id);

    }
    else{

      selectedNotes.add(id);

    }

    renderNoteList();

    return;

  }


  selectedNotes.clear();

  currentNoteId = id;

  render();

};
