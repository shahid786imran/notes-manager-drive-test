<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Manager</title>
<style>
:root{
    --bg:#f4f6f9;
    --surface:#ffffff;
    --surface2:#f8fafc;
    --text:#172033;
    --muted:#697386;
    --border:#dfe4ec;
    --primary:#2563eb;
    --primary2:#1d4ed8;
    --danger:#dc2626;
    --success:#15803d;
    --warning:#b45309;
    --shadow:0 8px 25px rgba(20,30,50,.08);
    --radius:12px;
    --font-size:15px;
}

*{ box-sizing:border-box; }

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    font-size:var(--font-size);
}

/* =========================================================
   TOP HEADER
   ========================================================= */

.app-header{
    position:sticky;
    top:0;
    z-index:1000;
    min-height:62px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px 8px 92px;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.header-left{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
    flex:none;
}

.header-title{
    font-size:18px;
    font-weight:700;
    white-space:nowrap;
}

/* ===== COMPACT STATUS LINE ===== */

.header-status{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    min-width:0;
    flex:1;
    margin-left:4px;
}

.status-text{
    font-size:11px;
    font-weight:600;
    white-space:nowrap;
    line-height:1.2;
}

.status-text.drive-on{ color:#15803d; }
.status-text.drive-off{ color:#dc2626; }

.status-text.sync-on{ color:#15803d; }
.status-text.sync-off{ color:#b45309; }
.status-text.sync-err{ color:#dc2626; }

.status-text.pending{ color:#b45309; }
.status-text.no-pending{ color:#697386; }

.status-text.last-sync{ color:#2563eb; }

.status-sep{
    color:#cbd5e1;
    font-size:10px;
    user-select:none;
}

/* ===== TOP ACTION BUTTONS - UNIFORM ===== */

.header-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:nowrap;
    flex:none;
}

button,
select,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.btn{
    height:34px;
    min-width:74px;
    padding:0 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    color:var(--text);
    font-size:12px;
    font-weight:600;
    transition:.15s ease;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    white-space:nowrap;
}

.btn:hover{ background:#f1f5f9; }

.btn.primary{
    background:var(--primary);
    color:white;
    border-color:var(--primary);
}

.btn.primary:hover{ background:var(--primary2); }

.btn.danger{
    color:white;
    background:var(--danger);
    border-color:var(--danger);
}

.btn.success{
    color:white;
    background:var(--success);
    border-color:var(--success);
}

.btn.small{
    min-width:65px;
    height:30px;
    font-size:12px;
    padding:0 8px;
}

.btn.icon{
    min-width:34px;
    width:34px;
    padding:0;
}

/* =========================================================
   FIXED SHOW / HIDE BUTTON
   ========================================================= */

.sidebar-toggle{
    position:fixed;
    top:8px;
    left:8px;
    z-index:3000;
    height:34px;
    min-width:72px;
    padding:0 13px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    color:var(--text);
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    font-size:13px;
    font-weight:700;
}

.sidebar-toggle:hover{ background:#eef2ff; }

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar-overlay{
    position:fixed;
    inset:0;
    z-index:1900;
    background:rgba(0,0,0,.22);
    display:none;
}

.sidebar-overlay.open{ display:block; }

.sidebar{
    position:fixed;
    top:62px;
    left:0;
    bottom:0;
    width:280px;
    z-index:2000;
    background:var(--surface);
    border-right:1px solid var(--border);
    box-shadow:10px 0 25px rgba(0,0,0,.08);
    transform:translateX(-105%);
    transition:transform .2s ease;
    overflow-y:auto;
    padding:10px;
}

.sidebar.open{ transform:translateX(0); }

.sidebar-section{ margin-bottom:8px; }

.sidebar-item{
    position:relative;
    min-height:38px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 9px;
    border-radius:8px;
    cursor:pointer;
    color:var(--text);
}

.sidebar-item:hover,
.sidebar-item.active{ background:#eef2ff; }

.sidebar-icon{
    width:20px;
    text-align:center;
    flex:none;
}

.sidebar-label{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.sidebar-count{
    color:var(--muted);
    font-size:11px;
    flex:none;
}

/* ===== EDIT / REMOVE BUTTONS ON SIDEBAR ITEMS ===== */

.sidebar-controls{
    display:none;
    gap:3px;
    flex:none;
}

.sidebar-item:hover .sidebar-controls,
.sidebar-item.selected .sidebar-controls{
    display:flex;
}

.sidebar-ctrl{
    width:24px;
    height:24px;
    min-width:24px;
    padding:0;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    color:var(--text);
    font-size:11px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    line-height:1;
}

.sidebar-ctrl:hover{ background:#e2e8f0; }

.sidebar-ctrl.danger:hover{
    background:#fef2f2;
    border-color:#fecaca;
    color:#dc2626;
}

.sidebar-collapse{
    margin-top:3px;
    padding-left:18px;
}

.sidebar-tree{ margin-left:8px; }

.tree-row{
    display:flex;
    align-items:center;
    gap:5px;
    min-height:32px;
    padding-left:4px;
}

.tree-arrow{
    width:20px;
    min-width:20px;
    text-align:center;
    cursor:pointer;
}

.tree-content{
    flex:1;
    min-width:0;
}

.tree-children{ margin-left:17px; }

.tag-list,
.category-list{ display:none; }

.tag-list.open,
.category-list.open{ display:block; }

.sidebar-subtitle{
    padding:6px 9px;
    color:var(--muted);
    font-size:11px;
}

/* =========================================================
   MAIN
   ========================================================= */

.main{
    min-height:calc(100vh - 62px);
    padding:12px;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
}

.search-box{
    flex:1;
    min-width:180px;
}

.search-box input{
    width:100%;
    height:36px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    outline:none;
}

.search-box input:focus{ border-color:var(--primary); }

.workspace{
    display:grid;
    grid-template-columns:minmax(250px,32%) 1fr;
    gap:10px;
    min-height:calc(100vh - 130px);
}

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
}

.panel-header{
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:8px 12px;
    border-bottom:1px solid var(--border);
}

.panel-title{ font-weight:700; }

.note-list{
    max-height:calc(100vh - 180px);
    overflow-y:auto;
}

.note-row{
    display:flex;
    align-items:flex-start;
    gap:9px;
    padding:10px 11px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
}

.note-row:hover{ background:#f8fafc; }
.note-row.active{ background:#eff6ff; }

.note-marker{
    width:5px;
    min-width:5px;
    height:42px;
    border-radius:5px;
    background:var(--note-color,#94a3b8);
}

.note-row-body{
    flex:1;
    min-width:0;
}

.note-row-title{
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.note-row-preview{
    margin-top:4px;
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.note-row-meta{
    margin-top:5px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    font-size:10px;
    color:var(--muted);
}

.note-actions{
    display:flex;
    gap:4px;
}

.note-actions button{
    border:0;
    background:transparent;
    padding:3px;
    cursor:pointer;
    font-size:14px;
}

/* =========================================================
   NOTE DETAIL
   ========================================================= */

.detail{ min-width:0; }

.detail-body{ padding:14px; }

.note-title-display{
    font-size:24px;
    font-weight:750;
    line-height:1.25;
    margin-bottom:12px;
    word-break:break-word;
}

.note-content-display{
    white-space:pre-wrap;
    line-height:1.6;
    word-break:break-word;
    min-height:100px;
}

.editor-field{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 10px;
    outline:none;
    background:var(--surface);
    color:var(--text);
}

.editor-field:focus{ border-color:var(--primary); }

.editor-title{
    font-size:23px;
    font-weight:700;
}

.editor-content{
    min-height:280px;
    resize:vertical;
    line-height:1.55;
}

.field-group{ margin-bottom:12px; }

.field-label{
    display:block;
    margin-bottom:5px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}

.detail-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

/* =========================================================
   LINKS / TAGS
   ========================================================= */

.links-box{ margin-top:18px; }

.link-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 0;
    border-bottom:1px solid var(--border);
}

.link-row a{
    color:var(--primary);
    text-decoration:none;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:7px;
}

.tag-chip{
    border:1px solid #cbd5e1;
    border-radius:999px;
    padding:3px 8px;
    background:#f8fafc;
    font-size:11px;
}

/* =========================================================
   METADATA
   ========================================================= */

.metadata-box{
    margin-top:20px;
    border:1px solid var(--border);
    border-radius:9px;
    overflow:hidden;
    background:var(--surface2);
}

.metadata-title{
    padding:7px 10px;
    font-size:12px;
    font-weight:700;
    background:#f1f5f9;
    border-bottom:1px solid var(--border);
}

.metadata-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.metadata-table tr{
    border-bottom:1px solid #e7ebf0;
}

.metadata-table tr:last-child{ border-bottom:0; }

.metadata-table td{
    padding:5px 8px;
    font-size:11px;
    line-height:1.25;
    vertical-align:middle;
}

.metadata-table td.label{
    width:25%;
    color:var(--muted);
    font-weight:700;
}

.metadata-table td.value{
    width:25%;
    color:var(--text);
    word-break:break-word;
}

/* =========================================================
   EMPTY
   ========================================================= */

.empty{
    min-height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    padding:20px;
    text-align:center;
}

/* =========================================================
   SETTINGS
   ========================================================= */

.settings-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.setting{
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px;
    background:var(--surface2);
}

.setting label{
    display:block;
    margin-bottom:6px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}

.setting select{
    width:100%;
    height:34px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--surface);
    padding:0 7px;
}

/* =========================================================
   PAGINATION
   ========================================================= */

.pagination{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:9px;
    border-top:1px solid var(--border);
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
    position:fixed;
    right:15px;
    bottom:15px;
    z-index:5000;
    max-width:360px;
    padding:10px 13px;
    border-radius:8px;
    background:#172033;
    color:#fff;
    font-size:13px;
    box-shadow:0 8px 30px rgba(0,0,0,.2);
    transform:translateY(20px);
    opacity:0;
    pointer-events:none;
    transition:.2s ease;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* =========================================================
   NIGHT MODE
   ========================================================= */

body.night{
    --bg:#0f172a;
    --surface:#172033;
    --surface2:#1e293b;
    --text:#e5e7eb;
    --muted:#94a3b8;
    --border:#334155;
}

body.night .app-header,
body.night .panel,
body.night .sidebar,
body.night .editor-field,
body.night .search-box input,
body.night .btn{
    background:var(--surface);
    color:var(--text);
}

body.night .metadata-title{ background:#263449; }

body.night .note-row:hover{ background:#1e293b; }
body.night .note-row.active{ background:#1e3a5f; }

body.night .status-text.drive-on{ color:#4ade80; }
body.night .status-text.sync-on{ color:#4ade80; }

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:850px){

    .app-header{
        min-height:62px;
        align-items:flex-start;
        flex-wrap:wrap;
        padding-top:9px;
        padding-bottom:9px;
        padding-left:92px;
    }

    .header-title{ font-size:16px; }

    .header-status{
        width:100%;
        margin-left:0;
        order:3;
        gap:6px;
        padding-top:4px;
        border-top:1px dashed var(--border);
    }

    .status-text{ font-size:10px; }

    .header-actions{
        margin-left:auto;
    }

    .workspace{
        grid-template-columns:1fr;
    }

    .note-list{ max-height:40vh; }

    .settings-grid{ grid-template-columns:1fr; }

    .metadata-table td{
        padding:5px 6px;
        font-size:10px;
    }
}

@media(max-width:550px){

    .main{ padding:7px; }

    .app-header{ padding-left:88px; }

    .header-actions{ gap:4px; }

    .header-actions .btn{
        min-width:64px;
        padding:0 7px;
        font-size:11px;
    }

    .toolbar .btn{ min-width:72px; }

    .detail-body{ padding:10px; }

    .note-title-display{ font-size:20px; }

    .metadata-table td.label{ width:24%; }
    .metadata-table td.value{ width:26%; }

    .status-text{ font-size:9px; }
    .status-sep{ display:none; }
    .header-status{ gap:4px 8px; }
}

@media(max-width:400px){
    .status-text{ font-size:9px; }
    .header-title{ font-size:15px; }
}
</style>
</head>

<body>

<!-- =========================================================
     FIXED SHOW / HIDE
     ========================================================= -->

<button id="sidebarToggle" class="sidebar-toggle" type="button">Show</button>

<!-- =========================================================
     HEADER
     ========================================================= -->

<header class="app-header">

    <div class="header-left">
        <div class="header-title">Notes</div>
    </div>

    <!-- COMPACT SINGLE-LINE STATUS -->
    <div class="header-status">
        <span id="driveStatus" class="status-text drive-off">Drive: Off</span>
        <span class="status-sep">|</span>
        <span id="syncStatus" class="status-text sync-off">Sync: Idle</span>
        <span class="status-sep">|</span>
        <span id="lastChangeStatus" class="status-text last-sync">Change: —</span>
        <span class="status-sep">|</span>
        <span id="pendingStatus" class="status-text no-pending">Pending: No</span>
    </div>

    <div class="header-actions">
        <button id="connectBtn" class="btn primary" type="button">Connect</button>
        <button id="loadBtn" class="btn" type="button">Load</button>
        <button id="syncBtn" class="btn" type="button">Sync</button>
    </div>

</header>

<!-- =========================================================
     SIDEBAR OVERLAY
     ========================================================= -->

<div id="sidebarOverlay" class="sidebar-overlay"></div>

<!-- =========================================================
     SIDEBAR
     ========================================================= -->

<aside id="sidebar" class="sidebar">

    <div class="sidebar-section">

        <div class="sidebar-item active"
             data-view="all"
             onclick="setView('all')">

            <span class="sidebar-icon">📒</span>
            <span class="sidebar-label">All Notes</span>
            <span id="allCount" class="sidebar-count">0</span>

        </div>

        <div class="sidebar-item"
             data-view="favorites"
             onclick="setView('favorites')">

            <span class="sidebar-icon">⭐</span>
            <span class="sidebar-label">Favorites</span>
            <span id="favoriteCount" class="sidebar-count">0</span>

        </div>

        <div class="sidebar-item"
             data-view="pinned"
             onclick="setView('pinned')">

            <span class="sidebar-icon">📌</span>
            <span class="sidebar-label">Pinned</span>
            <span id="pinnedCount" class="sidebar-count">0</span>

        </div>

    </div>

    <!-- CATEGORIES -->

    <div class="sidebar-section">

        <div class="sidebar-item"
             onclick="toggleSidebarSection('categoryList')">

            <span class="sidebar-icon">📁</span>
            <span class="sidebar-label">Categories</span>
            <span id="categoryArrow">▸</span>

        </div>

        <div id="categoryList"
             class="category-list sidebar-collapse">
        </div>

    </div>

    <!-- TAGS -->

    <div class="sidebar-section">

        <div class="sidebar-item"
             onclick="toggleSidebarSection('tagList')">

            <span class="sidebar-icon">🏷️</span>
            <span class="sidebar-label">Tags</span>
            <span id="tagArrow">▸</span>

        </div>

        <div id="tagList"
             class="tag-list sidebar-collapse">
        </div>

    </div>

    <!-- CHECKLIST -->

    <div class="sidebar-section">

        <div class="sidebar-item"
             onclick="openChecklist()">

            <span class="sidebar-icon">☑️</span>
            <span class="sidebar-label">Checklist</span>

        </div>

    </div>

    <!-- TRASH -->

    <div class="sidebar-section">

        <div class="sidebar-item"
             onclick="setView('trash')">

            <span class="sidebar-icon">🗑️</span>
            <span class="sidebar-label" id="trashLabel">Trash</span>
            <span id="trashCount" class="sidebar-count">0</span>

        </div>

    </div>

    <!-- SETTINGS -->

    <div class="sidebar-section">

        <div class="sidebar-item"
             onclick="openSettings()">

            <span class="sidebar-icon">⚙️</span>
            <span class="sidebar-label">Settings</span>

        </div>

    </div>

</aside>

<!-- =========================================================
     MAIN
     ========================================================= -->

<main class="main">

    <div class="toolbar">

        <div class="search-box">
            <input id="searchInput"
                   type="search"
                   placeholder="Search notes...">
        </div>

        <button class="btn primary"
                type="button"
                onclick="addNote()">
            + Add
        </button>

        <button class="btn"
                type="button"
                onclick="refreshUI()">
            Refresh
        </button>

    </div>

    <section class="workspace">

        <!-- NOTE LIST -->

        <div class="panel">

            <div class="panel-header">

                <span id="listTitle" class="panel-title">
                    All Notes
                </span>

                <span id="listCount"
                      class="sidebar-count">
                    0
                </span>

            </div>

            <div id="noteList"
                 class="note-list">
            </div>

            <div id="pagination"
                 class="pagination"
                 style="display:none;">
            </div>

        </div>

        <!-- DETAIL -->

        <div class="panel detail">

            <div class="panel-header">

                <span class="panel-title">
                    Note
                </span>

                <div id="detailActions"
                     class="detail-actions">
                </div>

            </div>

            <div id="detailBody"
                 class="detail-body">

                <div class="empty">
                    Select a note to view it.
                </div>

            </div>

        </div>

    </section>

</main>

<div id="toast" class="toast"></div>

     GOOGLE IDENTITY SERVICES
     ========================================================= -->

let pendingChanges = false;

let lastSuccessfulSync = null;
let lastChangeTime = null;


/* =========================================================
   DEFAULT DATABASE
   ========================================================= */

            dateTimeFormat: "Local"
        },

        },

            trashHidden: false

/* =========================================================
   GOOGLE AUTH
   ========================================================= */

function initializeGoogle(){

    if(
        typeof google === "undefined" ||
        !google.accounts ||
        !google.accounts.oauth2
    ){
        showToast(
            "Google Identity Services load نہیں ہوئی۔ Internet connection check کریں۔",
            "error"
        );

        return;
    }

    tokenClient =
        google.accounts.oauth2.initTokenClient({

            client_id: CLIENT_ID,

            scope: DRIVE_SCOPE,

            callback: function(response){

                if(response.error){

                    console.error(response);

                    showToast(
                        "Google Drive connection failed.",
                        "error"
                    );

                    return;
                }

                accessToken = response.access_token;

                setDriveConnected(true);

                showToast(
                    "Drive Connected",
                    "success"
                );

                loadDatabase();
            }

        });
}


function connectDrive(){

    if(!tokenClient){

        initializeGoogle();

        setTimeout(() => {

            if(tokenClient){
                requestDriveToken();
            }

        },300);

        return;
    }

    requestDriveToken();
}


function requestDriveToken(){

    try{

        tokenClient.requestAccessToken({
            prompt: ""
        });

    }catch(error){

        console.error(error);

        showToast(
            "Google Drive connection could not start.",
            "error"
        );
    }
}


/* =========================================================
   DRIVE STATUS
   ========================================================= */

function setDriveConnected(value){

    const el =
        document.getElementById("driveStatus");

    if(value){

        el.textContent =
            "Drive: On";

        el.className =
            "status-text drive-on";

    }else{

        el.textContent =
            "Drive: Off";

        el.className =
            "status-text drive-off";
    }
}


/* =========================================================
   GOOGLE DRIVE API
   ========================================================= */

async function driveRequest(
    url,
    options = {}
){

    if(!accessToken){
        throw new Error(
            "Google Drive is not connected."
        );
    }

    const headers =
        new Headers(
            options.headers || {}
        );

    headers.set(
        "Authorization",
        "Bearer " + accessToken
    );

    const response =
        await fetch(
            url,
            {
                ...options,
                headers
            }
        );

    if(!response.ok){

        const text =
            await response.text();

        throw new Error(
            "Drive API " +
            response.status +
            ": " +
            text
        );
    }

    return response;
}


/* =========================================================
   FIND MASTERDB.JSON
   ========================================================= */

async function findDatabaseFile(){

    let query =
        "name = '" +
        DATABASE_NAME.replace(/'/g,"\\'") +
        "' and trashed = false";

    if(DATABASE_FOLDER_ID){

        query +=
            " and '" +
            DATABASE_FOLDER_ID +
            "' in parents";
    }

    const url =
        "https://www.googleapis.com/drive/v3/files" +
        "?q=" +
        encodeURIComponent(query) +
        "&spaces=drive" +
        "&fields=files(id,name,mimeType,modifiedTime,parents)" +
        "&pageSize=100";

    const response =
        await driveRequest(url);

    const data =
        await response.json();

    if(!data.files || !data.files.length){

        return null;
    }

    return data.files[0];
}


/* =========================================================
   CREATE MASTERDB.JSON
   ========================================================= */

async function createDatabaseFile(){

    const metadata = {
        name: DATABASE_NAME,
        mimeType: "application/json"
    };

    if(DATABASE_FOLDER_ID){

        metadata.parents =
            [DATABASE_FOLDER_ID];
    }

    const body =
        JSON.stringify(
            db,
            null,
            2
        );

    const form =
        new FormData();

    form.append(
        "metadata",
        new Blob(
            [
                JSON.stringify(metadata)
            ],
            {
                type:"application/json"
            }
        )
    );

    form.append(
        "file",
        new Blob(
            [body],
            {
                type:"application/json"
            }
        )
    );

    const response =
        await driveRequest(
            "https://www.googleapis.com/upload/drive/v3/files" +
            "?uploadType=multipart" +
            "&fields=id,name,modifiedTime",
            {
                method:"POST",
                body:form
            }
        );

    const result =
        await response.json();

    databaseFileId =
        result.id;

    return result;
}


/* =========================================================
   LOAD DATABASE
   ========================================================= */

async function loadDatabase(){

    if(!accessToken){

        connectDrive();

        return;
    }

    try{

        setSyncStatus(
            "Loading...",
            "normal"
        );

        const file =
            await findDatabaseFile();

        if(!file){

            db =
                createEmptyDatabase();

            const created =
                await createDatabaseFile();

            databaseFileId =
                created.id;

            pendingChanges = false;

            updatePendingStatus();

            setLastSync(
                new Date()
            );

            showToast(
                "New MasterDB.json created in Google Drive.",
                "success"
            );

            refreshUI();

            return;
        }

        databaseFileId =
            file.id;

        const response =
            await driveRequest(
                "https://www.googleapis.com/drive/v3/files/" +
                encodeURIComponent(file.id) +
                "?alt=media"
            );

        const text =
            await response.text();

        if(!text.trim()){

            db =
                createEmptyDatabase();

        }else{

            try{

                db =
                    normalizeDatabase(
                        JSON.parse(text)
                    );

            }catch(error){

                console.error(error);

                throw new Error(
                    "MasterDB.json contains invalid JSON."
                );
            }
        }

        pendingChanges = false;

        updatePendingStatus();

        lastSuccessfulSync =
            file.modifiedTime
                ? new Date(file.modifiedTime)
                : new Date();

        setLastSync(
            lastSuccessfulSync
        );

        setSyncStatus(
            "Synced",
            "success"
        );

        applySettings();

        refreshUI();

        showToast(
            "Database loaded from Google Drive.",
            "success"
        );

    }catch(error){

        console.error(error);

        setSyncStatus(
            "Sync Error",
            "error"
        );

        showToast(
            error.message,
            "error"
        );
    }
}


/* =========================================================
   NORMALIZE DATABASE
   ========================================================= */

function normalizeDatabase(data){

    const base =
        createEmptyDatabase();

    if(!data || typeof data !== "object"){
        return base;
    }

    const result = {
        ...base,
        ...data
    };

    result.settings = {
        ...base.settings,
        ...(data.settings || {})
    };

    result.checklist = {
        ...base.checklist,
        ...(data.checklist || {})
    };

    result.trash = {
        ...base.trash,
        ...(data.trash || {})
    };

    result.categories =
        Array.isArray(data.categories)
            ? data.categories
            : [];

    result.tags =
        Array.isArray(data.tags)
            ? data.tags
            : [];

    result.notes =
        Array.isArray(data.notes)
            ? data.notes.map(normalizeNote)
            : [];

    result.binCounter =
        Number(data.binCounter || 0);

    return result;
}


function normalizeNote(note){

    const n = note || {};

    return {

        id:
            n.id ||
            generateId("note"),

        title:
            n.title ||
            "Untitled Note",

        content:
            n.content ||
            "",

        categoryId:
            n.categoryId ||
            null,

        tags:
            Array.isArray(n.tags)
                ? n.tags
                : [],

        links:
            Array.isArray(n.links)
                ? n.links
                : [],

        favorite:
            !!n.favorite,

        pinned:
            !!n.pinned,

        deleted:
            !!n.deleted,

        trashHidden:
            !!n.trashHidden,

        binNumber:
            Number(n.binNumber || 0),

        color:
            n.color ||
            "#64748b",

        createdAt:
            n.createdAt ||
            new Date().toISOString(),

        modifiedAt:
            n.modifiedAt ||
            n.createdAt ||
            new Date().toISOString(),

        lastViewedAt:
            n.lastViewedAt ||
            null,

        viewCount:
            Number(n.viewCount || 0)
    };
}


/* =========================================================
   WRITE DATABASE
   ========================================================= */

async function saveDatabaseToDrive(){

    if(!accessToken){

        showToast(
            "پہلے Drive کو Connect کریں۔",
            "error"
        );

        return false;
    }

    if(saveInProgress){
        return false;
    }

    try{

        saveInProgress = true;

        setSyncStatus(
            "Saving...",
            "normal"
        );

        db.meta.updated =
            new Date().toISOString();

        const body =
            JSON.stringify(
                db,
                null,
                2
            );

        if(!databaseFileId){

            const file =
                await findDatabaseFile();

            if(file){
                databaseFileId =
                    file.id;
            }
        }

        if(!databaseFileId){

            await createDatabaseFile();

        }else{

            await driveRequest(
                "https://www.googleapis.com/upload/drive/v3/files/" +
                encodeURIComponent(databaseFileId) +
                "?uploadType=media",
                {
                    method:"PATCH",
                    headers:{
                        "Content-Type":
                            "application/json; charset=UTF-8"
                    },
                    body
                }
            );
        }

        pendingChanges = false;

        updatePendingStatus();

        lastSuccessfulSync =
            new Date();

        setLastSync(
            lastSuccessfulSync
        );

        setSyncStatus(
            "Synced",
            "success"
        );

        return true;

    }catch(error){

        console.error(error);

        setSyncStatus(
            "Save Error",
            "error"
        );

        showToast(
            "Drive save failed: " +
            error.message,
            "error"
        );

        return false;

    }finally{

        saveInProgress = false;
    }
}


/* =========================================================
   CHANGE TRACKING
   ========================================================= */

function markChanged(){

    pendingChanges = true;

    lastChangeTime =
        new Date();

    db.meta.updated =
        lastChangeTime.toISOString();

    updatePendingStatus();
    updateLastChangeStatus();

    scheduleAutosave();
}


function updatePendingStatus(){

    const el =
        document.getElementById(
            "pendingStatus"
        );

    if(pendingChanges){

        el.textContent =
            "Pending: Yes";

        el.className =
            "status-text pending";

    }else{

        el.textContent =
            "Pending: No";

        el.className =
            "status-text no-pending";
    }
}


function updateLastChangeStatus(){

    const el =
        document.getElementById(
            "lastChangeStatus"
        );

    if(!lastChangeTime){

        el.textContent =
            "Change: —";

        return;
    }

    el.textContent =
        "Change: " +
        formatShortTime(
            lastChangeTime
        );
}


function scheduleAutosave(){

    clearTimeout(
        autosaveTimer
    );

    if(
        !db.settings.autosave ||
        !accessToken
    ){
        return;
    }

    const seconds =
        Math.max(
            1,
            Number(
                db.settings.autosaveInterval || 5
            )
        );

    autosaveTimer =
        setTimeout(
            async function(){

                if(pendingChanges){

                    await saveDatabaseToDrive();

                }

            },
            seconds * 1000
        );
}


/* =========================================================
   MANUAL SYNC
   ========================================================= */

async function synchronize(){

    if(pendingChanges){

        const saved =
            await saveDatabaseToDrive();

        if(saved){

            showToast(
                "Changes synchronized with Google Drive.",
                "success"
            );
        }

        return;
    }

    await loadDatabase();
}


/* =========================================================
   STATUS
   ========================================================= */

function setSyncStatus(text,type){

    const el =
        document.getElementById(
            "syncStatus"
        );

    if(type === "success"){

        el.textContent =
            "Sync: " + text;

        el.className =
            "status-text sync-on";

    }else if(type === "error"){

        el.textContent =
            "Sync: Error";

        el.className =
            "status-text sync-err";

    }else{

        el.textContent =
            "Sync: " + text;

        el.className =
            "status-text sync-off";
    }
}


function setLastSync(date){

    if(!date){
        return;
    }

    lastSuccessfulSync =
        date;

    updateLastChangeStatus();
}


/* =========================================================
   NOTE CRUD
   ========================================================= */

function addNote(){

    const now =
        new Date().toISOString();

    const note = {

        id:
            generateId("note"),

        title:
            "New Note",

        content:
            "",

        categoryId:
            null,

        tags:
            [],

        links:
            [],

        favorite:
            false,

        pinned:
            false,

        deleted:
            false,

        trashHidden:
            false,

        binNumber:
            0,

        color:
            "#64748b",

        createdAt:
            now,

        modifiedAt:
            now,

        lastViewedAt:
            null,

        viewCount:
            0
    };

    db.notes.unshift(note);

    selectedNoteId =
        note.id;

    currentView =
        "all";

    markChanged();

    refreshUI();

    enterEditMode(
        note.id
    );
}


function getNote(id){

    return db.notes.find(
        n => n.id === id
    );
}


function updateNote(id, changes){

    const note =
        getNote(id);

    if(!note){
        return;
    }

    Object.assign(
        note,
        changes
    );

    note.modifiedAt =
        new Date().toISOString();

    markChanged();

    refreshUI();
}


/* =========================================================
   DELETE → RECYCLE BIN
   ========================================================= */

function deleteNote(id){

    const note =
        getNote(id);

    if(!note){
        return;
    }

    if(
        db.settings.deleteConfirmation
    ){

        const ok =
            confirm(
                "Move this note to the Recycle Bin?"
            );

        if(!ok){
            return;
        }
    }

    note.deleted = true;
    note.trashHidden = false;

    /*
       Only a single "Bin" tag is added.
       No incremental Bin numbering anymore.
    */

    addTagToNote(
        note,
        "Bin"
    );

    note.binNumber = 0;

    note.modifiedAt =
        new Date().toISOString();

    markChanged();

    /*
       Immediately clear selection & refresh list
       so note disappears from active view.
    */

    selectedNoteId = null;

    refreshUI();

    showToast(
        "Note moved to Recycle Bin.",
        "success"
    );
}


function restoreNote(id){

    const note =
        getNote(id);

    if(!note){
        return;
    }

    note.deleted = false;
    note.trashHidden = false;

    note.modifiedAt =
        new Date().toISOString();

    markChanged();

    selectedNoteId =
        note.id;

    refreshUI();

    showToast(
        "Note restored.",
        "success"
    );
}


function restoreAllDeleted(){

    let count = 0;

    db.notes.forEach(
        note => {

            if(note.deleted){

                note.deleted = false;
                note.trashHidden = false;

                note.modifiedAt =
                    new Date().toISOString();

                count++;
            }

        }
    );

    if(count){

        markChanged();

        refreshUI();

        showToast(
            count +
            " deleted notes restored.",
            "success"
        );
    }
}


function emptyTrash(){

    const deleted =
        db.notes.filter(
            n => n.deleted
        );

    if(!deleted.length){

        showToast(
            "Recycle Bin is already empty.",
            "normal"
        );

        return;
    }

    const ok =
        confirm(
            "Empty Recycle Bin? Notes will NOT be permanently deleted. They will only be hidden from the normal view."
        );

    if(!ok){
        return;
    }

    deleted.forEach(
        note => {

            note.trashHidden =
                true;

            note.modifiedAt =
                new Date().toISOString();
        }
    );

    markChanged();

    refreshUI();

    showToast(
        "Recycle Bin emptied from normal view. No permanent deletion occurred.",
        "success"
    );
}


function restoreTrash(){

    db.notes.forEach(
        note => {

            if(note.deleted){

                note.trashHidden =
                    false;
            }
        }
    );

    markChanged();

    refreshUI();

    showToast(
        "Recycle Bin restored.",
        "success"
    );
}


/* =========================================================
   TAG HELPERS
   ========================================================= */

function addTagToNote(note, tag){

    if(!note.tags.includes(tag)){

        note.tags.push(tag);
    }

    if(!db.tags.includes(tag)){

        db.tags.push(tag);
    }
}


function removeTagFromNote(note, tag){

    note.tags =
        note.tags.filter(
            t => t !== tag
        );

    note.modifiedAt =
        new Date().toISOString();
}


/* =========================================================
   FAVORITE / PIN
   ========================================================= */

function toggleFavorite(id){

    const note =
        getNote(id);

    if(!note){
        return;
    }

    note.favorite =
        !note.favorite;

    note.modifiedAt =
        new Date().toISOString();

    markChanged();

    refreshUI();
}


function togglePinned(id){

    const note =
        getNote(id);

    if(!note){
        return;
    }

    note.pinned =
        !note.pinned;

    note.modifiedAt =
        new Date().toISOString();

    markChanged();

    refreshUI();
}


/* =========================================================
   NOTE VIEW
   ========================================================= */

function selectNote(id){

    const note =
        getNote(id);

    if(!note){
        return;
    }

    selectedNoteId =
        id;

    note.lastViewedAt =
        new Date().toISOString();

    note.viewCount =
        Number(note.viewCount || 0) + 1;

    markChanged();

    renderNoteList();
    renderDetail();
}


function renderDetail(){

    const container =
        document.getElementById(
            "detailBody"
        );

    const note =
        getNote(selectedNoteId);

    if(!note){

        container.innerHTML =
            `
            <div class="empty">
                Select a note to view it.
            </div>
            `;

        return;
    }

    const categoryPath =
        getCategoryPath(
            note.categoryId
        );

    const tags =
        note.tags
            .map(
                tag =>
                    `<span class="tag-chip">${escapeHtml(tag)}</span>`
            )
            .join("");

    const links =
        (note.links || [])
            .map(
                link => {

                    const title =
                        link.title ||
                        link.label ||
                        link.url ||
                        "Link";

                    return `
                        <div class="link-row">
                            🔗
                            <a href="${escapeAttribute(link.url)}"
                               target="_blank"
                               rel="noopener noreferrer">
                                ${escapeHtml(title)}
                            </a>
                        </div>
                    `;
                }
            )
            .join("");

    const trashAction =
        note.deleted
            ? `
                <button class="btn success"
                        onclick="restoreNote('${note.id}')">
                    Restore
                </button>
              `
            : `
                <button class="btn danger"
                        onclick="deleteNote('${note.id}')">
                    Delete
                </button>
              `;

    container.innerHTML =
        `

        <div class="detail-actions"
             style="margin-bottom:12px;">

            <button class="btn primary"
                    onclick="enterEditMode('${note.id}')">
                Edit
            </button>

            <button class="btn"
                    onclick="toggleFavorite('${note.id}')">
                ${note.favorite ? "★ Favorite" : "☆ Favorite"}
            </button>

            <button class="btn"
                    onclick="togglePinned('${note.id}')">
                ${note.pinned ? "📌 Pinned" : "📍 Pin"}
            </button>

            ${trashAction}

        </div>

        <div class="note-title-display">
            ${escapeHtml(note.title)}
        </div>

        <div class="note-content-display">
            ${escapeHtml(note.content)}
        </div>

        ${
            links
            ?
            `
            <div class="links-box">
                <div class="field-label">
                    Links
                </div>
                ${links}
            </div>
            `
            :
            ""
        }

        ${
            tags
            ?
            `
            <div class="links-box">
                <div class="field-label">
                    Tags
                </div>

                <div class="tags">
                    ${tags}
                </div>
            </div>
            `
            :
            ""
        }

        ${renderMetadata(note,categoryPath)}

        `;
}

/* =========================================================
   EDIT NOTE
   ========================================================= */

function enterEditMode(id){

    const note =
        getNote(id);

    if(!note){
        return;
    }

    selectedNoteId =
        id;

    const container =
        document.getElementById(
            "detailBody"
        );

function saveEditedNote(id){

    const note =
        getNote(id);

    if(!note){
        return;
    }

    const title =
        document.getElementById(
            "editTitle"
        ).value.trim();

    const content =
        document.getElementById(
            "editContent"
        ).value;

    const category =
        document.getElementById(
            "editCategory"
        ).value;

    const tagsText =
        document.getElementById(
            "editTags"
        ).value;

    const color =
        document.getElementById(
            "editColor"
        ).value;

    const linksText =
        document.getElementById(
            "editLinks"
        ).value;

    note.title =
        title || "Untitled Note";

    note.content =
        content;

    note.categoryId =
        category || null;

    note.tags =
        parseTags(
            tagsText
        );

    note.color =
        color || "#64748b";

    note.links =
        parseLinks(
            linksText
        );

    note.tags.forEach(
        tag => {

            if(!db.tags.includes(tag)){
                db.tags.push(tag);
            }
        }
    );

    note.modifiedAt =
        new Date().toISOString();

    markChanged();

    refreshUI();

    showToast(
        "Note saved.",
        "success"
    );
}


function parseTags(text){

    return [
        ...new Set(
            text
                .split(",")
                .map(
                    x => x.trim()
                )
                .filter(Boolean)
        )
    ];
}


function parseLinks(text){

    return text
        .split("\n")
        .map(
            line => line.trim()
        )
        .filter(Boolean)
        .map(
            line => {

                const parts =
                    line.split("|");

                if(parts.length >= 2){

                    return {
                        title:
                            parts[0].trim(),

                        url:
                            parts
                                .slice(1)
                                .join("|")
                                .trim()
                    };
                }

                return {
                    title: line,
                    url: line
                };
            }
        );
}

function addCategory(
    parentId = null
){

    const name =
        prompt(
            parentId
            ?
            "Child category name:"
            :
            "Category name:"
        );

    if(!name || !name.trim()){
        return;
    }

    const category = {

        id:
            generateId("cat"),

        name:
            name.trim(),

        parentId:
            parentId || null,

        collapsed:
            true
    };

    db.categories.push(
        category
    );

    markChanged();

    renderSidebar();

    showToast(
        "Category added.",
        "success"
    );
}


function renameCategory(id){

    const category =
        db.categories.find(
            c => c.id === id
        );

    if(!category){
        return;
    }

    const name =
        prompt(
            "Rename category:",
            category.name
        );

    if(!name || !name.trim()){
        return;
    }

    category.name =
        name.trim();

    markChanged();

    renderSidebar();
}


function removeCategory(id){

    const category =
        db.categories.find(
            c => c.id === id
        );

    if(!category){
        return;
    }

    const ok =
        confirm(
            "Remove this category? Notes will remain but be reassigned to the parent (or No Category)."
        );

    if(!ok){
        return;
    }

    const parentId =
        category.parentId || null;

    /*
       Reassign notes to parent category.
    */

    db.notes.forEach(
        note => {

            if(note.categoryId === id){

                note.categoryId =
                    parentId;

                note.modifiedAt =
                    new Date().toISOString();
            }
        }
    );

    /*
       Remove category and all its descendants.
    */

    const toRemove = new Set([id]);

    let changed = true;

    while(changed){

        changed = false;

        db.categories.forEach(c => {

            if(
                c.parentId &&
                toRemove.has(c.parentId) &&
                !toRemove.has(c.id)
            ){
                toRemove.add(c.id);
                changed = true;
            }
        });
    }

    db.categories =
        db.categories.filter(
            c => !toRemove.has(c.id)
        );

    markChanged();

    renderSidebar();
    refreshUI();

    showToast(
        "Category removed. Notes kept.",
        "success"
    );
}


function isDescendantOf(
    categoryId,
    ancestorId
){

    let current =
        db.categories.find(
            c => c.id === categoryId
        );

    const guard = new Set();

    while(
        current &&
        current.parentId &&
        !guard.has(current.id)
    ){

        guard.add(
            current.id
        );

        if(
            current.parentId ===
            ancestorId
        ){
            return true;
        }

        current =
            db.categories.find(
                c =>
                    c.id ===
                    current.parentId
            );
    }

    return false;
}


function buildCategoryOptions(
    selectedId
){

    const roots =
        db.categories.filter(
            c =>
                !c.parentId
        );

    let html = "";

    roots.forEach(
        category => {

            html +=
                buildCategoryOptionRecursive(
                    category,
                    0,
                    selectedId
                );
        }
    );

    return html;
}


function buildCategoryOptionRecursive(
    category,
    depth,
    selectedId
){

    let html =
        `
        <option value="${escapeAttribute(category.id)}"
            ${category.id === selectedId ? "selected" : ""}>
            ${escapeHtml(
                "— ".repeat(depth) +
                category.name
            )}
        </option>
        `;

    const children =
        db.categories.filter(
            c =>
                c.parentId ===
                category.id
        );

    children.forEach(
        child => {

            html +=
                buildCategoryOptionRecursive(
                    child,
                    depth + 1,
                    selectedId
                );
        }
    );

    return html;
}


function getCategoryPath(
    categoryId
){

    if(!categoryId){
        return "";
    }

    const parts = [];

    let current =
        db.categories.find(
            c =>
                c.id ===
                categoryId
        );

    const guard =
        new Set();

    while(
        current &&
        !guard.has(current.id)
    ){

        guard.add(
            current.id
        );

        parts.unshift(
            current.name
        );

        current =
            db.categories.find(
                c =>
                    c.id ===
                    current.parentId
            );
    }

    return parts.join(
        " / "
    );
}


/* =========================================================
   TAGS - ONLY ACTIVE NOTES
   ========================================================= */

function getUsedTags(){

    const used =
        new Set();

    /*
       Only consider ACTIVE (non-deleted) notes.
       Notes in Recycle Bin are excluded entirely.
    */

    db.notes.forEach(
        note => {

            if(note.deleted){
                return;
            }

            note.tags.forEach(
                tag => {

                    /*
                       Skip auto-assigned "Bin" tag
                       from sidebar listing.
                    */
                    if(tag === "Bin"){
                        return;
                    }

                    used.add(tag);
                }
            );
        }
    );

    return [
        ...used
    ].sort(
        (a,b) =>
            a.localeCompare(b)
    );
}

function renderCategories(){

    const container =
        document.getElementById(
            "categoryList"
        );

    /*
       Only categories that contain at least one active note
       (directly or through descendants).
    */

    const usedIds =
        new Set();

    db.notes.forEach(
        note => {

            if(note.deleted){
                return;
            }

            if(note.categoryId){

                let current =
                    db.categories.find(
                        c =>
                            c.id ===
                            note.categoryId
                    );

                const guard =
                    new Set();

                while(
                    current &&
                    !guard.has(current.id)
                ){

                    guard.add(
                        current.id
                    );

                    usedIds.add(
                        current.id
                    );

                    current =
                        db.categories.find(
                            c =>
                                c.id ===
                                current.parentId
                        );
                }
            }
        }
    );

    const roots =
        db.categories.filter(
            c =>
                !c.parentId &&
                usedIds.has(c.id)
        );

    if(!roots.length){

        container.innerHTML =
            `
            <div class="sidebar-subtitle">
                No used categories
            </div>
            `;

        return;
    }

    container.innerHTML =
        roots
            .map(
                category =>
                    renderCategoryTree(
                        category,
                        usedIds
                    )
            )
            .join("");
}


function renderCategoryTree(
    category,
    usedIds
){

    if(!usedIds.has(category.id)){
        return "";
    }

    const children =
        db.categories.filter(
            c =>
                c.parentId ===
                category.id &&
                usedIds.has(c.id)
        );

    const count =
        countCategoryNotes(
            category.id
        );

    const childrenHtml =
        children.length
        ?
        `
        <div class="tree-children">
            ${
                children
                    .map(
                        child =>
                            renderCategoryTree(
                                child,
                                usedIds
                            )
                    )
                    .join("")
            }
        </div>
        `
        :
        "";

    return `
        <div class="tree-row">

            <span class="tree-arrow"
                  onclick="event.stopPropagation(); toggleCategoryNode('${category.id}')">
                ${
                    children.length
                    ?
                    "▸"
                    :
                    ""
                }
            </span>

            <div class="tree-content">

                <div class="sidebar-item"
                     onclick="setCategoryView('${category.id}')">

                    <span class="sidebar-icon">
                        📁
                    </span>

                    <span class="sidebar-label">
                        ${escapeHtml(category.name)}
                    </span>

                    <span class="sidebar-count">
                        ${count}
                    </span>

                    <div class="sidebar-controls">

                        <button class="sidebar-ctrl"
                                title="Rename"
                                onclick="event.stopPropagation(); renameCategory('${category.id}')">
                            ✎
                        </button>

                        <button class="sidebar-ctrl danger"
                                title="Remove"
                                onclick="event.stopPropagation(); removeCategory('${category.id}')">
                            🗑
                        </button>

                    </div>

                </div>

                <div id="catChildren-${category.id}"
                     style="display:none;">
                    ${childrenHtml}
                </div>

            </div>

        </div>
    `;
}


function toggleCategoryNode(id){

    const element =
        document.getElementById(
            "catChildren-" + id
        );

    if(!element){
        return;
    }

    const isHidden =
        element.style.display ===
        "none";

    element.style.display =
        isHidden
        ?
        "block"
        :
        "none";
}


function countCategoryNotes(
    categoryId
){

    let count = 0;

    db.notes.forEach(
        note => {

            if(
                note.deleted ||
                !note.categoryId
            ){
                return;
            }

            if(
                note.categoryId ===
                categoryId
            ){

                count++;

                return;
            }

            if(
                isDescendantOf(
                    note.categoryId,
                    categoryId
                )
            ){

                count++;
            }
        }
    );

    return count;
}


function renderTags(){

    const container =
        document.getElementById(
            "tagList"
        );

    const usedTags =
        getUsedTags();

    if(!usedTags.length){

        container.innerHTML =

    container.innerHTML =

                                </button>

                                        onclick="event.stopPropagation(); removeTagEverywhere('${escapeAttribute(tag)}')">
                                    🗑
                                </button>

                        </div>
                    `;

            .join("");
}


function renameTag(tag){

    const newName =
        prompt(
            "Rename tag:",
            tag
        );

    if(
        !newName ||
        !newName.trim()
    ){
        return;
    }

    const clean =
        newName.trim();

    db.notes.forEach(
        note => {

            note.tags =
                note.tags.map(
                    t =>
                        t === tag
                        ?
                        clean
                        :
                        t
                );

            note.modifiedAt =
                new Date().toISOString();
        }
    );

    db.tags =
        db.tags.map(
            t =>
                t === tag
                ?
                clean
                :
                t
        );

    markChanged();

    refreshUI();

    showToast(
        "Tag renamed.",
        "success"
    );
}


function removeTagEverywhere(tag){

    const ok =
        confirm(
            "Remove tag '" + tag + "' from all notes?\n\nNotes will NOT be deleted."
        );

    if(!ok){
        return;
    }

    db.notes.forEach(
        note => {

            if(note.tags.includes(tag)){

                note.tags =
                    note.tags.filter(
                        t => t !== tag
                    );

                note.modifiedAt =
                    new Date().toISOString();
            }
        }
    );

    db.tags =
        db.tags.filter(
            t => t !== tag
        );

    markChanged();

    refreshUI();

    showToast(
        "Tag removed. Notes kept.",
        "success"
    );
}

/* =========================================================
   FILTER NOTES
   ========================================================= */

function getVisibleNotes(){

    let notes =
        [...db.notes];

    if(currentView === "trash"){

        notes =
            notes.filter(
                note =>
                    note.deleted &&
                    !note.trashHidden
            );

    }else{

        notes =
            notes.filter(
                note =>
                    !note.deleted
            );
    }

    if(currentView === "favorites"){

        notes =
            notes.filter(
                note =>
                    note.favorite
            );
    }

    if(currentView === "pinned"){

        notes =
            notes.filter(
                note =>
                    note.pinned
            );
    }

    if(currentView === "category"){

        notes =
            notes.filter(
                note =>
                    note.categoryId ===
                    currentCategoryId ||
                    (
                        note.categoryId &&
                        isDescendantOf(
                            note.categoryId,
                            currentCategoryId
                        )
                    )
            );
    }

    if(currentView === "tag"){

        notes =
            notes.filter(
                note =>
                    note.tags.includes(
                        currentTagName
                    )
            );
    }

    if(searchText){

        const q =
            searchText.toLowerCase();

        notes =
            notes.filter(
                note => {

                    const category =
                        getCategoryPath(
                            note.categoryId
                        );

                    return (

                        note.title
                            .toLowerCase()
                            .includes(q)

                        ||

                        note.content
                            .toLowerCase()
                            .includes(q)

                        ||

                        category
                            .toLowerCase()
                            .includes(q)

                        ||

                        note.tags
                            .join(" ")
                            .toLowerCase()
                            .includes(q)

                    );
                }
            );
    }

    return sortNotes(
        notes
    );
}


/* =========================================================
   SORT
   ========================================================= */

function sortNotes(notes){

    const sorting =
        db.settings.sorting;

    if(
        sorting ===
        "Alphabetical"
    ){

        return notes.sort(
            (a,b) =>
                a.title.localeCompare(
                    b.title
                )
        );
    }

    if(
        sorting ===
        "Newest"
    ){

        return notes.sort(
            (a,b) =>
                new Date(b.createdAt) -
                new Date(a.createdAt)
        );
    }

    if(
        sorting ===
        "Oldest"
    ){

        return notes.sort(
            (a,b) =>
                new Date(a.createdAt) -
                new Date(b.createdAt)
        );
    }

    return notes.sort(
        (a,b) =>
            new Date(b.modifiedAt) -
            new Date(a.modifiedAt)
    );
}


/* =========================================================
   RENDER NOTE LIST
   ========================================================= */

function renderNoteList(){

    const container =
        document.getElementById(
            "noteList"
        );

    let notes =
        getVisibleNotes();

    document.getElementById(
        "listCount"
    ).textContent =
        notes.length;

    const perPage =
        db.settings.notesPerPage;

    let pages = 1;

    if(perPage !== "All"){

        const n =
            Number(perPage);

        pages =
            Math.max(
                1,
                Math.ceil(
                    notes.length / n
                )
            );

        currentPage =
            Math.min(
                currentPage,
                pages
            );

        const start =
            (currentPage - 1) * n;

        notes =
            notes.slice(
                start,
                start + n
            );

    }else{

        currentPage =
            1;
    }

    if(!notes.length){

        container.innerHTML =
            `
            <div class="empty">
                No notes found.
            </div>
            `;

        renderPagination(
            1
        );

        return;
    }

    container.innerHTML =
        notes
            .map(
                note =>
                    renderNoteRow(
                        note
                    )
            )
            .join("");

    renderPagination(
        pages
    );
}


function renderNoteRow(note){

    const preview =
        note.content
            .replace(/\s+/g," ")
            .trim();

    const date =
        formatDateTime(
            note.modifiedAt
        );

    return `
        <div class="note-row ${
            selectedNoteId === note.id
            ? "active"
            : ""
        }"
        onclick="selectNote('${note.id}')">

            <div class="note-marker"
                 style="--note-color:${escapeAttribute(note.color)}">
            </div>

            <div class="note-row-body">

                <div class="note-row-title">
                    ${
                        note.pinned
                        ? "📌 "
                        : ""
                    }

                    ${
                        note.favorite
                        ? "⭐ "
                        : ""
                    }

                    ${escapeHtml(
                        note.title
                    )}
                </div>

                <div class="note-row-preview">
                    ${escapeHtml(
                        preview ||
                        "No content"
                    )}
                </div>

                <div class="note-row-meta">

                    <span>
                        ${escapeHtml(date)}
                    </span>

                    ${
                        note.tags.length
                        ?
                        `
                        <span>
                            • ${escapeHtml(
                                note.tags.slice(
                                    0,
                                    3
                                ).join(", ")
                            )}
                        </span>
                        `
                        :
                        ""
                    }

                </div>

            </div>

            <div class="note-actions">

                <button
                    title="Favorite"
                    onclick="event.stopPropagation(); toggleFavorite('${note.id}')">
                    ${
                        note.favorite
                        ? "★"
                        : "☆"
                    }
                </button>

                <button
                    title="Pin"
                    onclick="event.stopPropagation(); togglePinned('${note.id}')">
                    ${
                        note.pinned
                        ? "📌"
                        : "📍"
                    }
                </button>

                ${
                    note.deleted
                    ?
                    `
                    <button
                        title="Restore"
                        onclick="event.stopPropagation(); restoreNote('${note.id}')">
                        ↩
                    </button>
                    `
                    :
                    `
                    <button
                        title="Delete"
                        onclick="event.stopPropagation(); deleteNote('${note.id}')">
                        🗑
                    </button>
                    `
                }

            </div>

        </div>
    `;
}


/* =========================================================
   PAGINATION
   ========================================================= */

function renderPagination(
    pages
){

    const container =
        document.getElementById(
            "pagination"
        );

    if(pages <= 1){

        container.style.display =
            "none";

        return;
    }

    container.style.display =
        "flex";

    let html = "";

    html +=
        `
        <button class="btn small"
                onclick="changePage(-1)"
                ${currentPage <= 1 ? "disabled" : ""}>
            Prev
        </button>
        `;

    html +=
        `
        <span style="font-size:12px;">
            ${currentPage} / ${pages}
        </span>
        `;

    html +=
        `
        <button class="btn small"
                onclick="changePage(1)"
                ${currentPage >= pages ? "disabled" : ""}>
            Next
        </button>
        `;

    container.innerHTML =
        html;
}


function changePage(delta){

    currentPage +=
        delta;

    renderNoteList();
}

function applySettings(){

    const theme =
        db.settings.theme;

    document.body.classList.remove(
        "night"
    );

    if(theme === "Night"){

        document.body.classList.add(
            "night"
        );

    }else if(theme === "System"){

        if(
            window.matchMedia &&
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches
        ){

            document.body.classList.add(
                "night"
            );
        }
    }

    const fontSizes = {

        "Small":
            "13px",

        "Normal":
            "15px",

        "Large":
            "17px",

        "Extra Large":
            "19px"
    };

    document.documentElement.style
        .setProperty(
            "--font-size",
            fontSizes[
                db.settings.fontSize
            ] ||
            "15px"
        );

    document.getElementById(
        "trashLabel"
    ).textContent =
        db.trash.label ||
        "Recycle Bin";
}

/* =========================================================
   DATE / TIME
   ========================================================= */

function formatDateTime(value){

    if(!value){
        return "—";
    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return "—";
    }

    const settings =
        db.settings.dateTimeFormat;

    if(settings === "12 Hour"){

        return date.toLocaleString(
            undefined,
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit",
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",
                hour12:true
            }
        );

    }

    if(settings === "24 Hour"){

        return date.toLocaleString(
            undefined,
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit",
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit",
                hour12:false
            }
        );
    }

    return date.toLocaleString();
}


function formatShortTime(value){

    if(!value){
        return "—";
    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return "—";
    }

    return date.toLocaleTimeString(
        undefined,
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* =========================================================
   UTILITIES
   ========================================================= */

function generateId(prefix){

    return (
        prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .slice(2,9)
    );
}


function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


function escapeAttribute(value){

    return escapeHtml(
        value
    );
}


function showToast(
    message,
    type = "normal"
){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toast._timer
    );

    toast._timer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );
}
