<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes Manager</title>
<style>
:root{
    --bg:#f4f6f9;
    --surface:#ffffff;
    --surface2:#f8fafc;
    --text:#172033;
    --muted:#697386;
    --border:#dfe4ec;
    --primary:#2563eb;
    --primary2:#1d4ed8;
    --danger:#dc2626;
    --success:#15803d;
    --warning:#b45309;
    --shadow:0 8px 25px rgba(20,30,50,.08);
    --radius:12px;
    --font-size:15px;
    --sidebar-width:290px;
    --sidebar-border:1px;
    --note-list-bg:#ffffff;
    --note-panel-bg:#ffffff;
    --section-height:38px;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; min-height:100%; }
body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    font-size:var(--font-size);
}

/* FLOATING SIDEBAR TOGGLE */
.floating-toggle{
    position:fixed;
    top:10px;
    left:10px;
    z-index:3000;
    width:46px;
    height:46px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    color:var(--text);
    box-shadow:0 6px 20px rgba(0,0,0,.15);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:700;
    padding:0;
    transition:background .15s;
}
.floating-toggle:hover{ background:#eef2ff; }
.floating-toggle .hamburger{
    display:flex;
    flex-direction:column;
    gap:4px;
}
.floating-toggle .hamburger span{
    width:20px;
    height:2.5px;
    background:var(--text);
    border-radius:2px;
    display:block;
}
.floating-toggle .arrow-icon{ font-size:18px; line-height:1; }

/* TOP AREA */
.top-area{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    box-shadow:0 2px 8px rgba(0,0,0,.04);
    padding:10px 12px 10px 68px;
    position:sticky;
    top:0;
    z-index:1000;
}
.app-title{
    font-size:20px;
    font-weight:800;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--primary);
    margin-bottom:8px;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.status-row{
    display:flex;
    gap:8px;
    flex-wrap:nowrap;
    overflow-x:auto;
    margin-bottom:10px;
    padding-bottom:2px;
    scrollbar-width:thin;
}
.status-card{
    flex:0 0 auto;
    padding:5px 12px;
    border-radius:8px;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
    border:1px solid var(--border);
    background:var(--surface2);
    color:var(--muted);
    line-height:1.4;
}
.status-card.drive-on{ color:#15803d; border-color:#bbf7d0; background:#f0fdf4; }
.status-card.drive-off{ color:#dc2626; border-color:#fecaca; background:#fef2f2; }
.status-card.sync-on{ color:#15803d; border-color:#bbf7d0; background:#f0fdf4; }
.status-card.sync-off{ color:#b45309; border-color:#fde68a; background:#fffbeb; }
.status-card.sync-err{ color:#dc2626; border-color:#fecaca; background:#fef2f2; }
.status-card.last-sync{ color:#2563eb; border-color:#bfdbfe; background:#eff6ff; }
.status-card.last-change{ color:#7c3aed; border-color:#ddd6fe; background:#f5f3ff; }

.top-buttons{
    display:flex;
    gap:6px;
    flex-wrap:nowrap;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:thin;
}
.top-buttons .btn{
    flex:0 0 auto;
    height:34px;
    min-width:72px;
    padding:0 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    color:var(--text);
    font-size:12px;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    white-space:nowrap;
    cursor:pointer;
    transition:.15s ease;
}
.top-buttons .btn:hover{ background:#f1f5f9; }
.top-buttons .btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); }
.top-buttons .btn.primary:hover{ background:var(--primary2); }
.top-buttons .btn.danger{ background:var(--danger); color:#fff; border-color:var(--danger); }
.top-buttons .btn.danger:hover{ background:#b91c1c; }
.top-buttons .btn.success{ background:var(--success); color:#fff; border-color:var(--success); }
.top-buttons .btn.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

.btn{ cursor:pointer; font:inherit; }
button,select,input,textarea{ font:inherit; }

/* SIDEBAR */
.sidebar-overlay{
    position:fixed;
    inset:0;
    z-index:1900;
    background:rgba(0,0,0,.22);
    display:none;
}
.sidebar-overlay.open{ display:block; }

.sidebar{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:var(--sidebar-width);
    z-index:2000;
    background:var(--surface);
    border-right:var(--sidebar-border) solid var(--border);
    box-shadow:10px 0 25px rgba(0,0,0,.08);
    transform:translateX(-105%);
    transition:transform .2s ease;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:10px;
    padding-top:66px;
    scrollbar-width:none;
}
.sidebar::-webkit-scrollbar{ display:none; }
.sidebar.open{ transform:translateX(0); }

.sidebar-section{ margin-bottom:4px; }

.sidebar-item{
    position:relative;
    min-height:var(--section-height);
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 9px;
    border-radius:8px;
    cursor:pointer;
    color:var(--text);
}
.sidebar-item:hover,
.sidebar-item.active{ background:#eef2ff; }
.sidebar-icon{ width:20px; text-align:center; flex:none; }
.sidebar-label{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.sidebar-count{ color:var(--muted); font-size:11px; flex:none; }

.bin-badge{
    background:#dc2626;
    color:#fff;
    font-size:10px;
    font-weight:700;
    padding:1px 6px;
    border-radius:999px;
    flex:none;
    min-width:18px;
    text-align:center;
}

.sidebar-divider{
    height:1px;
    background:#e2e8f0;
    margin:8px 4px;
    border:0;
}

.sidebar-controls{ display:flex; gap:3px; flex:none; }
.sidebar-ctrl{
    width:24px;
    height:24px;
    min-width:24px;
    padding:0;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    color:var(--text);
    font-size:11px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    cursor:pointer;
}
.sidebar-ctrl:hover{ background:#e2e8f0; }
.sidebar-ctrl.danger:hover{ background:#fef2f2; border-color:#fecaca; color:#dc2626; }

.sidebar-collapse{ margin-top:3px; padding-left:12px; }
.tag-list, .category-list{ display:block; }
.sidebar-subtitle{
    padding:6px 9px;
    color:var(--muted);
    font-size:11px;
}

.cat-row{
    display:flex;
    align-items:center;
    gap:6px;
    padding:2px 4px;
    border-radius:8px;
}
.cat-row:hover{ background:#f8fafc; }
.cat-row-btns{ display:flex; gap:3px; flex:none; order:3; }

.cat-expander{
    width:18px;
    height:18px;
    padding:0;
    border:1px solid var(--border);
    border-radius:4px;
    background:var(--surface);
    cursor:pointer;
    font-size:11px;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    flex:none;
}
.cat-expander:hover{ background:#e2e8f0; }

/* MAIN */
.main{ min-height:calc(100vh - 160px); padding:12px; }
.toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
}
.search-box{ flex:1; min-width:180px; }
.search-box input{
    width:100%;
    height:36px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    outline:none;
}
.search-box input:focus{ border-color:var(--primary); }

.workspace{
    display:grid;
    grid-template-columns:minmax(260px,34%) 1fr;
    gap:10px;
    min-height:calc(100vh - 220px);
}

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
}
.panel-header{
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:8px 12px;
    border-bottom:1px solid var(--border);
}
.panel-title{ font-weight:700; }

/* Filter/Sort bar inside panel (N16-b) */
.filter-sort-bar{
    display:flex;
    gap:6px;
    padding:6px 10px;
    border-bottom:1px solid var(--border);
    background:var(--surface2);
    flex-wrap:wrap;
    align-items:center;
}
.filter-sort-bar select{
    height:26px;
    font-size:11px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    padding:0 6px;
}

.note-list{
    max-height:480px;
    overflow-y:auto;
    overscroll-behavior:contain;
    background:var(--note-list-bg);
}

.note-row{
    display:flex;
    align-items:flex-start;
    gap:9px;
    padding:9px 11px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    transition:background .12s, transform .12s;
}
.note-row:hover{ background:#f8fafc; transform:scale(1.005); }
.note-row.active{ background:#93c5fd; }
.note-row.ms-selected{ background:#bfdbfe; }

.note-marker{
    width:5px;
    min-width:5px;
    height:auto;
    align-self:stretch;
    border-radius:5px;
    background:var(--note-color,#94a3b8);
}
.note-row-body{ flex:1; min-width:0; }

.note-line1{ display:flex; gap:6px; align-items:baseline; min-width:0; }
.note-line1-title{
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:0 1 auto;
    max-width:55%;
}
.note-line1-content{
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1 1 auto;
    min-width:0;
}
.note-line2{
    margin-top:4px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
    font-size:11px;
    color:var(--muted);
}
.note-line3{
    margin-top:4px;
    font-size:10px;
    color:var(--muted);
}
.note-line2 .meta-chip{
    display:inline-flex;
    align-items:center;
    gap:3px;
    max-width:120px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.note-row-right{
    display:flex;
    flex-direction:column;
    gap:4px;
    align-items:flex-end;
    flex:none;
}
.row-icon-btn{
    width:24px;
    height:24px;
    padding:0;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    color:#94a3b8;
    font-size:12px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    line-height:1;
}
.row-icon-btn:hover{ background:#e2e8f0; }
.row-icon-btn.pin-on{ color:#b45309; border-color:#fde68a; background:#fffbeb; }
.row-icon-btn.fav-on{ color:#d97706; border-color:#fde68a; background:#fffbeb; }
.row-icon-btn.success:hover{ color:#15803d; border-color:#bbf7d0; background:#f0fdf4; }
.row-icon-btn.danger:hover{ color:#dc2626; border-color:#fecaca; background:#fef2f2; }

/* Checkbox */
.note-row.has-checkbox{
    padding-left:36px;
    position:relative;
}
.note-row.has-checkbox::before{
    content:"";
    position:absolute;
    left:12px;
    top:14px;
    width:16px;
    height:16px;
    border:2px solid var(--border);
    border-radius:4px;
    background:var(--surface);
    cursor:pointer;
}
.note-row.has-checkbox.ms-selected::before{
    background:var(--primary);
    border-color:var(--primary);
    content:"✓";
    color:#fff;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

/* DETAIL PANEL */
.detail{ min-width:0; }
.detail-body{ padding:0; background:var(--note-panel-bg); }

/* Colour border around whole panel (P1) */
.note-panel-border{
    border:5px solid var(--note-color,#94a3b8);
    border-radius:12px;
    overflow:hidden;
}

.note-controls-card{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 10px;
    border-bottom:1px solid var(--border);
    background:var(--surface2);
    flex-wrap:wrap;
}
.note-controls-left{ display:flex; gap:5px; flex-wrap:wrap; }
.note-controls-right{ display:flex; gap:5px; margin-left:auto; flex-wrap:wrap; }

.ctrl-btn{
    height:30px;
    min-width:62px;
    padding:0 9px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--surface);
    color:var(--text);
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    white-space:nowrap;
}
.ctrl-btn:hover{ background:#f1f5f9; }
.ctrl-btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); }
.ctrl-btn.danger{ background:var(--danger); color:#fff; border-color:var(--danger); }
.ctrl-btn.success{ background:var(--success); color:#fff; border-color:var(--success); }

.heading-card{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
}
.heading-input{
    width:100%;
    border:0;
    background:transparent;
    outline:none;
    font-size:22px;
    font-weight:700;
    color:var(--text);
    padding:4px 0;
}
.heading-display{
    font-size:22px;
    font-weight:700;
    line-height:1.3;
    word-break:break-word;
    min-height:28px;
}

.content-bar{ border-bottom:1px solid var(--border); }
.content-toolbar{
    display:flex;
    gap:4px;
    flex-wrap:wrap;
    padding:6px 10px;
    background:var(--surface2);
    border-bottom:1px solid var(--border);
    align-items:center;
}
.tool-btn{
    width:30px;
    height:28px;
    min-width:30px;
    padding:0;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    color:var(--text);
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}
.tool-btn:hover{ background:#e2e8f0; }
.tool-btn.wide{ width:auto; min-width:auto; padding:0 8px; gap:4px; }
.tool-sep{ width:1px; height:20px; background:var(--border); margin:0 3px; }

.content-editable{
    min-height:220px;
    padding:10px 12px;
    outline:none;
    line-height:1.6;
    word-break:break-word;
    font-size:14px;
}
.content-editable:empty:before{
    content:attr(data-placeholder);
    color:var(--muted);
}
.content-display{
    padding:10px 12px;
    white-space:pre-wrap;
    line-height:1.6;
    word-break:break-word;
    min-height:120px;
}

/* LINKS */
.links-card{
    margin:10px;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--surface);
}
.links-card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 10px;
    background:var(--surface2);
    border-bottom:1px solid var(--border);
    gap:6px;
}
.links-card-title{ font-size:12px; font-weight:700; color:var(--muted); }
.links-card-header-actions{ display:flex; gap:4px; }

.link-item{
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 10px;
    border-bottom:1px solid var(--border);
    font-size:12px;
}
.link-item:last-child{ border-bottom:0; }
.link-item-text{
    flex:0 0 auto;
    font-weight:600;
    max-width:35%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}
.link-item-url{
    flex:1 1 auto;
    color:var(--primary);
    text-decoration:none;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
}
.link-item-actions{ display:flex; gap:3px; flex:none; }
.link-icon-btn{
    width:24px;
    height:24px;
    min-width:24px;
    padding:0;
    border:1px solid var(--border);
    border-radius:5px;
    background:var(--surface);
    cursor:pointer;
    font-size:11px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}
.link-icon-btn:hover{ background:#e2e8f0; }
.link-icon-btn.danger:hover{ background:#fef2f2; color:#dc2626; }

/* TAGS + CAT */
.tags-cat-card{
    margin:10px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    padding:10px;
}
.tags-cat-row{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:8px;
}
.tags-cat-row:last-child{ margin-bottom:0; }
.tags-cat-label{
    font-size:11px;
    font-weight:700;
    color:var(--muted);
    min-width:56px;
}
.tag-chip{
    display:inline-flex;
    align-items:center;
    gap:3px;
    border:1px solid #cbd5e1;
    border-radius:999px;
    padding:2px 8px;
    background:#f8fafc;
    font-size:11px;
}
.tag-chip .chip-x{ cursor:pointer; color:#94a3b8; font-weight:700; }
.tag-chip .chip-x:hover{ color:#dc2626; }

.tags-input-inline{
    flex:1;
    min-width:140px;
    height:28px;
    padding:0 8px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    outline:none;
    font-size:12px;
}
.tags-input-inline:focus{ border-color:var(--primary); }

.small-action-btn{
    height:28px;
    padding:0 8px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    color:var(--text);
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:3px;
}
.small-action-btn:hover{ background:#e2e8f0; }
.small-action-btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); }
.small-action-btn.danger{ background:var(--danger); color:#fff; border-color:var(--danger); }
.small-action-btn.success{ background:var(--success); color:#fff; border-color:var(--success); }

/* METADATA */
.metadata-box{
    margin:10px;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:#f8fafc;
    color:#697386;
}
.metadata-title{
    padding:7px 10px;
    font-size:12px;
    font-weight:700;
    background:#f1f5f9;
    border-bottom:1px solid var(--border);
    color:#697386;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    user-select:none;
}
.metadata-title .toggle-icon{
    font-size:11px;
    color:#94a3b8;
}
.metadata-body{ display:block; }
.metadata-body.collapsed{ display:none; }

.metadata-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}
.metadata-table td{
    padding:5px 8px;
    font-size:11px;
    line-height:1.3;
    vertical-align:top;
    border:1px solid var(--border);
    word-break:break-word;
    color:#697386;
}
.metadata-table td.label{
    width:22%;
    color:#697386;
    font-weight:700;
    background:#f1f5f9;
}
.metadata-table td.value{
    width:28%;
    color:#697386;
}
.metadata-table a.cat-link{
    color:#2563eb;
    text-decoration:none;
    cursor:pointer;
}

.metadata-actions{
    padding:8px 10px;
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    border-top:1px solid var(--border);
    background:#f1f5f9;
}

/* EMPTY */
.empty{
    min-height:200px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    padding:20px;
    text-align:center;
    flex-direction:column;
    gap:8px;
}

/* SETTINGS */
.settings-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:10px;
}
.setting{
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px;
    background:var(--surface2);
}
.setting label{
    display:block;
    margin-bottom:6px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CLIENT_ID = "262106898132-tsn94p3vvpf34do0ommc6rai2mtc5sh6.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive";
const DATABASE_NAME = "NotesManagerDB.json";
const DATABASE_FOLDER_ID = "";

/* =========================================================
   STATE
   ========================================================= */
let accessToken = null;
let tokenClient = null;
let databaseFileId = null;
let databaseFolderId = null;
let db = createEmptyDatabase();
let selectedNoteId = null;
let editingNoteId = null;
let currentView = "all";
let currentCategoryId = null;
let currentTagName = null;
let searchText = "";
let sidebarOpen = false;
let currentPage = 1;
let autosaveTimer = null;
let saveInProgress = false;
let pendingChanges = false;
let lastSuccessfulSync = null;
let lastChangeTime = null;
let selectedIds = new Set();
let globalLinks = [];
let undoDeleteSnapshot = null;
let undoTimer = null;

/* 20 Predefined colours (P14-b) */
const COLOR_PALETTE = [
    "#64748b","#dc2626","#ea580c","#d97706","#ca8a04","#65a30d","#16a34a","#059669",
    "#0d9488","#0891b2","#0284c7","#2563eb","#4f46e5","#7c3aed","#9333ea","#c026d3",
    "#db2777","#e11d48","#78350f","#1e293b"
];

/* =========================================================
   DEFAULT DB
   ========================================================= */
function createEmptyDatabase(){
    return {
        version: 8,
        settings: {
            theme: "System",
            fontSize: "Normal",
            sorting: "Last Modified First",
            notesPerPage: 5,
            notesVisibleNoScroll: 5,
            sidebarWidth: 290,
            mobileSidebarWidth: "85%",
            sidebarBorder: 1,
            sectionHeight: 38,
            noteListBg: "#ffffff",
            notePanelBg: "#ffffff",
            noteLineCount: 3,
            noteRowHeight: "Auto",
            contentPreviewLength: 60,
            deleteConfirmation: true,
            autosave: true,
            autosaveInterval: 5,
            dateTimeFormat: "12 Hour",
            defaultNoteColor: "#64748b",
            autoAssignBinTag: true,
            toolbarButtons: ["bold","underline","italic","color","link"],
            catAssignMethod: "prompt",
            metadataCollapsed: true
        },
        trash: { label: "Recycle Bin" },
        categories: [],
        tags: [],
        notes: [],
        globalLinks: [],
        meta: {
            created: new Date().toISOString(),
            updated: new Date().toISOString()
        }
    };
}

/* =========================================================
   GOOGLE AUTH
   ========================================================= */
function initializeGoogle(){
    if (typeof google === "undefined" || !google.accounts || !google.accounts.oauth2){
        showToast("Google Identity Services load nahi hui.", "error");
        return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: function(response){
            if (response.error){
                console.error(response);
                showToast("Google Drive connection failed.", "error");
                return;
            }
            accessToken = response.access_token;
            setDriveConnected(true);
            showToast("Drive Connected", "success");
            loadDatabase();
        }
    });
}

function connectDrive(){
    if (!tokenClient){
        initializeGoogle();
        setTimeout(() => { if (tokenClient) requestDriveToken(); }, 300);
        return;
    }
    requestDriveToken();
}

function requestDriveToken(){
    try { tokenClient.requestAccessToken({ prompt: "" }); }
    catch(error){
        console.error(error);
        showToast("Google Drive connection could not start.", "error");
    }
}

function setDriveConnected(value){
    const el = document.getElementById("driveStatus");
    if (value){
        el.textContent = "Drive: Connected";
        el.className = "status-card drive-on";
    } else {
        el.textContent = "Drive: Disconnected";
        el.className = "status-card drive-off";
    }
}

/* =========================================================
   DRIVE API
   ========================================================= */
async function driveRequest(url, options = {}){
    if (!accessToken) throw new Error("Google Drive is not connected.");
    const headers = new Headers(options.headers || {});
    headers.set("Authorization", "Bearer " + accessToken);
    const response = await fetch(url, { ...options, headers });
    if (!response.ok){
        const text = await response.text();
        throw new Error("Drive API " + response.status + ": " + text);
    }
    return response;
}

async function findDatabaseFile(){
    let query = "name = '" + DATABASE_NAME.replace(/'/g, "\\'") + "' and trashed = false";
    if (DATABASE_FOLDER_ID) query += " and '" + DATABASE_FOLDER_ID + "' in parents";
    const url = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(query) +
        "&spaces=drive&fields=files(id,name,mimeType,modifiedTime,parents)&pageSize=100";
    const response = await driveRequest(url);
    const data = await response.json();
    if (!data.files || !data.files.length) return null;
    return data.files[0];
}

async function createDatabaseFile(){
    const metadata = { name: DATABASE_NAME, mimeType: "application/json" };
    if (DATABASE_FOLDER_ID) metadata.parents = [DATABASE_FOLDER_ID];
    const body = JSON.stringify(db, null, 2);
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
    form.append("file", new Blob([body], { type: "application/json" }));
    const response = await driveRequest(
        "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime,parents",
        { method: "POST", body: form }
    );
    const result = await response.json();
    databaseFileId = result.id;
    if (result.parents && result.parents.length) databaseFolderId = result.parents[0];
    updateFooter();
    return result;
}

/* =========================================================
   LOAD
   ========================================================= */
async function loadDatabase(){
    if (!accessToken) { connectDrive(); return; }
    try {
        setSyncStatus("Loading", "normal");
        const file = await findDatabaseFile();
        if (!file){
            db = createEmptyDatabase();
            const created = await createDatabaseFile();
            databaseFileId = created.id;
            pendingChanges = false;
            updateSyncStatus();
            setLastSync(new Date());
            showToast("New NotesManagerDB.json created.", "success");
            refreshUI();
            return;
        }
        databaseFileId = file.id;
        if (file.parents && file.parents.length) databaseFolderId = file.parents[0];
        const response = await driveRequest(
            "https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(file.id) + "?alt=media"
        );
        const text = await response.text();
        if (!text.trim()){
            db = createEmptyDatabase();
        } else {
            try { db = normalizeDatabase(JSON.parse(text)); }
            catch(e){ throw new Error("NotesManagerDB.json invalid JSON."); }
        }
        pendingChanges = false;
        updateSyncStatus();
        lastSuccessfulSync = file.modifiedTime ? new Date(file.modifiedTime) : new Date();
        setLastSync(lastSuccessfulSync);
        applySettings();
        refreshUI();
        updateFooter();
        showToast("Database loaded.", "success");
    } catch(error){
        console.error(error);
        setSyncStatus("Error", "error");
        showToast(error.message, "error");
    }
}

function normalizeDatabase(data){
    const base = createEmptyDatabase();
    if (!data || typeof data !== "object") return base;
    const result = { ...base, ...data };
    result.settings = { ...base.settings, ...(data.settings || {}) };
    result.trash = { ...base.trash, ...(data.trash || {}) };
    result.categories = Array.isArray(data.categories) ? data.categories : [];
    result.tags = Array.isArray(data.tags) ? data.tags : [];
    result.notes = Array.isArray(data.notes) ? data.notes.map(normalizeNote) : [];
    result.globalLinks = Array.isArray(data.globalLinks) ? data.globalLinks : [];
    return result;
}

function normalizeNote(note){
    const n = note || {};
    return {
        id: n.id || generateId("note"),
        title: n.title || "Untitled Note",
        content: n.content || "",
        categoryId: n.categoryId || null,
        tags: Array.isArray(n.tags) ? n.tags : [],
        links: Array.isArray(n.links) ? n.links : [],
        favorite: !!n.favorite,
        pinned: !!n.pinned,
        deleted: !!n.deleted,
        trashHidden: !!n.trashHidden,
        color: n.color || "#64748b",
        createdAt: n.createdAt || new Date().toISOString(),
        modifiedAt: n.modifiedAt || n.createdAt || new Date().toISOString(),
        deletedAt: n.deletedAt || null,
        lastViewedAt: n.lastViewedAt || null,
        lastRestoredAt: n.lastRestoredAt || null,
        viewCount: Number(n.viewCount || 0),
        editCount: Number(n.editCount || 0),
        restoredCount: Number(n.restoredCount || 0)
    };
}

/* =========================================================
   SAVE
   ========================================================= */
async function saveDatabaseToDrive(){
    if (!accessToken){ showToast("Connect Drive first.", "error"); return false; }
    if (saveInProgress) return false;
    try {
        saveInProgress = true;
        setSyncStatus("Saving", "normal");
        db.meta.updated = new Date().toISOString();
        db.globalLinks = globalLinks;
        const body = JSON.stringify(db, null, 2);
        if (!databaseFileId){
            const file = await findDatabaseFile();
            if (file) databaseFileId = file.id;
        }
        if (!databaseFileId){
            await createDatabaseFile();
        } else {
            await driveRequest(
                "https://www.googleapis.com/upload/drive/v3/files/" +
                encodeURIComponent(databaseFileId) + "?uploadType=media",
                {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json; charset=UTF-8" },
                    body
                }
            );
        }
        pendingChanges = false;
        lastSuccessfulSync = new Date();
        updateSyncStatus();
        setLastSync(lastSuccessfulSync);
        return true;
    } catch(error){
        console.error(error);
        setSyncStatus("Error", "error");
        showToast("Drive save failed: " + error.message, "error");
        return false;
    } finally {
        saveInProgress = false;
    }
}

/* =========================================================
   CHANGE TRACKING
   ========================================================= */
function markChanged(){
    pendingChanges = true;
    lastChangeTime = new Date();
    db.meta.updated = lastChangeTime.toISOString();
    updateSyncStatus();
    updateLastChangeStatus();
    scheduleAutosave();
}

function updateSyncStatus(){
    const el = document.getElementById("syncStatus");
    if (saveInProgress){
        el.textContent = "Sync: Saving…";
        el.className = "status-card sync-off";
    } else if (pendingChanges){
        el.textContent = "Sync: Pending";
        el.className = "status-card sync-off";
    } else {
        el.textContent = "Sync: Synced";
        el.className = "status-card sync-on";
    }
}

function setSyncStatus(text, type){
    const el = document.getElementById("syncStatus");
    if (type === "error"){
        el.textContent = "Sync: Error";
        el.className = "status-card sync-err";
    } else if (text === "Loading"){
        el.textContent = "Sync: Loading…";
        el.className = "status-card sync-off";
    } else if (text === "Saving"){
        el.textContent = "Sync: Saving…";
        el.className = "status-card sync-off";
    }
}

function scheduleAutosave(){
    clearTimeout(autosaveTimer);
    if (!db.settings.autosave || !accessToken) return;
    const seconds = Math.max(1, Number(db.settings.autosaveInterval || 5));
    autosaveTimer = setTimeout(async () => {
        if (pendingChanges) await saveDatabaseToDrive();
    }, seconds * 1000);
}

async function synchronize(){
    if (pendingChanges){
        const saved = await saveDatabaseToDrive();
        if (saved) showToast("Changes synced.", "success");
        return;
    }
    await loadDatabase();
}

/* =========================================================
   NOTE CRUD
   ========================================================= */
function addNote(){
    const now = new Date().toISOString();
    const note = {
        id: generateId("note"),
        title: "New Note",
        content: "",
        categoryId: null,
        tags: [],
        links: [],
        favorite: false,
        pinned: false,
        deleted: false,
        trashHidden: false,
        color: db.settings.defaultNoteColor || "#64748b",
        createdAt: now,
        modifiedAt: now,
        deletedAt: null,
        lastViewedAt: null,
        lastRestoredAt: null,
        viewCount: 0,
        editCount: 0,
        restoredCount: 0
    };
    db.notes.unshift(note);
    selectedNoteId = note.id;
    editingNoteId = note.id;
    markChanged();
    refreshUI();
    renderDetail();
}

function duplicateNote(id){
    const note = getNote(id);
    if (!note) return;
    const copy = JSON.parse(JSON.stringify(note));
    copy.id = generateId("note");
    copy.title = note.title + " (Copy)";
    copy.createdAt = new Date().toISOString();
    copy.modifiedAt = copy.createdAt;
    copy.editCount = 0;
    copy.restoredCount = 0;
    copy.viewCount = 0;
    copy.lastViewedAt = null;
    db.notes.unshift(copy);
    markChanged();
    refreshUI();
    showToast("Note duplicated.", "success");
}

function getNote(id){ return db.notes.find(n => n.id === id); }

function deleteNote(id){
    const note = getNote(id);
    if (!note) return;
    if (db.settings.deleteConfirmation){
        if (!confirm("Move this note to the Recycle Bin?")) return;
    }

    /* Snapshot for undo */
    const snapshot = JSON.parse(JSON.stringify(note));

    note.deleted = true;
    note.trashHidden = false;
    note.deletedAt = new Date().toISOString();
    if (db.settings.autoAssignBinTag && !note.tags.includes("Bin")) note.tags.push("Bin");
    note.modifiedAt = new Date().toISOString();

    if (selectedNoteId === id) selectedNoteId = null;
    if (editingNoteId === id) editingNoteId = null;

    markChanged();
    refreshUI();

    /* Undo bar */
    showUndoBar("Note moved to Recycle Bin.", snapshot);
}

function showUndoBar(msg, snapshot){
    undoDeleteSnapshot = snapshot;
    document.getElementById("undoMsg").textContent = msg;
    document.getElementById("undoBar").classList.add("show");
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => {
        document.getElementById("undoBar").classList.remove("show");
        undoDeleteSnapshot = null;
    }, 5000);
}

function undoDelete(){
    if (!undoDeleteSnapshot) return;
    const snapshot = undoDeleteSnapshot;
    const note = getNote(snapshot.id);
    if (note){
        Object.assign(note, snapshot);
        note.modifiedAt = new Date().toISOString();
    } else {
        db.notes.unshift(snapshot);
    }
    undoDeleteSnapshot = null;
    document.getElementById("undoBar").classList.remove("show");
    markChanged();
    refreshUI();
    showToast("Delete undone.", "success");
}

   ========================================================= */
function selectNote(id){
    /* Trash view: only checkbox toggle */
    if (currentView === "trash"){
        if (selectedIds.has(id)) selectedIds.delete(id);
        else selectedIds.add(id);
        renderNoteList();
        renderBinToolbar();
        return;
    }

    /* Click on checkbox (prefix) toggles selection */
    if (selectedIds.size > 0){
        /* In selection mode, toggle selection */
        if (selectedIds.has(id)) selectedIds.delete(id);
        else selectedIds.add(id);
        renderNoteList();
        return;
    }

    /* Normal: open note preview */
    const note = getNote(id);
    if (!note) return;
    selectedNoteId = id;
    editingNoteId = null;
    note.lastViewedAt = new Date().toISOString();
    note.viewCount = Number(note.viewCount || 0) + 1;
    markChanged();
    renderNoteList();
    renderDetail();
}

function toggleSelect(id){
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    renderNoteList();
    if (currentView === "trash") renderBinToolbar();
}

        `<button class="tool-btn" style="background:${c};width:28px;height:28px;border:${c === current ? '3px solid #2563eb' : '1px solid #dfe4ec'}" onclick="applyColor('${noteId}','${c}')"></button>`

function execCmd(cmd){

}

function insertLinkDialog(){
    const text = prompt("Link text:", "");
    if (text === null) return;
    const url = prompt("Link URL:", "https://");

/* =========================================================
   TAGS
   ========================================================= */
function assignTagFromInput(noteId){
    const input = document.getElementById("detailTagsInput");
    if (!input) return;
    const value = input.value.trim();
    if (!value) return;
    const note = getNote(noteId);
    if (!note) return;
    const tags = parseTags(value);
    tags.forEach(t => {
        if (!note.tags.includes(t)) note.tags.push(t);
        if (!db.tags.includes(t)) db.tags.push(t);
    });
    note.modifiedAt = new Date().toISOString();
    input.value = "";
    markChanged();
    renderDetail();
    renderSidebar();
}

function removeTagFromNoteById(noteId, tag){
    const note = getNote(noteId);
    if (!note) return;
    note.tags = note.tags.filter(t => t !== tag);
    note.modifiedAt = new Date().toISOString();
    markChanged();
    renderDetail();
    renderSidebar();
}

function parseTags(text){
    return [...new Set(text.split(",").map(x => x.trim()).filter(Boolean))];
}

/* =========================================================
   LINKS
   ========================================================= */
function addLinkInline(noteId){
    const note = getNote(noteId);
    if (!note) return;
    openLinkPopup("Add Link", "", "", (title, url) => {
        if (!note.links) note.links = [];
        note.links.push({ title: title || url, url: url });
        note.modifiedAt = new Date().toISOString();
        markChanged();
        renderDetail();
    });
}

function editLinkInline(noteId, index){
    const note = getNote(noteId);
    if (!note || !note.links || !note.links[index]) return;
    const link = note.links[index];
    openLinkPopup("Edit Link", link.title, link.url, (title, url) => {
        link.title = title || url;
        link.url = url;
        note.modifiedAt = new Date().toISOString();
        markChanged();
        renderDetail();
    });
}

function deleteLinkInline(noteId, index){
    const note = getNote(noteId);
    if (!note || !note.links || !note.links[index]) return;
    if (!confirm("Delete this link?")) return;
    note.links.splice(index, 1);
    note.modifiedAt = new Date().toISOString();
    markChanged();
    renderDetail();
}

function openLinkPopup(title, initialTitle, initialUrl, onSave){
    const w = window.open("", "LinkWindow", "width=420,height=280,resizable=yes,scrollbars=yes");
    if (!w){
        const t = prompt(title + "\n\nLink Title:", initialTitle);
        if (t === null) return;
        const u = prompt("Link URL:", initialUrl || "https://");
        if (!u) return;
        onSave(t || u, u);
        return;
    }
    w.document.write(`
        <!DOCTYPE html>
        <html><head><title>${escapeHtml(title)}</title>
        <style>
            body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:16px;color:#172033;}
            h3{margin:0 0 12px;font-size:16px;}
            label{display:block;font-size:12px;font-weight:700;color:#697386;margin-bottom:4px;margin-top:10px;}
            input{width:100%;height:36px;padding:0 10px;border:1px solid #dfe4ec;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none;}
            input:focus{border-color:#2563eb;}
            .buttons{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
            button{height:34px;min-width:80px;padding:0 14px;border-radius:8px;border:1px solid #dfe4ec;background:#fff;font-weight:600;cursor:pointer;font-size:13px;}
            .primary{background:#2563eb;color:#fff;border-color:#2563eb;}
        </style>
        </head><body>
            <h3>${escapeHtml(title)}</h3>
            <label>Link Title</label>
            <input id="ttl" value="${escapeAttribute(initialTitle)}" placeholder="e.g. Google">
            <label>Link Address</label>
            <input id="url" value="${escapeAttribute(initialUrl)}" placeholder="https://example.com">
            <div class="buttons">
                <button onclick="window.close()">Cancel</button>
                <button class="primary" onclick="save()">Save</button>
            </div>
            <script>
                function save(){
                    var t = document.getElementById('ttl').value.trim();
                    var u = document.getElementById('url').value.trim();
                    if (!u){ alert('Please enter a URL.'); return; }
                    if (window.opener && window.opener.__linkCallback){
                        window.opener.__linkCallback(t, u);
                    }
                    window.close();
                }
            <\/script>
        </body></html>
    `);
    w.document.close();
    window.__linkCallback = function(t, u){ onSave(t, u); delete window.__linkCallback; };
}

function editGlobalLinkAt(index){

    openLinkPopup("Edit Link", link.title, link.url, (title, url) => {

        markChanged();
        renderGlobalLinks();

function removeGlobalLinkAt(index){

    if (!confirm("Remove this link?")) return;
    globalLinks.splice(index, 1);

    showToast("Link removed.", "success");
}

function openCategoryMenuForNote(noteId){
    const note = getNote(noteId);
    if (!note) return;

    const menu = ["0 = Uncat"];
    db.categories.forEach((c, i) => menu.push((i+1) + " = " + getCategoryPath(c.id)));

    const choice = prompt(
        "Assign Category:\n" + menu.join("\n") +
        "\n\nEnter number, or C=New root, S=Sister, H=Child:",
        ""
    );
    if (choice === null) return;
    const trimmed = choice.trim();

    if (trimmed.toLowerCase() === "c"){
        const name = prompt("New root category name:");
        if (!name || !name.trim()) return;
        const cat = { id: generateId("cat"), name: name.trim(), parentId: null };
        db.categories.push(cat);
        note.categoryId = cat.id;
    } else if (trimmed.toLowerCase() === "s"){
        const name = prompt("New sister category name:");
        if (!name || !name.trim()) return;
        const current = db.categories.find(c => c.id === note.categoryId);
        const parentId = current ? (current.parentId || null) : null;
        const cat = { id: generateId("cat"), name: name.trim(), parentId };
        db.categories.push(cat);
        note.categoryId = cat.id;
    } else if (trimmed.toLowerCase() === "h"){
        const name = prompt("New child category name:");
        if (!name || !name.trim()) return;
        const parentId = note.categoryId || null;
        const cat = { id: generateId("cat"), name: name.trim(), parentId };
        db.categories.push(cat);
        note.categoryId = cat.id;
    } else {
        const idx = parseInt(trimmed, 10);
        if (idx === 0) note.categoryId = null;
        else if (idx >= 1 && idx <= db.categories.length) note.categoryId = db.categories[idx - 1].id;
        else { showToast("Invalid choice.", "error"); return; }
    }

    note.modifiedAt = new Date().toISOString();
    markChanged();
    refreshUI();
}

function countWords(text){
    if (!text) return 0;
    return text.trim().split(/\s+/).filter(Boolean).length;
}

function countSiblingNotes(noteId, categoryId){
    let count = 0;
    db.notes.forEach(n => {
        if (!n.deleted && n.id !== noteId && n.categoryId === categoryId) count++;
    });
    return count;
}

function getCategoryDepth(catId){
    let depth = 0;
    let current = db.categories.find(c => c.id === catId);
    const guard = new Set();
    while (current && !guard.has(current.id)){
        guard.add(current.id);
        depth++;
        current = current.parentId ? db.categories.find(c => c.id === current.parentId) : null;
    }
    return depth;
}

function daysBetween(d1, d2){
    const ms = Math.abs(d2 - d1);
    return Math.floor(ms / (1000 * 60 * 60 * 24));
}

function relativeTime(value){
    if (!value) return "—";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "—";
    const sec = Math.floor((Date.now() - date.getTime()) / 1000);
    if (sec < 60) return sec + "s ago";
    const min = Math.floor(sec / 60);
    if (min < 60) return min + " min ago";
    const hrs = Math.floor(min / 60);
    if (hrs < 24) return hrs + " hr ago";
    const days = Math.floor(hrs / 24);
    if (days < 30) return days + " days ago";
    const months = Math.floor(days / 30);
    if (months < 12) return months + " months ago";
    const years = Math.floor(months / 12);
    return years + " years ago";
}

/* =========================================================
   EXPORT DIALOG (P15: QR / Print / Copy / PDF)
   ========================================================= */
function openExportDialog(noteId){
    const note = getNote(noteId);
    if (!note) return;
    const choice = prompt(
        "Export as:\n1 = Copy to Clipboard\n2 = Print\n3 = PDF\n4 = QR Code",
        "1"
    );
    if (choice === null) return;
    if (choice === "1"){
        const text = note.title + "\n\n" + note.content;
        navigator.clipboard.writeText(text).then(() => {
            showToast("Copied to clipboard.", "success");
        }).catch(() => {
            showToast("Copy failed.", "error");
        });
    } else if (choice === "2"){
        const w = window.open("", "_blank");
        w.document.write(`<pre style="font-family:Arial;padding:20px;white-space:pre-wrap;">${escapeHtml(note.title)}\n\n${escapeHtml(note.content)}</pre>`);
        w.document.close();
        w.print();
    } else if (choice === "3"){
        showToast("Use browser Print → Save as PDF.", "normal");
        const w = window.open("", "_blank");
        w.document.write(`<pre style="font-family:Arial;padding:20px;white-space:pre-wrap;">${escapeHtml(note.title)}\n\n${escapeHtml(note.content)}</pre>`);
        w.document.close();
        setTimeout(() => w.print(), 300);
    } else if (choice === "4"){
        const url = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(note.title + "\n" + note.content.slice(0, 500));
        window.open(url, "_blank");
    }
}

/* =========================================================
   RENDER CATEGORIES
   ========================================================= */
function renderCategories(){
    const container = document.getElementById("categoryList");
    const usedIds = new Set();

    db.notes.forEach(note => {
        if (note.deleted) return;
        if (note.categoryId){
            let current = db.categories.find(c => c.id === note.categoryId);
            const guard = new Set();
            while (current && !guard.has(current.id)){
                guard.add(current.id);
                usedIds.add(current.id);
                current = db.categories.find(c => c.id === current.parentId);
            }
        }
    });

    const roots = db.categories.filter(c => !c.parentId && usedIds.has(c.id));

    if (!roots.length){
        container.innerHTML = `<div class="sidebar-subtitle">No categories in use</div>`;
        return;
    }

    container.innerHTML = roots.map(cat => renderCategoryTree(cat, usedIds)).join("");
}

function renderCategoryTree(cat, usedIds){
    if (!usedIds.has(cat.id)) return "";
    const children = db.categories.filter(c => c.parentId === cat.id && usedIds.has(c.id));
    const count = countCategoryNotes(cat.id);
    const hasChildren = children.length > 0;
    const childrenHtml = hasChildren
        ? `<div class="tree-children" style="margin-left:14px;display:none;" id="catChildren-${cat.id}">${children.map(c => renderCategoryTree(c, usedIds)).join("")}</div>`
        : "";

    const expander = hasChildren
        ? `<button class="cat-expander" onclick="event.stopPropagation(); toggleCatNode('${cat.id}', this)">+</button>`
        : `<span style="width:18px;display:inline-block;"></span>`;

    return `
        <div class="cat-row" style="padding-left:22px;">
            ${expander}
            <span class="sidebar-icon">📁</span>
            <span class="sidebar-label" onclick="setCategoryView('${cat.id}')" style="cursor:pointer;">${escapeHtml(cat.name)}</span>
            <span class="sidebar-count">${count}</span>
            <div class="cat-row-btns">
                <button class="sidebar-ctrl" title="Rename" onclick="event.stopPropagation(); renameCategory('${cat.id}')">✎</button>
                <button class="sidebar-ctrl danger" title="Remove" onclick="event.stopPropagation(); removeCategory('${cat.id}')">🗑</button>
            </div>
        </div>
        ${childrenHtml}
    `;
}

function toggleCatNode(catId, btn){
    const el = document.getElementById("catChildren-" + catId);
    if (!el) return;
    if (el.style.display === "none"){
        el.style.display = "block";
        btn.textContent = "−";
    } else {
        el.style.display = "none";
        btn.textContent = "+";
    }
}

function countCategoryNotes(catId){
    let count = 0;
    db.notes.forEach(note => {
        if (note.deleted || !note.categoryId) return;
        if (note.categoryId === catId){ count++; return; }
        if (isDescendantOf(note.categoryId, catId)) count++;
    });
    return count;
}

function isDescendantOf(catId, ancestorId){
    let current = db.categories.find(c => c.id === catId);
    const guard = new Set();
    while (current && current.parentId && !guard.has(current.id)){
        guard.add(current.id);
        if (current.parentId === ancestorId) return true;
        current = db.categories.find(c => c.id === current.parentId);
    }
    return false;
}

function getCategoryPath(catId){
    if (!catId) return "";
    const parts = [];
    let current = db.categories.find(c => c.id === catId);
    const guard = new Set();
    while (current && !guard.has(current.id)){
        guard.add(current.id);
        parts.unshift(current.name);
        current = db.categories.find(c => c.id === current.parentId);
    }
    return parts.join(" / ");
}

function renameCategory(id){
    const cat = db.categories.find(c => c.id === id);
    if (!cat) return;
    const name = prompt("Rename category:", cat.name);
    if (!name || !name.trim()) return;
    cat.name = name.trim();
    markChanged();
    renderSidebar();
    refreshUI();
}

function removeCategory(id){
    const cat = db.categories.find(c => c.id === id);
    if (!cat) return;
    if (!confirm("Remove this category? Its notes will be reassigned to the parent category (or Uncat).")) return;

    const parentId = cat.parentId || null;

    db.notes.forEach(note => {
        if (note.categoryId === id){
            note.categoryId = parentId;
            note.modifiedAt = new Date().toISOString();
        }
    });

    const toRemove = new Set([id]);
    let changed = true;
    while (changed){
        changed = false;
        db.categories.forEach(c => {
            if (c.parentId && toRemove.has(c.parentId) && !toRemove.has(c.id)){
                toRemove.add(c.id);
                changed = true;
            }
        });
    }

    db.categories = db.categories.filter(c => !toRemove.has(c.id));
    markChanged();
    renderSidebar();
    refreshUI();
    showToast("Category removed. Notes kept.", "success");
}

/* =========================================================
   TAGS
   ========================================================= */
function renderTags(){
    const container = document.getElementById("tagList");
    const used = new Set();

    db.notes.forEach(note => {
        if (note.deleted) return;
        note.tags.forEach(t => {
            if (t === "Bin") return;
            used.add(t);
        });
    });

    const sorted = [...used].sort((a,b) => a.localeCompare(b));

    document.getElementById("tagCountTotal").textContent = sorted.length;

    if (!sorted.length){
        container.innerHTML = `<div class="sidebar-subtitle" style="display:none;">No tags</div>`;
        return;
    }

    container.innerHTML = sorted.map(tag => {
        const count = db.notes.filter(n => !n.deleted && n.tags.includes(tag)).length;
        return `
            <div class="sidebar-item" style="padding-left:22px;">
                <span class="sidebar-icon">🏷️</span>
                <span class="sidebar-label" onclick="setTagView('${escapeAttribute(tag)}')" style="cursor:pointer;">${escapeHtml(tag)}</span>
                <span class="sidebar-count">${count}</span>
                <div class="sidebar-controls">
                    <button class="sidebar-ctrl" title="Rename" onclick="event.stopPropagation(); renameTag('${escapeAttribute(tag)}')">✎</button>
                    <button class="sidebar-ctrl danger" title="Remove" onclick="event.stopPropagation(); removeTagEverywhere('${escapeAttribute(tag)}')">🗑</button>
                </div>
            </div>
        `;
    }).join("");
}

function renameTag(tag){
    const newName = prompt("Rename tag:", tag);
    if (!newName || !newName.trim()) return;
    const clean = newName.trim();
    db.notes.forEach(note => {
        note.tags = note.tags.map(t => t === tag ? clean : t);
        note.modifiedAt = new Date().toISOString();
    });
    db.tags = db.tags.map(t => t === tag ? clean : t);
    markChanged();
    refreshUI();
    showToast("Tag renamed.", "success");
}

function removeTagEverywhere(tag){
    if (!confirm("Remove tag '" + tag + "' from all notes? Notes will NOT be deleted.")) return;
    db.notes.forEach(note => {
        if (note.tags.includes(tag)){
            note.tags = note.tags.filter(t => t !== tag);
            note.modifiedAt = new Date().toISOString();
        }
    });
    db.tags = db.tags.filter(t => t !== tag);
    markChanged();
    refreshUI();
    showToast("Tag removed. Notes kept.", "success");
}

        const cat = db.categories.find(c => c.id === currentCategoryId);
        title.textContent = cat ? cat.name : "Category";
    }
    else if (currentView === "tag") title.textContent = "Tag: " + currentTagName;
}

/* =========================================================
   FILTER / SORT
   ========================================================= */
function getVisibleNotes(){
    let notes = [...db.notes];

    if (currentView === "trash"){
        notes = notes.filter(n => n.deleted && !n.trashHidden);
    } else {
        notes = notes.filter(n => !n.deleted);
    }

    if (currentView === "favorites") notes = notes.filter(n => n.favorite);
    if (currentView === "cat") notes = notes.filter(n => n.categoryId);
    if (currentView === "uncat") notes = notes.filter(n => !n.categoryId);

    if (currentView === "category"){
        notes = notes.filter(n =>
            n.categoryId === currentCategoryId ||
            (n.categoryId && isDescendantOf(n.categoryId, currentCategoryId))
        );
    }

    if (currentView === "tag"){
        notes = notes.filter(n => n.tags.includes(currentTagName));
    }

    if (searchText){
        const q = searchText.toLowerCase();
        notes = notes.filter(n => {
            const cat = getCategoryPath(n.categoryId);
            return (
                n.title.toLowerCase().includes(q) ||
                n.content.toLowerCase().includes(q) ||
                cat.toLowerCase().includes(q) ||
                n.tags.join(" ").toLowerCase().includes(q)
            );
        });
    }

    return sortNotes(notes);
}

function sortNotes(notes){
    const s = db.settings.sorting;
    if (s === "Alphabetical") return notes.sort((a,b) => a.title.localeCompare(b.title));
    if (s === "Newest") return notes.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    if (s === "Oldest") return notes.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
    return notes.sort((a,b) => new Date(b.modifiedAt) - new Date(a.modifiedAt));
}

function changeSortFromBar(value){
    db.settings.sorting = value;
    markChanged();
    renderNoteList();
}

/* =========================================================
   RENDER NOTE LIST
   ========================================================= */
function renderNoteList(){
    const container = document.getElementById("noteList");
    let notes = getVisibleNotes();

    document.getElementById("listCount").textContent = notes.length;

    const perPage = db.settings.notesPerPage;
    let pages = 1;
    if (perPage !== "All"){
        const n = Number(perPage);
        pages = Math.max(1, Math.ceil(notes.length / n));
        currentPage = Math.min(currentPage, pages);
        const start = (currentPage - 1) * n;
        notes = notes.slice(start, start + n);
    } else {
        currentPage = 1;
    }

    if (!notes.length){
        container.innerHTML = `<div class="empty">No notes found.</div>`;
        renderPagination(1);
        return;
    }

    container.innerHTML = notes.map(note => renderNoteRow(note)).join("");
    renderPagination(pages);
}

function renderNoteRow(note){
    const previewLen = db.settings.contentPreviewLength || 60;
    const contentPreview = note.content.replace(/\s+/g, " ").trim().slice(0, previewLen);
    const lastCat = note.categoryId ? (db.categories.find(c => c.id === note.categoryId) || {}).name || "" : "";
    const date = formatDateTime(note.modifiedAt);
    const relTime = relativeTime(note.modifiedAt);
    const isMs = selectedIds.has(note.id);
    const isTrash = currentView === "trash";

    /* Tags preview: max 5, then "..." */
    const filteredTags = note.tags.filter(t => t !== "Bin");
    const tagsShown = filteredTags.slice(0, 5);
    const tagsMore = filteredTags.length > 5 ? " ..." : "";
    const tagsPreview = tagsShown.map(t => `<span class="meta-chip">🏷️ ${escapeHtml(t)}</span>`).join(" ");

    const lineCount = db.settings.noteLineCount || 3;

    if (isTrash){
        return `
            <div class="note-row has-checkbox ${isMs ? "ms-selected" : ""}" onclick="selectNote('${note.id}')">
                <div class="note-marker" style="--note-color:${escapeAttribute(note.color)}"></div>
                <div class="note-row-body">
                    <div class="note-line1">
                        <span class="note-line1-title">${escapeHtml(note.title)}</span>
                        ${lineCount >= 2 ? `<span class="note-line1-content">${escapeHtml(contentPreview || "No content")}</span>` : ""}
                    </div>
                    ${lineCount >= 3 ? `<div class="note-line2">
                        ${lastCat ? `<span class="meta-chip">📁 ${escapeHtml(lastCat)}</span>` : `<span class="meta-chip" style="color:var(--muted);">📁 Uncat</span>`}
                        ${tagsPreview || ""}${tagsMore}
                    </div>` : ""}
                    ${lineCount >= 4 ? `<div class="note-line3">🕒 ${escapeHtml(date)} (${escapeHtml(relTime)})</div>` : (lineCount === 3 ? `<div class="note-line3">🕒 ${escapeHtml(date)} (${escapeHtml(relTime)})</div>` : "")}
                </div>
                <div class="note-row-right">
                    <button class="row-icon-btn success" title="Restore" onclick="event.stopPropagation(); restoreNote('${note.id}')">↩</button>
                    <button class="row-icon-btn danger" title="Permanent Delete" onclick="event.stopPropagation(); permanentDeleteNote('${note.id}')">🗑</button>
                </div>
            </div>
        `;
    }

    return `
        <div class="note-row has-checkbox ${selectedNoteId === note.id ? "active" : ""} ${isMs ? "ms-selected" : ""}"
             onclick="selectNote('${note.id}')"
             oncontextmenu="event.preventDefault(); showContextMenu(event, '${note.id}');">
            <div class="note-marker" style="--note-color:${escapeAttribute(note.color)}"></div>
            <div class="note-row-body">
                <div class="note-line1">
                    <span class="note-line1-title">${escapeHtml(note.title)}</span>
                    ${lineCount >= 2 ? `<span class="note-line1-content">${escapeHtml(contentPreview || "No content")}</span>` : ""}
                </div>
                ${lineCount >= 3 ? `<div class="note-line2">
                    ${lastCat ? `<span class="meta-chip">📁 ${escapeHtml(lastCat)}</span>` : `<span class="meta-chip" style="color:var(--muted);">📁 Uncat</span>`}
                    ${tagsPreview || ""}${tagsMore}
                </div>` : ""}
                ${lineCount >= 4 ? `<div class="note-line3">🕒 ${escapeHtml(date)} (${escapeHtml(relTime)})</div>` : (lineCount === 3 ? `<div class="note-line3">🕒 ${escapeHtml(date)} (${escapeHtml(relTime)})</div>` : "")}
            </div>
            <div class="note-row-right">
                <button class="row-icon-btn ${note.pinned ? "pin-on" : ""}" title="${note.pinned ? "Unpin" : "Pin"}" onclick="event.stopPropagation(); togglePinned('${note.id}')">📌</button>
                <button class="row-icon-btn ${note.favorite ? "fav-on" : ""}" title="${note.favorite ? "Unfavorite" : "Favorite"}" onclick="event.stopPropagation(); toggleFavorite('${note.id}')">${note.favorite ? "★" : "☆"}</button>
            </div>
        </div>
    `;
}

/* =========================================================

function showContextMenu(event, noteId){
    event.preventDefault();
    const menu = document.getElementById("contextMenu");
    menu.innerHTML = `
        <button onclick="ctxDuplicate('${noteId}')">⎘ Duplicate</button>
        <button onclick="ctxTogglePin('${noteId}')">📌 Toggle Pin</button>
        <button onclick="ctxToggleFav('${noteId}')">⭐ Toggle Favorite</button>
        <button onclick="ctxExport('${noteId}')">↗ Export</button>
        <button style="color:#dc2626;" onclick="ctxDelete('${noteId}')">🗑 Delete</button>
    `;
    menu.style.left = event.pageX + "px";
    menu.style.top = event.pageY + "px";
    menu.classList.add("show");
}

document.addEventListener("click", (e) => {
    const menu = document.getElementById("contextMenu");
    if (menu && !menu.contains(e.target)) menu.classList.remove("show");
});

function ctxDuplicate(id){ duplicateNote(id); closeCtx(); }
function ctxTogglePin(id){ togglePinned(id); closeCtx(); }
function ctxToggleFav(id){ toggleFavorite(id); closeCtx(); }
function ctxExport(id){ openExportDialog(id); closeCtx(); }
function ctxDelete(id){ deleteNote(id); closeCtx(); }
function closeCtx(){ document.getElementById("contextMenu").classList.remove("show"); }

/* =========================================================
   PAGINATION
   ========================================================= */
function renderPagination(pages){
    const container = document.getElementById("pagination");
    if (pages <= 1){ container.style.display = "none"; return; }
    container.style.display = "flex";
    container.innerHTML = `
        <button onclick="changePage(-1)" ${currentPage <= 1 ? "disabled" : ""}>Prev</button>
        <span style="font-size:12px;">${currentPage} / ${pages}</span>
        <button onclick="changePage(1)" ${currentPage >= pages ? "disabled" : ""}>Next</button>
    `;
}

function changePage(delta){
    currentPage += delta;
    renderNoteList();
}

/* =========================================================
   RECYCLE BIN ACTIONS
   ========================================================= */
function renderBinToolbar(){
    const wrap = document.getElementById("binToolbarWrap");
    if (!wrap) return;
    if (currentView !== "trash"){
        wrap.innerHTML = "";
        return;
    }
    const total = db.notes.filter(n => n.deleted && !n.trashHidden).length;
    const selCount = selectedIds.size;
    wrap.innerHTML = `
        <div class="bin-toolbar">
            <button class="ctrl-btn success" onclick="binRestoreSelected()" ${selCount ? "" : "disabled"}>↩ Restore</button>
            <button class="ctrl-btn danger" onclick="binPermanentDeleteSelected()" ${selCount ? "" : "disabled"}>🗑 Delete</button>
            <button class="ctrl-btn danger" onclick="emptyBin()" ${total ? "" : "disabled"}>Empty Bin</button>
            <span class="bin-toolbar-info">${selCount} of ${total} selected</span>
        </div>
    `;
}

function restoreNote(id){
    const note = getNote(id);
    if (!note) return;
    note.deleted = false;
    note.trashHidden = false;
    note.restoredCount = Number(note.restoredCount || 0) + 1;
    note.lastRestoredAt = new Date().toISOString();
    note.modifiedAt = new Date().toISOString();
    markChanged();
    refreshUI();
    showToast("Note restored.", "success");
}

function permanentDeleteNote(id){
    const note = getNote(id);
    if (!note) return;
    if (!confirm("Permanently delete '" + note.title + "'? This cannot be undone.")) return;
    db.notes = db.notes.filter(n => n.id !== id);
    selectedIds.delete(id);
    markChanged();
    refreshUI();
    showToast("Note permanently deleted.", "success");
}

function binRestoreSelected(){
    if (!selectedIds.size){ showToast("Select notes first.", "normal"); return; }
    selectedIds.forEach(id => {
        const note = getNote(id);
        if (note){
            note.deleted = false;
            note.trashHidden = false;
            note.restoredCount = Number(note.restoredCount || 0) + 1;
            note.lastRestoredAt = new Date().toISOString();
            note.modifiedAt = new Date().toISOString();
        }
    });
    selectedIds.clear();
    markChanged();
    refreshUI();
    showToast("Selected notes restored.", "success");
}

function binPermanentDeleteSelected(){
    if (!selectedIds.size){ showToast("Select notes first.", "normal"); return; }
    if (!confirm("Permanently delete " + selectedIds.size + " note(s)? This cannot be undone.")) return;
    db.notes = db.notes.filter(n => !selectedIds.has(n.id));
    selectedIds.clear();
    markChanged();
    refreshUI();
    showToast("Selected notes permanently deleted.", "success");
}

function emptyBin(){
    const deleted = db.notes.filter(n => n.deleted && !n.trashHidden);
    if (!deleted.length){ showToast("Recycle Bin is empty.", "normal"); return; }
    if (!confirm("Empty Recycle Bin? All " + deleted.length + " notes will be PERMANENTLY deleted. This cannot be undone.")) return;
    db.notes = db.notes.filter(n => !(n.deleted && !n.trashHidden));
    selectedIds.clear();
    markChanged();
    refreshUI();
    showToast("Recycle Bin emptied permanently.", "success");
}

/* =========================================================
   DELETE SELECTED (from top bar)
   ========================================================= */
function deleteSelected(){
    if (!selectedIds.size){ showToast("No notes selected.", "normal"); return; }
    if (currentView === "trash"){
        binPermanentDeleteSelected();
        return;
    }
    if (!confirm("Delete " + selectedIds.size + " selected note(s)?")) return;
    selectedIds.forEach(id => {
        const note = getNote(id);
        if (note){
            note.deleted = true;
            note.trashHidden = false;
            note.deletedAt = new Date().toISOString();
            if (db.settings.autoAssignBinTag && !note.tags.includes("Bin")) note.tags.push("Bin");
            note.modifiedAt = new Date().toISOString();
        }
    });
    selectedIds.clear();
    markChanged();
    refreshUI();
    showToast("Selected notes moved to Recycle Bin.", "success");
}

function exportDatabaseJSON(){
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "NotesManagerDB_export_" + Date.now() + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
    showToast("Exported.", "success");
}

function showDatabaseStats(){
    const active = db.notes.filter(n => !n.deleted).length;
    const deleted = db.notes.filter(n => n.deleted).length;
    const cats = db.categories.length;
    const tags = new Set();
    db.notes.forEach(n => n.tags.forEach(t => { if (t !== "Bin") tags.add(t); }));
    alert(
        "Database Stats:\n\n" +
        "Active Notes: " + active + "\n" +
        "Deleted Notes: " + deleted + "\n" +
        "Categories: " + cats + "\n" +
        "Unique Tags: " + tags.size + "\n" +
        "Global Links: " + globalLinks.length
    );
}

/* =========================================================
   APPLY SETTINGS
   ========================================================= */
function applySettings(){
    const theme = db.settings.theme;
    document.body.classList.remove("night");
    if (theme === "Night"){
        document.body.classList.add("night");
    } else if (theme === "System"){
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){
            document.body.classList.add("night");
        }
    }
    const fontSizes = { "Small":"13px", "Normal":"15px", "Large":"17px", "Extra Large":"19px" };
    document.documentElement.style.setProperty("--font-size", fontSizes[db.settings.fontSize] || "15px");

    if (db.settings.sidebarWidth){
        document.documentElement.style.setProperty("--sidebar-width", db.settings.sidebarWidth + "px");
    }
    if (db.settings.sidebarBorder !== undefined){
        document.documentElement.style.setProperty("--sidebar-border", db.settings.sidebarBorder + "px");
    }
    if (db.settings.sectionHeight){
        document.documentElement.style.setProperty("--section-height", db.settings.sectionHeight + "px");
    }
    if (db.settings.noteListBg){
        document.documentElement.style.setProperty("--note-list-bg", db.settings.noteListBg);
    }
    if (db.settings.notePanelBg){
        document.documentElement.style.setProperty("--note-panel-bg", db.settings.notePanelBg);
    }

    /* Notes visible without scroll */
    const listEl = document.getElementById("noteList");
    if (listEl){
        const visible = db.settings.notesVisibleNoScroll;
        if (visible === "All"){
            listEl.style.maxHeight = "none";
        } else {
            const rowHeight = 80;
            listEl.style.maxHeight = (Number(visible) * rowHeight) + "px";
        }
    }

    document.getElementById("trashLabel").textContent = db.trash.label || "Recycle Bin";
    updateFooter();
}

/* =========================================================
   DATE / TIME
   ========================================================= */
function formatDateTime(value){
    if (!value) return "—";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "—";
    const s = db.settings.dateTimeFormat;
    if (s === "24 Hour"){
        return date.toLocaleString(undefined, { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false });
    }
    return date.toLocaleString(undefined, { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:true });
}

function formatShortTime(value){
    if (!value) return "—";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "—";
    return date.toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit", hour12:true });
}

/* =========================================================
   UTILITIES
   ========================================================= */
function generateId(prefix){
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
}

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value){ return escapeHtml(value); }

function showToast(message, type = "normal"){
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove("show"), 2500);
}

/* =========================================================
   INIT
   ========================================================= */
function initializeApp(){
    sidebarOpen = false;
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("open");
    db = normalizeDatabase(db);
    globalLinks = Array.isArray(db.globalLinks) ? db.globalLinks : [];
    applySettings();
    renderSidebar();
    renderListTitle();
    renderNoteList();
    renderBinToolbar();
    renderDetail();
    updateSyncStatus();
    updateFooter();
    initializeGoogle();
}

if (window.matchMedia){
    const media = window.matchMedia("(prefers-color-scheme: dark)");
    media.addEventListener("change", () => {
        if (db.settings.theme === "System") applySettings();
    });
}

initializeApp();
</script>
