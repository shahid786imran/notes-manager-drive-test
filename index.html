<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Manager — Frontend Preview</title>

<style>
/* =========================================================
   NOTES MANAGER — MOBILE FIRST FRONTEND PREVIEW
   ========================================================= */

:root {
    --bg: #f1f3f5;
    --panel: #ffffff;
    --border: #dfe3e7;
    --text: #202124;
    --muted: #6b7280;
    --hover: #f6f8fa;
    --selected: #eef4ff;
    --danger: #d93025;
    --blue: #4285f4;
    --green: #34a853;
    --orange: #f9ab00;
    --purple: #8e63d2;
    --shadow: 0 2px 10px rgba(0,0,0,.06);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    min-height: 100vh;
    display: flex;
    position: relative;
}

/* =========================================================
   MOBILE SIDEBAR
   ========================================================= */

.sidebar {
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    bottom: 0;
    width: 280px;
    background: #fff;
    border-right: 1px solid var(--border);
    transform: translateX(-100%);
    transition: transform .2s ease;
    overflow-y: auto;
    box-shadow: 4px 0 15px rgba(0,0,0,.08);
}

.sidebar.open {
    transform: translateX(0);
}

.sidebar-header {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #fff;
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--border);
}

.sidebar-title {
    font-size: 18px;
    font-weight: 600;
}

.sidebar-section {
    padding: 8px 8px 14px;
}

.sidebar-item {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 42px;
    padding: 8px 42px 8px 10px;
    border-radius: 8px;
    color: #30343b;
    user-select: none;
}

.sidebar-item:hover {
    background: var(--hover);
}

.sidebar-item.active {
    background: var(--selected);
    font-weight: 600;
}

.sidebar-icon {
    width: 28px;
    flex: 0 0 28px;
}

.sidebar-count {
    margin-left: auto;
    color: var(--muted);
    font-size: 12px;
}

.sidebar-edit {
    display: none;
    position: absolute;
    right: 8px;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 5px;
    border-radius: 6px;
}

.sidebar-item:hover .sidebar-edit {
    display: block;
}

.sidebar-group-title {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 8px 6px;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .04em;
}

.tree-item {
    padding-left: 18px;
}

.tree-child {
    padding-left: 30px;
}

.tree-toggle {
    width: 20px;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 0;
}

.sidebar-overlay {
    display: none;
    position: fixed;
    z-index: 900;
    inset: 0;
    background: rgba(0,0,0,.25);
}

.sidebar.open + .sidebar-overlay {
    display: block;
}

/* =========================================================
   FIXED SHOW / HIDE BUTTON
   ========================================================= */

.sidebar-toggle {
    position: fixed;
    z-index: 1200;
    left: 10px;
    top: 10px;
    min-width: 78px;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: #fff;
    box-shadow: var(--shadow);
    color: #333;
    font-size: 14px;
}

/* =========================================================
   MAIN AREA
   ========================================================= */

.main {
    width: 100%;
    min-width: 0;
    padding-top: 58px;
}

.notes-panel {
    width: 100%;
    min-width: 0;
    padding: 10px;
}

.notes-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
}

.notes-title {
    font-size: 20px;
    font-weight: 600;
}

.notes-count {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
}

.search-box {
    width: 100%;
    height: 42px;
    padding: 0 13px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: #fff;
    outline: none;
    margin-bottom: 10px;
}

.search-box:focus {
    border-color: #a9b8ca;
}

.sort-row {
    margin-bottom: 10px;
}

.sort-select {
    width: 100%;
    height: 38px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: #333;
}

/* =========================================================
   NOTES LIST
   ========================================================= */

.notes-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.note-item {
    position: relative;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 11px 9px 15px;
    cursor: pointer;
    overflow: hidden;
    transition: background .15s ease, border-color .15s ease;
}

.note-item:hover {
    background: var(--hover);
}

.note-item.selected {
    background: var(--selected);
    border-color: #c8d8f2;
}

.note-item.pinned {
    background: #fffdfa;
}

.note-accent {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
}

.note-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 3px;
}

.note-preview {
    color: #5f6368;
    font-size: 13px;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    margin-bottom: 6px;
}

.note-meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px 8px;
    font-size: 11px;
    color: #5f6368;
    line-height: 1.3;
}

.meta-icon {
    margin-right: 2px;
}

.favorite {
    color: #9aa0a6;
}

.favorite.active {
    color: #f4b400;
}

.pin {
    color: #9aa0a6;
}

.pin.active {
    color: #d93025;
}

.note-date {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
}

/* =========================================================
   RIGHT / ACTUAL NOTE PANEL
   ========================================================= */

.note-page {
    width: 100%;
    min-width: 0;
    padding: 10px;
}

.document {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
}

.color-line {
    height: 7px;
    width: 100%;
    border-radius: 4px 4px 0 0;
    margin-bottom: 7px;
}

.card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 7px;
    box-shadow: none;
}

/* =========================================================
   ACTIONS
   ========================================================= */

.actions-card {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 7px;
}

.action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 34px;
    padding: 6px 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    color: #333;
    font-size: 12px;
}

.action-btn:hover {
    background: var(--hover);
}

/* =========================================================
   HEADING / CONTENT
   ========================================================= */

.heading-card {
    padding: 13px 14px;
}

.note-heading {
    margin: 0;
    font-size: 25px;
    line-height: 1.25;
    font-weight: 650;
}

.content-card {
    padding: 14px;
}

.note-content {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    line-height: 1.65;
}

/* =========================================================
   LINKS
   ========================================================= */

.links-card {
    padding: 9px;
}

.card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 7px;
}

.card-header-title {
    font-size: 14px;
    font-weight: 600;
}

.small-btn {
    min-height: 31px;
    padding: 5px 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #fff;
    font-size: 12px;
}

.links-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.link-item {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px;
    border: 1px solid #e7eaed;
    border-radius: 6px;
    min-width: 0;
}

.link-info {
    flex: 1;
    min-width: 0;
}

.link-name {
    font-size: 12px;
    font-weight: 600;
}

.link-url {
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.open-link {
    border: 0;
    background: transparent;
    color: var(--blue);
    font-size: 11px;
}

/* =========================================================
   METADATA
   ========================================================= */

.metadata-card {
    padding: 9px;
}

.metadata-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
}

.metadata-row {
    display: grid;
    grid-template-columns: 135px 1fr;
    gap: 8px;
    padding: 5px 2px;
    border-bottom: 1px solid #eef0f2;
    font-size: 12px;
}

.metadata-row:last-child {
    border-bottom: 0;
}

.metadata-label {
    color: var(--muted);
}

.metadata-value {
    word-break: break-word;
}

/* =========================================================
   MENUS / MODALS
   ========================================================= */

.menu {
    position: fixed;
    z-index: 3000;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 5px 18px rgba(0,0,0,.12);
    min-width: 170px;
    padding: 5px;
    display: none;
}

.menu.show {
    display: block;
}

.menu button {
    display: block;
    width: 100%;
    border: 0;
    background: transparent;
    text-align: left;
    padding: 9px 10px;
    border-radius: 6px;
    font-size: 12px;
}

.menu button:hover {
    background: var(--hover);
}

.modal-backdrop {
    position: fixed;
    z-index: 4000;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 15px;
    background: rgba(0,0,0,.25);
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 430px;
    background: #fff;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 15px;
}

.modal h3 {
    margin: 0 0 12px;
    font-size: 17px;
}

.form-group {
    margin-bottom: 10px;
}

.form-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
}

.form-group input,
.form-group select {
    width: 100%;
    min-height: 38px;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 12px;
}

.primary {
    background: #202124;
    color: #fff;
    border-color: #202124;
}

/* =========================================================
   EMPTY STATE
   ========================================================= */

.empty-state {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 25px 15px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
}

/* =========================================================
   TABLET
   ========================================================= */

@media (min-width: 700px) {

    .main {
        padding-top: 58px;
    }

    .notes-panel {
        max-width: 700px;
        margin: 0 auto;
    }

    .note-page {
        max-width: 700px;
        margin: 0 auto;
    }
}

/* =========================================================
   DESKTOP — THREE PANELS
   ========================================================= */

@media (min-width: 1050px) {

    .sidebar {
        position: fixed;
        transform: translateX(-100%);
        width: 255px;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .main {
        padding-top: 0;
        display: grid;
        grid-template-columns: minmax(260px, 31%) minmax(420px, 69%);
        min-height: 100vh;
        width: 100%;
    }

    .notes-panel {
        max-width: none;
        margin: 0;
        border-right: 1px solid var(--border);
        padding: 14px;
        overflow-y: auto;
        height: 100vh;
    }

    .note-page {
        max-width: none;
        margin: 0;
        padding: 14px;
        height: 100vh;
        overflow-y: auto;
    }

    .document {
        max-width: 820px;
    }

    .sidebar-toggle {
        top: 12px;
        left: 12px;
    }

    .notes-panel {
        padding-top: 58px;
    }

    .note-page {
        padding-top: 58px;
    }

    .metadata-grid {
        grid-template-columns: 1fr 1fr;
        column-gap: 14px;
    }

    .metadata-row {
        grid-template-columns: 110px 1fr;
    }
}

/* =========================================================
   PRINT
   ========================================================= */

@media print {

    body {
        background: #fff;
    }

    .sidebar,
    .sidebar-toggle,
    .sidebar-overlay,
    .notes-panel,
    .actions-card,
    .open-link {
        display: none !important;
    }

    .main {
        display: block !important;
        padding: 0 !important;
    }

    .note-page {
        padding: 0 !important;
        height: auto !important;
        overflow: visible !important;
    }

    .document {
        max-width: none;
        width: 100%;
    }

    .card {
        border: 1px solid #ddd;
        box-shadow: none;
        break-inside: avoid;
    }

    .color-line {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <div class="sidebar-title">Notes Manager</div>
        </div>

        <div class="sidebar-section">

            <div class="sidebar-item active" data-section="All Notes">
                <span class="sidebar-icon">📝</span>
                <span>All Notes</span>
                <span class="sidebar-count" id="allCount">6</span>
                <button class="sidebar-edit" type="button">✏️</button>
            </div>

            <div class="sidebar-item" data-section="Favorites">
                <span class="sidebar-icon">⭐</span>
                <span>Favorites</span>
                <span class="sidebar-count" id="favoriteCount">3</span>
                <button class="sidebar-edit" type="button">✏️</button>
            </div>

            <div class="sidebar-group-title">Categories</div>

            <div class="sidebar-item tree-item">
                <button class="tree-toggle" type="button">▸</button>
                <span class="sidebar-icon">📁</span>
                <span>Projects</span>
                <span class="sidebar-count">3</span>
                <button class="sidebar-edit" type="button">✏️</button>
            </div>

            <div class="sidebar-item tree-item">
                <button class="tree-toggle" type="button">▸</button>
                <span class="sidebar-icon">📁</span>
                <span>Personal</span>
                <span class="sidebar-count">1</span>
                <button class="sidebar-edit" type="button">✏️</button>
            </div>

            <div class="sidebar-item tree-item">
                <button class="tree-toggle" type="button">▸</button>
                <span class="sidebar-icon">📁</span>
                <span>Technology</span>
                <span class="sidebar-count">2</span>
                <button class="sidebar-edit" type="button">✏️</button>
            </div>

            <div class="sidebar-group-title">Tags</div>

            <div class="sidebar-item">
                <span class="sidebar-icon">🏷️</span>
                <span>Important</span>
                <span class="sidebar-count">3</span>
                <button class="sidebar-edit" type="button">✏️</button>
            </div>

            <div class="sidebar-item">
                <span class="sidebar-icon">🏷️</span>
                <span>Development</span>
                <span class="sidebar-count">2</span>
                <button class="sidebar-edit" type="button">✏️</button>
            </div>

            <div class="sidebar-item">
                <span class="sidebar-icon">🏷️</span>
                <span>Work</span>
                <span class="sidebar-count">2</span>
                <button class="sidebar-edit" type="button">✏️</button>
            </div>

            <div class="sidebar-item">
                <span class="sidebar-icon">☑️</span>
                <span>Checklist</span>
                <button class="sidebar-edit" type="button">✏️</button>
            </div>

            <div class="sidebar-item">
                <span class="sidebar-icon">🗑️</span>
                <span>Recycle Bin</span>
                <span class="sidebar-count">2</span>
                <button class="sidebar-edit" type="button">✏️</button>
            </div>

            <div class="sidebar-item">
                <span class="sidebar-icon">⚙️</span>
                <span>Settings</span>
                <button class="sidebar-edit" type="button">✏️</button>
            </div>

        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- =====================================================
         FIXED SHOW / HIDE
         ===================================================== -->

    <button class="sidebar-toggle" id="sidebarToggle">
        ☰ Show
    </button>

    <!-- =====================================================
         MAIN AREA
         ===================================================== -->

    <main class="main">

        <!-- =================================================
             CENTER NOTES LIST
             ================================================= -->

                        ⋮ More

                    <div class="note-content" id="noteContent"></div>

                            ➕ Add

                    </div>

                        id="linksList"

                    <div class="card-header">
                        <div class="card-header-title">

                    </div>

                        id="metadataGrid"

    </main>

</div>

<!-- =========================================================
     CATEGORY MENU
     ========================================================= -->

</div>

<!-- =========================================================
     MORE MENU

</div>

     LINK ADD MENU
     ========================================================= -->

<div class="menu" id="linkMenu">

<!-- =========================================================
     LINK MODAL
     ========================================================= -->

<div class="modal-backdrop" id="linkModalBackdrop">

    <div class="modal">

        <h3 id="linkModalTitle">
            Add Link
        </h3>

        <div class="form-group">
            <label>Link Name</label>
            <input id="linkNameInput" type="text">

        <div class="form-group">
            <label>Link Text / URL</label>
            <input id="linkUrlInput" type="text">

        <div class="modal-actions">

            <button
                class="small-btn"
                id="cancelLinkBtn"
            >
                Cancel
            </button>

            <button
                class="small-btn primary"
                id="saveLinkBtn"
            >
                Save / Add
            </button>

        </div>

    </div>

</div>

<!-- =========================================================
     GOOGLE FILE PREVIEW MODAL
     ========================================================= -->

<div class="modal-backdrop" id="googleFileBackdrop">

    <div class="modal">

let selectedNoteId = notes[0].id;
let currentSection = "All Notes";

/* =========================================================
   ELEMENTS
   ========================================================= */

const sidebar = document.getElementById("sidebar");
const sidebarToggle = document.getElementById("sidebarToggle");
const sidebarOverlay = document.getElementById("sidebarOverlay");

const notesList = document.getElementById("notesList");
const searchInput = document.getElementById("searchInput");
const sortSelect = document.getElementById("sortSelect");

const sectionTitle = document.getElementById("sectionTitle");
const notesCount = document.getElementById("notesCount");

const noteColorLine = document.getElementById("noteColorLine");
const noteHeading = document.getElementById("noteHeading");
const noteContent = document.getElementById("noteContent");
const linksList = document.getElementById("linksList");
const metadataGrid = document.getElementById("metadataGrid");

const favoriteBtn = document.getElementById("favoriteBtn");
const pinBtn = document.getElementById("pinBtn");

/* =========================================================
   SIDEBAR SHOW / HIDE
   ========================================================= */

function openSidebar() {
    sidebar.classList.add("open");
    sidebarToggle.textContent = "✕ Hide";
}

function closeSidebar() {
    sidebar.classList.remove("open");
    sidebarToggle.textContent = "☰ Show";
}

sidebarToggle.addEventListener("click", () => {
    if (sidebar.classList.contains("open")) {
        closeSidebar();
    } else {
        openSidebar();
    }
});

sidebarOverlay.addEventListener("click", closeSidebar);

/* =========================================================
   HELPERS
   ========================================================= */

function formatDate(value) {
    const d = new Date(value);

    return d.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    }) + " · " +
    d.toLocaleTimeString("en-US", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
    });
}

function wordCount(text) {
    return text.trim()
        ? text.trim().split(/\s+/).length
        : 0;
}

function getVisibleNotes() {

    let result = [...notes];

    if (currentSection === "Favorites") {
        result = result.filter(n => n.favorite);
    }

    const query = searchInput.value.trim().toLowerCase();

    if (query) {
        result = result.filter(n =>
            n.title.toLowerCase().includes(query) ||
            n.content.toLowerCase().includes(query) ||
            n.category.toLowerCase().includes(query) ||
            n.tags.some(tag => tag.toLowerCase().includes(query))
        );
    }

    switch (sortSelect.value) {

        case "modified":
            result.sort(
                (a, b) =>
                    new Date(b.modified) - new Date(a.modified)
            );
            break;

        case "newest":
            result.sort(
                (a, b) =>
                    new Date(b.created) - new Date(a.created)
            );
            break;

        case "oldest":
            result.sort(
                (a, b) =>
                    new Date(a.created) - new Date(b.created)
            );
            break;

        case "alphabetical":
            result.sort(
                (a, b) =>
                    a.title.localeCompare(b.title)
            );
            break;
    }

    return result;
}

/* =========================================================
   RENDER NOTES
   ========================================================= */

function renderNotes() {

    const visible = getVisibleNotes();

    sectionTitle.textContent = currentSection;

    notesCount.textContent =
        `${visible.length} ${visible.length === 1 ? "Note" : "Notes"}`;

    notesList.innerHTML = "";

    if (!visible.length) {
        notesList.innerHTML = `
            <div class="empty-state">
                No notes found.
            </div>
        `;
        return;
    }

    visible.forEach(note => {

        const item = document.createElement("div");

        item.className =
            "note-item" +
            (note.id === selectedNoteId ? " selected" : "") +
            (note.pinned ? " pinned" : "");

        item.innerHTML = `

            <div
                class="note-accent"
                style="background:${note.categoryColor}"
            ></div>

            <div class="note-title">
                ${escapeHtml(note.title)}
            </div>

            <div class="note-preview">
                ${escapeHtml(note.content)}
            </div>

            <div class="note-meta">

                <span
                    class="pin ${note.pinned ? "active" : ""}"
                    title="${note.pinned ? "Pinned" : "Not pinned"}"
                >📌</span>

                <span
                    class="favorite ${note.favorite ? "active" : ""}"
                    title="${note.favorite ? "Favorite" : "Not favorite"}"
                >⭐</span>

                <span
                    style="color:${note.categoryColor}"
                >
                    📁 ${escapeHtml(note.category)}
                </span>

                ${
                    note.tags.length
                    ? note.tags.map(tag =>
                        `<span>🏷️ ${escapeHtml(tag)}</span>`
                    ).join("")
                    : ""
                }

            </div>

            <div class="note-date">
                ${formatDate(note.modified)}
            </div>
        `;

        item.addEventListener("click", () => {

            selectedNoteId = note.id;

            renderNotes();
            renderSelectedNote();

            if (window.innerWidth < 700) {
                closeSidebar();
            }
        });

        notesList.appendChild(item);
    });
}

/* =========================================================
   RENDER SELECTED NOTE
   ========================================================= */

function renderSelectedNote() {

    const note = notes.find(n => n.id === selectedNoteId);

    if (!note) return;

    noteColorLine.style.background = note.categoryColor;

    noteHeading.textContent = note.title;
    noteContent.textContent = note.content;

    favoriteBtn.innerHTML =
        note.favorite ? "⭐ Favorite" : "⭐ Favorite";

    pinBtn.innerHTML =
        note.pinned ? "📌 Pin" : "📌 Pin";

    renderLinks(note);
    renderMetadata(note);
}

/* =========================================================
   LINKS
   ========================================================= */

function renderLinks(note) {

    linksList.innerHTML = "";

    if (!note.links.length) {

        linksList.innerHTML = `
            <div
                style="
                    color:var(--muted);
                    font-size:11px;
                    padding:4px 2px;
                "
            >
                No links added.
            </div>
        `;

        return;
    }

    note.links.forEach(link => {

        const item = document.createElement("div");

        item.className = "link-item";

        item.innerHTML = `
            <div>${link.icon}</div>

            <div class="link-info">
                <div class="link-name">
                    ${escapeHtml(link.name)}
                </div>

                <div class="link-url">
                    ${escapeHtml(link.url)}
                </div>
            </div>

            <button
                class="open-link"
                type="button"
            >
                Open
            </button>
        `;

        item.querySelector(".open-link")
            .addEventListener("click", event => {

                event.stopPropagation();

                if (
                    link.url.startsWith("http://") ||
                    link.url.startsWith("https://")
                ) {
                    window.open(link.url, "_blank");
                } else {
                    alert("Preview: this link will be opened by the future backend-connected version.");
                }
            });

        linksList.appendChild(item);
    });
}

/* =========================================================
   METADATA
   ========================================================= */

function renderMetadata(note) {

    const rows = [

        ["Created", formatDate(note.created)],
        ["Last Modified", formatDate(note.modified)],
        ["Last Viewed", formatDate(note.viewed)],
        ["Last Synced", formatDate(note.synced)],

        ["Category", `📁 ${note.category}`],
        ["Category Path", note.categoryPath],
        ["Tags",
            note.tags.length
                ? note.tags.map(t => `🏷️ ${t}`).join(" · ")
                : "None"
        ],
        ["Status", note.status],
        ["Favorite", note.favorite ? "⭐ Yes" : "No"],
        ["Pin", note.pinned ? "📌 Yes" : "No"],
        ["Word Count", wordCount(note.content).toLocaleString()],
        ["Note Size", note.size],
        ["Links Count", note.links.length],
        ["Attachment Count", note.attachments],
        ["Total Views", note.views],
        ["Storage / Sync", "☁️ Synced"],
        ["Note ID", note.id]
    ];

    metadataGrid.innerHTML = rows.map(row => `
        <div class="metadata-row">
            <div class="metadata-label">
                ${escapeHtml(row[0])}
            </div>

            <div class="metadata-value">
                ${escapeHtml(String(row[1]))}
            </div>
        </div>
    `).join("");
}

/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* =========================================================
   SEARCH / SORT
   ========================================================= */

searchInput.addEventListener("input", renderNotes);

sortSelect.addEventListener("change", renderNotes);

/* =========================================================
   FAVORITE
   ========================================================= */

favoriteBtn.addEventListener("click", () => {

    const note = notes.find(n => n.id === selectedNoteId);

    if (!note) return;

    note.favorite = !note.favorite;

    renderNotes();
    renderSelectedNote();
});

/* =========================================================
   PIN

pinBtn.addEventListener("click", () => {

    if (!note) return;

    note.pinned = !note.pinned;

    renderNotes();
    renderSelectedNote();
});

            linkMenu,
            event.currentTarget
        );
    });

function showMenu(menu, button) {

    document.querySelectorAll(".menu")
        .forEach(m => m.classList.remove("show"));

    const rect = button.getBoundingClientRect();

    menu.style.left =
        Math.min(
            rect.left,
            window.innerWidth - menu.offsetWidth - 10
        ) + "px";

    menu.style.top =
        (rect.bottom + 5) + "px";

    menu.classList.add("show");
}

document.addEventListener("click", event => {

    if (
        !event.target.closest(".menu") &&
        !event.target.closest(".action-btn") &&
        !event.target.closest(".small-btn")
    ) {
        document.querySelectorAll(".menu")
            .forEach(m => m.classList.remove("show"));
    }
});

/* =========================================================
   CATEGORY ACTIONS
   ========================================================= */

categoryMenu.addEventListener("click", event => {

    const action = event.target.dataset.action;

    if (!action) return;

    categoryMenu.classList.remove("show");

    const messages = {
        "category-add": "Preview: Add Category",
        "category-rename": "Preview: Rename Category",
        "category-move": "Preview: Move Category",
        "category-delete": "Preview: Delete Category"
    };

    alert(messages[action]);
});

/* =========================================================
   MORE ACTIONS
   ========================================================= */

moreMenu.addEventListener("click", event => {

    const action = event.target.dataset.action;

    if (!action) return;

    moreMenu.classList.remove("show");

    if (action === "print") {
        window.print();
        return;
    }

    if (action === "duplicate") {
        alert("Preview: Duplicate Note");
        return;
    }

    if (action === "share") {
        alert("Preview: Share Note");
    }
});

/* =========================================================
   LINK ACTIONS
   ========================================================= */

const linkModalBackdrop =
    document.getElementById("linkModalBackdrop");

const googleFileBackdrop =

linkMenu.addEventListener("click", event => {

    const action = event.target.dataset.action;

    if (!action) return;

    linkMenu.classList.remove("show");

    if (
        action === "add-link" ||
        action === "other-link"
    ) {
        document.getElementById("linkModalTitle").textContent =
            action === "add-link"
                ? "Add Link"
                : "Add Other Link";

        document.getElementById("linkNameInput").value = "";
        document.getElementById("linkUrlInput").value = "";

        linkModalBackdrop.classList.add("show");
    }

    if (action === "google-file") {
        document.getElementById("googleFileName").value = "";
        googleFileBackdrop.classList.add("show");
    }
});

/* =========================================================
   SAVE LINK
   ========================================================= */

document.getElementById("saveLinkBtn")
    .addEventListener("click", () => {

        const name =
            document.getElementById("linkNameInput")
                .value.trim();

        const url =
            document.getElementById("linkUrlInput")
                .value.trim();

        if (!name || !url) {
            alert("Please enter Link Name and Link Text / URL.");
            return;
        }

        const note =
            notes.find(n => n.id === selectedNoteId);

        note.links.push({
            icon: "🔗",
            name,
            url
        });

        linkModalBackdrop.classList.remove("show");

        renderSelectedNote();
    });

document.getElementById("cancelLinkBtn")
    .addEventListener("click", () => {

        linkModalBackdrop.classList.remove("show");
    });

/* =========================================================
   GOOGLE FILE PREVIEW
   ========================================================= */

document.getElementById("saveGoogleBtn")
    .addEventListener("click", () => {

        const type =
            document.getElementById("googleFileType")
                .value;

        const name =
            document.getElementById("googleFileName")
                .value.trim();

        if (!name) {
            alert("Please enter a file name.");
            return;
        }

        const note =
            notes.find(n => n.id === selectedNoteId);

        note.links.push({
            icon: type.split(" ")[0],
            name,
            url: `${type} — Google Drive preview`
        });

        note.attachments++;

        googleFileBackdrop.classList.remove("show");

        renderSelectedNote();
    });

document.getElementById("cancelGoogleBtn")
    .addEventListener("click", () => {

        googleFileBackdrop.classList.remove("show");
    });

   ========================================================= */

   ========================================================= */

document.getElementById("colorBtn")
    .addEventListener("click", () => {

        const note =
            notes.find(n => n.id === selectedNoteId);

        const colors = [
            "#4285f4",
            "#34a853",
            "#f9ab00",
            "#8e63d2"

        const current =
            colors.indexOf(note.categoryColor);

        note.categoryColor =
            colors[(current + 1) % colors.length];

        renderNotes();
        renderSelectedNote();
    });

   ========================================================= */

        const note =

        alert(

   ========================================================= */

                event.target.closest(".sidebar-edit") ||
                event.target.closest(".tree-toggle")
            ) {
                return;
            }

            document.querySelectorAll(".sidebar-item")
                .forEach(x =>
                    x.classList.remove("active")
                );

            item.classList.add("active");

            const section =
                item.dataset.section;

            if (section) {

                currentSection = section;

                renderNotes();
            }
        });
    });

/* =========================================================

   ========================================================= */

document.querySelectorAll(".sidebar-item")
    .forEach(item => {

        item.addEventListener("touchstart", () => {

            document.querySelectorAll(".sidebar-item")
                .forEach(x => x.classList.remove("touch-selected"));

            item.classList.add("touch-selected");

        }, { passive: true });
    });

/* =========================================================
   TREE TOGGLE PREVIEW
   ========================================================= */

document.querySelectorAll(".tree-toggle")
    .forEach(toggle => {

        toggle.addEventListener("click", event => {

            event.stopPropagation();

            toggle.textContent =
                toggle.textContent === "▸"
                    ? "▾"
                    : "▸";
        });
    });

/* =========================================================
   INITIAL RENDER
   ========================================================= */

sortSelect.value = "modified";

renderNotes();
renderSelectedNote();

/*
   Sidebar intentionally starts CLOSED.
*/
closeSidebar();

</script>
