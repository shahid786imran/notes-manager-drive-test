<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes Manager</title>
<style>
:root{
    --bg:#f4f6f9;
    --surface:#ffffff;
    --surface2:#f8fafc;
    --text:#172033;
    --muted:#697386;
    --border:#dfe4ec;
    --primary:#2563eb;
    --primary2:#1d4ed8;
    --danger:#dc2626;
    --success:#15803d;
    --warning:#b45309;
    --shadow:0 8px 25px rgba(20,30,50,.08);
    --radius:12px;
    --font-size:15px;
}

*{ box-sizing:border-box; }

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    font-size:var(--font-size);
}

/* =========================================================
   APP TITLE + STATUS + BUTTONS (TOP SECTION)
   ========================================================= */

.top-area{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    box-shadow:0 2px 8px rgba(0,0,0,.04);
    padding:10px 12px;
    position:sticky;
    top:0;
    z-index:1000;
}

.app-title{
    font-size:20px;
    font-weight:800;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--primary);
    margin-bottom:8px;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ===== STATUS CARDS ROW ===== */

.status-row{
    display:flex;
    gap:8px;
    flex-wrap:nowrap;
    overflow-x:auto;
    margin-bottom:10px;
    padding-bottom:2px;
    scrollbar-width:thin;
}

.status-card{
    flex:0 0 auto;
    padding:5px 12px;
    border-radius:8px;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
    border:1px solid var(--border);
    background:var(--surface2);
    color:var(--muted);
    line-height:1.4;
}

.status-card.drive-on{
    color:#15803d;
    border-color:#bbf7d0;
    background:#f0fdf4;
}

.status-card.drive-off{
    color:#dc2626;
    border-color:#fecaca;
    background:#fef2f2;
}

.status-card.sync-on{
    color:#15803d;
    border-color:#bbf7d0;
    background:#f0fdf4;
}

.status-card.sync-off{
    color:#b45309;
    border-color:#fde68a;
    background:#fffbeb;
}

.status-card.sync-err{
    color:#dc2626;
    border-color:#fecaca;
    background:#fef2f2;
}

.status-card.last-sync{
    color:#2563eb;
    border-color:#bfdbfe;
    background:#eff6ff;
}

/* ===== TOP BUTTONS ROW ===== */

.top-buttons{
    display:flex;
    gap:6px;
    flex-wrap:nowrap;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:thin;
}

.top-buttons .btn{
    flex:0 0 auto;
    height:34px;
    min-width:72px;
    padding:0 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    color:var(--text);
    font-size:12px;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    white-space:nowrap;
    cursor:pointer;
    transition:.15s ease;
}

.top-buttons .btn:hover{ background:#f1f5f9; }

.top-buttons .btn.primary{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
}

.top-buttons .btn.primary:hover{ background:var(--primary2); }

.top-buttons .btn.danger{
    background:var(--danger);
    color:#fff;
    border-color:var(--danger);
}

.top-buttons .btn.danger:hover{ background:#b91c1c; }

.top-buttons .btn.success{
    background:var(--success);
    color:#fff;
    border-color:var(--success);
}

.top-buttons .btn.active{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
}

.btn{
    cursor:pointer;
    font:inherit;
}

button,
select,
input,
textarea{
    font:inherit;
}

/* =========================================================
   FIXED SHOW / HIDE (mobile-friendly)
   ========================================================= */

.sidebar-overlay{
    position:fixed;
    inset:0;
    z-index:1900;
    background:rgba(0,0,0,.22);
    display:none;
}

.sidebar-overlay.open{ display:block; }

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    width:290px;
    z-index:2000;
    background:var(--surface);
    border-right:1px solid var(--border);
    box-shadow:10px 0 25px rgba(0,0,0,.08);
    transform:translateX(-105%);
    transition:transform .2s ease;
    overflow-y:auto;
    padding:10px;
    padding-top:12px;
}

.sidebar.open{ transform:translateX(0); }

.sidebar-section{ margin-bottom:4px; }

.sidebar-item{
    position:relative;
    min-height:38px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 9px;
    border-radius:8px;
    cursor:pointer;
    color:var(--text);
}

.sidebar-item:hover,
.sidebar-item.active{ background:#eef2ff; }

.sidebar-icon{
    width:20px;
    text-align:center;
    flex:none;
}

.sidebar-label{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.sidebar-count{
    color:var(--muted);
    font-size:11px;
    flex:none;
}

.sidebar-divider{
    height:1px;
    background:#e2e8f0;
    margin:8px 4px;
    border:0;
}

.sidebar-controls{
    display:none;
    gap:3px;
    flex:none;
}

.sidebar-item:hover .sidebar-controls,
.sidebar-item.selected .sidebar-controls{
    display:flex;
}

.sidebar-ctrl{
    width:24px;
    height:24px;
    min-width:24px;
    padding:0;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    color:var(--text);
    font-size:11px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    cursor:pointer;
}

.sidebar-ctrl:hover{ background:#e2e8f0; }

.sidebar-ctrl.danger:hover{
    background:#fef2f2;
    border-color:#fecaca;
    color:#dc2626;
}

.sidebar-collapse{
    margin-top:3px;
    padding-left:12px;
}

.tag-list,
.category-list{ display:block; }

.sidebar-subtitle{
    padding:6px 9px;
    color:var(--muted);
    font-size:11px;
}

/* =========================================================
   MAIN
   ========================================================= */

.main{
    min-height:calc(100vh - 160px);
    padding:12px;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
}

.search-box{
    flex:1;
    min-width:180px;
}

.search-box input{
    width:100%;
    height:36px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    outline:none;
}

.search-box input:focus{ border-color:var(--primary); }

.workspace{
    display:grid;
    grid-template-columns:minmax(260px,34%) 1fr;
    gap:10px;
    min-height:calc(100vh - 220px);
}

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
}

.panel-header{
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:8px 12px;
    border-bottom:1px solid var(--border);
}

.panel-title{ font-weight:700; }

.note-list{
    max-height:calc(100vh - 260px);
    overflow-y:auto;
}

/* ===== 3-LINE NOTE ROW ===== */

.note-row{
    display:flex;
    align-items:flex-start;
    gap:9px;
    padding:9px 11px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    transition:background .12s;
}

.note-row:hover{ background:#f8fafc; }
.note-row.active{ background:#eff6ff; }

.note-marker{
    width:5px;
    min-width:5px;
    height:auto;
    align-self:stretch;
    border-radius:5px;
    background:var(--note-color,#94a3b8);
}

.note-row-body{
    flex:1;
    min-width:0;
}

.note-line1{
    display:flex;
    gap:6px;
    align-items:baseline;
    min-width:0;
}

.note-line1-title{
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:0 1 auto;
    max-width:55%;
}

.note-line1-content{
    color:var(--muted);
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1 1 auto;
    min-width:0;
}

.note-line2{
    margin-top:4px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:center;
    font-size:11px;
    color:var(--muted);
}

.note-line2 .mini-toggle{
    cursor:pointer;
    padding:2px 4px;
    border-radius:4px;
    user-select:none;
    border:1px solid transparent;
}

.note-line2 .mini-toggle:hover{
    background:#e2e8f0;
    border-color:var(--border);
}

.note-line2 .mini-toggle.on{
    color:#b45309;
    font-weight:700;
}

.note-line2 .mini-toggle.fav-on{
    color:#d97706;
    font-weight:700;
}

.note-line2 .meta-chip{
    display:inline-flex;
    align-items:center;
    gap:3px;
    max-width:120px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.note-line3{
    margin-top:4px;
    font-size:10px;
    color:var(--muted);
}

/* =========================================================
   NOTE DETAIL PANEL
   ========================================================= */

.detail{ min-width:0; }

.detail-body{
    padding:0;
}

/* Colour bar at very top of note panel */

.note-color-bar{
    height:6px;
    width:100%;
    background:var(--note-color,#94a3b8);
}

/* Control card (single row) */

.note-controls-card{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 10px;
    border-bottom:1px solid var(--border);
    background:var(--surface2);
    flex-wrap:wrap;
}

.note-controls-left{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.note-controls-right{
    display:flex;
    gap:5px;
    margin-left:auto;
    flex-wrap:wrap;
}

.ctrl-btn{
    height:30px;
    min-width:62px;
    padding:0 9px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--surface);
    color:var(--text);
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    white-space:nowrap;
}

.ctrl-btn:hover{ background:#f1f5f9; }

.ctrl-btn.primary{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
}

.ctrl-btn.danger{
    background:var(--danger);
    color:#fff;
    border-color:var(--danger);
}

.ctrl-btn.success{
    background:var(--success);
    color:#fff;
    border-color:var(--success);
}

/* Heading card */

.heading-card{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
}

.heading-input{
    width:100%;
    border:0;
    background:transparent;
    outline:none;
    font-size:22px;
    font-weight:700;
    color:var(--text);
    padding:4px 0;
}

.heading-display{
    font-size:22px;
    font-weight:700;
    line-height:1.3;
    word-break:break-word;
    min-height:28px;
}

/* Content bar with text controls */

.content-bar{
    border-bottom:1px solid var(--border);
}

.content-toolbar{
    display:flex;
    gap:4px;
    flex-wrap:wrap;
    padding:6px 10px;
    background:var(--surface2);
    border-bottom:1px solid var(--border);
    align-items:center;
}

.tool-btn{
    width:30px;
    height:28px;
    min-width:30px;
    padding:0;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    color:var(--text);
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.tool-btn:hover{ background:#e2e8f0; }

.tool-btn.wide{
    width:auto;
    min-width:auto;
    padding:0 8px;
    gap:4px;
}

.tool-sep{
    width:1px;
    height:20px;
    background:var(--border);
    margin:0 3px;
}

.content-editable{
    min-height:220px;
    padding:10px 12px;
    outline:none;
    line-height:1.6;
    word-break:break-word;
    font-size:14px;
}

.content-editable:empty:before{
    content:attr(data-placeholder);
    color:var(--muted);
}

.content-display{
    padding:10px 12px;
    white-space:pre-wrap;
    line-height:1.6;
    word-break:break-word;
    min-height:120px;
}

/* =========================================================
   LINKS CARD
   ========================================================= */

.links-card{
    margin:10px;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--surface);
}

.links-card-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 10px;
    background:var(--surface2);
    border-bottom:1px solid var(--border);
}

.links-card-title{
    font-size:12px;
    font-weight:700;
    color:var(--muted);
}

.link-item{
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px 10px;
    border-bottom:1px solid var(--border);
    font-size:12px;
}

.link-item:last-child{ border-bottom:0; }

.link-item-text{
    flex:0 0 auto;
    font-weight:600;
    max-width:35%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.link-item-url{
    flex:1 1 auto;
    color:var(--primary);
    text-decoration:none;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
}

.link-item-actions{
    display:flex;
    gap:3px;
    flex:none;
}

.link-icon-btn{
    width:24px;
    height:24px;
    min-width:24px;
    padding:0;
    border:1px solid var(--border);
    border-radius:5px;
    background:var(--surface);
    cursor:pointer;
    font-size:11px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.link-icon-btn:hover{ background:#e2e8f0; }

.link-icon-btn.danger:hover{
    background:#fef2f2;
    color:#dc2626;
}

/* =========================================================
   TAGS + CATEGORY CARD
   ========================================================= */

.tags-cat-card{
    margin:10px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    padding:10px;
}

.tags-cat-row{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:8px;
}

.tags-cat-row:last-child{ margin-bottom:0; }

.tags-cat-label{
    font-size:11px;
    font-weight:700;
    color:var(--muted);
    min-width:56px;
}

.tag-chip{
    display:inline-flex;
    align-items:center;
    gap:3px;
    border:1px solid #cbd5e1;
    border-radius:999px;
    padding:2px 8px;
    background:#f8fafc;
    font-size:11px;
}

.tag-chip .chip-x{
    cursor:pointer;
    color:#94a3b8;
    font-weight:700;
}

.tag-chip .chip-x:hover{ color:#dc2626; }

.tags-input-inline{
    flex:1;
    min-width:140px;
    height:28px;
    padding:0 8px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    outline:none;
    font-size:12px;
}

.tags-input-inline:focus{ border-color:var(--primary); }

.small-action-btn{
    height:28px;
    padding:0 8px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    color:var(--text);
    font-size:11px;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:3px;
}

.small-action-btn:hover{ background:#e2e8f0; }

.small-action-btn.primary{
    background:var(--primary);
    color:#fff;
    border-color:var(--primary);
}

/* =========================================================
   METADATA CARD (2-COLUMN BORDERED TABLE)
   ========================================================= */

.metadata-box{
    margin:10px;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--surface);
}

.metadata-title{
    padding:7px 10px;
    font-size:12px;
    font-weight:700;
    background:var(--surface2);
    border-bottom:1px solid var(--border);
    color:var(--muted);
}

.metadata-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.metadata-table td{
    padding:6px 9px;
    font-size:11px;
    line-height:1.3;
    vertical-align:top;
    border:1px solid var(--border);
    word-break:break-word;
}

.metadata-table td.label{
    width:22%;
    color:var(--muted);
    font-weight:700;
    background:var(--surface2);
}

.metadata-table td.value{
    width:28%;
    color:var(--text);
}

/* =========================================================
   EMPTY
   ========================================================= */

.empty{
    min-height:200px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    padding:20px;
    text-align:center;
    flex-direction:column;
    gap:8px;
}

/* =========================================================
   SETTINGS
   ========================================================= */

.settings-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:10px;
}

.setting{
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px;
    background:var(--surface2);
}

.setting label{
    display:block;
    margin-bottom:6px;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
}

.setting select{
    width:100%;
    height:34px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--surface);
    padding:0 7px;
}

/* =========================================================
   PAGINATION
   ========================================================= */

.pagination{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:9px;
    border-top:1px solid var(--border);
}

.pagination button{
    height:28px;
    min-width:60px;
    padding:0 8px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    cursor:pointer;
    font-size:12px;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast{
    position:fixed;
    right:15px;
    bottom:15px;
    z-index:5000;
    max-width:360px;
    padding:10px 13px;
    border-radius:8px;
    background:#172033;
    color:#fff;
    font-size:13px;
    box-shadow:0 8px 30px rgba(0,0,0,.2);
    transform:translateY(20px);
    opacity:0;
    pointer-events:none;
    transition:.2s ease;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* =========================================================
   MULTISELECT MODE
   ========================================================= */

body.multiselect .note-row{
    padding-left:36px;
    position:relative;
}

body.multiselect .note-row::before{
    content:"";
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    border:2px solid var(--border);
    border-radius:4px;
    background:var(--surface);
}

body.multiselect .note-row.ms-selected::before{
    background:var(--primary);
    border-color:var(--primary);
    content:"✓";
    color:#fff;
    font-size:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

body.multiselect .note-row.ms-selected{
    background:#eff6ff;
}

/* =========================================================
   NIGHT MODE
   ========================================================= */

body.night{
    --bg:#0f172a;
    --surface:#172033;
    --surface2:#1e293b;
    --text:#e5e7eb;
    --muted:#94a3b8;
    --border:#334155;
}

body.night .top-area,
body.night .panel,
body.night .sidebar,
body.night .editor-field,
body.night .search-box input,
body.night .btn,
body.night .ctrl-btn,
body.night .tool-btn,
body.night .link-icon-btn,
body.night .small-action-btn,
body.night .heading-input,
body.night .content-editable,
body.night .content-display,
body.night .tags-input-inline{
    background:var(--surface);
    color:var(--text);
}

body.night .metadata-title,
body.night .links-card-header,
body.night .content-toolbar,
body.night .note-controls-card{
    background:var(--surface2);
}

body.night .note-row:hover{ background:#1e293b; }
body.night .note-row.active{ background:#1e3a5f; }

body.night .status-card.drive-on,
body.night .status-card.sync-on{
    background:#14532d;
    border-color:#166534;
    color:#bbf7d0;
}

body.night .status-card.drive-off,
body.night .status-card.sync-err{
    background:#7f1d1d;

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CLIENT_ID = "262106898132-tsn94p3vvpf34do0ommc6rai2mtc5sh6.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive";
const DATABASE_NAME = "MasterDB.json";
const DATABASE_FOLDER_ID = "";

/* =========================================================
   STATE
   ========================================================= */
let accessToken = null;
let tokenClient = null;
let databaseFileId = null;
let db = createEmptyDatabase();
let selectedNoteId = null;
let editingNoteId = null;
let currentView = "all";
let currentCategoryId = null;
let currentTagName = null;
let searchText = "";
let sidebarOpen = false;
let tagOpen = true;
let currentPage = 1;
let autosaveTimer = null;
let saveInProgress = false;
let pendingChanges = false;
let lastSuccessfulSync = null;
let lastChangeTime = null;
let multiselectMode = false;
let multiselectIds = new Set();

/* =========================================================
   DEFAULT DATABASE
   ========================================================= */
function createEmptyDatabase(){
    return {
        version: 1,
        settings: {
            sidebarView: "Compact",
            theme: "System",
            fontSize: "Normal",
            sorting: "Last Modified First",
            notesPerPage: "All",
            deleteConfirmation: true,
            autosave: true,
            autosaveInterval: 5,
            dateTimeFormat: "12 Hour"
        },
        checklist: { url: "" },
        trash: { label: "Recycle Bin" },
        categories: [],
        tags: [],
        notes: [],
        meta: {
            created: new Date().toISOString(),
            updated: new Date().toISOString()
        }
    };
}

/* =========================================================
   GOOGLE AUTH
   ========================================================= */
function initializeGoogle(){
    if (typeof google === "undefined" || !google.accounts || !google.accounts.oauth2){
        showToast("Google Identity Services load نہیں ہوئی۔ Internet check کریں۔", "error");
        return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: function(response){
            if (response.error){
                console.error(response);
                showToast("Google Drive connection failed.", "error");
                return;
            }
            accessToken = response.access_token;
            setDriveConnected(true);
            showToast("Drive Connected", "success");
            loadDatabase();
        }
    });
}

function connectDrive(){
    if (!tokenClient){
        initializeGoogle();
        setTimeout(() => { if (tokenClient) requestDriveToken(); }, 300);
        return;
    }
    requestDriveToken();
}

function requestDriveToken(){
    try {
        tokenClient.requestAccessToken({ prompt: "" });
    } catch(error){
        console.error(error);
        showToast("Google Drive connection could not start.", "error");
    }
}

function setDriveConnected(value){
    const el = document.getElementById("driveStatus");
    if (value){
        el.textContent = "Drive: Connected";
        el.className = "status-card drive-on";
    } else {
        el.textContent = "Drive: Disconnected";
        el.className = "status-card drive-off";
    }
}

/* =========================================================
   DRIVE API
   ========================================================= */
async function driveRequest(url, options = {}){
    if (!accessToken) throw new Error("Google Drive is not connected.");
    const headers = new Headers(options.headers || {});
    headers.set("Authorization", "Bearer " + accessToken);
    const response = await fetch(url, { ...options, headers });
    if (!response.ok){
        const text = await response.text();
        throw new Error("Drive API " + response.status + ": " + text);
    }
    return response;
}

async function findDatabaseFile(){
    let query = "name = '" + DATABASE_NAME.replace(/'/g, "\\'") + "' and trashed = false";
    if (DATABASE_FOLDER_ID) query += " and '" + DATABASE_FOLDER_ID + "' in parents";
    const url = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(query) +
        "&spaces=drive&fields=files(id,name,mimeType,modifiedTime,parents)&pageSize=100";
    const response = await driveRequest(url);
    const data = await response.json();
    if (!data.files || !data.files.length) return null;
    return data.files[0];
}

async function createDatabaseFile(){
    const metadata = { name: DATABASE_NAME, mimeType: "application/json" };
    if (DATABASE_FOLDER_ID) metadata.parents = [DATABASE_FOLDER_ID];
    const body = JSON.stringify(db, null, 2);
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
    form.append("file", new Blob([body], { type: "application/json" }));
    const response = await driveRequest(
        "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime",
        { method: "POST", body: form }
    );
    const result = await response.json();
    databaseFileId = result.id;
    return result;
}

/* =========================================================
   LOAD DATABASE
   ========================================================= */
async function loadDatabase(){
    if (!accessToken) { connectDrive(); return; }
    try {
        setSyncStatus("Loading", "normal");
        const file = await findDatabaseFile();
        if (!file){
            db = createEmptyDatabase();
            const created = await createDatabaseFile();
            databaseFileId = created.id;
            pendingChanges = false;
            updateSyncStatus();
            setLastSync(new Date());
            showToast("New MasterDB.json created.", "success");
            refreshUI();
            return;
        }
        databaseFileId = file.id;
        const response = await driveRequest(
            "https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(file.id) + "?alt=media"
        );
        const text = await response.text();
        if (!text.trim()){
            db = createEmptyDatabase();
        } else {
            try { db = normalizeDatabase(JSON.parse(text)); }
            catch(e){ throw new Error("MasterDB.json contains invalid JSON."); }
        }
        pendingChanges = false;
        updateSyncStatus();
        lastSuccessfulSync = file.modifiedTime ? new Date(file.modifiedTime) : new Date();
        setLastSync(lastSuccessfulSync);
        applySettings();
        refreshUI();
        showToast("Database loaded from Google Drive.", "success");
    } catch(error){
        console.error(error);
        setSyncStatus("Error", "error");
        showToast(error.message, "error");
    }
}

function normalizeDatabase(data){
    const base = createEmptyDatabase();
    if (!data || typeof data !== "object") return base;
    const result = { ...base, ...data };
    result.settings = { ...base.settings, ...(data.settings || {}) };
    result.checklist = { ...base.checklist, ...(data.checklist || {}) };
    result.trash = { ...base.trash, ...(data.trash || {}) };
    result.categories = Array.isArray(data.categories) ? data.categories : [];
    result.tags = Array.isArray(data.tags) ? data.tags : [];
    result.notes = Array.isArray(data.notes) ? data.notes.map(normalizeNote) : [];
    return result;
}

function normalizeNote(note){
    const n = note || {};
    return {
        id: n.id || generateId("note"),
        title: n.title || "Untitled Note",
        content: n.content || "",
        categoryId: n.categoryId || null,
        tags: Array.isArray(n.tags) ? n.tags : [],
        links: Array.isArray(n.links) ? n.links : [],
        favorite: !!n.favorite,
        pinned: !!n.pinned,
        deleted: !!n.deleted,
        trashHidden: !!n.trashHidden,
        color: n.color || "#64748b",
        createdAt: n.createdAt || new Date().toISOString(),
        modifiedAt: n.modifiedAt || n.createdAt || new Date().toISOString(),
        lastViewedAt: n.lastViewedAt || null,
        viewCount: Number(n.viewCount || 0)
    };
}

/* =========================================================
   SAVE DATABASE
   ========================================================= */
async function saveDatabaseToDrive(){
    if (!accessToken){ showToast("پہلے Drive کو Connect کریں۔", "error"); return false; }
    if (saveInProgress) return false;
    try {
        saveInProgress = true;
        setSyncStatus("Saving", "normal");
        db.meta.updated = new Date().toISOString();
        const body = JSON.stringify(db, null, 2);
        if (!databaseFileId){
            const file = await findDatabaseFile();
            if (file) databaseFileId = file.id;
        }
        if (!databaseFileId){
            await createDatabaseFile();
        } else {
            await driveRequest(
                "https://www.googleapis.com/upload/drive/v3/files/" +
                encodeURIComponent(databaseFileId) + "?uploadType=media",
                {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json; charset=UTF-8" },
                    body
                }
            );
        }
        pendingChanges = false;
        lastSuccessfulSync = new Date();
        updateSyncStatus();
        setLastSync(lastSuccessfulSync);
        return true;
    } catch(error){
        console.error(error);
        setSyncStatus("Error", "error");
        showToast("Drive save failed: " + error.message, "error");
        return false;
    } finally {
        saveInProgress = false;
    }
}

/* =========================================================
   CHANGE TRACKING
   ========================================================= */
function markChanged(){
    pendingChanges = true;
    lastChangeTime = new Date();
    db.meta.updated = lastChangeTime.toISOString();
    updateSyncStatus();
    scheduleAutosave();
}

function updateSyncStatus(){
    const el = document.getElementById("syncStatus");
    if (saveInProgress){
        el.textContent = "Sync: Saving…";
        el.className = "status-card sync-off";
    } else if (pendingChanges){
        el.textContent = "Sync: Pending";
        el.className = "status-card sync-off";
    } else {
        el.textContent = "Sync: Synced";
        el.className = "status-card sync-on";
    }
}

function setSyncStatus(text, type){
    const el = document.getElementById("syncStatus");
    if (type === "error"){
        el.textContent = "Sync: Error";
        el.className = "status-card sync-err";
    } else if (text === "Loading"){
        el.textContent = "Sync: Loading…";
        el.className = "status-card sync-off";
    } else if (text === "Saving"){
        el.textContent = "Sync: Saving…";
        el.className = "status-card sync-off";
    }
}

function scheduleAutosave(){
    clearTimeout(autosaveTimer);
    if (!db.settings.autosave || !accessToken) return;
    const seconds = Math.max(1, Number(db.settings.autosaveInterval || 5));
    autosaveTimer = setTimeout(async () => {
        if (pendingChanges) await saveDatabaseToDrive();
    }, seconds * 1000);
}

async function synchronize(){
    if (pendingChanges){
        const saved = await saveDatabaseToDrive();
        if (saved) showToast("Changes synced.", "success");
        return;
    }
    await loadDatabase();
}

function setLastSync(date){
    const el = document.getElementById("lastSyncStatus");
    if (!date){ el.textContent = "Last Synced: —"; return; }
    el.textContent = "Last Synced: " + formatShortTime(date);
}

/* =========================================================
   NOTE CRUD
   ========================================================= */
function addNote(){
    const now = new Date().toISOString();
    const note = {
        id: generateId("note"),
        title: "New Note",
        content: "",
        categoryId: null,
        tags: [],
        links: [],
        favorite: false,
        pinned: false,
        deleted: false,
        trashHidden: false,
        color: "#64748b",
        createdAt: now,
        modifiedAt: now,
        lastViewedAt: null,
        viewCount: 0
    };
    db.notes.unshift(note);
    selectedNoteId = note.id;
    editingNoteId = note.id;
    markChanged();
    refreshUI();
    renderDetail();
}

function getNote(id){ return db.notes.find(n => n.id === id); }

function deleteNote(id){
    const note = getNote(id);
    if (!note) return;
    if (db.settings.deleteConfirmation){
        if (!confirm("Move this note to the Recycle Bin?")) return;
    }
    note.deleted = true;
    note.trashHidden = false;
    if (!note.tags.includes("Bin")) note.tags.push("Bin");
    note.modifiedAt = new Date().toISOString();
    markChanged();
    if (selectedNoteId === id) selectedNoteId = null;
    if (editingNoteId === id) editingNoteId = null;
    refreshUI();
    showToast("Note moved to Recycle Bin.", "success");
}

function restoreNote(id){
    const note = getNote(id);
    if (!note) return;
    note.deleted = false;
    note.trashHidden = false;
    note.modifiedAt = new Date().toISOString();
    markChanged();
    selectedNoteId = note.id;
    refreshUI();
    showToast("Note restored.", "success");
}

function restoreAllDeleted(){
    let count = 0;
    db.notes.forEach(n => {
        if (n.deleted){ n.deleted = false; n.trashHidden = false; n.modifiedAt = new Date().toISOString(); count++; }
    });
    if (count){ markChanged(); refreshUI(); showToast(count + " notes restored.", "success"); }
}

function emptyTrash(){
    const deleted = db.notes.filter(n => n.deleted);
    if (!deleted.length){ showToast("Recycle Bin is empty.", "normal"); return; }
    if (!confirm("Empty Recycle Bin? Notes will NOT be permanently deleted.")) return;
    deleted.forEach(n => { n.trashHidden = true; n.modifiedAt = new Date().toISOString(); });
    markChanged();
    refreshUI();
    showToast("Recycle Bin emptied.", "success");
}

function restoreTrash(){
    db.notes.forEach(n => { if (n.deleted) n.trashHidden = false; });
    markChanged();
    refreshUI();
    showToast("Recycle Bin restored.", "success");
}

/* =========================================================
   FAVORITE / PIN
   ========================================================= */
function toggleFavorite(id){
    const note = getNote(id);
    if (!note) return;
    note.favorite = !note.favorite;
    note.modifiedAt = new Date().toISOString();
    markChanged();
    refreshUI();
}

function togglePinned(id){
    const note = getNote(id);
    if (!note) return;
    note.pinned = !note.pinned;
    note.modifiedAt = new Date().toISOString();
    markChanged();
    refreshUI();
}

/* =========================================================
   SELECT NOTE
   ========================================================= */
function selectNote(id){
    if (multiselectMode){
        if (multiselectIds.has(id)) multiselectIds.delete(id);
        else multiselectIds.add(id);
        renderNoteList();
        return;
    }
    const note = getNote(id);
    if (!note) return;
    selectedNoteId = id;
    editingNoteId = null;
    note.lastViewedAt = new Date().toISOString();
    note.viewCount = Number(note.viewCount || 0) + 1;
    markChanged();
    renderNoteList();
    renderDetail();
}

/* =========================================================
   RENDER DETAIL (VIEW MODE)
   ========================================================= */
function renderDetail(){
    const container = document.getElementById("detailBody");
    const note = getNote(selectedNoteId);

    if (!note){
        container.innerHTML = `<div class="empty">Select a note to view it.</div>`;
        return;
    }

    if (editingNoteId === note.id){
        renderEditMode(note);
        return;
    }

    const categoryPath = getCategoryPath(note.categoryId);
    const tagsHtml = note.tags.map(t =>
        `<span class="tag-chip">${escapeHtml(t)}</span>`
    ).join("");

    const linksHtml = (note.links || []).map((link, idx) => `
        <div class="link-item">
            <span class="link-item-text">${escapeHtml(link.title || "Link")}</span>
            <a class="link-item-url" href="${escapeAttribute(link.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.url)}</a>
            <div class="link-item-actions">
                <button class="link-icon-btn" title="Edit" onclick="editLinkInline('${note.id}', ${idx})">✎</button>
                <button class="link-icon-btn danger" title="Delete" onclick="deleteLinkInline('${note.id}', ${idx})">🗑</button>
            </div>
        </div>
    `).join("");

    container.innerHTML = `
        <div class="note-color-bar" style="--note-color:${escapeAttribute(note.color)}"></div>

        <div class="note-controls-card">
            <div class="note-controls-left">
                <button class="ctrl-btn primary" onclick="addNote()">+ Add</button>
                <button class="ctrl-btn" onclick="startEdit()">✎ Edit</button>
                <button class="ctrl-btn danger" onclick="deleteNote('${note.id}')">🗑 Delete</button>
            </div>
            <div class="note-controls-right">
                <button class="ctrl-btn success" onclick="saveCurrent()">💾 Save</button>
                <button class="ctrl-btn" onclick="cancelEdit()">✕ Cancel</button>
            </div>
        </div>

        <div class="heading-card">
            <div class="heading-display">${escapeHtml(note.title)}</div>
        </div>

        <div class="content-bar">
            <div class="content-toolbar">
                <button class="tool-btn" title="Bold" onclick="execCmd('bold')"><b>B</b></button>
                <button class="tool-btn" title="Underline" onclick="execCmd('underline')"><u>U</u></button>
                <button class="tool-btn" title="Italic" onclick="execCmd('italic')"><i>I</i></button>
                <span class="tool-sep"></span>
                <button class="tool-btn" title="Text Colour" onclick="pickColor()">🎨</button>
                <button class="tool-btn wide" title="Insert Link" onclick="insertLinkDialog()">🔗 Link</button>
            </div>
            <div class="content-display">${escapeHtml(note.content)}</div>
        </div>

        <div class="links-card">
            <div class="links-card-header">
                <span class="links-card-title">Links (${(note.links||[]).length})</span>
                <button class="small-action-btn primary" onclick="addLinkInline('${note.id}')">+ Add Link</button>
            </div>
            ${linksHtml || `<div class="empty" style="min-height:60px;font-size:12px;">No links yet.</div>`}
        </div>

        <div class="tags-cat-card">
            <div class="tags-cat-row">
                <span class="tags-cat-label">🏷️ Tags:</span>
                ${tagsHtml || `<span style="color:var(--muted);font-size:11px;">No tags</span>`}
                <input id="detailTagsInput" class="tags-input-inline" placeholder="Add tag..." onkeydown="if(event.key==='Enter'){assignTagFromInput('${note.id}');}">
                <button class="small-action-btn primary" onclick="assignTagFromInput('${note.id}')">Add</button>
            </div>
            <div class="tags-cat-row">
                <span class="tags-cat-label">📁 Cat:</span>
                <span style="font-size:12px;">${escapeHtml(categoryPath || "Uncat")}</span>

}

function cancelEdit(){

}

function saveCurrent(){
    if (!editingNoteId){ showToast("Nothing to save.", "normal"); return; }

    if (!note) return;

    const titleEl = document.getElementById("editTitle");
    const contentEl = document.getElementById("editContent");
    const colorEl = document.getElementById("editColor");

    if (titleEl) note.title = titleEl.value.trim() || "Untitled Note";

    refreshUI();

}

/* =========================================================
   RICH TEXT COMMANDS
   ========================================================= */
function execCmd(cmd){
    document.execCommand(cmd, false, null);
    const el = document.getElementById("editContent");
    if (el) el.focus();
}

function pickColor(){
    const color = prompt("Enter colour (hex like #ff0000):", "#ff0000");
    if (!color) return;
    document.execCommand("foreColor", false, color);
    const el = document.getElementById("editContent");
    if (el) el.focus();
}

function insertLinkDialog(){
    const text = prompt("Link text (displayed):", "");
    if (text === null) return;
    const url = prompt("Link URL:", "https://");
    if (!url) return;
    const html = `<a href="${escapeAttribute(url)}" target="_blank">${escapeHtml(text || url)}</a>`;
    document.execCommand("insertHTML", false, html);
}

/* =========================================================
   TAG ACTIONS
   ========================================================= */
function assignTagFromInput(noteId){
    const input = document.getElementById("detailTagsInput");
    if (!input) return;
    const value = input.value.trim();
    if (!value) return;
    const note = getNote(noteId);
    if (!note) return;
    const tags = parseTags(value);
    tags.forEach(t => {
        if (!note.tags.includes(t)) note.tags.push(t);
        if (!db.tags.includes(t)) db.tags.push(t);
    });
    note.modifiedAt = new Date().toISOString();
    input.value = "";
    markChanged();
    renderDetail();
    renderSidebar();
}

function removeTagFromNoteById(noteId, tag){
    const note = getNote(noteId);
    if (!note) return;
    note.tags = note.tags.filter(t => t !== tag);
    note.modifiedAt = new Date().toISOString();
    markChanged();
    renderDetail();
    renderSidebar();
}

function parseTags(text){
    return [...new Set(text.split(",").map(x => x.trim()).filter(Boolean))];
}

/* =========================================================
   LINK ACTIONS
   ========================================================= */
function addLinkInline(noteId){
    const note = getNote(noteId);
    if (!note) return;
    const title = prompt("Link title:", "");
    if (title === null) return;
    const url = prompt("Link URL:", "https://");
    if (!url) return;
    if (!note.links) note.links = [];
    note.links.push({ title: title || url, url: url });
    note.modifiedAt = new Date().toISOString();
    markChanged();
    renderDetail();
}

function editLinkInline(noteId, index){
    const note = getNote(noteId);
    if (!note || !note.links || !note.links[index]) return;
    const link = note.links[index];
    const title = prompt("Edit link title:", link.title);
    if (title === null) return;
    const url = prompt("Edit link URL:", link.url);
    if (!url) return;
    link.title = title || url;
    link.url = url;
    note.modifiedAt = new Date().toISOString();
    markChanged();
    renderDetail();
}

function deleteLinkInline(noteId, index){
    const note = getNote(noteId);
    if (!note || !note.links || !note.links[index]) return;
    if (!confirm("Delete this link?")) return;
    note.links.splice(index, 1);
    note.modifiedAt = new Date().toISOString();
    markChanged();
    renderDetail();
}

/* =========================================================
   CATEGORY MENU FOR NOTE
   ========================================================= */
function openCategoryMenuForNote(noteId){
    const note = getNote(noteId);
    if (!note) return;

    const menu = [];
    menu.push("0 = Uncat");
    db.categories.forEach((c, i) => {
        menu.push((i+1) + " = " + getCategoryPath(c.id));
    });

    const choice = prompt(
        "Assign Category:\n" + menu.join("\n") +
        "\n\nEnter number (or C to create new, S for sister, H for child):",
        ""
    );
    if (choice === null) return;

    const trimmed = choice.trim();

    if (trimmed.toLowerCase() === "c"){
        const name = prompt("New root category name:");
        if (!name || !name.trim()) return;
        const cat = { id: generateId("cat"), name: name.trim(), parentId: null };
        db.categories.push(cat);
        note.categoryId = cat.id;
    } else if (trimmed.toLowerCase() === "s"){
        const name = prompt("New sister category name:");
        if (!name || !name.trim()) return;
        const current = db.categories.find(c => c.id === note.categoryId);
        const parentId = current ? (current.parentId || null) : null;
        const cat = { id: generateId("cat"), name: name.trim(), parentId };
        db.categories.push(cat);
        note.categoryId = cat.id;
    } else if (trimmed.toLowerCase() === "h"){
        const name = prompt("New child category name:");
        if (!name || !name.trim()) return;
        const parentId = note.categoryId || null;
        const cat = { id: generateId("cat"), name: name.trim(), parentId };
        db.categories.push(cat);
        note.categoryId = cat.id;
    } else {
        const idx = parseInt(trimmed, 10);
        if (idx === 0){
            note.categoryId = null;
        } else if (idx >= 1 && idx <= db.categories.length){
            note.categoryId = db.categories[idx - 1].id;
        } else {
            showToast("Invalid choice.", "error");
            return;
        }
    }

    note.modifiedAt = new Date().toISOString();
    markChanged();
    refreshUI();
}

function renderSidebar(){

/* =========================================================
   RENDER CATEGORIES (only with notes)
   ========================================================= */
function renderCategories(){
    const container = document.getElementById("categoryList");
    const usedIds = new Set();

    db.notes.forEach(note => {
        if (note.deleted) return;
        if (note.categoryId){
            let current = db.categories.find(c => c.id === note.categoryId);
            const guard = new Set();
            while (current && !guard.has(current.id)){
                guard.add(current.id);
                usedIds.add(current.id);
                current = db.categories.find(c => c.id === current.parentId);
            }
        }
    });

    const roots = db.categories.filter(c => !c.parentId && usedIds.has(c.id));

    if (!roots.length){
        container.innerHTML = `<div class="sidebar-subtitle">No categories in use</div>`;
        return;
    }

    container.innerHTML = roots.map(cat => renderCategoryTree(cat, usedIds)).join("");
}

function renderCategoryTree(cat, usedIds){
    if (!usedIds.has(cat.id)) return "";
    const children = db.categories.filter(c => c.parentId === cat.id && usedIds.has(c.id));
    const count = countCategoryNotes(cat.id);
    const childrenHtml = children.length
        ? `<div class="tree-children">${children.map(c => renderCategoryTree(c, usedIds)).join("")}</div>`
        : "";

    return `
        <div class="sidebar-item" style="padding-left:22px;" onclick="setCategoryView('${cat.id}')">
            <span class="sidebar-icon">↳</span>
            <span class="sidebar-label">${escapeHtml(cat.name)}</span>
            <span class="sidebar-count">${count}</span>
            <div class="sidebar-controls">
                <button class="sidebar-ctrl" title="Rename" onclick="event.stopPropagation(); renameCategory('${cat.id}')">✎</button>
                <button class="sidebar-ctrl danger" title="Remove" onclick="event.stopPropagation(); removeCategory('${cat.id}')">🗑</button>
            </div>
        </div>
        ${childrenHtml}
    `;
}

function countCategoryNotes(catId){
    let count = 0;
    db.notes.forEach(note => {
        if (note.deleted || !note.categoryId) return;
        if (note.categoryId === catId){ count++; return; }
        if (isDescendantOf(note.categoryId, catId)) count++;
    });
    return count;
}

function isDescendantOf(catId, ancestorId){
    let current = db.categories.find(c => c.id === catId);
    const guard = new Set();
    while (current && current.parentId && !guard.has(current.id)){
        guard.add(current.id);
        if (current.parentId === ancestorId) return true;
        current = db.categories.find(c => c.id === current.parentId);
    }
    return false;
}

function getCategoryPath(catId){
    if (!catId) return "";
    const parts = [];
    let current = db.categories.find(c => c.id === catId);
    const guard = new Set();
    while (current && !guard.has(current.id)){
        guard.add(current.id);
        parts.unshift(current.name);
        current = db.categories.find(c => c.id === current.parentId);
    }
    return parts.join(" / ");
}

function renameCategory(id){
    const cat = db.categories.find(c => c.id === id);
    if (!cat) return;
    const name = prompt("Rename category:", cat.name);
    if (!name || !name.trim()) return;
    cat.name = name.trim();
    markChanged();
    renderSidebar();
    refreshUI();
}

function removeCategory(id){
    const cat = db.categories.find(c => c.id === id);
    if (!cat) return;
    if (!confirm("Remove this category? Notes will NOT be deleted. They will be reassigned to the parent (or Uncat).")) return;

    const parentId = cat.parentId || null;

    db.notes.forEach(note => {
        if (note.categoryId === id){
            note.categoryId = parentId;
            note.modifiedAt = new Date().toISOString();
        }
    });

    const toRemove = new Set([id]);
    let changed = true;
    while (changed){
        changed = false;
        db.categories.forEach(c => {
            if (c.parentId && toRemove.has(c.parentId) && !toRemove.has(c.id)){
                toRemove.add(c.id);
                changed = true;
            }
        });
    }

    db.categories = db.categories.filter(c => !toRemove.has(c.id));
    markChanged();
    renderSidebar();
    refreshUI();
    showToast("Category removed. Notes kept.", "success");
}

/* =========================================================
   RENDER TAGS (only from active notes)
   ========================================================= */
function renderTags(){
    const container = document.getElementById("tagList");
    const used = new Set();

    db.notes.forEach(note => {
        if (note.deleted) return;
        note.tags.forEach(t => {
            if (t === "Bin") return;
            used.add(t);
        });
    });

    const sorted = [...used].sort((a,b) => a.localeCompare(b));

    if (!sorted.length){
        container.innerHTML = `<div class="sidebar-subtitle">No tags in use</div>`;
        return;
    }

    container.innerHTML = sorted.map(tag => {
        const count = db.notes.filter(n => !n.deleted && n.tags.includes(tag)).length;
        return `
            <div class="sidebar-item" onclick="setTagView('${escapeAttribute(tag)}')">
                <span class="sidebar-icon">🏷️</span>
                <span class="sidebar-label">${escapeHtml(tag)}</span>
                <span class="sidebar-count">${count}</span>
                <div class="sidebar-controls">
                    <button class="sidebar-ctrl" title="Rename" onclick="event.stopPropagation(); renameTag('${escapeAttribute(tag)}')">✎</button>
                    <button class="sidebar-ctrl danger" title="Remove tag from all notes" onclick="event.stopPropagation(); removeTagEverywhere('${escapeAttribute(tag)}')">🗑</button>
                </div>
            </div>
        `;
    }).join("");
}

function renameTag(tag){
    const newName = prompt("Rename tag:", tag);
    if (!newName || !newName.trim()) return;
    const clean = newName.trim();
    db.notes.forEach(note => {
        note.tags = note.tags.map(t => t === tag ? clean : t);
        note.modifiedAt = new Date().toISOString();
    });
    db.tags = db.tags.map(t => t === tag ? clean : t);
    markChanged();
    refreshUI();
    showToast("Tag renamed.", "success");
}

function removeTagEverywhere(tag){
    if (!confirm("Remove tag '" + tag + "' from all notes? Notes will NOT be deleted.")) return;
    db.notes.forEach(note => {
        if (note.tags.includes(tag)){
            note.tags = note.tags.filter(t => t !== tag);
            note.modifiedAt = new Date().toISOString();
        }
    });
    db.tags = db.tags.filter(t => t !== tag);
    markChanged();
    refreshUI();
    showToast("Tag removed. Notes kept.", "success");
}

/* =========================================================
   VIEWS
   ========================================================= */
function setView(view){
    currentView = view;
    currentCategoryId = null;
    currentTagName = null;
    currentPage = 1;
    updateSidebarActive();
    renderListTitle();
    renderNoteList();
}

function setCategoryView(id){
    currentView = "category";
    currentCategoryId = id;
    currentTagName = null;
    currentPage = 1;
    updateSidebarActive();
    renderListTitle();
    renderNoteList();
}

function setTagView(tag){
    currentView = "tag";
    currentTagName = tag;
    currentCategoryId = null;
    currentPage = 1;
    updateSidebarActive();
    renderListTitle();
    renderNoteList();
}

function updateSidebarActive(){
    document.querySelectorAll(".sidebar-item[data-view]").forEach(item => {
        item.classList.toggle("active", item.dataset.view === currentView);
    });
}

function renderListTitle(){
    const title = document.getElementById("listTitle");
    if (currentView === "all") title.textContent = "All Notes";
    else if (currentView === "favorites") title.textContent = "Favorites";
    else if (currentView === "cat") title.textContent = "Cat";
    else if (currentView === "uncat") title.textContent = "Uncat";
    else if (currentView === "trash") title.textContent = db.trash.label || "Recycle Bin";
    else if (currentView === "category"){
        const cat = db.categories.find(c => c.id === currentCategoryId);
        title.textContent = cat ? cat.name : "Category";
    }
    else if (currentView === "tag") title.textContent = "Tag: " + currentTagName;
}

/* =========================================================
   FILTER + SORT
   ========================================================= */
function getVisibleNotes(){
    let notes = [...db.notes];

    if (currentView === "trash"){
        notes = notes.filter(n => n.deleted && !n.trashHidden);
    } else {
        notes = notes.filter(n => !n.deleted);
    }

    if (currentView === "favorites") notes = notes.filter(n => n.favorite);
    if (currentView === "cat") notes = notes.filter(n => n.categoryId);
    if (currentView === "uncat") notes = notes.filter(n => !n.categoryId);

    if (currentView === "category"){
        notes = notes.filter(n =>
            n.categoryId === currentCategoryId ||
            (n.categoryId && isDescendantOf(n.categoryId, currentCategoryId))
        );
    }

    if (currentView === "tag"){
        notes = notes.filter(n => n.tags.includes(currentTagName));
    }

    if (searchText){
        const q = searchText.toLowerCase();
        notes = notes.filter(n => {
            const cat = getCategoryPath(n.categoryId);
            return (
                n.title.toLowerCase().includes(q) ||
                n.content.toLowerCase().includes(q) ||
                cat.toLowerCase().includes(q) ||
                n.tags.join(" ").toLowerCase().includes(q)
            );
        });
    }

    return sortNotes(notes);
}

function sortNotes(notes){
    const s = db.settings.sorting;
    if (s === "Alphabetical") return notes.sort((a,b) => a.title.localeCompare(b.title));
    if (s === "Newest") return notes.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    if (s === "Oldest") return notes.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
    return notes.sort((a,b) => new Date(b.modifiedAt) - new Date(a.modifiedAt));
}

/* =========================================================
   RENDER NOTE LIST (3 LINES)
   ========================================================= */
function renderNoteList(){
    const container = document.getElementById("noteList");
    let notes = getVisibleNotes();

    document.getElementById("listCount").textContent = notes.length;

    const perPage = db.settings.notesPerPage;
    let pages = 1;
    if (perPage !== "All"){
        const n = Number(perPage);
        pages = Math.max(1, Math.ceil(notes.length / n));
        currentPage = Math.min(currentPage, pages);
        const start = (currentPage - 1) * n;
        notes = notes.slice(start, start + n);
    } else {
        currentPage = 1;
    }

    if (!notes.length){
        container.innerHTML = `<div class="empty">No notes found.</div>`;
        renderPagination(1);
        return;
    }

    container.innerHTML = notes.map(note => renderNoteRow(note)).join("");
    renderPagination(pages);
}

function renderNoteRow(note){
    const contentPreview = note.content.replace(/\s+/g, " ").trim().slice(0, 60);
    const catPath = getCategoryPath(note.categoryId);
    const date = formatDateTime(note.modifiedAt);
    const isMs = multiselectIds.has(note.id);

    const tagsPreview = note.tags
        .filter(t => t !== "Bin")
        .slice(0, 3)
        .map(t => `<span class="meta-chip">🏷️ ${escapeHtml(t)}</span>`)
        .join(" ");

    return `
        <div class="note-row ${selectedNoteId === note.id ? "active" : ""} ${isMs ? "ms-selected" : ""}"
             onclick="selectNote('${note.id}')">

            <div class="note-marker" style="--note-color:${escapeAttribute(note.color)}"></div>

            <div class="note-row-body">

                <div class="note-line1">
                    <span class="note-line1-title">${escapeHtml(note.title)}</span>
                    <span class="note-line1-content">${escapeHtml(contentPreview || "No content")}</span>
                </div>

                <div class="note-line2">
                    <span class="mini-toggle ${note.pinned ? "on" : ""}"
                          title="${note.pinned ? "Unpin" : "Pin"}"
                          onclick="event.stopPropagation(); togglePinned('${note.id}')">
                        📌 ${note.pinned ? "Pinned" : "Pin"}
                    </span>

                    <span class="mini-toggle ${note.favorite ? "fav-on" : ""}"
                          title="${note.favorite ? "Unfavorite" : "Favorite"}"
                          onclick="event.stopPropagation(); toggleFavorite('${note.id}')">
                        ${note.favorite ? "★ Fav" : "☆ Fav"}
                    </span>

                    ${catPath ? `<span class="meta-chip">📁 ${escapeHtml(catPath)}</span>` : `<span class="meta-chip" style="color:var(--muted);">📁 Uncat</span>`}

                    ${tagsPreview || ""}
                </div>

                <div class="note-line3">
                    🕒 ${escapeHtml(date)}
                </div>

            </div>

        </div>
    `;
}

/* =========================================================
   PAGINATION
   ========================================================= */
function renderPagination(pages){
    const container = document.getElementById("pagination");
    if (pages <= 1){ container.style.display = "none"; return; }
    container.style.display = "flex";
    container.innerHTML = `
        <button onclick="changePage(-1)" ${currentPage <= 1 ? "disabled" : ""}>Prev</button>
        <span style="font-size:12px;">${currentPage} / ${pages}</span>
        <button onclick="changePage(1)" ${currentPage >= pages ? "disabled" : ""}>Next</button>
    `;
}

function changePage(delta){
    currentPage += delta;
    renderNoteList();
}

/* =========================================================
   SETTINGS
   ========================================================= */
function openSettings(){
    currentView = "settings";
    document.getElementById("listTitle").textContent = "Settings";
    document.getElementById("listCount").textContent = "";
    document.getElementById("noteList").innerHTML = "";
    const detail = document.getElementById("detailBody");
    detail.innerHTML = renderSettings();
    selectedNoteId = null;
    editingNoteId = null;
}

function renderSettings(){
    const s = db.settings;
    return `
        <div style="padding:14px;">
            <h3 style="margin-top:0;">Settings</h3>
            <div class="settings-grid">
                <div class="setting">
                    <label>Theme</label>
                    <select onchange="saveSetting('theme',this.value)">
                        ${option("Day", s.theme)}${option("Night", s.theme)}${option("System", s.theme)}
                    </select>
                </div>
                <div class="setting">
                    <label>Font Size</label>
                    <select onchange="saveSetting('fontSize',this.value)">
                        ${option("Small", s.fontSize)}${option("Normal", s.fontSize)}${option("Large", s.fontSize)}${option("Extra Large", s.fontSize)}
                    </select>
                </div>
                <div class="setting">
                    <label>Sorting</label>
                    <select onchange="saveSetting('sorting',this.value)">
                        ${option("Last Modified First", s.sorting)}${option("Newest", s.sorting)}${option("Oldest", s.sorting)}${option("Alphabetical", s.sorting)}
                    </select>
                </div>
                <div class="setting">
                    <label>Notes Per Page</label>
                    <select onchange="saveSetting('notesPerPage',this.value)">
                        ${option("10", String(s.notesPerPage))}${option("20", String(s.notesPerPage))}${option("50", String(s.notesPerPage))}${option("100", String(s.notesPerPage))}${option("All", String(s.notesPerPage))}
                    </select>
                </div>
                <div class="setting">
                    <label>Autosave</label>
                    <select onchange="saveSetting('autosave',this.value === 'true')">
                        <option value="true" ${s.autosave ? "selected" : ""}>On</option>
                        <option value="false" ${!s.autosave ? "selected" : ""}>Off</option>
                    </select>
                </div>
                <div class="setting">
                    <label>Autosave Interval</label>
                    <select onchange="saveSetting('autosaveInterval',Number(this.value))">
                        ${[5,10,15,30,60].map(x => `<option value="${x}" ${Number(s.autosaveInterval) === x ? "selected" : ""}>${x} sec</option>`).join("")}
                    </select>
                </div>
                <div class="setting">
                    <label>Delete Confirmation</label>
                    <select onchange="saveSetting('deleteConfirmation',this.value === 'true')">
                        <option value="true" ${s.deleteConfirmation ? "selected" : ""}>On</option>
                        <option value="false" ${!s.deleteConfirmation ? "selected" : ""}>Off</option>
                    </select>
                </div>
                <div class="setting">
                    <label>Date / Time Format</label>
                    <select onchange="saveSetting('dateTimeFormat',this.value)">
                        ${option("Local", s.dateTimeFormat)}${option("12 Hour", s.dateTimeFormat)}${option("24 Hour", s.dateTimeFormat)}
                    </select>
                </div>
            </div>

            <div style="margin-top:15px;">
                <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;">Checklist Web App URL</div>
                <div style="display:flex;gap:7px;">
                    <input id="checklistUrl" class="tags-input-inline" style="flex:1;height:34px;" value="${escapeAttribute(db.checklist.url || "")}" placeholder="https://...">
                    <button class="small-action-btn primary" style="height:34px;" onclick="saveChecklistUrl()">Save</button>
                </div>
            </div>

            <div style="margin-top:15px;">
                <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;">Recycle Bin Name</div>
                <select class="tags-input-inline" style="width:100%;height:34px;" onchange="changeTrashLabel(this.value)">
                    ${["Recycle Bin","Trash","Dustbin","Deleted Items","Bin","Waste Bin"].map(x => `<option ${x === db.trash.label ? "selected" : ""}>${escapeHtml(x)}</option>`).join("")}
                </select>
            </div>

            <div style="margin-top:18px;display:flex;gap:6px;flex-wrap:wrap;">
                <button class="ctrl-btn" onclick="restoreAllDeleted()">Restore All</button>
                <button class="ctrl-btn" onclick="emptyTrash()">Empty Bin</button>
                <button class="ctrl-btn" onclick="restoreTrash()">Restore Bin</button>
            </div>
        </div>
    `;
}

function option(value, selected){
    return `<option value="${escapeAttribute(value)}" ${value === selected ? "selected" : ""}>${escapeHtml(value)}</option>`;
}

function saveSetting(key, value){
    db.settings[key] = value;
    applySettings();
    markChanged();
    showToast("Setting saved.", "success");
}

function saveChecklistUrl(){
    const input = document.getElementById("checklistUrl");
    db.checklist.url = input.value.trim();
    markChanged();
    showToast("Checklist link saved.", "success");
}

function changeTrashLabel(value){
    db.trash.label = value;
    markChanged();
    document.getElementById("trashLabel").textContent = value;
    renderListTitle();
}

/* =========================================================
   APPLY SETTINGS
   ========================================================= */
function applySettings(){
    const theme = db.settings.theme;
    document.body.classList.remove("night");
    if (theme === "Night"){
        document.body.classList.add("night");
    } else if (theme === "System"){
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){
            document.body.classList.add("night");
        }
    }
    const fontSizes = { "Small":"13px", "Normal":"15px", "Large":"17px", "Extra Large":"19px" };
    document.documentElement.style.setProperty("--font-size", fontSizes[db.settings.fontSize] || "15px");
    document.getElementById("trashLabel").textContent = db.trash.label || "Recycle Bin";
}

/* =========================================================
   CHECKLIST
   ========================================================= */
function openChecklist(){
    const url = db.checklist.url;
    if (!url){ showToast("Checklist URL not set in Settings.", "error"); return; }
    window.open(url, "_blank", "noopener,noreferrer");
}

/* =========================================================
   MULTISELECT
   ========================================================= */
function toggleMultiselect(){
    multiselectMode = !multiselectMode;
    multiselectIds.clear();
    const btn = document.getElementById("multiselectBtn");
    if (multiselectMode){
        document.body.classList.add("multiselect");
        btn.classList.add("active");
        btn.textContent = "Cancel MS";
        showToast("Multiselect ON. Tap notes to select.", "normal");
    } else {
        document.body.classList.remove("multiselect");
        btn.classList.remove("active");
        btn.textContent = "Multiselect";
    }
    renderNoteList();
}

function deleteSelected(){
    if (!multiselectIds.size){ showToast("No notes selected.", "normal"); return; }
    if (!confirm("Delete " + multiselectIds.size + " selected note(s)?")) return;
    multiselectIds.forEach(id => {
        const note = getNote(id);
        if (note){
            note.deleted = true;
            note.trashHidden = false;
            if (!note.tags.includes("Bin")) note.tags.push("Bin");
            note.modifiedAt = new Date().toISOString();
        }
    });
    multiselectIds.clear();
    multiselectMode = false;
    document.body.classList.remove("multiselect");
    document.getElementById("multiselectBtn").classList.remove("active");
    document.getElementById("multiselectBtn").textContent = "Multiselect";
    markChanged();
    refreshUI();
    showToast("Selected notes moved to Recycle Bin.", "success");
}

/* =========================================================
   REFRESH
   ========================================================= */
function refreshUI(){
    if (currentView === "settings"){ openSettings(); return; }
    renderSidebar();
    renderListTitle();
    renderNoteList();
    renderDetail();
}

/* =========================================================
   SEARCH
   ========================================================= */
document.getElementById("searchInput").addEventListener("input", function(){
    searchText = this.value.trim();
    currentPage = 1;
    renderNoteList();
});

/* =========================================================
   BUTTON EVENTS
   ========================================================= */
document.getElementById("sidebarToggle").addEventListener("click", toggleSidebar);
document.getElementById("sidebarOverlay").addEventListener("click", () => { if (sidebarOpen) toggleSidebar(); });
document.getElementById("connectBtn").addEventListener("click", connectDrive);
document.getElementById("syncBtn").addEventListener("click", synchronize);
document.getElementById("addBtn").addEventListener("click", addNote);
document.getElementById("multiselectBtn").addEventListener("click", toggleMultiselect);
document.getElementById("deleteSelectedBtn").addEventListener("click", deleteSelected);

/* =========================================================
   KEYBOARD
   ========================================================= */
document.addEventListener("keydown", function(e){
    if (e.ctrlKey && e.key.toLowerCase() === "s"){
        e.preventDefault();
        if (editingNoteId) saveCurrent();
        else if (pendingChanges) saveDatabaseToDrive();
    }
    if (e.key === "Escape"){
        if (sidebarOpen) toggleSidebar();
        if (editingNoteId) cancelEdit();
        if (multiselectMode) toggleMultiselect();
    }
});

/* =========================================================
   DATE / TIME
   ========================================================= */
function formatDateTime(value){
    if (!value) return "—";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "—";
    const s = db.settings.dateTimeFormat;
    if (s === "24 Hour"){
        return date.toLocaleString(undefined, { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false });
    }
    return date.toLocaleString(undefined, { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:true });
}

function formatShortTime(value){
    if (!value) return "—";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "—";
    return date.toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit", hour12:true });
}

/* =========================================================
   UTILITIES
   ========================================================= */
function generateId(prefix){
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
}

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value){ return escapeHtml(value); }

function showToast(message, type = "normal"){
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove("show"), 2500);
}

/* =========================================================
   INIT
   ========================================================= */
function initializeApp(){
    sidebarOpen = false;
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("open");
    document.getElementById("sidebarToggle").textContent = "Show Sidebar";
    db = normalizeDatabase(db);
    applySettings();
    renderSidebar();
    renderListTitle();
    renderNoteList();
    renderDetail();
    updateSyncStatus();
    initializeGoogle();
}

if (window.matchMedia){
    const media = window.matchMedia("(prefers-color-scheme: dark)");
    media.addEventListener("change", () => {
        if (db.settings.theme === "System") applySettings();
    });
}

initializeApp();
</script>
