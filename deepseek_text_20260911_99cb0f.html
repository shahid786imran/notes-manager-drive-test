document.addEventListener("keydown",(e)=>{if(e.key==="Escape"){if(document.getElementById("popupBackdrop").classList.contains("show"))closePopup();if(document.getElementById("dropdownPopup").classList.contains("show"))document.getElementById("dropdownPopup").classList.remove("show");if(document.getElementById("linkCtxMenu").classList.contains("show"))document.getElementById("linkCtxMenu").classList.remove("show");if(document.getElementById("contextMenu").classList.contains("show"))document.getElementById("contextMenu").classList.remove("show");if(sidebarOpen)toggleSidebar();if(editingNoteId)cancelEdit();}});
function openCategoryAssignPopup(noteId){const note=getNote(noteId);if(!note)return;let selectedCatId=note.categoryId;function renderTree(){const roots=db.categories.filter(c=>!c.parentId);let h='<div class="cat-tree-row '+(!selectedCatId?"selected":"")+'" onclick="__catSelect(null, this)"><span class="cat-radio"></span><span>📄 Uncat</span></div>';h+=roots.map(c=>renderCatNode(c,0)).join("");return h;}function renderCatNode(cat,depth){const ind="— ".repeat(depth);let h='<div class="cat-tree-row '+(cat.id===selectedCatId?"selected":"")+'" onclick="__catSelect(\''+cat.id+'\', this)"><span class="cat-radio"></span><span>📁 '+escapeHtml(ind+cat.name)+'</span></div>';const ch=db.categories.filter(c=>c.parentId===cat.id);h+=ch.map(c=>renderCatNode(c,depth+1)).join("");return h;}openPopup({title:"Assign Category",bodyHTML:'<div class="popup-field"><input id="catSearchInput" placeholder="🔍 Search..." oninput="__catFilter(this.value)"></div><div class="cat-tree" id="catTreeContainer">'+renderTree()+'</div><div style="margin-top:10px;display:flex;gap:6px;"><button class="popup-btn" id="addSisterBtn" disabled onclick="__catAddSister()">+ Sister</button><button class="popup-btn" id="addChildBtn" disabled onclick="__catAddChild()">+ Child</button></div>',onSave:()=>{note.categoryId=selectedCatId;note.modifiedAt=new Date().toISOString();markChanged();refreshUI();showToast("Assigned.","success");return true;}});window.__catSelect=(id,el)=>{selectedCatId=id;document.querySelectorAll("#catTreeContainer .cat-tree-row").forEach(r=>r.classList.remove("selected"));el.classList.add("selected");updateCatButtons();};window.__catFilter=(q)=>{q=q.toLowerCase();document.querySelectorAll("#catTreeContainer .cat-tree-row").forEach(r=>{r.style.display=!q||r.textContent.toLowerCase().includes(q)?"flex":"none";});};window.__catAddSister=()=>{if(!selectedCatId){showToast("Select category.","error");return;}const cat=db.categories.find(c=>c.id===selectedCatId);const name=prompt("Sister name:");if(!name||!name.trim())return;const nc={id:generateId("cat"),name:name.trim(),parentId:cat?cat.parentId||null:null};db.categories.push(nc);selectedCatId=nc.id;markChanged();document.getElementById("catTreeContainer").innerHTML=renderTree();updateCatButtons();};window.__catAddChild=()=>{if(!selectedCatId){showToast("Select category.","error");return;}const name=prompt("Child name:");if(!name||!name.trim())return;const nc={id:generateId("cat"),name:name.trim(),parentId:selectedCatId};db.categories.push(nc);selectedCatId=nc.id;markChanged();document.getElementById("catTreeContainer").innerHTML=renderTree();updateCatButtons();};function updateCatButtons(){document.getElementById("addSisterBtn").disabled=!selectedCatId;document.getElementById("addChildBtn").disabled=false;}}
function assignTagFromInput(noteId){const input=document.getElementById("detailTagsInput");if(!input)return;const value=input.value.trim();if(!value)return;const note=getNote(noteId);if(!note)return;parseTags(value).forEach(t=>{if(!note.tags.includes(t))note.tags.push(t);if(!db.tags.includes(t))db.tags.push(t);});note.modifiedAt=new Date().toISOString();input.value="";markChanged();renderDetail();renderSidebar();}
function removeTagFromNoteById(noteId,tag){const note=getNote(noteId);if(!note)return;note.tags=note.tags.filter(t=>t!==tag);note.modifiedAt=new Date().toISOString();markChanged();renderDetail();renderSidebar();}
function parseTags(text){return[...new Set(text.split(",").map(x=>x.trim()).filter(Boolean))];}
function renderMetadata(note,categoryPath){const collapsed=db.settings.metadataCollapsed?"collapsed":"";const words=countWords(note.content);const chars=(note.content||"").length;const lines=(note.content||"").split(/\n/).length;const size=new Blob([JSON.stringify(note)]).size;const extLinks=((note.content||"").match(/https?:\/\/[^\s<]+/g)||[]).length;const tagsCount=note.tags.length;const catDepth=note.categoryId?getCategoryDepth(note.categoryId):0;const sib=note.categoryId?countSiblingNotes(note.id,note.categoryId):0;const edits=Number(note.editCount||0);const age=daysBetween(new Date(note.createdAt),new Date());const dsm=daysBetween(new Date(note.modifiedAt),new Date());const tse=relativeTime(note.modifiedAt);return '<div class="metadata-box"><div class="metadata-title" onclick="toggleMetadata()"><span>📊 Note Metadata</span><span class="toggle-icon" id="metaToggleIcon">'+(collapsed?"▸":"▾")+'</span></div><div class="metadata-body '+collapsed+'" id="metaBody"><table class="metadata-table"><tr><td class="label">Created</td><td class="value">'+escapeHtml(formatFullDateTime(note.createdAt))+'</td><td class="label">Modified</td><td class="value">'+escapeHtml(formatFullDateTime(note.modifiedAt))+'</td></tr><tr><td class="label">Category</td><td class="value">'+(categoryPath?'<a class="cat-link" onclick="setCategoryView(\''+note.categoryId+'\')">'+escapeHtml(categoryPath)+'</a>':"Uncat")+'</td><td class="label">Tags</td><td class="value">'+(note.tags.length?escapeHtml(note.tags.join(", ")):"None")+'</td></tr><tr><td class="label">Status</td><td class="value">'+(note.deleted?"In Bin":"Active")+'</td><td class="label">Favorite</td><td class="value">'+(note.favorite?"Yes":"No")+'</td></tr><tr><td class="label">Pinned</td><td class="value">'+(note.pinned?"Yes":"No")+'</td><td class="label">Colour</td><td class="value">'+escapeHtml(note.color)+'</td></tr><tr><td class="label">ID</td><td class="value">'+escapeHtml(note.id.slice(0,12))+'</td><td class="label">Words</td><td class="value">'+words+'</td></tr><tr><td class="label">Chars</td><td class="value">'+chars+'</td><td class="label">Lines</td><td class="value">'+lines+'</td></tr><tr><td class="label">Last Viewed</td><td class="value">'+(note.lastViewedAt?escapeHtml(formatFullDateTime(note.lastViewedAt)):"Never")+'</td><td class="label">Views</td><td class="value">'+(note.viewCount||0)+'</td></tr><tr><td class="label">Synced</td><td class="value">'+(lastSuccessfulSync?"Drive":"No")+'</td><td class="label">Last Sync</td><td class="value">'+(lastSuccessfulSync?formatShortTime(lastSuccessfulSync):"—")+'</td></tr><tr><td class="label">Age</td><td class="value">'+age+' days</td><td class="label">Since Mod</td><td class="value">'+dsm+' days</td></tr><tr><td class="label">Edits</td><td class="value">'+edits+'</td><td class="label">Restored</td><td class="value">'+(note.restoredCount||0)+'</td></tr><tr><td class="label">Size</td><td class="value">'+size+' B</td><td class="label">Ext Links</td><td class="value">'+extLinks+'</td></tr><tr><td class="label">Tags #</td><td class="value">'+tagsCount+'</td><td class="label">Cat Depth</td><td class="value">'+catDepth+'</td></tr><tr><td class="label">Siblings</td><td class="value">'+sib+'</td><td class="label">Since Edit</td><td class="value">'+tse+'</td></tr><tr><td class="label">Last Restore</td><td class="value" colspan="3">'+(note.lastRestoredAt?escapeHtml(formatFullDateTime(note.lastRestoredAt)):"Never")+'</td></tr></table><div class="metadata-actions"><button class="small-action-btn" onclick="duplicateNote(\''+note.id+'\')">⎘ Duplicate</button><button class="small-action-btn" onclick="openExportDialog(\''+note.id+'\')">↗ Export</button><button class="small-action-btn" onclick="resetViewCount(\''+note.id+'\')">Reset Views</button></div></div></div>';}
function toggleMetadata(){db.settings.metadataCollapsed=!db.settings.metadataCollapsed;const b=document.getElementById("metaBody");const i=document.getElementById("metaToggleIcon");if(db.settings.metadataCollapsed){b.classList.add("collapsed");if(i)i.textContent="▸";}else{b.classList.remove("collapsed");if(i)i.textContent="▾";}markChanged();}
function resetViewCount(id){const n=getNote(id);if(!n)return;if(!confirm("Reset view count?"))return;n.viewCount=0;n.modifiedAt=new Date().toISOString();markChanged();renderDetail();showToast("Reset.","success");}
function countWords(t){if(!t)return 0;return t.trim().split(/\s+/).filter(Boolean).length;}
function countSiblingNotes(nid,cid){let c=0;db.notes.forEach(n=>{if(!n.deleted&&n.id!==nid&&n.categoryId===cid)c++;});return c;}
function getCategoryDepth(cid){let d=0;let cur=db.categories.find(c=>c.id===cid);const g=new Set();while(cur&&!g.has(cur.id)){g.add(cur.id);d++;cur=cur.parentId?db.categories.find(c=>c.id===cur.parentId):null;}return d;}
function daysBetween(d1,d2){return Math.floor(Math.abs(d2-d1)/(1000*60*60*24));}
function relativeTime(value){if(!value)return"—";const date=new Date(value);if(Number.isNaN(date.getTime()))return"—";const s=Math.floor((Date.now()-date.getTime())/1000);if(s<5)return"just now";if(s<60)return s+" sec ago";const m=Math.floor(s/60);if(m<60)return m+" min ago";const h=Math.floor(m/60);if(h<24)return h+" hr ago";const d=Math.floor(h/24);if(d<30)return d+" days ago";const mo=Math.floor(d/30);if(mo<12)return mo+" mo ago";return Math.floor(mo/12)+" yr ago";}
function openExportDialog(id){const note=getNote(id);if(!note)return;openPopup({title:"Export Note",bodyHTML:'<div style="display:flex;flex-direction:column;gap:6px;"><button class="popup-btn" onclick="__expCopy()">📋 Copy</button><button class="popup-btn" onclick="__expPrint()">🖨 Print</button><button class="popup-btn" onclick="__expPDF()">📄 PDF</button><button class="popup-btn" onclick="__expQR()">📱 QR</button></div>',footerHTML:'<button class="popup-btn" onclick="closePopup()">Close</button>',onSave:null});window.__expCopy=()=>{navigator.clipboard.writeText(note.title+"\n\n"+note.content).then(()=>{showToast("Copied.","success");closePopup();});};window.__expPrint=()=>{const w=window.open("","_blank");w.document.write('<pre style="font-family:Arial;padding:20px;white-space:pre-wrap;">'+escapeHtml(note.title)+'\n\n'+escapeHtml(note.content)+'</pre>');w.document.close();w.print();closePopup();};window.__expPDF=()=>{const w=window.open("","_blank");w.document.write('<pre style="font-family:Arial;padding:20px;white-space:pre-wrap;">'+escapeHtml(note.title)+'\n\n'+escapeHtml(note.content)+'</pre>');w.document.close();setTimeout(()=>w.print(),300);closePopup();};window.__expQR=()=>{window.open("https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+encodeURIComponent(note.title+"\n"+note.content.slice(0,500)),"_blank");closePopup();};}
function toggleSidebar(){sidebarOpen=!sidebarOpen;const s=document.getElementById("sidebar");const o=document.getElementById("sidebarOverlay");const b=document.getElementById("floatingToggle");if(sidebarOpen){s.classList.add("open");o.classList.add("open");b.innerHTML='<span class="arrow-icon">◀</span>';}else{s.classList.remove("open");o.classList.remove("open");b.innerHTML='<span class="hamburger"><span></span><span></span><span></span></span>';}}
function toggleSidebarSection(sectionId,arrowId){const sec=document.getElementById(sectionId);const arrow=document.getElementById(arrowId);if(!sec)return;if(sec.classList.contains("open")){sec.classList.remove("open");if(arrow)arrow.textContent="+";}else{sec.classList.add("open");if(arrow)arrow.textContent="−";}}
function renderSidebar(){const active=db.notes.filter(n=>!n.deleted);document.getElementById("allCount").textContent=active.length;document.getElementById("favoriteCount").textContent=active.filter(n=>n.favorite).length;document.getElementById("catCount").textContent=active.filter(n=>n.categoryId).length;document.getElementById("uncatCount").textContent=active.filter(n=>!n.categoryId).length;const tc=db.notes.filter(n=>n.deleted&&!n.trashHidden).length;const badge=document.getElementById("binBadge");if(tc>0){badge.style.display="inline-block";badge.textContent=tc;}else badge.style.display="none";renderCategories();renderTags();renderGlobalLinks();}
function renderCategories(){const c=document.getElementById("categoryList");const used=new Set();db.notes.forEach(n=>{if(n.deleted)return;if(n.categoryId){let cur=db.categories.find(x=>x.id===n.categoryId);const g=new Set();while(cur&&!g.has(cur.id)){g.add(cur.id);used.add(cur.id);cur=db.categories.find(x=>x.id===cur.parentId);}}});const roots=db.categories.filter(x=>!x.parentId&&used.has(x.id));if(!roots.length){c.innerHTML='<div class="sidebar-subtitle">No categories</div>';return;}c.innerHTML=roots.map(x=>renderCatTree(x,used)).join("");}
function renderCatTree(cat,used){if(!used.has(cat.id))return"";const ch=db.categories.filter(x=>x.parentId===cat.id&&used.has(x.id));const cnt=countCategoryNotes(cat.id);const hasCh=ch.length>0;const collapsed=db.settings.categoriesCollapsed;const chH=hasCh?'<div class="tree-children '+(collapsed?"":"open")+'" id="catCh-'+cat.id+'">'+ch.map(x=>renderCatTree(x,used)).join("")+'</div>':"";const exp=hasCh?'<button class="cat-expander" onclick="event.stopPropagation(); toggleCatNode(\''+cat.id+'\', this)">'+(collapsed?"+":"−")+'</button>':'<span style="width:22px;display:inline-block;"></span>';return '<div class="cat-row" style="padding-left:14px;">'+exp+'<span class="sidebar-icon">📁</span><span class="sidebar-label" onclick="setCategoryView(\''+cat.id+'\')" style="cursor:pointer;">'+escapeHtml(cat.name)+'</span><span class="sidebar-count">'+cnt+'</span><div class="cat-row-btns"><button class="sidebar-ctrl" onclick="event.stopPropagation(); renameCategory(\''+cat.id+'\')">✎</button><button class="sidebar-ctrl danger" onclick="event.stopPropagation(); removeCategory(\''+cat.id+'\')">🗑</button></div></div>'+chH;}
function toggleCatNode(id,btn){const el=document.getElementById("catCh-"+id);if(!el)return;if(el.classList.contains("open")){el.classList.remove("open");btn.textContent="+";}else{el.classList.add("open");btn.textContent="−";}}
function countCategoryNotes(cid){let c=0;db.notes.forEach(n=>{if(n.deleted||!n.categoryId)return;if(n.categoryId===cid){c++;return;}if(isDescendantOf(n.categoryId,cid))c++;});return c;}
function isDescendantOf(cid,anc){let cur=db.categories.find(x=>x.id===cid);const g=new Set();while(cur&&cur.parentId&&!g.has(cur.id)){g.add(cur.id);if(cur.parentId===anc)return true;cur=db.categories.find(x=>x.id===cur.parentId);}return false;}
function getCategoryPath(cid){if(!cid)return"";const p=[];let cur=db.categories.find(x=>x.id===cid);const g=new Set();while(cur&&!g.has(cur.id)){g.add(cur.id);p.unshift(cur.name);cur=db.categories.find(x=>x.id===cur.parentId);}return p.join(" / ");}
function renameCategory(id){const c=db.categories.find(x=>x.id===id);if(!c)return;const n=prompt("Rename:",c.name);if(!n||!n.trim())return;c.name=n.trim();markChanged();renderSidebar();refreshUI();}
function removeCategory(id){const c=db.categories.find(x=>x.id===id);if(!c)return;if(!confirm("Remove? Notes kept."))return;const pid=c.parentId||null;db.notes.forEach(n=>{if(n.categoryId===id){n.categoryId=pid;n.modifiedAt=new Date().toISOString();}});const rm=new Set([id]);let ch=true;while(ch){ch=false;db.categories.forEach(x=>{if(x.parentId&&rm.has(x.parentId)&&!rm.has(x.id)){rm.add(x.id);ch=true;}});}db.categories=db.categories.filter(x=>!rm.has(x.id));markChanged();renderSidebar();refreshUI();showToast("Removed.","success");}
function renderTags(){const c=document.getElementById("tagList");const used=new Set();db.notes.forEach(n=>{if(n.deleted)return;n.tags.forEach(t=>{if(t==="Bin")return;used.add(t);});});const sorted=[...used].sort((a,b)=>a.localeCompare(b));document.getElementById("tagCountTotal").textContent=sorted.length;if(!sorted.length){c.innerHTML="";return;}c.innerHTML=sorted.map(tag=>{const cnt=db.notes.filter(n=>!n.deleted&&n.tags.includes(tag)).length;return '<div class="sidebar-item" style="padding-left:14px;"><span class="sidebar-icon">🏷️</span><span class="sidebar-label" onclick="setTagView(\''+escapeAttribute(tag)+'\')" style="cursor:pointer;">'+escapeHtml(tag)+'</span><span class="sidebar-count">'+cnt+'</span><div class="sidebar-controls"><button class="sidebar-ctrl" onclick="event.stopPropagation(); renameTag(\''+escapeAttribute(tag)+'\')">✎</button><button class="sidebar-ctrl danger" onclick="event.stopPropagation(); removeTagEverywhere(\''+escapeAttribute(tag)+'\')">🗑</button></div></div>';}).join("");}
function renameTag(tag){const n=prompt("Rename tag:",tag);if(!n||!n.trim())return;const cl=n.trim();db.notes.forEach(x=>{x.tags=x.tags.map(t=>t===tag?cl:t);x.modifiedAt=new Date().toISOString();});db.tags=db.tags.map(t=>t===tag?cl:t);markChanged();refreshUI();showToast("Renamed.","success");}
function removeTagEverywhere(tag){if(!confirm("Remove tag '"+tag+"'?"))return;db.notes.forEach(n=>{if(n.tags.includes(tag)){n.tags=n.tags.filter(t=>t!==tag);n.modifiedAt=new Date().toISOString();}});db.tags=db.tags.filter(t=>t!==tag);markChanged();refreshUI();showToast("Removed.","success");}
function setView(v){currentView=v;currentCategoryId=null;currentTagName=null;currentPage=1;selectedIds.clear();const ws=document.getElementById("workspace");ws.classList.remove("settings-mode");updateSidebarActive();renderListTitle();renderNoteList();renderBinToolbar();updateDeleteButton();}
function setCategoryView(id){currentView="category";currentCategoryId=id;currentTagName=null;currentPage=1;selectedIds.clear();document.getElementById("workspace").classList.remove("settings-mode");updateSidebarActive();renderListTitle();renderNoteList();renderBinToolbar();updateDeleteButton();}
function setTagView(tag){currentView="tag";currentTagName=tag;currentCategoryId=null;currentPage=1;selectedIds.clear();document.getElementById("workspace").classList.remove("settings-mode");updateSidebarActive();renderListTitle();renderNoteList();renderBinToolbar();updateDeleteButton();}
function updateSidebarActive(){document.querySelectorAll(".sidebar-item[data-view]").forEach(i=>{i.classList.toggle("active",i.dataset.view===currentView);});}
function renderListTitle(){const t=document.getElementById("listTitle");if(currentView==="all")t.textContent="All Notes";else if(currentView==="favorites")t.textContent="Favorites";else if(currentView==="cat")t.textContent="Cat";else if(currentView==="uncat")t.textContent="Uncat";else if(currentView==="trash")t.textContent=db.trash.label||"Recycle Bin";else if(currentView==="category"){const c=db.categories.find(x=>x.id===currentCategoryId);t.textContent=c?c.name:"Category";}else if(currentView==="tag")t.textContent="Tag: "+currentTagName;}
function getVisibleNotes(){let notes=[...db.notes];if(currentView==="trash")notes=notes.filter(n=>n.deleted&&!n.trashHidden);else notes=notes.filter(n=>!n.deleted);if(currentView==="favorites")notes=notes.filter(n=>n.favorite);if(currentView==="cat")notes=notes.filter(n=>n.categoryId);if(currentView==="uncat")notes=notes.filter(n=>!n.categoryId);if(currentView==="category")notes=notes.filter(n=>n.categoryId===currentCategoryId||(n.categoryId&&isDescendantOf(n.categoryId,currentCategoryId)));if(currentView==="tag")notes=notes.filter(n=>n.tags.includes(currentTagName));if(searchText){const q=searchText.toLowerCase();notes=notes.filter(n=>{const c=getCategoryPath(n.categoryId);return n.title.toLowerCase().includes(q)||n.content.toLowerCase().includes(q)||c.toLowerCase().includes(q)||n.tags.join(" ").toLowerCase().includes(q);});}return sortNotes(notes);}
function sortNotes(notes){const s=db.settings.sorting;if(s==="Alphabetical")return notes.sort((a,b)=>a.title.localeCompare(b.title));if(s==="Newest")return notes.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));if(s==="Oldest")return notes.sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));return notes.sort((a,b)=>new Date(b.modifiedAt)-new Date(a.modifiedAt));}
function changeSortFromBar(v){db.settings.sorting=v;markChanged();renderNoteList();}
function renderNoteList(){const c=document.getElementById("noteList");let notes=getVisibleNotes();document.getElementById("listCount").textContent=notes.length;const perPage=db.settings.notesPerPage;let pages=1;if(perPage!=="All"){const n=Number(perPage);pages=Math.max(1,Math.ceil(notes.length/n));currentPage=Math.min(currentPage,pages);notes=notes.slice((currentPage-1)*n,(currentPage-1)*n+n);}else currentPage=1;if(!notes.length){c.innerHTML='<div class="empty">No notes found.</div>';renderPagination(1);return;}c.innerHTML=notes.map(n=>renderNoteRow(n)).join("");renderPagination(pages);}
function renderNoteRow(note){const pl=db.settings.contentPreviewLength||60;const prev=note.content.replace(/\s+/g," ").trim().slice(0,pl);const lastCat=note.categoryId?(db.categories.find(c=>c.id===note.categoryId)||{}).name||"":"";const date=formatFullDateTime(note.modifiedAt);const rel=relativeTime(note.modifiedAt);const isMs=selectedIds.has(note.id);const isTrash=currentView==="trash";const fTags=note.tags.filter(t=>t!=="Bin");const tagsHtml=fTags.slice(0,5).map(t=>'<span class="meta-chip">🏷️ '+escapeHtml(t)+'</span>').join(" ")+(fTags.length>5?" ...":"");const lc=db.settings.noteLineCount||3;
if(isTrash){return '<div class="note-row has-checkbox '+(isMs?"ms-selected":"")+'" onclick="selectNote(\''+note.id+'\')"><div class="note-row-main"><div class="note-marker" style="--note-color:'+escapeAttribute(note.color)+'"></div><div class="note-row-body"><div class="note-line1"><span class="note-line1-title">'+escapeHtml(note.title)+'</span>'+(lc>=2?'<span class="note-line1-content">'+escapeHtml(prev||"No content")+'</span>':"")+'</div>'+(lc>=3?'<div class="note-line2">'+(lastCat?'<span class="meta-chip">📁 '+escapeHtml(lastCat)+'</span>':'<span class="meta-chip" style="color:var(--muted);">📁 Uncat</span>')+tagsHtml+'</div>':"")+(lc>=3?'<div class="note-line3">🕒 '+escapeHtml(date)+' ('+escapeHtml(rel)+')</div>':"")+'</div></div><div class="note-icons-bar"><button onclick="event.stopPropagation(); restoreNote(\''+note.id+'\')" title="Restore">↩</button><button class="del-ic" onclick="event.stopPropagation(); permanentDeleteNote(\''+note.id+'\')" title="Permanent Delete">🗑</button></div></div>';}
return '<div class="note-row has-checkbox '+(selectedNoteId===note.id?"active":"")+' '+(isMs?"ms-selected":"")+'" onclick="selectNote(\''+note.id+'\')" oncontextmenu="event.preventDefault(); showContextMenu(event, \''+note.id+'\');"><div class="note-row-main"><div class="note-marker" style="--note-color:'+escapeAttribute(note.color)+'"></div><div class="note-row-body"><div class="note-line1"><span class="note-line1-title">'+escapeHtml(note.title)+'</span>'+(lc>=2?'<span class="note-line1-content">'+escapeHtml(prev||"No content")+'</span>':"")+'</div>'+(lc>=3?'<div class="note-line2">'+(lastCat?'<span class="meta-chip">📁 '+escapeHtml(lastCat)+'</span>':'<span class="meta-chip" style="color:var(--muted);">📁 Uncat</span>')+tagsHtml+'</div>':"")+(lc>=3?'<div class="note-line3">🕒 '+escapeHtml(date)+' ('+escapeHtml(rel)+')</div>':"")+'</div></div><div class="note-icons-bar"><button class="'+(note.pinned?"pin-on":"")+'" onclick="event.stopPropagation(); togglePinned(\''+note.id+'\')" title="Pin">📌</button><button class="'+(note.favorite?"fav-on":"")+'" onclick="event.stopPropagation(); toggleFavorite(\''+note.id+'\')" title="Favorite">'+(note.favorite?"★":"☆")+'</button><button class="edit-ic" onclick="event.stopPropagation(); editingNoteId=\''+note.id+'\'; selectedNoteId=\''+note.id+'\'; renderDetail();" title="Edit">✎</button><button class="del-ic" onclick="event.stopPropagation(); deleteNoteWithConfirm(\''+note.id+'\')" title="Delete">🗑</button></div></div>';}
function showContextMenu(e,id){e.preventDefault();const m=document.getElementById("contextMenu");m.innerHTML='<button onclick="ctxDuplicate(\''+id+'\')">⎘ Duplicate</button><button onclick="ctxTogglePin(\''+id+'\')">📌 Pin</button><button onclick="ctxToggleFav(\''+id+'\')">⭐ Fav</button><button onclick="ctxExport(\''+id+'\')">↗ Export</button><button style="color:#dc2626;" onclick="ctxDelete(\''+id+'\')">🗑 Delete</button>';const x=e.touches?e.touches[0].clientX:e.clientX;const y=e.touches?e.touches[0].clientY:e.clientY;m.style.left=Math.min(x,window.innerWidth-200)+"px";m.style.top=Math.min(y,window.innerHeight-200)+"px";m.classList.add("show");}
function ctxDuplicate(id){duplicateNote(id);closeCtx();}
function ctxTogglePin(id){togglePinned(id);closeCtx();}
function ctxToggleFav(id){toggleFavorite(id);closeCtx();}
function ctxExport(id){openExportDialog(id);closeCtx();}
function ctxDelete(id){deleteNoteWithConfirm(id);closeCtx();}
function closeCtx(){document.getElementById("contextMenu").classList.remove("show");}
let noteLongPressTimer=null;
document.addEventListener("touchstart",(e)=>{const r=e.target.closest(".note-row");if(!r)return;noteLongPressTimer=setTimeout(()=>{const id=r.getAttribute("onclick")?.match(/'([^']+)'/)?.[1];if(id)showContextMenu(e,id);},600);});
document.addEventListener("touchend",()=>clearTimeout(noteLongPressTimer));
document.addEventListener("touchmove",()=>clearTimeout(noteLongPressTimer));
function renderPagination(pages){const c=document.getElementById("pagination");if(pages<=1){c.style.display="none";return;}c.style.display="flex";c.innerHTML='<button onclick="changePage(-1)" '+(currentPage<=1?"disabled":"")+'>Prev</button><span style="font-size:12px;">'+currentPage+' / '+pages+'</span><button onclick="changePage(1)" '+(currentPage>=pages?"disabled":"")+'>Next</button>';}
function changePage(d){currentPage+=d;renderNoteList();}
function renderBinToolbar(){const w=document.getElementById("binToolbarWrap");if(!w)return;if(currentView!=="trash"){w.innerHTML="";return;}const total=db.notes.filter(n=>n.deleted&&!n.trashHidden).length;const sel=selectedIds.size;w.innerHTML='<div class="bin-toolbar"><button class="ctrl-btn success" onclick="binRestoreSelected()" '+(sel?"":"disabled")+'>↩ Restore</button><button class="ctrl-btn danger" onclick="emptyBin()" '+(total?"":"disabled")+'>Empty Bin</button><span class="bin-toolbar-info">'+sel+' of '+total+' selected</span></div>';}
function restoreNote(id){const n=getNote(id);if(!n)return;n.deleted=false;n.trashHidden=false;n.restoredCount=Number(n.restoredCount||0)+1;n.lastRestoredAt=new Date().toISOString();n.modifiedAt=new Date().toISOString();markChanged();refreshUI();showToast("Restored.","success");}
function permanentDeleteNote(id){const n=getNote(id);if(!n)return;if(!confirm("Permanently delete '"+n.title+"'?"))return;db.notes=db.notes.filter(x=>x.id!==id);selectedIds.delete(id);markChanged();refreshUI();showToast("Deleted.","success");}
function binRestoreSelected(){if(!selectedIds.size){showToast("Select first.","normal");return;}selectedIds.forEach(id=>{const n=getNote(id);if(n){n.deleted=false;n.trashHidden=false;n.restoredCount=Number(n.restoredCount||0)+1;n.lastRestoredAt=new Date().toISOString();n.modifiedAt=new Date().toISOString();}});selectedIds.clear();markChanged();refreshUI();showToast("Restored.","success");}
function binPermanentDeleteSelected(){if(!selectedIds.size){showToast("Select first.","normal");return;}if(!confirm("Permanently delete "+selectedIds.size+" note(s)?"))return;db.notes=db.notes.filter(n=>!selectedIds.has(n.id));selectedIds.clear();markChanged();refreshUI();showToast("Deleted.","success");}
function emptyBin(){const d=db.notes.filter(n=>n.deleted&&!n.trashHidden);if(!d.length){showToast("Empty.","normal");return;}if(!confirm("Empty Bin? "+d.length+" notes will be PERMANENTLY deleted."))return;db.notes=db.notes.filter(n=>!(n.deleted&&!n.trashHidden));selectedIds.clear();markChanged();refreshUI();showToast("Emptied.","success");}
function deleteSelected(){if(!selectedIds.size){showToast("Select first.","normal");return;}if(currentView==="trash"){binPermanentDeleteSelected();return;}if(!confirm("Move "+selectedIds.size+" note(s) to Bin?"))return;selectedIds.forEach(id=>{const n=getNote(id);if(n){n.deleted=true;n.trashHidden=false;n.deletedAt=new Date().toISOString();if(db.settings.autoAssignBinTag&&!n.tags.includes("Bin"))n.tags.push("Bin");n.modifiedAt=new Date().toISOString();}});selectedIds.clear();markChanged();refreshUI();showToast("Moved.","success");}
function openSettings(){currentView="settings";document.getElementById("listTitle").textContent="Settings";document.getElementById("listCount").textContent="";document.getElementById("noteList").innerHTML="";document.getElementById("binToolbarWrap").innerHTML="";document.getElementById("pagination").style.display="none";document.getElementById("workspace").classList.add("settings-mode");const d=document.getElementById("detailBody");d.innerHTML=renderSettings();selectedNoteId=null;editingNoteId=null;}
function renderSettings(){const s=db.settings;return '<div style="padding:14px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;"><h3 style="margin:0;">Settings</h3><button class="ctrl-btn" onclick="setView(\'all\')">✕ Close</button></div><div class="settings-grid"><div class="setting"><label>Theme</label><select onchange="saveSetting(\'theme\',this.value)">'+option("Day",s.theme)+option("Night",s.theme)+option("System",s.theme)+'</select></div><div class="setting"><label>Font Size</label><select onchange="saveSetting(\'fontSize\',this.value)">'+option("Small",s.fontSize)+option("Normal",s.fontSize)+option("Large",s.fontSize)+option("Extra Large",s.fontSize)+'</select></div><div class="setting"><label>Sorting</label><select onchange="saveSetting(\'sorting\',this.value)">'+option("Last Modified First",s.sorting)+option("Newest",s.sorting)+option("Oldest",s.sorting)+option("Alphabetical",s.sorting)+'</select></div><div class="setting"><label>Notes Per Page</label><select onchange="saveSetting(\'notesPerPage\', this.value === \'All\' ? \'All\' : Number(this.value))">'+["5","10","20","50","100","All"].map(x=>'<option value="'+x+'" '+(String(s.notesPerPage)===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div><div class="setting"><label>Note List Height</label><select onchange="saveSetting(\'notesVisibleNoScroll\', this.value === \'All\' ? \'All\' : Number(this.value))">'+["3","5","10","15","20","All"].map(x=>'<option value="'+x+'" '+(String(s.notesVisibleNoScroll)===x?"selected":"")+'>'+(x==="All"?"All":x+" notes")+'</option>').join("")+'</select></div><div class="setting"><label>Note Line Count</label><select onchange="saveSetting(\'noteLineCount\',Number(this.value))">'+[2,3,4].map(x=>'<option value="'+x+'" '+(s.noteLineCount===x?"selected":"")+'>'+x+' lines</option>').join("")+'</select></div><div class="setting"><label>Preview Length</label><select onchange="saveSetting(\'contentPreviewLength\',Number(this.value))">'+[40,60,100,150].map(x=>'<option value="'+x+'" '+(Number(s.contentPreviewLength)===x?"selected":"")+'>'+x+' chars</option>').join("")+'</select></div><div class="setting"><label>Sidebar Width</label><select onchange="saveSetting(\'sidebarWidth\', Number(this.value))"><option value="240" '+(s.sidebarWidth===240?"selected":"")+'>Narrow (240)</option><option value="290" '+(s.sidebarWidth===290?"selected":"")+'>Normal (290)</option><option value="340" '+(s.sidebarWidth===340?"selected":"")+'>Wide (340)</option><option value="400" '+(s.sidebarWidth===400?"selected":"")+'>Extra (400)</option></select></div><div class="setting"><label>Sidebar Border</label><select onchange="saveSetting(\'sidebarBorder\',Number(this.value))">'+[0,1,2,3].map(x=>'<option value="'+x+'" '+(Number(s.sidebarBorder)===x?"selected":"")+'>'+x+'px</option>').join("")+'</select></div><div class="setting"><label>Section Height</label><select onchange="saveSetting(\'sectionHeight\',Number(this.value))">'+[32,38,44,50].map(x=>'<option value="'+x+'" '+(Number(s.sectionHeight)===x?"selected":"")+'>'+x+'px</option>').join("")+'</select></div><div class="setting"><label>Note List BG</label><input type="color" value="'+escapeAttribute(s.noteListBg||"#ffffff")+'" onchange="saveSetting(\'noteListBg\',this.value)"></div><div class="setting"><label>Note Panel BG</label><input type="color" value="'+escapeAttribute(s.notePanelBg||"#ffffff")+'" onchange="saveSetting(\'notePanelBg\',this.value)"></div><div class="setting"><label>Autosave</label><select onchange="saveSetting(\'autosave\',this.value === \'true\')"><option value="true" '+(s.autosave?"selected":"")+'>On</option><option value="false" '+(!s.autosave?"selected":"")+'>Off</option></select></div><div class="setting"><label>Autosave Interval</label><select onchange="saveSetting(\'autosaveInterval\',Number(this.value))">'+[5,10,15,30,60].map(x=>'<option value="'+x+'" '+(Number(s.autosaveInterval)===x?"selected":"")+'>'+x+'s</option>').join("")+'</select></div><div class="setting"><label>Delete Confirmation</label><select onchange="saveSetting(\'deleteConfirmation\',this.value === \'true\')"><option value="true" '+(s.deleteConfirmation?"selected":"")+'>On</option><option value="false" '+(!s.deleteConfirmation?"selected":"")+'>Off</option></select></div><div class="setting"><label>Date Format</label><select onchange="saveSetting(\'dateTimeFormat\',this.value)">'+option("Local",s.dateTimeFormat)+option("12 Hour",s.dateTimeFormat)+option("24 Hour",s.dateTimeFormat)+'</select></div><div class="setting"><label>Default Colour</label><input type="color" value="'+escapeAttribute(s.defaultNoteColor||"#64748b")+'" onchange="saveSetting(\'defaultNoteColor\',this.value)"></div><div class="setting"><label>Auto "Bin" Tag</label><select onchange="saveSetting(\'autoAssignBinTag\',this.value === \'true\')"><option value="true" '+(s.autoAssignBinTag?"selected":"")+'>On</option><option value="false" '+(!s.autoAssignBinTag?"selected":"")+'>Off</option></select></div><div class="setting"><label>Metadata Default</label><select onchange="saveSetting(\'metadataCollapsed\',this.value === \'true\')"><option value="true" '+(s.metadataCollapsed?"selected":"")+'>Collapsed</option><option value="false" '+(!s.metadataCollapsed?"selected":"")+'>Expanded</option></select></div><div class="setting"><label>Sidebar Sections Default</label><select onchange="saveSetting(\'sidebarSectionsDefault\',this.value)"><option value="both-collapsed" '+(s.sidebarSectionsDefault==="both-collapsed"?"selected":"")+'>Both Collapsed</option><option value="both-expanded" '+(s.sidebarSectionsDefault==="both-expanded"?"selected":"")+'>Both Expanded</option></select></div><div class="setting"><label>Recycle Bin Name</label><select onchange="changeTrashLabel(this.value)">'+["Recycle Bin","Trash","Dustbin","Deleted Items","Bin","Waste Bin"].map(x=>'<option '+(x===db.trash.label?"selected":"")+'>'+escapeHtml(x)+'</option>').join("")+'</select></div></div><div style="margin-top:18px;display:flex;gap:6px;flex-wrap:wrap;"><button class="ctrl-btn" onclick="exportDatabaseJSON()">Export JSON</button><button class="ctrl-btn" onclick="showDatabaseStats()">Show Stats</button></div><div style="margin-top:20px;padding:12px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);font-size:11px;color:var(--muted);"><strong style="color:var(--text);">Database:</strong> '+escapeHtml(DATABASE_NAME)+'<br><strong style="color:var(--text);">Drive:</strong> '+(databaseFolderId?'<a href="https://drive.google.com/drive/folders/'+databaseFolderId+'" target="_blank" style="color:var(--primary);">Open Folder</a>':databaseFileId?'<a href="https://drive.google.com/file/d/'+databaseFileId+'/view" target="_blank" style="color:var(--primary);">Open File</a>':"Not connected")+'</div></div>';}
function option(v,s){return '<option value="'+escapeAttribute(v)+'" '+(v===s?"selected":"")+'>'+escapeHtml(v)+'</option>';}
function saveSetting(k,v){db.settings[k]=v;applySettings();markChanged();showToast("Saved.","success");}
function changeTrashLabel(v){db.trash.label=v;markChanged();document.getElementById("trashLabel").textContent=v;renderListTitle();}
function exportDatabaseJSON(){const b=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="NotesManagerDB_"+Date.now()+".json";a.click();URL.revokeObjectURL(a.href);showToast("Exported.","success");}
function showDatabaseStats(){const a=db.notes.filter(n=>!n.deleted).length;const d=db.notes.filter(n=>n.deleted).length;const t=new Set();db.notes.forEach(n=>n.tags.forEach(x=>{if(x!=="Bin")t.add(x);}));alert("Active: "+a+"\nDeleted: "+d+"\nCategories: "+db.categories.length+"\nTags: "+t.size+"\nLinks: "+globalLinks.length+"\nGroups: "+linkGroups.length);}
function applySettings(){const t=db.settings.theme;document.body.classList.remove("night");if(t==="Night")document.body.classList.add("night");else if(t==="System"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)document.body.classList.add("night");const fs={"Small":"13px","Normal":"15px","Large":"17px","Extra Large":"19px"};document.documentElement.style.setProperty("--font-size",fs[db.settings.fontSize]||"15px");if(db.settings.sidebarWidth)document.documentElement.style.setProperty("--sidebar-width",db.settings.sidebarWidth+"px");if(db.settings.sidebarBorder!==undefined)document.documentElement.style.setProperty("--sidebar-border",db.settings.sidebarBorder+"px");if(db.settings.sectionHeight)document.documentElement.style.setProperty("--section-height",db.settings.sectionHeight+"px");if(db.settings.noteListBg)document.documentElement.style.setProperty("--note-list-bg",db.settings.noteListBg);if(db.settings.notePanelBg)document.documentElement.style.setProperty("--note-panel-bg",db.settings.notePanelBg);const listEl=document.getElementById("noteList");if(listEl){const v=db.settings.notesVisibleNoScroll;const rh=88;if(v==="All"){listEl.style.height="auto";listEl.style.maxHeight="calc(100vh - 240px)";}else{const h=(Number(v)*rh)+"px";listEl.style.height=h;listEl.style.maxHeight=h;}}document.getElementById("trashLabel").textContent=db.trash.label||"Recycle Bin";updateFooter();}
function refreshUI(){if(currentView==="settings"){openSettings();return;}renderSidebar();renderListTitle();renderNoteList();renderBinToolbar();renderDetail();updateDeleteButton();const sf=document.getElementById("sortFilter");if(sf)sf.value=db.settings.sorting;updateLastSyncDisplay();}
document.getElementById("searchInput").addEventListener("input",function(){searchText=this.value.trim();currentPage=1;renderNoteList();});
document.getElementById("floatingToggle").addEventListener("click",toggleSidebar);
document.getElementById("sidebarOverlay").addEventListener("click",()=>{if(sidebarOpen)toggleSidebar();});
document.getElementById("connectBtn").addEventListener("click",connectDrive);
document.getElementById("syncBtn").addEventListener("click",synchronize);
document.getElementById("addBtn").addEventListener("click",addNote);
document.getElementById("deleteSelectedBtn").addEventListener("click",deleteSelected);
document.getElementById("emptyBinBtn").addEventListener("click",emptyBin);
document.addEventListener("keydown",function(e){if(e.ctrlKey&&e.key.toLowerCase()==="s"){e.preventDefault();if(editingNoteId)saveCurrent();else if(pendingChanges)saveDatabaseToDrive();}});
function formatFullDateTime(value){if(!value)return"—";const d=new Date(value);if(Number.isNaN(d.getTime()))return"—";const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];const day=d.getDate();const mo=m[d.getMonth()];const y=d.getFullYear();let h=d.getHours();const mi=String(d.getMinutes()).padStart(2,"0");const s=String(d.getSeconds()).padStart(2,"0");const ap=h>=12?"PM":"AM";h=h%12;if(h===0)h=12;const hh=String(h).padStart(2,"0");return day+"-"+mo+"-"+y+", "+hh+":"+mi+":"+s+" "+ap;}
function formatShortTime(v){if(!v)return"—";const d=new Date(v);if(Number.isNaN(d.getTime()))return"—";return d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit",hour12:true});}
function generateId(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);}
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function escapeAttribute(v){return escapeHtml(v);}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove("show"),2500);}
/* Tooltip for status items */
document.addEventListener("mouseover",(e)=>{const it=e.target.closest("[data-tip]");const tb=document.getElementById("tooltipBox");if(it&&tb){const r=it.getBoundingClientRect();tb.textContent=it.getAttribute("data-tip");tb.style.left=r.left+"px";tb.style.top=(r.bottom+4)+"px";tb.classList.add("show");}});
document.addEventListener("mouseout",(e)=>{const tb=document.getElementById("tooltipBox");if(tb)tb.classList.remove("show");});
function initializeApp(){sidebarOpen=false;document.getElementById("sidebar").classList.remove("open");document.getElementById("sidebarOverlay").classList.remove("open");db=normalizeDatabase(db);globalLinks=Array.isArray(db.globalLinks)?db.globalLinks:[];linkGroups=Array.isArray(db.linkGroups)?db.linkGroups:[];applySettings();renderSidebar();renderListTitle();renderNoteList();renderBinToolbar();renderDetail();updateSyncStatus();updateFooter();updateLastSyncDisplay();startRelTimeTicker();initializeGoogle();}
if(window.matchMedia){const m=window.matchMedia("(prefers-color-scheme: dark)");m.addEventListener("change",()=>{if(db.settings.theme==="System")applySettings();});}
initializeApp();
</script>
