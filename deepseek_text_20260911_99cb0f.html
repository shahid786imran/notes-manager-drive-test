<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes Manager</title>
<style>
:root{--bg:#f4f6f9;--surface:#ffffff;--surface2:#f8fafc;--text:#172033;--muted:#697386;--border:#dfe4ec;--primary:#2563eb;--primary2:#1d4ed8;--danger:#dc2626;--success:#15803d;--warning:#b45309;--shadow:0 8px 25px rgba(20,30,50,.08);--radius:12px;--font-size:15px;--sidebar-width:290px;--sidebar-border:1px;--note-list-bg:#ffffff;--note-panel-bg:#ffffff;--section-height:38px;--icons-bar-bg:#f8fafc;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100%;}
body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;font-size:var(--font-size);}
button,select,input,textarea{font:inherit;}
button{cursor:pointer;}
.floating-toggle{position:fixed;top:10px;left:10px;z-index:3000;width:46px;height:46px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);box-shadow:0 6px 20px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;padding:0;}
.floating-toggle:hover{background:#eef2ff;}
.floating-toggle .hamburger{display:flex;flex-direction:column;gap:4px;}
.floating-toggle .hamburger span{width:20px;height:2.5px;background:var(--text);border-radius:2px;display:block;}
.floating-toggle .arrow-icon{font-size:18px;line-height:1;}
.top-area{background:var(--surface);border-bottom:1px solid var(--border);box-shadow:0 2px 8px rgba(0,0,0,.04);padding:6px 10px 6px 66px;position:sticky;top:0;z-index:1000;}
.status-row{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;margin-bottom:6px;line-height:1.3;}
.status-item{display:inline-flex;align-items:center;gap:4px;cursor:help;position:relative;}
.status-dot{width:10px;height:10px;border-radius:50%;background:#94a3b8;flex:none;display:inline-block;}
.status-dot.green{background:#22c55e;}
.status-dot.red{background:#dc2626;}
.status-dot.amber{background:#f59e0b;}
.status-time{color:#2563eb;font-size:11px;font-weight:700;}
.top-buttons{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;}
.top-buttons .btn{flex:0 0 auto;height:32px;min-width:42px;padding:0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;transition:.15s ease;}
.top-buttons .btn:hover{background:#f1f5f9;}
.top-buttons .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.top-buttons .btn.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.top-buttons .btn.success{background:var(--success);color:#fff;border-color:var(--success);}
.top-buttons .btn.hidden{display:none;}
.top-buttons .btn:disabled{opacity:.45;cursor:not-allowed;}
.sidebar-overlay{position:fixed;inset:0;z-index:1900;background:rgba(0,0,0,.22);display:none;}
.sidebar-overlay.open{display:block;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-width);z-index:2000;background:var(--surface);border-right:var(--sidebar-border) solid var(--border);box-shadow:10px 0 25px rgba(0,0,0,.08);transform:translateX(-105%);transition:transform .2s ease;overflow-y:auto;overscroll-behavior:contain;padding:10px;padding-top:66px;scrollbar-width:none;}
.sidebar::-webkit-scrollbar{display:none;}
.sidebar.open{transform:translateX(0);}
.sidebar-title{font-size:15px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--primary);padding:0 9px 10px;margin-bottom:4px;border-bottom:1px solid var(--border);}
.sidebar-section{margin-bottom:4px;}
.sidebar-item{position:relative;min-height:var(--section-height);display:flex;align-items:center;gap:8px;padding:0 9px;border-radius:8px;cursor:pointer;color:var(--text);}
.sidebar-item:hover,.sidebar-item.active{background:#eef2ff;}
.sidebar-icon{width:20px;text-align:center;flex:none;}
.sidebar-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sidebar-count{color:var(--muted);font-size:11px;flex:none;}
.bin-badge{background:#dc2626;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;flex:none;min-width:18px;text-align:center;}
.sidebar-divider{height:1px;background:#e2e8f0;margin:8px 4px;border:0;}
.sidebar-controls{display:flex;gap:3px;flex:none;}
.sidebar-ctrl{width:24px;height:24px;min-width:24px;padding:0;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:11px;display:inline-flex;align-items:center;justify-content:center;line-height:1;}
.sidebar-ctrl:hover{background:#e2e8f0;}
.sidebar-ctrl.danger:hover{background:#fef2f2;border-color:#fecaca;color:#dc2626;}
.sidebar-collapse{margin-top:3px;padding-left:12px;display:none;}
.sidebar-collapse.open{display:block;}
.sidebar-subtitle{padding:6px 9px;color:var(--muted);font-size:11px;}
.cat-row{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:8px;}
.cat-row:hover{background:#f8fafc;}
.cat-row-btns{display:flex;gap:3px;flex:none;order:3;}
.cat-expander{width:22px;height:22px;padding:0;border:1px solid var(--border);border-radius:5px;background:var(--surface);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;line-height:1;flex:none;}
.cat-expander:hover{background:#e2e8f0;}
.tree-children{display:none;}
.tree-children.open{display:block;}
.main{min-height:calc(100vh - 140px);padding:12px;}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.search-box{flex:1;min-width:180px;}
.search-box input{width:100%;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);outline:none;}
.search-box input:focus{border-color:var(--primary);}
.workspace{display:grid;grid-template-columns:minmax(260px,34%) 1fr;gap:10px;min-height:calc(100vh - 220px);}
.workspace.settings-mode{grid-template-columns:1fr;}
.workspace.settings-mode .toolbar,.workspace.settings-mode .filter-sort-bar,.workspace.settings-mode .search-box{display:none !important;}
.workspace.settings-mode .panel:first-child{display:none !important;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.panel-header{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);}
.panel-title{font-weight:700;}
.filter-sort-bar{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--surface2);flex-wrap:wrap;align-items:center;}
.filter-sort-bar select{height:26px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 6px;}
.note-list{overflow-y:auto;overscroll-behavior:contain;background:var(--note-list-bg);}
.note-row{display:flex;flex-direction:column;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.note-row:hover{background:#f8fafc;}
.note-row.active{background:#93c5fd;}
.note-row.ms-selected{background:#bfdbfe;}
.note-row-main{display:flex;align-items:flex-start;gap:9px;padding:9px 11px 6px;}
.note-marker{width:5px;min-width:5px;height:auto;align-self:stretch;border-radius:5px;background:var(--note-color,#94a3b8);}
.note-row-body{flex:1;min-width:0;}
.note-line1{display:flex;gap:6px;align-items:baseline;min-width:0;}
.note-line1-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;max-width:55%;}
.note-line1-content{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0;}
.note-line2{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted);}
.note-line3{margin-top:4px;font-size:10px;color:var(--muted);}
.note-line2 .meta-chip{display:inline-flex;align-items:center;gap:3px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.note-icons-bar{display:flex;justify-content:space-around;align-items:center;padding:4px 11px;background:var(--icons-bar-bg);border-top:1px solid var(--border);}
.note-icons-bar button{background:transparent;border:0;color:#94a3b8;font-size:18px;padding:2px 6px;cursor:pointer;line-height:1;transition:color .15s;}
.note-icons-bar button.pin-on{color:#b45309;}
.note-icons-bar button.fav-on{color:#d97706;}
.note-icons-bar button.edit-ic:hover{color:#2563eb;}
.note-icons-bar button.del-ic:hover{color:#dc2626;}
.note-row.has-checkbox{padding-left:36px;position:relative;}
.note-row.has-checkbox::before{content:"";position:absolute;left:12px;top:14px;width:16px;height:16px;border:2px solid var(--border);border-radius:4px;background:var(--surface);cursor:pointer;z-index:2;}
.note-row.has-checkbox.ms-selected::before{background:var(--primary);border-color:var(--primary);content:"✓";color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.detail{min-width:0;}
.detail-body{padding:0;background:var(--note-panel-bg);}
.note-panel-border{border:5px solid var(--note-color,#94a3b8);border-radius:12px;overflow:hidden;}
.note-controls-card{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface2);flex-wrap:wrap;}
.note-controls-left{display:flex;gap:5px;flex-wrap:wrap;}
.note-controls-right{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap;}
.ctrl-btn{height:30px;min-width:62px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--text);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;}
.ctrl-btn:hover{background:#f1f5f9;}
.ctrl-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.ctrl-btn.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.ctrl-btn.success{background:var(--success);color:#fff;border-color:var(--success);}
.heading-card{padding:10px 12px;border-bottom:1px solid var(--border);}
.heading-input{width:100%;border:0;background:transparent;outline:none;font-size:22px;font-weight:700;color:var(--text);padding:4px 0;}
.heading-display{font-size:22px;font-weight:700;line-height:1.3;word-break:break-word;min-height:28px;}
.content-bar{border-bottom:1px solid var(--border);}
.content-toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:6px 10px;background:var(--surface2);border-bottom:1px solid var(--border);align-items:center;}
.tool-btn{width:30px;height:28px;min-width:30px;padding:0;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.tool-btn:hover{background:#e2e8f0;}
.tool-btn.wide{width:auto;min-width:auto;padding:0 8px;gap:4px;}
.tool-sep{width:1px;height:20px;background:var(--border);margin:0 3px;}
.content-editable{min-height:120px;padding:10px 12px;outline:none;line-height:1.6;word-break:break-word;font-size:14px;}
.content-editable:empty:before{content:attr(data-placeholder);color:var(--muted);}
.content-editable a{color:var(--primary);text-decoration:underline;cursor:pointer;}
.content-display{padding:10px 12px;white-space:pre-wrap;line-height:1.6;word-break:break-word;min-height:120px;}
.content-display a{color:var(--primary);text-decoration:underline;}
.links-card{margin:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface);}
.links-card-header{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--surface2);border-bottom:1px solid var(--border);gap:6px;}
.links-card-title{font-size:12px;font-weight:700;color:var(--muted);}
.links-card-header-actions{display:flex;gap:4px;}
.link-item{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px;}
.link-item:last-child{border-bottom:0;}
.link-item-text{flex:0 0 auto;font-weight:600;max-width:35%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.link-item-url{flex:1 1 auto;color:var(--primary);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.link-item-actions{display:flex;gap:3px;flex:none;}
.link-icon-btn{width:24px;height:24px;min-width:24px;padding:0;border:1px solid var(--border);border-radius:5px;background:var(--surface);cursor:pointer;font-size:11px;display:inline-flex;align-items:center;justify-content:center;}
.link-icon-btn:hover{background:#e2e8f0;}
.link-icon-btn.danger:hover{background:#fef2f2;color:#dc2626;}
.tags-cat-card{margin:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px;}
.tags-cat-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.tags-cat-row:last-child{margin-bottom:0;}
.tags-cat-label{font-size:11px;font-weight:700;color:var(--muted);min-width:56px;}
.tag-chip{display:inline-flex;align-items:center;gap:3px;border:1px solid #cbd5e1;border-radius:999px;padding:2px 8px;background:#f8fafc;font-size:11px;}
.tag-chip .chip-x{cursor:pointer;color:#94a3b8;font-weight:700;}
.tag-chip .chip-x:hover{color:#dc2626;}
.tags-input-inline{flex:1;min-width:140px;height:28px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);outline:none;font-size:12px;}
.tags-input-inline:focus{border-color:var(--primary);}
.small-action-btn{height:28px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:3px;}
.small-action-btn:hover{background:#e2e8f0;}
.small-action-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.small-action-btn.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.small-action-btn.success{background:var(--success);color:#fff;border-color:var(--success);}
.metadata-box{margin:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#f8fafc;color:#697386;}
.metadata-title{padding:7px 10px;font-size:12px;font-weight:700;background:#f1f5f9;border-bottom:1px solid var(--border);color:#697386;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.metadata-title .toggle-icon{font-size:11px;color:#94a3b8;}
.metadata-body{display:block;}
.metadata-body.collapsed{display:none;}
.metadata-table{width:100%;border-collapse:collapse;table-layout:fixed;}
.metadata-table td{padding:5px 8px;font-size:11px;line-height:1.3;vertical-align:top;border:1px solid var(--border);word-break:break-word;color:#697386;}
.metadata-table td.label{width:22%;color:#697386;font-weight:700;background:#f1f5f9;}
.metadata-table td.value{width:28%;color:#697386;}
.metadata-table a.cat-link{color:#2563eb;text-decoration:none;cursor:pointer;}
.metadata-actions{padding:8px 10px;display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid var(--border);background:#f1f5f9;}
.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);padding:20px;text-align:center;flex-direction:column;gap:8px;min-height:100px;}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;}
.setting{border:1px solid var(--border);border-radius:9px;padding:10px;background:var(--surface2);}
.setting label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:700;}
.setting select,.setting input[type="text"],.setting input[type="number"],.setting input[type="color"]{width:100%;height:34px;border:1px solid var(--border);border-radius:7px;background:var(--surface);padding:0 7px;}
.setting input[type="color"]{padding:0;cursor:pointer;}
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-top:1px solid var(--border);}
.pagination button{height:28px;min-width:60px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12px;}
.bin-toolbar{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface2);flex-wrap:wrap;align-items:center;}
.bin-toolbar-info{font-size:11px;color:var(--muted);margin-left:auto;}
.toast{position:fixed;right:15px;bottom:15px;z-index:5000;max-width:360px;padding:10px 13px;border-radius:8px;background:#172033;color:#fff;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.2);transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s ease;}
.toast.show{transform:translateY(0);opacity:1;}
.undo-bar{position:fixed;left:50%;transform:translateX(-50%) translateY(80px);bottom:20px;z-index:5000;background:#172033;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:.2s ease;}
.undo-bar.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto;}
.undo-bar button{background:transparent;color:#60a5fa;border:1px solid #60a5fa;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12px;font-weight:700;}
.app-footer{padding:14px 12px;text-align:center;border-top:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:11px;margin-top:20px;}
.app-footer a{color:var(--primary);text-decoration:none;font-weight:600;}
.app-footer a:hover{text-decoration:underline;}
.popup-backdrop{position:fixed;inset:0;z-index:5500;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;}
.popup-backdrop.show{display:flex;}
.popup{background:var(--surface);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;animation:popIn .18s ease;}
@keyframes popIn{from{transform:scale(.95);opacity:0;}to{transform:scale(1);opacity:1;}}
.popup-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface2);}
.popup-title{font-weight:700;font-size:14px;}
.popup-close{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;}
.popup-close:hover{background:#e2e8f0;}
.popup-body{padding:12px 14px;overflow-y:auto;flex:1;}
.popup-footer{padding:10px 14px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:6px;background:var(--surface2);}
.popup-field{margin-bottom:10px;}
.popup-field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px;}
.popup-field input,.popup-field textarea,.popup-field select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);outline:none;font-size:13px;}
.popup-field input:focus,.popup-field textarea:focus,.popup-field select:focus{border-color:var(--primary);}
.popup-btn{height:32px;min-width:80px;padding:0 12px;border:1px solid var(--border);border-radius:7px;background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;}
.popup-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.popup-btn.danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.popup-btn:hover{filter:brightness(.96);}
.cat-tree{max-height:250px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--surface2);}
.cat-tree-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;}
.cat-tree-row:hover{background:#eef2ff;}
.cat-tree-row.selected{background:#dbeafe;font-weight:700;}
.cat-tree-row .cat-radio{width:14px;height:14px;border:2px solid var(--border);border-radius:50%;flex:none;}
.cat-tree-row.selected .cat-radio{background:var(--primary);border-color:var(--primary);}
.dropdown-popup{position:fixed;z-index:5600;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:8px;display:none;max-width:320px;}
.dropdown-popup.show{display:block;}
.color-swatch-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.color-swatch{width:36px;height:36px;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:.12s;}
.color-swatch:hover{transform:scale(1.08);}
.color-swatch.selected{border-color:#172033;box-shadow:0 0 0 2px #fff inset;}
.color-custom-row{display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
.color-custom-row input{flex:1;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;}
.color-custom-row button{height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--primary);background:var(--primary);color:#fff;font-size:12px;font-weight:600;cursor:pointer;}
.link-ctx-menu{position:fixed;z-index:5600;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:4px 0;min-width:180px;display:none;}
.link-ctx-menu.show{display:block;}

<script>
const CLIENT_ID="262106898132-tsn94p3vvpf34do0ommc6rai2mtc5sh6.apps.googleusercontent.com";
const DRIVE_SCOPE="https://www.googleapis.com/auth/drive";
const DATABASE_NAME="NotesManagerDB.json";
const DATABASE_FOLDER_ID="";
let accessToken=null;let tokenClient=null;let databaseFileId=null;let databaseFolderId=null;
let db=createEmptyDatabase();let selectedNoteId=null;let editingNoteId=null;
let currentView="all";let currentCategoryId=null;let currentTagName=null;let searchText="";
let sidebarOpen=false;let currentPage=1;let autosaveTimer=null;let relTimeTimer=null;
let saveInProgress=false;let pendingChanges=false;let lastSuccessfulSync=null;
let selectedIds=new Set();let globalLinks=[];let linkGroups=[];
let undoDeleteSnapshot=null;let undoTimer=null;let popupResolve=null;
let collapsedGroups=new Set();
const COLOR_PALETTE=["#64748b","#dc2626","#ea580c","#d97706","#ca8a04","#65a30d","#16a34a","#059669","#0d9488","#0891b2","#0284c7","#2563eb","#4f46e5","#7c3aed","#9333ea","#c026d3","#db2777","#e11d48","#78350f","#1e293b"];
function createEmptyDatabase(){return{version:12,settings:{theme:"System",fontSize:"Normal",sorting:"Last Modified First",notesPerPage:5,notesVisibleNoScroll:5,sidebarWidth:290,sidebarBorder:1,sectionHeight:38,noteListBg:"#ffffff",notePanelBg:"#ffffff",noteLineCount:3,contentPreviewLength:60,deleteConfirmation:true,autosave:true,autosaveInterval:5,dateTimeFormat:"12 Hour",defaultNoteColor:"#64748b",autoAssignBinTag:true,metadataCollapsed:true,categoriesCollapsed:true,tagsCollapsed:true,linksCollapsed:true,sidebarSectionsDefault:"both-collapsed"},trash:{label:"Recycle Bin"},categories:[],tags:[],notes:[],globalLinks:[],linkGroups:[],meta:{created:new Date().toISOString(),updated:new Date().toISOString()}};}
function initializeGoogle(){if(typeof google==="undefined"||!google.accounts||!google.accounts.oauth2){showToast("Google Identity Services load nahi hui.","error");return;}tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:DRIVE_SCOPE,callback:function(response){if(response.error){console.error(response);showToast("Drive connection failed.","error");return;}accessToken=response.access_token;setDriveConnected(true);showToast("Drive Connected","success");loadDatabase();}});}
function connectDrive(){if(!tokenClient){initializeGoogle();setTimeout(()=>{if(tokenClient)requestDriveToken();},300);return;}requestDriveToken();}
function requestDriveToken(){try{tokenClient.requestAccessToken({prompt:""});}catch(error){console.error(error);showToast("Drive connection could not start.","error");}}
function setDriveConnected(value){document.getElementById("driveDot").className="status-dot "+(value?"green":"red");document.getElementById("driveStatus").setAttribute("data-tip","Drive: "+(value?"Connected":"Disconnected"));const cb=document.getElementById("connectBtn");if(value)cb.classList.add("hidden");else cb.classList.remove("hidden");}
async function driveRequest(url,options={}){if(!accessToken)throw new Error("Drive not connected.");const headers=new Headers(options.headers||{});headers.set("Authorization","Bearer "+accessToken);const response=await fetch(url,{...options,headers});if(!response.ok){const text=await response.text();throw new Error("Drive "+response.status+": "+text);}return response;}
async function findDatabaseFile(){let query="name = '"+DATABASE_NAME.replace(/'/g,"\\'")+"' and trashed = false";if(DATABASE_FOLDER_ID)query+=" and '"+DATABASE_FOLDER_ID+"' in parents";const url="https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent(query)+"&spaces=drive&fields=files(id,name,mimeType,modifiedTime,parents)&pageSize=100";const response=await driveRequest(url);const data=await response.json();if(!data.files||!data.files.length)return null;return data.files[0];}
async function createDatabaseFile(){const metadata={name:DATABASE_NAME,mimeType:"application/json"};if(DATABASE_FOLDER_ID)metadata.parents=[DATABASE_FOLDER_ID];const body=JSON.stringify(db,null,2);const form=new FormData();form.append("metadata",new Blob([JSON.stringify(metadata)],{type:"application/json"}));form.append("file",new Blob([body],{type:"application/json"}));const response=await driveRequest("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime,parents",{method:"POST",body:form});const result=await response.json();databaseFileId=result.id;if(result.parents&&result.parents.length)databaseFolderId=result.parents[0];updateFooter();return result;}
async function loadDatabase(){if(!accessToken){connectDrive();return;}try{setSyncState("loading");const file=await findDatabaseFile();if(!file){db=createEmptyDatabase();const created=await createDatabaseFile();databaseFileId=created.id;pendingChanges=false;updateSyncStatus();setLastSync(new Date());showToast("New DB created.","success");refreshUI();return;}databaseFileId=file.id;if(file.parents&&file.parents.length)databaseFolderId=file.parents[0];const response=await driveRequest("https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(file.id)+"?alt=media");const text=await response.text();if(!text.trim())db=createEmptyDatabase();else{try{db=normalizeDatabase(JSON.parse(text));}catch(e){throw new Error("Invalid JSON.");}}pendingChanges=false;updateSyncStatus();lastSuccessfulSync=file.modifiedTime?new Date(file.modifiedTime):new Date();setLastSync(lastSuccessfulSync);applySettings();refreshUI();updateFooter();showToast("Database loaded.","success");}catch(error){console.error(error);setSyncState("error");showToast(error.message,"error");}}
function normalizeDatabase(data){const base=createEmptyDatabase();if(!data||typeof data!=="object")return base;const result={...base,...data};result.settings={...base.settings,...(data.settings||{})};result.trash={...base.trash,...(data.trash||{})};result.categories=Array.isArray(data.categories)?data.categories:[];result.tags=Array.isArray(data.tags)?data.tags:[];result.notes=Array.isArray(data.notes)?data.notes.map(normalizeNote):[];result.globalLinks=Array.isArray(data.globalLinks)?data.globalLinks.map(normalizeLink):[];result.linkGroups=Array.isArray(data.linkGroups)?data.linkGroups:[];return result;}
function normalizeLink(link){const l=link||{};return{id:l.id||generateId("link"),title:l.title||"",url:autoFixUrl(l.url||""),groupId:l.groupId||null};}
function autoFixUrl(url){if(!url)return"";url=String(url).trim();if(!/^https?:\/\//i.test(url))url="https://"+url;return url;}
function normalizeNote(note){const n=note||{};return{id:n.id||generateId("note"),title:n.title||"Untitled Note",content:n.content||"",categoryId:n.categoryId||null,tags:Array.isArray(n.tags)?n.tags:[],links:Array.isArray(n.links)?n.links:[] ,favorite:!!n.favorite,pinned:!!n.pinned,deleted:!!n.deleted,trashHidden:!!n.trashHidden,color:n.color||"#64748b",createdAt:n.createdAt||new Date().toISOString(),modifiedAt:n.modifiedAt||n.createdAt||new Date().toISOString(),deletedAt:n.deletedAt||null,lastViewedAt:n.lastViewedAt||null,lastRestoredAt:n.lastRestoredAt||null,viewCount:Number(n.viewCount||0),editCount:Number(n.editCount||0),restoredCount:Number(n.restoredCount||0)};}
async function saveDatabaseToDrive(){if(!accessToken){showToast("Connect Drive first.","error");return false;}if(saveInProgress)return false;try{saveInProgress=true;setSyncState("saving");db.meta.updated=new Date().toISOString();db.globalLinks=globalLinks;db.linkGroups=linkGroups;const body=JSON.stringify(db,null,2);if(!databaseFileId){const file=await findDatabaseFile();if(file)databaseFileId=file.id;}if(!databaseFileId)await createDatabaseFile();else await driveRequest("https://www.googleapis.com/upload/drive/v3/files/"+encodeURIComponent(databaseFileId)+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json; charset=UTF-8"},body});pendingChanges=false;lastSuccessfulSync=new Date();updateSyncStatus();setLastSync(lastSuccessfulSync);return true;}catch(error){console.error(error);setSyncState("error");showToast("Save failed: "+error.message,"error");return false;}finally{saveInProgress=false;}}
function markChanged(){pendingChanges=true;db.meta.updated=new Date().toISOString();updateSyncStatus();scheduleAutosave();}
function updateSyncStatus(){if(saveInProgress)setSyncState("saving");else if(pendingChanges)setSyncState("pending");else setSyncState("synced");}
function setSyncState(state){const dot=document.getElementById("syncDot");const item=document.getElementById("syncStatusItem");dot.className="status-dot";let tip="Sync: ";if(state==="synced"){dot.classList.add("green");tip+="Synced";}else if(state==="pending"){dot.classList.add("amber");tip+="Pending";}else if(state==="saving"){dot.classList.add("amber");tip+="Saving";}else if(state==="loading"){dot.classList.add("amber");tip+="Loading";}else if(state==="error"){dot.classList.add("red");tip+="Error";}item.setAttribute("data-tip",tip);}
function scheduleAutosave(){clearTimeout(autosaveTimer);if(!db.settings.autosave||!accessToken)return;const s=Math.max(1,Number(db.settings.autosaveInterval||5));autosaveTimer=setTimeout(async()=>{if(pendingChanges)await saveDatabaseToDrive();},s*1000);}
async function synchronize(){if(pendingChanges){const saved=await saveDatabaseToDrive();if(saved)showToast("Synced.","success");return;}await loadDatabase();}
function setLastSync(date){if(!date)return;lastSuccessfulSync=date;updateLastSyncDisplay();}
function updateLastSyncDisplay(){const el=document.getElementById("lastSyncText");const item=document.getElementById("lastSyncStatus");if(!lastSuccessfulSync){el.textContent="—";item.setAttribute("data-tip","Last Synced: —");return;}el.textContent=relativeTimeShort(lastSuccessfulSync);item.setAttribute("data-tip","Last Synced: "+formatFullDateTime(lastSuccessfulSync));}
function startRelTimeTicker(){clearInterval(relTimeTimer);relTimeTimer=setInterval(()=>{updateLastSyncDisplay();},1000);}
function relativeTimeShort(value){if(!value)return"—";const date=new Date(value);if(Number.isNaN(date.getTime()))return"—";const sec=Math.floor((Date.now()-date.getTime())/1000);if(sec<5)return"now";if(sec<60)return sec+"s";const min=Math.floor(sec/60);if(min<60)return min+"m";const hrs=Math.floor(min/60);if(hrs<24)return hrs+"h";const days=Math.floor(hrs/24);if(days<30)return days+"d";const mo=Math.floor(days/30);if(mo<12)return mo+"mo";return Math.floor(mo/12)+"y";}
function updateFooter(){document.getElementById("dbFileName").textContent=DATABASE_NAME;const linkEl=document.getElementById("driveFolderLink");if(databaseFolderId){linkEl.href="https://drive.google.com/drive/folders/"+databaseFolderId;linkEl.textContent="Open Folder";}else if(databaseFileId){linkEl.href="https://drive.google.com/file/d/"+databaseFileId+"/view";linkEl.textContent="Open File";}else{linkEl.href="#";linkEl.textContent="Not connected";}}
function addNote(){const now=new Date().toISOString();const note={id:generateId("note"),title:"New Note",content:"",categoryId:null,tags:[],links:[],favorite:false,pinned:false,deleted:false,trashHidden:false,color:db.settings.defaultNoteColor||"#64748b",createdAt:now,modifiedAt:now,deletedAt:null,lastViewedAt:null,lastRestoredAt:null,viewCount:0,editCount:0,restoredCount:0};db.notes.unshift(note);selectedNoteId=note.id;editingNoteId=note.id;markChanged();refreshUI();renderDetail();}
function duplicateNote(id){const note=getNote(id);if(!note)return;const copy=JSON.parse(JSON.stringify(note));copy.id=generateId("note");copy.title=note.title+" (Copy)";copy.createdAt=new Date().toISOString();copy.modifiedAt=copy.createdAt;copy.editCount=0;copy.restoredCount=0;copy.viewCount=0;copy.lastViewedAt=null;db.notes.unshift(copy);markChanged();refreshUI();showToast("Duplicated.","success");}

function undoDelete(){if(!undoDeleteSnapshot)return;const snap=undoDeleteSnapshot;const note=getNote(snap.id);if(note){Object.assign(note,snap);note.modifiedAt=new Date().toISOString();}else db.notes.unshift(snap);undoDeleteSnapshot=null;document.getElementById("undoBar").classList.remove("show");markChanged();refreshUI();showToast("Undone.","success");}

lick="insertDateTime()">🕐</button></div><div class="content-display">'+escapeHtml(note.content).replace(/\n/g,"<br>")+'</div></div><div class="links-card"><div class="links-card-header"><span class="links-card-title">Links ('+((note.links||[]).length)+')</span><div class="links-card-header-actions"><button class="small-action-btn primary" onclick="openLinkEditor(\''+note.id+'\',-1)">+ Add</button></div></div>'+(linksHtml||'<div class="empty" style="min-height:60px;font-size:12px;">No links yet.</div>')+'</div><div class="tags-cat-card"><div class="tags-cat-row"><span class="tags-cat-label">🏷️ Tags:</span>'+(tagsHtml||'<span style="color:var(--muted);font-size:11px;">No tags</span>')+'<input id="detailTagsInput" class="tags-input-inline" placeholder="Add tag..." onkeydown="if(event.key===\'Enter\'){assignTagFromInput(\''+note.id+'\');}"><button class="small-action-btn primary" onclick="assignTagFromInput(\''+note.id+'\')">Add</button></div><div class="tags-cat-row"><span class="tags-cat-label">📁 Cat:</span><span style="font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(categoryPath||"Uncat")+'</span><button class="small-action-btn" onclick="openCategoryAssignPopup(\''+note.id+'\')">Add Category</button></div></div>'+renderMetadata(note,categoryPath)+'</div>';}

function renderEditMode(note){const container=document.getElementById("detailBody");const categoryPath=getCategoryPath(note.categoryId);const tagsHtml=note.tags.map(t=>'<span class="tag-chip">'+escapeHtml(t)+'<span class="chip-x" onclick="removeTagFromNoteById(\''+note.id+'\',\''+escapeAttribute(t)+'\')">×</span></span>').join("");const linksHtml=(note.links||[]).map((link,idx)=>'<div class="link-item"><span class="link-item-text">'+escapeHtml(link.title||"Link")+'</span><a class="link-item-url" href="'+escapeAttribute(link.url)+'" target="_blank" rel="noopener">'+escapeHtml(link.url)+'</a><div class="link-item-actions"><button class="link-icon-btn" onclick="openLinkEditor(\''+note.id+'\','+idx+')">✎</button><button class="link-icon-btn danger" onclick="deleteLinkInline(\''+note.id+'\','+idx+')">🗑</button></div></div>').join("");container.innerHTML='<div class="note-panel-border" style="--note-color:'+escapeAttribute(note.color)+'"><div class="note-controls-card"><div class="note-controls-left"><button class="ctrl-btn primary" onclick="addNote()">+ Add</button><button class="ctrl-btn" onclick="startEdit()">✎ Edit</button><button class="ctrl-btn danger" onclick="deleteNoteWithConfirm(\''+note.id+'\')">🗑 Delete</button><button class="ctrl-btn" onclick="duplicateNote(\''+note.id+'\')">⎘ Copy</button></div><div class="note-controls-right"><button class="ctrl-btn success" onclick="saveCurrent()">💾 Save</button><button class="ctrl-btn" onclick="cancelEdit()">✕ Cancel</button></div></div><div class="heading-card"><input id="editTitle" class="heading-input" value="'+escapeAttribute(note.title)+'" placeholder="Untitled Note"></div><div class="content-bar"><div class="content-toolbar"><button class="tool-btn" onclick="execCmd(\'bold\')"><b>B</b></button><button class="tool-btn" onclick="execCmd(\'underline\')"><u>U</u></button><button class="tool-btn" onclick="execCmd(\'italic\')"><i>I</i></button><span class="tool-sep"></span><button class="tool-btn" onclick="event.stopPropagation(); openColorDropdown(event, \''+note.id+'\')">🎨</button><button class="tool-btn" onclick="insertLinkDialog()">🔗</button><button class="tool-btn" onclick="insertDateTime()">🕐</button></div><div id="editContent" class="content-editable" contenteditable="true" data-placeholder="Write your note...">'+escapeHtml(note.content).replace(/\n/g,"<br>")+'</div></div><div class="links-card"><div class="links-card-header"><span class="links-card-title">Links ('+((note.links||[]).length)+')</span><div class="links-card-header-actions"><button class="small-action-btn primary" onclick="openLinkEditor(\''+note.id+'\',-1)">+ Add</button></div></div>'+(linksHtml||'<div class="empty" style="min-height:60px;font-size:12px;">No links yet.</div>')+'</div><div class="tags-cat-card"><div class="tags-cat-row"><span class="tags-cat-label">🏷️ Tags:</span>'+(tagsHtml||'<span style="color:var(--muted);font-size:11px;">No tags</span>')+'<input id="detailTagsInput" class="tags-input-inline" placeholder="Add tag..." onkeydown="if(event.key===\'Enter\'){assignTagFromInput(\''+note.id+'\');}"><button class="small-action-btn primary" onclick="assignTagFromInput(\''+note.id+'\')">Add</button></div><div class="tags-cat-row"><span class="tags-cat-label">📁 Cat:</span><span style="font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+escapeHtml(categoryPath||"Uncat")+'</span><button class="small-action-btn" onclick="openCategoryAssignPopup(\''+note.id+'\')">Add Category</button></div></div>'+renderMetadata(note,categoryPath)+'</div>';}

function formatDateTimeForInsert(date){const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];const d=date.getDate();const m=months[date.getMonth()];const y=date.getFullYear();let h=date.getHours();const min=String(date.getMinutes()).padStart(2,"0");const s=String(date.getSeconds()).padStart(2,"0");const ampm=h>=12?"PM":"AM";h=h%12;if(h===0)h=12;const hh=String(h).padStart(2,"0");return d+"-"+m+"-"+y+", "+hh+":"+min+":"+s+" "+ampm;}
function openColorDropdown(event,noteId){event.stopPropagation();const dp=document.getElementById("dropdownPopup");const note=getNote(noteId);if(!note)return;const cur=note.color;let html='<div class="color-swatch-grid">';COLOR_PALETTE.forEach(c=>{html+='<div class="color-swatch '+(c===cur?"selected":"")+'" style="background:'+c+'" onclick="applyColorAndClose(\''+noteId+'\',\''+c+'\')"></div>';});html+='</div><div class="color-custom-row"><input id="colorCustomHex" placeholder="#hex" value="'+escapeAttribute(cur)+'"><button onclick="applyCustomColor(\''+noteId+'\')">OK</button></div>';dp.innerHTML=html;const rect=event.target.getBoundingClientRect();dp.style.left=Math.min(rect.left,window.innerWidth-340)+"px";dp.style.top=(rect.bottom+6)+"px";dp.classList.add("show");}

function showLinkContextMenu(event,href,text){const menu=document.getElementById("linkCtxMenu");const x=event.touches?event.touches[0].clientX:event.clientX;const y=event.touches?event.touches[0].clientY:event.clientY;menu.innerHTML='<button onclick="linkMenuOpen(\''+escapeAttribute(href)+'\')">🔗 Open</button><button onclick="linkMenuEdit(\''+escapeAttribute(href)+'\',\''+escapeAttribute(text)+'\')">✎ Edit</button><button onclick="linkMenuDelete(\''+escapeAttribute(href)+'\')">🗑 Delete</button><button onclick="linkMenuCopy(\''+escapeAttribute(href)+'\')">📋 Copy Link Address</button>';menu.style.left=Math.min(x,window.innerWidth-200)+"px";menu.style.top=Math.min(y,window.innerHeight-200)+"px";menu.classList.add("show");}
function linkMenuOpen(href){window.open(href,"_blank");document.getElementById("linkCtxMenu").classList.remove("show");}
function linkMenuEdit(href,text){document.getElementById("linkCtxMenu").classList.remove("show");const newText=prompt("Link text:",text);if(newText===null)return;const newUrl=prompt("Link URL:",href);if(!newUrl)return;const fixed=autoFixUrl(newUrl);const note=getNote(editingNoteId||selectedNoteId);if(!note)return;const escapeRegex=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");const re=new RegExp('<a[^>]*href="'+escapeRegex(href)+'"[^>]*>.*?<\\/a>',"i");if(note.content&&note.content.match(re)){note.content=note.content.replace(re,'<a href="'+escapeAttribute(fixed)+'" target="_blank">'+escapeHtml(newText||fixed)+'</a>');}else{note.content=(note.content||"")+' <a href="'+escapeAttribute(fixed)+'" target="_blank">'+escapeHtml(newText||fixed)+'</a>';}note.modifiedAt=new Date().toISOString();markChanged();renderDetail();}
function linkMenuDelete(href){document.getElementById("linkCtxMenu").classList.remove("show");if(!confirm("Delete this link?"))return;const note=getNote(editingNoteId||selectedNoteId);if(!note)return;const escapeRegex=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");const re=new RegExp('<a[^>]*href="'+escapeRegex(href)+'"[^>]*>.*?<\\/a>',"gi");note.content=(note.content||"").replace(re,"");note.modifiedAt=new Date().toISOString();markChanged();renderDetail();}

function openLinkEditor(noteId,index){const note=getNote(noteId);if(!note)return;const isNew=index<0;const link=isNew?{title:"",url:""}:(note.links[index]||{title:"",url:""});openPopup({title:isNew?"Add Link":"Edit Link",bodyHTML:'<div class="popup-field"><label>Link Title</label><input id="linkTitleInput" value="'+escapeAttribute(link.title)+'"></div><div class="popup-field"><label>Link Address</label><input id="linkUrlInput" value="'+escapeAttribute(link.url)+'" placeholder="https://example.com"></div>',onSave:()=>{const t=document.getElementById("linkTitleInput").value.trim();const u=document.getElementById("linkUrlInput").value.trim();if(!u){showToast("URL required.","error");return false;}const fixed=autoFixUrl(u);if(isNew){if(!note.links)note.links=[];note.links.push({title:t||fixed,url:fixed});}else note.links[index]={title:t||fixed,url:fixed};note.modifiedAt=new Date().toISOString();markChanged();renderDetail();showToast("Saved.","success");return true;}});}

function renderGlobalLinks(){const c=document.getElementById("globalLinksList");if(!c)return;if(!linkGroups.length&&!globalLinks.length){c.innerHTML='<div class="sidebar-subtitle">No links</div>';return;}let html="";const groups=[...linkGroups];const ungrouped=globalLinks.filter(l=>!l.groupId||!linkGroups.find(g=>g.id===l.groupId));groups.forEach(g=>{const gLinks=globalLinks.filter(l=>l.groupId===g.id);const isCollapsed=collapsedGroups.has(g.id);html+='<div class="sidebar-item" style="padding-left:14px;" onclick="toggleLinkGroup(\''+g.id+'\')"><span class="cat-expander" style="width:20px;height:20px;">'+(isCollapsed?"+":"−")+'</span><span class="sidebar-label">'+escapeHtml(g.name)+'</span><span class="sidebar-count">'+gLinks.length+'</span></div>';if(!isCollapsed){gLinks.forEach(l=>{html+='<div class="sidebar-item" style="padding-left:44px;font-size:12px;" onclick="openLink(\''+escapeAttribute(l.url)+'\')"><span class="sidebar-label" title="'+escapeAttribute(l.url)+'">'+escapeHtml(l.title||l.url)+'</span></div>';});}});if(ungrouped.length){html+='<div class="sidebar-item" style="padding-left:14px;"><span class="sidebar-label" style="font-weight:700;color:var(--muted);font-size:11px;">Ungrouped</span></div>';ungrouped.forEach(l=>{html+='<div class="sidebar-item" style="padding-left:44px;font-size:12px;" onclick="openLink(\''+escapeAttribute(l.url)+'\')"><span class="sidebar-label" title="'+escapeAttribute(l.url)+'">'+escapeHtml(l.title||l.url)+'</span></div>';});}c.innerHTML=html;}

function addGlobalLink(){const groupOptions=linkGroups.map(g=>'<option value="'+g.id+'">'+escapeHtml(g.name)+'</option>').join("");openPopup({title:"Add Link",bodyHTML:'<div class="popup-field"><label>Title</label><input id="glTitle" placeholder="e.g. Google"></div><div class="popup-field"><label>URL</label><input id="glUrl" placeholder="https://example.com"></div><div class="popup-field"><label>Group</label><select id="glGroup"><option value="">-- None --</option>'+groupOptions+'<option value="__NEW__">+ New Group</option></select></div>',onSave:()=>{const t=document.getElementById("glTitle").value.trim();const u=document.getElementById("glUrl").value.trim();let g=document.getElementById("glGroup").value;if(!u){showToast("URL required.","error");return false;}if(g==="__NEW__"){const name=prompt("Group name:");if(!name||!name.trim())return false;const newG={id:generateId("grp"),name:name.trim()};linkGroups.push(newG);g=newG.id;}globalLinks.push({id:generateId("link"),title:t||autoFixUrl(u),url:autoFixUrl(u),groupId:g||null});markChanged();renderGlobalLinks();showToast("Added.","success");return true;}});}

function renderManageLinksPopup(){const groupsHtml=linkGroups.map(g=>{const gLinks=globalLinks.filter(l=>l.groupId===g.id);const isCollapsed=collapsedGroups.has(g.id);return '<div class="group-block"><div class="group-header" onclick="toggleLinkGroup(\''+g.id+'\')"><div style="display:flex;align-items:center;gap:6px;"><span class="expander">'+(isCollapsed?"+":"−")+'</span><span>'+escapeHtml(g.name)+' ('+gLinks.length+')</span></div><div style="display:flex;gap:4px;"><button onclick="event.stopPropagation(); renameGroup(\''+g.id+'\')" style="padding:2px 6px;font-size:11px;">✎</button><button onclick="event.stopPropagation(); removeGroup(\''+g.id+'\')" style="padding:2px 6px;font-size:11px;color:#dc2626;">🗑</button></div></div><div class="group-links '+(isCollapsed?"collapsed":"")+'">'+gLinks.map(l=>renderManageLinkRow(l)).join("")+(gLinks.length===0?'<div style="padding:8px;font-size:11px;color:var(--muted);text-align:center;">No links</div>':"")+'</div></div>';}).join("");const ungrouped=globalLinks.filter(l=>!l.groupId||!linkGroups.find(g=>g.id===l.groupId));const ungroupedHtml=ungrouped.length?'<div class="group-block"><div class="group-header"><div><span style="width:20px;display:inline-block;"></span><span>Ungrouped ('+ungrouped.length+')</span></div></div><div class="group-links">'+ungrouped.map(l=>renderManageLinkRow(l)).join("")+'</div></div>':"";openPopup({title:"Manage Links",bodyHTML:'<div class="manage-links-header-actions"><button class="primary" onclick="__mlAdd()">+ Add Link</button><button onclick="__mlAddGroup()">+ Add Group</button><button onclick="__mlExport()">📤 Export</button><button onclick="__mlImport()">📥 Import</button><button onclick="__mlCheck()">🔍 Check All</button></div><div id="manageLinksBody">'+groupsHtml+ungroupedHtml+(linkGroups.length===0&&globalLinks.length===0?'<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px;">No links yet. Click "+ Add Link" to start.</div>':"")+'</div>',footerHTML:'<button class="popup-btn" onclick="closePopup()">Close</button>',onSave:null});window.__mlAdd=()=>{closePopup();addGlobalLink();};window.__mlAddGroup=()=>{const name=prompt("Group name:");if(!name||!name.trim())return;linkGroups.push({id:generateId("grp"),name:name.trim()});markChanged();renderGlobalLinks();closePopup();openManageLinks();};window.__mlExport=()=>{const data=JSON.stringify({linkGroups,globalLinks},null,2);navigator.clipboard.writeText(data).then(()=>showToast("Copied to clipboard.","success"));};window.__mlImport=()=>{const data=prompt("Paste JSON:");if(!data)return;try{const parsed=JSON.parse(data);if(parsed.linkGroups)linkGroups=parsed.linkGroups;if(parsed.globalLinks)globalLinks=parsed.globalLinks.map(normalizeLink);markChanged();renderGlobalLinks();closePopup();openManageLinks();showToast("Imported.","success");}catch(e){showToast("Invalid JSON.","error");}};window.__mlCheck=()=>{showToast("Broken link check coming soon.","normal");};}
