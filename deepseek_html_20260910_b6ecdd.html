<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Notes Manager</title>
<style>
:root{
    --bg:#f4f6f9;
    --surface:#ffffff;
    --surface2:#f8fafc;
    --text:#172033;
    --muted:#697386;
    --border:#dfe4ec;
    --primary:#2563eb;
    --primary2:#1d4ed8;
    --danger:#dc2626;
    --success:#15803d;
    --warning:#b45309;
    --shadow:0 8px 25px rgba(20,30,50,.08);
    --radius:12px;
    --font-size:15px;
    --sidebar-width:290px;
    --sidebar-border:1px;
    --note-list-bg:#ffffff;
    --note-panel-bg:#ffffff;
    --section-height:38px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; min-height:100%; }
body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    font-size:var(--font-size);
}
button,select,input,textarea{ font:inherit; }
button{ cursor:pointer; }

/* FLOATING SIDEBAR TOGGLE */
.floating-toggle{
    position:fixed; top:10px; left:10px; z-index:3000;
    width:46px; height:46px;
    border:1px solid var(--border); border-radius:10px;
    background:var(--surface); color:var(--text);
    box-shadow:0 6px 20px rgba(0,0,0,.15);
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:700; padding:0;
}
.floating-toggle:hover{ background:#eef2ff; }
.floating-toggle .hamburger{ display:flex; flex-direction:column; gap:4px; }
.floating-toggle .hamburger span{
    width:20px; height:2.5px; background:var(--text); border-radius:2px; display:block;
}
.floating-toggle .arrow-icon{ font-size:18px; line-height:1; }

/* TOP AREA */
.top-area{
    background:var(--surface);
    border-bottom:1px solid var(--border);
    box-shadow:0 2px 8px rgba(0,0,0,.04);
    padding:8px 10px 8px 66px;
    position:sticky; top:0; z-index:1000;
}
.status-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    margin-bottom:8px;
    line-height:1.3;
}
.status-item{
    display:inline-flex;
    align-items:center;
    gap:4px;
    min-width:0;
    flex-shrink:1;
    overflow:hidden;
    text-overflow:ellipsis;
}
.status-dot{
    width:8px; height:8px; border-radius:50%;
    background:#94a3b8;
    flex:none;
    display:inline-block;
}
.status-dot.green{ background:#22c55e; }
.status-dot.red{ background:#dc2626; }
.status-dot.amber{ background:#f59e0b; }
.status-time{
    color:#2563eb;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
}
.status-change{
    color:#7c3aed;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
}
.status-rel{
    color:#94a3b8;
    font-weight:500;
    flex:none;
}
.top-buttons{
    display:flex; gap:6px;
    flex-wrap:nowrap;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:thin;
}
.top-buttons .btn{
    flex:0 0 auto;
    height:34px; min-width:72px; padding:0 10px;
    border:1px solid var(--border); border-radius:8px;
    background:var(--surface); color:var(--text);
    font-size:12px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center;
    white-space:nowrap; transition:.15s ease;
}
.top-buttons .btn:hover{ background:#f1f5f9; }
.top-buttons .btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); }
.top-buttons .btn.primary:hover{ background:var(--primary2); }
.top-buttons .btn.danger{ background:var(--danger); color:#fff; border-color:var(--danger); }
.top-buttons .btn.success{ background:var(--success); color:#fff; border-color:var(--success); }
.top-buttons .btn.hidden{ display:none; }

/* SIDEBAR */
.sidebar-overlay{
    position:fixed; inset:0; z-index:1900;
    background:rgba(0,0,0,.22); display:none;
}
.sidebar-overlay.open{ display:block; }
.sidebar{
    position:fixed; top:0; left:0; bottom:0;
    width:var(--sidebar-width);
    z-index:2000;
    background:var(--surface);
    border-right:var(--sidebar-border) solid var(--border);
    box-shadow:10px 0 25px rgba(0,0,0,.08);
    transform:translateX(-105%);
    transition:transform .2s ease;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:10px;
    padding-top:14px;
    scrollbar-width:none;
}
.sidebar::-webkit-scrollbar{ display:none; }
.sidebar.open{ transform:translateX(0); }
.sidebar-title{
    font-size:15px;
    font-weight:800;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:var(--primary);
    padding:8px 9px 10px;
    margin-bottom:4px;
    border-bottom:1px solid var(--border);
}
.sidebar-section{ margin-bottom:4px; }
.sidebar-item{
    position:relative;
    min-height:var(--section-height);
    display:flex; align-items:center; gap:8px;
    padding:0 9px; border-radius:8px;
    cursor:pointer; color:var(--text);
}
.sidebar-item:hover, .sidebar-item.active{ background:#eef2ff; }
.sidebar-icon{ width:20px; text-align:center; flex:none; }
.sidebar-label{
    flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.sidebar-count{ color:var(--muted); font-size:11px; flex:none; }
.bin-badge{
    background:#dc2626; color:#fff;
    font-size:10px; font-weight:700;
    padding:1px 6px; border-radius:999px;
    flex:none; min-width:18px; text-align:center;
}
.sidebar-divider{
    height:1px; background:#e2e8f0;
    margin:8px 4px; border:0;
}
.sidebar-controls{ display:flex; gap:3px; flex:none; }
.sidebar-ctrl{
    width:24px; height:24px; min-width:24px; padding:0;
    border:1px solid var(--border); border-radius:6px;
    background:var(--surface); color:var(--text);
    font-size:11px; display:inline-flex;
    align-items:center; justify-content:center; line-height:1;
}
.sidebar-ctrl:hover{ background:#e2e8f0; }
.sidebar-ctrl.danger:hover{ background:#fef2f2; border-color:#fecaca; color:#dc2626; }
.sidebar-collapse{ margin-top:3px; padding-left:12px; }
.tag-list, .category-list{ display:block; }
.sidebar-subtitle{ padding:6px 9px; color:var(--muted); font-size:11px; }
.cat-row{
    display:flex; align-items:center; gap:6px;
    padding:2px 4px; border-radius:8px;
}
.cat-row:hover{ background:#f8fafc; }
.cat-row-btns{ display:flex; gap:3px; flex:none; order:3; }
.cat-expander{
    width:18px; height:18px; padding:0;
    border:1px solid var(--border); border-radius:4px;
    background:var(--surface);
    font-size:11px; font-weight:700;
    display:inline-flex; align-items:center; justify-content:center;
    line-height:1; flex:none;
}
.cat-expander:hover{ background:#e2e8f0; }

/* MAIN */
.main{ min-height:calc(100vh - 140px); padding:12px; }
.toolbar{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.search-box{ flex:1; min-width:180px; }
.search-box input{
    width:100%; height:36px; padding:0 12px;
    border:1px solid var(--border); border-radius:8px;
    background:var(--surface); outline:none;
}
.search-box input:focus{ border-color:var(--primary); }
.workspace{
    display:grid;
    grid-template-columns:minmax(260px,34%) 1fr;
    gap:10px;
    min-height:calc(100vh - 220px);
}
.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
}
.panel-header{
    min-height:48px; display:flex;
    align-items:center; justify-content:space-between;
    gap:8px; padding:8px 12px;
    border-bottom:1px solid var(--border);
}
.panel-title{ font-weight:700; }
.filter-sort-bar{
    display:flex; gap:6px; padding:6px 10px;
    border-bottom:1px solid var(--border);
    background:var(--surface2); flex-wrap:wrap; align-items:center;
}
.filter-sort-bar select{
    height:26px; font-size:11px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--surface); padding:0 6px;
}

.note-list{
    overflow-y:auto;
    overscroll-behavior:contain;
    background:var(--note-list-bg);
}
.note-row{
    display:flex; align-items:flex-start; gap:9px;
    padding:9px 11px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    transition:background .12s, transform .12s;
}
.note-row:hover{ background:#f8fafc; transform:scale(1.005); }
.note-row.active{ background:#93c5fd; }
.note-row.ms-selected{ background:#bfdbfe; }
.note-marker{
    width:5px; min-width:5px; height:auto;
    align-self:stretch; border-radius:5px;
    background:var(--note-color,#94a3b8);
}
.note-row-body{ flex:1; min-width:0; }
.note-line1{
    display:flex; gap:6px; align-items:baseline; min-width:0;
}
.note-line1-title{
    font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    flex:0 1 auto; max-width:55%;
}
.note-line1-content{
    color:var(--muted); font-size:12px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    flex:1 1 auto; min-width:0;
}
.note-line2{
    margin-top:4px; display:flex; gap:6px;
    flex-wrap:wrap; align-items:center;
    font-size:11px; color:var(--muted);
}
.note-line3{ margin-top:4px; font-size:10px; color:var(--muted); }
.note-line2 .meta-chip{
    display:inline-flex; align-items:center; gap:3px;
    max-width:120px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
}
.note-row-right{
    display:flex; flex-direction:column;
    gap:4px; align-items:flex-end; flex:none;
}
.row-icon-btn{
    width:auto; min-width:32px;
    height:24px; padding:0 6px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--surface);
    color:#94a3b8;
    font-size:10px; font-weight:600;
    display:inline-flex; align-items:center;
    justify-content:center; line-height:1;
    gap:3px; white-space:nowrap;
}
.row-icon-btn:hover{ background:#e2e8f0; }
.row-icon-btn.pin-on{ color:#b45309; border-color:#fde68a; background:#fffbeb; }
.row-icon-btn.fav-on{ color:#d97706; border-color:#fde68a; background:#fffbeb; }
.row-icon-btn.edit-btn:hover{ color:#2563eb; border-color:#bfdbfe; background:#eff6ff; }
.row-icon-btn.danger:hover{ color:#dc2626; border-color:#fecaca; background:#fef2f2; }

/* Checkbox */
.note-row.has-checkbox{
    padding-left:36px; position:relative;
}
.note-row.has-checkbox::before{
    content:"";
    position:absolute; left:12px; top:14px;
    width:16px; height:16px;
    border:2px solid var(--border);
    border-radius:4px;
    background:var(--surface);
    cursor:pointer;
}
.note-row.has-checkbox.ms-selected::before{
    background:var(--primary);
    border-color:var(--primary);
    content:"✓"; color:#fff;
    font-size:11px;
    display:flex; align-items:center;
    justify-content:center; font-weight:700;
}

/* DETAIL PANEL */
.detail{ min-width:0; }
.detail-body{ padding:0; background:var(--note-panel-bg); }
.note-panel-border{
    border:5px solid var(--note-color,#94a3b8);
    border-radius:12px;
    overflow:hidden;
}
.note-controls-card{
    display:flex; align-items:center; gap:6px;
    padding:8px 10px;
    border-bottom:1px solid var(--border);
    background:var(--surface2); flex-wrap:wrap;
}
.note-controls-left{ display:flex; gap:5px; flex-wrap:wrap; }
.note-controls-right{ display:flex; gap:5px; margin-left:auto; flex-wrap:wrap; }
.ctrl-btn{
    height:30px; min-width:62px; padding:0 9px;
    border:1px solid var(--border); border-radius:7px;
    background:var(--surface); color:var(--text);
    font-size:11px; font-weight:600;
    display:inline-flex; align-items:center;
    justify-content:center; gap:3px; white-space:nowrap;
}
.ctrl-btn:hover{ background:#f1f5f9; }
.ctrl-btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); }
.ctrl-btn.danger{ background:var(--danger); color:#fff; border-color:var(--danger); }
.ctrl-btn.success{ background:var(--success); color:#fff; border-color:var(--success); }
.heading-card{
    padding:10px 12px;
    border-bottom:1px solid var(--border);
}
.heading-input{
    width:100%; border:0; background:transparent;
    outline:none; font-size:22px; font-weight:700;
    color:var(--text); padding:4px 0;
}
.heading-display{
    font-size:22px; font-weight:700;
    line-height:1.3; word-break:break-word;
    min-height:28px;
}
.content-bar{ border-bottom:1px solid var(--border); }
.content-toolbar{
    display:flex; gap:4px; flex-wrap:wrap;
    padding:6px 10px;
    background:var(--surface2);
    border-bottom:1px solid var(--border);
    align-items:center;
}
.tool-btn{
    width:30px; height:28px; min-width:30px; padding:0;
    border:1px solid var(--border); border-radius:6px;
    background:var(--surface); color:var(--text);
    font-size:12px; font-weight:700;
    display:inline-flex; align-items:center;
    justify-content:center; cursor:pointer;
}
.tool-btn:hover{ background:#e2e8f0; }
.tool-btn.wide{ width:auto; min-width:auto; padding:0 8px; gap:4px; }
.tool-sep{ width:1px; height:20px; background:var(--border); margin:0 3px; }
.content-editable{
    min-height:120px;
    padding:10px 12px;
    outline:none; line-height:1.6;
    word-break:break-word; font-size:14px;
}
.content-editable:empty:before{
    content:attr(data-placeholder);
    color:var(--muted);
}
.content-editable a{
    color:var(--primary);
    text-decoration:underline;
    cursor:pointer;
}
.content-display{
    padding:10px 12px;
    white-space:pre-wrap;
    line-height:1.6;
    word-break:break-word;
    min-height:120px;
}
.content-display a{
    color:var(--primary);
    text-decoration:underline;
}

/* LINKS */
.links-card{
    margin:10px;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:var(--surface);
}
.links-card-header{
    display:flex; align-items:center;
    justify-content:space-between;
    padding:7px 10px;
    background:var(--surface2);
    border-bottom:1px solid var(--border);
    gap:6px;
}
.links-card-title{ font-size:12px; font-weight:700; color:var(--muted); }
.links-card-header-actions{ display:flex; gap:4px; }
.link-item{
    display:flex; align-items:center; gap:6px;
    padding:7px 10px;
    border-bottom:1px solid var(--border);
    font-size:12px;
}
.link-item:last-child{ border-bottom:0; }
.link-item-text{
    flex:0 0 auto; font-weight:600;
    max-width:35%; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
}
.link-item-url{
    flex:1 1 auto; color:var(--primary);
    text-decoration:none; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;
    min-width:0;
}
.link-item-actions{ display:flex; gap:3px; flex:none; }
.link-icon-btn{
    width:24px; height:24px; min-width:24px; padding:0;
    border:1px solid var(--border); border-radius:5px;
    background:var(--surface); cursor:pointer;
    font-size:11px; display:inline-flex;
    align-items:center; justify-content:center;
}
.link-icon-btn:hover{ background:#e2e8f0; }
.link-icon-btn.danger:hover{ background:#fef2f2; color:#dc2626; }

/* TAGS + CAT */
.tags-cat-card{
    margin:10px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    padding:10px;
}
.tags-cat-row{
    display:flex; align-items:center;
    gap:6px; flex-wrap:wrap;
    margin-bottom:8px;
}
.tags-cat-row:last-child{ margin-bottom:0; }
.tags-cat-label{
    font-size:11px; font-weight:700;
    color:var(--muted); min-width:56px;
}
.tag-chip{
    display:inline-flex; align-items:center; gap:3px;
    border:1px solid #cbd5e1; border-radius:999px;
    padding:2px 8px; background:#f8fafc; font-size:11px;
}
.tag-chip .chip-x{
    cursor:pointer; color:#94a3b8; font-weight:700;
}
.tag-chip .chip-x:hover{ color:#dc2626; }
.tags-input-inline{
    flex:1; min-width:140px; height:28px;
    padding:0 8px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--surface); outline:none; font-size:12px;
}
.tags-input-inline:focus{ border-color:var(--primary); }
.small-action-btn{
    height:28px; padding:0 8px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--surface); color:var(--text);
    font-size:11px; font-weight:600;
    display:inline-flex; align-items:center; gap:3px;
}
.small-action-btn:hover{ background:#e2e8f0; }
.small-action-btn.primary{ background:var(--primary); color:#fff; border-color:var(--primary); }
.small-action-btn.danger{ background:var(--danger); color:#fff; border-color:var(--danger); }
.small-action-btn.success{ background:var(--success); color:#fff; border-color:var(--success); }

/* METADATA */
.metadata-box{
    margin:10px;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    background:#f8fafc;
    color:#697386;
}
.metadata-title{
    padding:7px 10px; font-size:12px; font-weight:700;
    background:#f1f5f9;
    border-bottom:1px solid var(--border);
    color:#697386;
    display:flex; align-items:center; justify-content:space-between;
    cursor:pointer; user-select:none;
}
.metadata-title .toggle-icon{ font-size:11px; color:#94a3b8; }
.metadata-body{ display:block; }
.metadata-body.collapsed{ display:none; }
.metadata-table{
    width:100%; border-collapse:collapse; table-layout:fixed;
}
.metadata-table td{
    padding:5px 8px; font-size:11px; line-height:1.3;
    vertical-align:top; border:1px solid var(--border);
    word-break:break-word; color:#697386;
}
.metadata-table td.label{
    width:22%; color:#697386;
    font-weight:700; background:#f1f5f9;
}
.metadata-table td.value{ width:28%; color:#697386; }
.metadata-table a.cat-link{
    color:#2563eb; text-decoration:none; cursor:pointer;
}
.metadata-actions{
    padding:8px 10px;
    display:flex; gap:5px; flex-wrap:wrap;
    border-top:1px solid var(--border);
    background:#f1f5f9;
}

/* EMPTY */
.empty{
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); padding:20px;
    text-align:center; flex-direction:column; gap:8px;
    min-height:100px;
}

/* SETTINGS */
.settings-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px; padding:10px;
}
.setting{
    border:1px solid var(--border);
    border-radius:9px; padding:10px;
    background:var(--surface2);
}
.setting label{
    display:block; margin-bottom:6px;
    color:var(--muted); font-size:12px; font-weight:700;
}
.setting select, .setting input[type="text"],
.setting input[type="number"], .setting input[type="color"]{
    width:100%; height:34px;
    border:1px solid var(--border); border-radius:7px;
    background:var(--surface); padding:0 7px;
}
.setting input[type="color"]{ padding:0; cursor:pointer; }

/* PAGINATION */
.pagination{
    display:flex; align-items:center; justify-content:center;
    gap:6px; padding:9px; border-top:1px solid var(--border);
}
.pagination button{
    height:28px; min-width:60px; padding:0 8px;
    border:1px solid var(--border); border-radius:6px;
    background:var(--surface); font-size:12px;
}

/* BIN TOOLBAR */
.bin-toolbar{
    display:flex; gap:6px; padding:8px 10px;
    border-bottom:1px solid var(--border);
    background:var(--surface2); flex-wrap:wrap; align-items:center;
}
.bin-toolbar-info{
    font-size:11px; color:var(--muted); margin-left:auto;
}

/* TOAST */
.toast{
    position:fixed; right:15px; bottom:15px;
    z-index:5000; max-width:360px;
    padding:10px 13px; border-radius:8px;
    background:#172033; color:#fff;
    font-size:13px;
    box-shadow:0 8px 30px rgba(0,0,0,.2);
    transform:translateY(20px); opacity:0;
    pointer-events:none; transition:.2s ease;
}
.toast.show{ transform:translateY(0); opacity:1; }

/* UNDO BAR */
.undo-bar{
    position:fixed; left:50%;
    transform:translateX(-50%) translateY(80px);
    bottom:20px; z-index:5000;
    background:#172033; color:#fff;
    padding:10px 16px; border-radius:8px;
    font-size:13px;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
    display:flex; align-items:center; gap:12px;
    opacity:0; pointer-events:none;
    transition:.2s ease;
}
.undo-bar.show{
    transform:translateX(-50%) translateY(0);
    opacity:1; pointer-events:auto;
}
.undo-bar button{
    background:transparent; color:#60a5fa;

<script src="https://accounts.google.com/gsi/client"></script>
<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CLIENT_ID = "262106898132-tsn94p3vvpf34do0ommc6rai2mtc5sh6.apps.googleusercontent.com";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive";
const DATABASE_NAME = "NotesManagerDB.json";
const DATABASE_FOLDER_ID = "";

/* =========================================================
   STATE
   ========================================================= */
let accessToken = null;
let tokenClient = null;
let databaseFileId = null;
let databaseFolderId = null;
let db = createEmptyDatabase();
let selectedNoteId = null;
let editingNoteId = null;
let currentView = "all";
let currentCategoryId = null;
let currentTagName = null;
let searchText = "";
let sidebarOpen = false;
let currentPage = 1;
let autosaveTimer = null;
let relTimeTimer = null;
let saveInProgress = false;
let pendingChanges = false;
let lastSuccessfulSync = null;
let lastChangeTime = null;
let selectedIds = new Set();
let globalLinks = [];
let undoDeleteSnapshot = null;
let undoTimer = null;
let popupResolve = null;

const COLOR_PALETTE = [
    "#64748b","#dc2626","#ea580c","#d97706","#ca8a04","#65a30d","#16a34a","#059669",
    "#0d9488","#0891b2","#0284c7","#2563eb","#4f46e5","#7c3aed","#9333ea","#c026d3",
    "#db2777","#e11d48","#78350f","#1e293b"
];

/* =========================================================
   DEFAULT DB
   ========================================================= */
function createEmptyDatabase(){
    return {
        version: 10,
        settings: {
            theme: "System",
            fontSize: "Normal",
            sorting: "Last Modified First",
            notesPerPage: 5,
            notesVisibleNoScroll: 5,
            sidebarWidth: 290,
            mobileSidebarWidth: "85%",
            sidebarBorder: 1,
            sectionHeight: 38,
            noteListBg: "#ffffff",
            notePanelBg: "#ffffff",
            noteLineCount: 3,
            noteRowHeight: "Auto",
            contentPreviewLength: 60,
            deleteConfirmation: true,
            autosave: true,
            autosaveInterval: 5,
            dateTimeFormat: "12 Hour",
            defaultNoteColor: "#64748b",
            autoAssignBinTag: true,
            metadataCollapsed: true,
            categoriesCollapsed: true
        },
        trash: { label: "Recycle Bin" },
        categories: [],
        tags: [],
        notes: [],
        globalLinks: [],
        meta: {
            created: new Date().toISOString(),
            updated: new Date().toISOString()
        }
    };
}

/* =========================================================
   GOOGLE AUTH
   ========================================================= */
function initializeGoogle(){
    if (typeof google === "undefined" || !google.accounts || !google.accounts.oauth2){
        showToast("Google Identity Services load nahi hui.", "error");
        return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: DRIVE_SCOPE,
        callback: function(response){
            if (response.error){
                console.error(response);
                showToast("Google Drive connection failed.", "error");
                return;
            }
            accessToken = response.access_token;
            setDriveConnected(true);
            showToast("Drive Connected", "success");
            loadDatabase();
        }
    });
}

function connectDrive(){
    if (!tokenClient){
        initializeGoogle();
        setTimeout(() => { if (tokenClient) requestDriveToken(); }, 300);
        return;
    }
    requestDriveToken();
}

function requestDriveToken(){
    try { tokenClient.requestAccessToken({ prompt: "" }); }
    catch(error){
        console.error(error);
        showToast("Google Drive connection could not start.", "error");
    }
}

function setDriveConnected(value){
    document.getElementById("driveDot").className = "status-dot " + (value ? "green" : "red");
    document.getElementById("driveText").textContent = value ? "Connected" : "Disconnected";
    /* Hide Connect button when connected */
    const cb = document.getElementById("connectBtn");
    if (value) cb.classList.add("hidden");
    else cb.classList.remove("hidden");
}

/* =========================================================
   DRIVE API
   ========================================================= */
async function driveRequest(url, options = {}){
    if (!accessToken) throw new Error("Google Drive is not connected.");
    const headers = new Headers(options.headers || {});
    headers.set("Authorization", "Bearer " + accessToken);
    const response = await fetch(url, { ...options, headers });
    if (!response.ok){
        const text = await response.text();
        throw new Error("Drive API " + response.status + ": " + text);
    }
    return response;
}

async function findDatabaseFile(){
    let query = "name = '" + DATABASE_NAME.replace(/'/g, "\\'") + "' and trashed = false";
    if (DATABASE_FOLDER_ID) query += " and '" + DATABASE_FOLDER_ID + "' in parents";
    const url = "https://www.googleapis.com/drive/v3/files?q=" + encodeURIComponent(query) +
        "&spaces=drive&fields=files(id,name,mimeType,modifiedTime,parents)&pageSize=100";
    const response = await driveRequest(url);
    const data = await response.json();
    if (!data.files || !data.files.length) return null;
    return data.files[0];
}

async function createDatabaseFile(){
    const metadata = { name: DATABASE_NAME, mimeType: "application/json" };
    if (DATABASE_FOLDER_ID) metadata.parents = [DATABASE_FOLDER_ID];
    const body = JSON.stringify(db, null, 2);
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
    form.append("file", new Blob([body], { type: "application/json" }));
    const response = await driveRequest(
        "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime,parents",
        { method: "POST", body: form }
    );
    const result = await response.json();
    databaseFileId = result.id;
    if (result.parents && result.parents.length) databaseFolderId = result.parents[0];
    updateFooter();
    return result;
}

/* =========================================================
   LOAD
   ========================================================= */
async function loadDatabase(){
    if (!accessToken) { connectDrive(); return; }
    try {
        setSyncState("loading");
        const file = await findDatabaseFile();
        if (!file){
            db = createEmptyDatabase();
            const created = await createDatabaseFile();
            databaseFileId = created.id;
            pendingChanges = false;
            updateSyncStatus();
            setLastSync(new Date());
            showToast("New " + DATABASE_NAME + " created.", "success");
            refreshUI();
            return;
        }
        databaseFileId = file.id;
        if (file.parents && file.parents.length) databaseFolderId = file.parents[0];
        const response = await driveRequest(
            "https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(file.id) + "?alt=media"
        );
        const text = await response.text();
        if (!text.trim()){
            db = createEmptyDatabase();
        } else {
            try { db = normalizeDatabase(JSON.parse(text)); }
            catch(e){ throw new Error("Invalid JSON."); }
        }
        pendingChanges = false;
        updateSyncStatus();
        lastSuccessfulSync = file.modifiedTime ? new Date(file.modifiedTime) : new Date();
        setLastSync(lastSuccessfulSync);
        applySettings();
        refreshUI();
        updateFooter();
        showToast("Database loaded.", "success");
    } catch(error){
        console.error(error);
        setSyncState("error");
        showToast(error.message, "error");
    }
}

function normalizeDatabase(data){
    const base = createEmptyDatabase();
    if (!data || typeof data !== "object") return base;
    const result = { ...base, ...data };
    result.settings = { ...base.settings, ...(data.settings || {}) };
    result.trash = { ...base.trash, ...(data.trash || {}) };
    result.categories = Array.isArray(data.categories) ? data.categories : [];
    result.tags = Array.isArray(data.tags) ? data.tags : [];
    result.notes = Array.isArray(data.notes) ? data.notes.map(normalizeNote) : [];
    result.globalLinks = Array.isArray(data.globalLinks) ? data.globalLinks : [];
    return result;
}

function normalizeNote(note){
    const n = note || {};
    return {
        id: n.id || generateId("note"),
        title: n.title || "Untitled Note",
        content: n.content || "",
        categoryId: n.categoryId || null,
        tags: Array.isArray(n.tags) ? n.tags : [],
        links: Array.isArray(n.links) ? n.links : [],
        favorite: !!n.favorite,
        pinned: !!n.pinned,
        deleted: !!n.deleted,
        trashHidden: !!n.trashHidden,
        color: n.color || "#64748b",
        createdAt: n.createdAt || new Date().toISOString(),
        modifiedAt: n.modifiedAt || n.createdAt || new Date().toISOString(),
        deletedAt: n.deletedAt || null,
        lastViewedAt: n.lastViewedAt || null,
        lastRestoredAt: n.lastRestoredAt || null,
        viewCount: Number(n.viewCount || 0),
        editCount: Number(n.editCount || 0),
        restoredCount: Number(n.restoredCount || 0)
    };
}

/* =========================================================
   SAVE
   ========================================================= */
async function saveDatabaseToDrive(){
    if (!accessToken){ showToast("Connect Drive first.", "error"); return false; }
    if (saveInProgress) return false;
    try {
        saveInProgress = true;
        setSyncState("saving");
        db.meta.updated = new Date().toISOString();
        db.globalLinks = globalLinks;
        const body = JSON.stringify(db, null, 2);
        if (!databaseFileId){
            const file = await findDatabaseFile();
            if (file) databaseFileId = file.id;
        }
        if (!databaseFileId){
            await createDatabaseFile();
        } else {
            await driveRequest(
                "https://www.googleapis.com/upload/drive/v3/files/" +
                encodeURIComponent(databaseFileId) + "?uploadType=media",
                {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json; charset=UTF-8" },
                    body
                }
            );
        }
        pendingChanges = false;
        lastSuccessfulSync = new Date();
        updateSyncStatus();
        setLastSync(lastSuccessfulSync);
        return true;
    } catch(error){
        console.error(error);
        setSyncState("error");
        showToast("Drive save failed: " + error.message, "error");
        return false;
    } finally {
        saveInProgress = false;
    }
}

/* =========================================================
   CHANGE TRACKING
   ========================================================= */
function markChanged(){
    pendingChanges = true;
    lastChangeTime = new Date();
    db.meta.updated = lastChangeTime.toISOString();
    updateSyncStatus();
    scheduleAutosave();
}

function updateSyncStatus(){
    if (saveInProgress){
        setSyncState("saving");
    } else if (pendingChanges){
        setSyncState("pending");
    } else {
        setSyncState("synced");
    }
}

function setSyncState(state){
    const dot = document.getElementById("syncDot");
    const text = document.getElementById("syncText");
    dot.className = "status-dot";
    if (state === "synced"){ dot.classList.add("green"); text.textContent = "Synced"; }
    else if (state === "pending"){ dot.classList.add("amber"); text.textContent = "Pending"; }
    else if (state === "saving"){ dot.classList.add("amber"); text.textContent = "Saving"; }
    else if (state === "loading"){ dot.classList.add("amber"); text.textContent = "Loading"; }
    else if (state === "error"){ dot.classList.add("red"); text.textContent = "Error"; }
}

function scheduleAutosave(){
    clearTimeout(autosaveTimer);
    if (!db.settings.autosave || !accessToken) return;
    const seconds = Math.max(1, Number(db.settings.autosaveInterval || 5));
    autosaveTimer = setTimeout(async () => {
        if (pendingChanges) await saveDatabaseToDrive();
    }, seconds * 1000);
}

async function synchronize(){
    if (pendingChanges){
        const saved = await saveDatabaseToDrive();
        if (saved) showToast("Changes synced.", "success");
        return;
    }
    await loadDatabase();
}

function setLastSync(date){
    if (!date){ return; }
    lastSuccessfulSync = date;
    updateLastSyncDisplay();
}

function updateLastSyncDisplay(){
    const el = document.getElementById("lastSyncText");
    const rel = document.getElementById("lastSyncRel");
    if (!lastSuccessfulSync){
        el.textContent = "—";
        rel.textContent = "";
        return;
    }
    el.textContent = formatFullDateTime(lastSuccessfulSync);
    rel.textContent = "(" + relativeTime(lastSuccessfulSync) + ")";
}

function updateLastChangeDisplay(){
    const el = document.getElementById("lastChangeText");
    const rel = document.getElementById("lastChangeRel");
    if (!lastChangeTime){
        el.textContent = "—";
        rel.textContent = "";
        return;
    }
    el.textContent = formatFullDateTime(lastChangeTime);
    rel.textContent = "(" + relativeTime(lastChangeTime) + ")";
}

/* Live ticker for relative times */
function startRelTimeTicker(){
    clearInterval(relTimeTimer);
    relTimeTimer = setInterval(() => {
        updateLastSyncDisplay();
        updateLastChangeDisplay();
    }, 1000);
}

/* =========================================================
   NOTE CRUD
   ========================================================= */
function addNote(){
    const now = new Date().toISOString();
    const note = {
        id: generateId("note"),
        title: "New Note",
        content: "",
        categoryId: null,
        tags: [],
        links: [],
        favorite: false, pinned: false,
        deleted: false, trashHidden: false,
        color: db.settings.defaultNoteColor || "#64748b",
        createdAt: now, modifiedAt: now,
        deletedAt: null, lastViewedAt: null, lastRestoredAt: null,
        viewCount: 0, editCount: 0, restoredCount: 0
    };
    db.notes.unshift(note);
    selectedNoteId = note.id;
    editingNoteId = note.id;
    markChanged();
    refreshUI();
    renderDetail();
}

function duplicateNote(id){
    const note = getNote(id);
    if (!note) return;
    const copy = JSON.parse(JSON.stringify(note));
    copy.id = generateId("note");
    copy.title = note.title + " (Copy)";
    copy.createdAt = new Date().toISOString();
    copy.modifiedAt = copy.createdAt;
    copy.editCount = 0; copy.restoredCount = 0; copy.viewCount = 0;
    copy.lastViewedAt = null;
    db.notes.unshift(copy);
    markChanged();
    refreshUI();
    showToast("Note duplicated.", "success");
}

function getNote(id){ return db.notes.find(n => n.id === id); }

function deleteNoteWithConfirm(id){
    const note = getNote(id);
    if (!note) return;
    if (!confirm("Move '" + note.title + "' to the Recycle Bin?")) return;
    const snapshot = JSON.parse(JSON.stringify(note));
    note.deleted = true;
    note.trashHidden = false;
    note.deletedAt = new Date().toISOString();
    if (db.settings.autoAssignBinTag && !note.tags.includes("Bin")) note.tags.push("Bin");
    note.modifiedAt = new Date().toISOString();
    if (selectedNoteId === id) selectedNoteId = null;
    if (editingNoteId === id) editingNoteId = null;
    markChanged();
    refreshUI();
    showUndoBar("Note moved to Recycle Bin.", snapshot);
}

function showUndoBar(msg, snapshot){
    undoDeleteSnapshot = snapshot;
    document.getElementById("undoMsg").textContent = msg;
    document.getElementById("undoBar").classList.add("show");
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => {
        document.getElementById("undoBar").classList.remove("show");
        undoDeleteSnapshot = null;
    }, 5000);
}

function undoDelete(){
    if (!undoDeleteSnapshot) return;
    const snapshot = undoDeleteSnapshot;
    const note = getNote(snapshot.id);
    if (note){
        Object.assign(note, snapshot);
        note.modifiedAt = new Date().toISOString();
    } else {
        db.notes.unshift(snapshot);
    }
    undoDeleteSnapshot = null;
    document.getElementById("undoBar").classList.remove("show");
    markChanged();
    refreshUI();
    showToast("Delete undone.", "success");
}

/* =========================================================
   SELECT NOTE
   ========================================================= */
function selectNote(id, event){
    /* Checkbox click? */
    if (event && event.target.classList.contains("has-checkbox")){
        toggleSelect(id);
        return;
    }
    /* Trash: only checkbox */
    if (currentView === "trash"){
        toggleSelect(id);
        return;
    }
    /* Multi mode (any selection) */
    if (selectedIds.size > 0){
        toggleSelect(id);
        return;
    }
    const note = getNote(id);
    if (!note) return;
    selectedNoteId = id;
    editingNoteId = null;
    note.lastViewedAt = new Date().toISOString();
    note.viewCount = Number(note.viewCount || 0) + 1;
    markChanged();
    renderNoteList();
    renderDetail();
    updateDeleteButton();
}

function toggleSelect(id){
    if (selectedIds.has(id)) selectedIds.delete(id);
    else selectedIds.add(id);
    renderNoteList();
    if (currentView === "trash") renderBinToolbar();
    updateDeleteButton();
}

function updateDeleteButton(){
    const btn = document.getElementById("deleteSelectedBtn");
    if (selectedIds.size >= 2){
        btn.classList.remove("hidden");
        btn.textContent = "Delete (" + selectedIds.size + ")";
    } else {
        btn.classList.add("hidden");
    }
}

    const note = getNote(editingNoteId);
    if (!note) return;
    const titleEl = document.getElementById("editTitle");
    const contentEl = document.getElementById("editContent");
    if (titleEl) note.title = titleEl.value.trim() || "Untitled Note";
    if (contentEl) note.content = contentEl.innerText;
    note.editCount = Number(note.editCount || 0) + 1;
    note.modifiedAt = new Date().toISOString();
    markChanged();
    editingNoteId = null;
    refreshUI();
    showToast("Note saved.", "success");
}

/* =========================================================
   RICH TEXT
   ========================================================= */
function execCmd(cmd){
    document.execCommand(cmd, false, null);
    const el = document.getElementById("editContent");
    if (el) el.focus();
}

function insertLinkDialog(){
    const text = prompt("Link text:", "");
    if (text === null) return;
    const url = prompt("Link URL:", "https://");
    if (!url) return;
    const html = `<a href="${escapeAttribute(url)}" target="_blank" rel="noopener">${escapeHtml(text || url)}</a>`;
    document.execCommand("insertHTML", false, html);
}

function insertDateTime(){
    const now = new Date();
    const formatted = formatDateTimeForInsert(now);
    document.execCommand("insertText", false, formatted);
}

function formatDateTimeForInsert(date){
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const d = date.getDate();
    const m = months[date.getMonth()];
    const y = date.getFullYear();
    let h = date.getHours();
    const min = String(date.getMinutes()).padStart(2,"0");
    const s = String(date.getSeconds()).padStart(2,"0");
    const ampm = h >= 12 ? "PM" : "AM";
    h = h % 12; if (h === 0) h = 12;
    const hh = String(h).padStart(2,"0");
    return `${d}-${m}-${y}, ${hh}:${min}:${s} ${ampm}`;
}

/* =========================================================
   COLOUR DROPDOWN (Option E)
   ========================================================= */
function openColorDropdown(event, noteId){
    event.stopPropagation();
    const dp = document.getElementById("dropdownPopup");
    const note = getNote(noteId);
    if (!note) return;
    const currentColor = note.color;

    let html = `<div class="color-swatch-grid">`;
    COLOR_PALETTE.forEach(c => {
        const sel = c === currentColor ? "selected" : "";
        html += `<div class="color-swatch ${sel}" style="background:${c}" onclick="applyColorAndClose('${noteId}','${c}')"></div>`;
    });
    html += `</div>
        <div class="color-custom-row">
            <input id="colorCustomHex" placeholder="#hex" value="${escapeAttribute(currentColor)}">
            <button onclick="applyCustomColor('${noteId}')">OK</button>
        </div>`;

    dp.innerHTML = html;

    /* Position */
    const rect = event.target.getBoundingClientRect();
    dp.style.left = Math.min(rect.left, window.innerWidth - 340) + "px";
    dp.style.top = (rect.bottom + 6) + "px";
    dp.classList.add("show");
}

function applyColorAndClose(noteId, color){
    const note = getNote(noteId);
    if (note){
        note.color = color;
        note.modifiedAt = new Date().toISOString();
        markChanged();
        renderDetail();
        renderNoteList();
    }
    document.getElementById("dropdownPopup").classList.remove("show");
}

function applyCustomColor(noteId){
    const input = document.getElementById("colorCustomHex");
    if (!input) return;
    const val = input.value.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(val)){
        applyColorAndClose(noteId, val);
    } else {
        showToast("Invalid hex colour.", "error");
    }
}

document.addEventListener("click", (e) => {
    const dp = document.getElementById("dropdownPopup");
    if (dp && !dp.contains(e.target)) dp.classList.remove("show");
    const lc = document.getElementById("linkCtxMenu");
    if (lc && !lc.contains(e.target)) lc.classList.remove("show");
    const cm = document.getElementById("contextMenu");
    if (cm && !cm.contains(e.target)) cm.classList.remove("show");
});

/* =========================================================
   LINK CONTEXT MENU (click on link = open; right-click = menu)
   ========================================================= */
function handleLinkClick(event){
    const a = event.target.closest("a");
    if (!a) return;
    if (event.button === 0){
        /* Left click → open in new tab (browser does this by default) */
        return;
    }
}

document.addEventListener("contextmenu", (e) => {
    const a = e.target.closest("a");
    if (!a) return;
    const inContent = e.target.closest(".content-editable, .content-display");
    if (!inContent) return;
    e.preventDefault();
    showLinkContextMenu(e, a.href, a.textContent);
});

/* Long-press for mobile */
let linkLongPressTimer = null;
document.addEventListener("touchstart", (e) => {
    const a = e.target.closest("a");
    if (!a) return;
    const inContent = e.target.closest(".content-editable, .content-display");
    if (!inContent) return;
    linkLongPressTimer = setTimeout(() => {
        showLinkContextMenu(e, a.href, a.textContent);
    }, 600);
});
document.addEventListener("touchend", () => clearTimeout(linkLongPressTimer));
document.addEventListener("touchmove", () => clearTimeout(linkLongPressTimer));

function showLinkContextMenu(event, href, text){
    const menu = document.getElementById("linkCtxMenu");
    const x = event.touches ? event.touches[0].clientX : event.clientX;
    const y = event.touches ? event.touches[0].clientY : event.clientY;
    menu.innerHTML = `
        <button onclick="linkMenuOpen('${escapeAttribute(href)}')">🔗 Open</button>
        <button onclick="linkMenuEdit('${escapeAttribute(href)}','${escapeAttribute(text)}')">✎ Edit</button>
        <button onclick="linkMenuDelete('${escapeAttribute(href)}')">🗑 Delete</button>
        <button onclick="linkMenuCopy('${escapeAttribute(href)}')">📋 Copy Link Address</button>
    `;
    menu.style.left = Math.min(x, window.innerWidth - 200) + "px";
    menu.style.top = Math.min(y, window.innerHeight - 200) + "px";
    menu.classList.add("show");
}

function linkMenuOpen(href){ window.open(href, "_blank"); document.getElementById("linkCtxMenu").classList.remove("show"); }
function linkMenuEdit(href, text){
    document.getElementById("linkCtxMenu").classList.remove("show");
    const newText = prompt("Link text:", text);
    if (newText === null) return;
    const newUrl = prompt("Link URL:", href);
    if (!newUrl) return;
    /* Replace matching anchor in content */
    const note = getNote(editingNoteId || selectedNoteId);
    if (!note) return;
    /* Simple find & replace */
    const escapeRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp('<a[^>]*href="' + escapeRegex(href) + '"[^>]*>.*?<\\/a>', "i");
    if (note.content && note.content.match(re)){
        note.content = note.content.replace(re, `<a href="${escapeAttribute(newUrl)}" target="_blank" rel="noopener">${escapeHtml(newText || newUrl)}</a>`);
    } else {
        note.content = (note.content || "") + ` <a href="${escapeAttribute(newUrl)}" target="_blank">${escapeHtml(newText || newUrl)}</a>`;
    }
    note.modifiedAt = new Date().toISOString();
    markChanged();
    renderDetail();
}
function linkMenuDelete(href){
    document.getElementById("linkCtxMenu").classList.remove("show");
    if (!confirm("Delete this link from the content?")) return;
    const note = getNote(editingNoteId || selectedNoteId);
    if (!note) return;
    const escapeRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp('<a[^>]*href="' + escapeRegex(href) + '"[^>]*>.*?<\\/a>', "gi");
    note.content = (note.content || "").replace(re, "");
    note.modifiedAt = new Date().toISOString();
    markChanged();
    renderDetail();
}
function linkMenuCopy(href){
    navigator.clipboard.writeText(href).then(() => showToast("Link copied.", "success"));
    document.getElementById("linkCtxMenu").classList.remove("show");
}

   CATEGORY ASSIGN POPUP
   ========================================================= */
function openCategoryAssignPopup(noteId){
    const note = getNote(noteId);
    if (!note) return;

    let selectedCatId = note.categoryId;

    function renderTree(){
        const roots = db.categories.filter(c => !c.parentId);
        let html = `<div class="cat-tree-row ${!selectedCatId ? "selected" : ""}" onclick="__catSelect(null, this)">
            <span class="cat-radio"></span>
            <span>📄 Uncat</span>
        </div>`;
        html += roots.map(c => renderCatNode(c, 0)).join("");
        return html;
    }

    function renderCatNode(cat, depth){
        const indent = "— ".repeat(depth);
        const sel = cat.id === selectedCatId ? "selected" : "";
        let html = `<div class="cat-tree-row ${sel}" onclick="__catSelect('${cat.id}', this)">
            <span class="cat-radio"></span>
            <span>📁 ${escapeHtml(indent + cat.name)}</span>
        </div>`;
        const children = db.categories.filter(c => c.parentId === cat.id);
        html += children.map(c => renderCatNode(c, depth + 1)).join("");
        return html;
    }

    openPopup({
        title: "Assign Category",
        bodyHTML: `
            <div class="popup-field">
                <input id="catSearchInput" placeholder="🔍 Search..." oninput="__catFilter(this.value)">
            </div>
            <div class="cat-tree" id="catTreeContainer">${renderTree()}</div>
            <div style="margin-top:10px;display:flex;gap:6px;">
                <button class="popup-btn" id="addSisterBtn" disabled onclick="__catAddSister()">+ Add Sister</button>
                <button class="popup-btn" id="addChildBtn" disabled onclick="__catAddChild()">+ Add Child</button>
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:8px;">
                Selected: <span id="catSelectedLabel">Uncat</span>
            </div>
        `,
        footerHTML: `
            <button class="popup-btn" onclick="closePopup()">Cancel</button>
            <button class="popup-btn primary" id="catAssignSaveBtn">Select</button>
        `,
        onSave: () => {
            note.categoryId = selectedCatId;
            note.modifiedAt = new Date().toISOString();
            markChanged();
            refreshUI();
            showToast("Category assigned.", "success");
            return true;
        }
    });

    /* Refresh tree after popup */
    window.__catSelect = function(id, el){
        selectedCatId = id;
        document.querySelectorAll("#catTreeContainer .cat-tree-row").forEach(r => r.classList.remove("selected"));
        el.classList.add("selected");
        updateCatButtons();
        const label = id ? getCategoryPath(id) : "Uncat";
        document.getElementById("catSelectedLabel").textContent = label;
    };

    window.__catFilter = function(query){
        const q = query.toLowerCase();
        const rows = document.querySelectorAll("#catTreeContainer .cat-tree-row");
        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = !q || text.includes(q) ? "flex" : "none";
        });
    };

    window.__catAddSister = function(){
        if (!selectedCatId){ showToast("Select a category first.", "error"); return; }
        const cat = db.categories.find(c => c.id === selectedCatId);
        if (!cat) return;
        const name = prompt("Sister category name:");
        if (!name || !name.trim()) return;
        const newCat = { id: generateId("cat"), name: name.trim(), parentId: cat.parentId || null };
        db.categories.push(newCat);
        selectedCatId = newCat.id;
        markChanged();
        /* Refresh tree */
        document.getElementById("catTreeContainer").innerHTML = renderTree();
        updateCatButtons();
        document.getElementById("catSelectedLabel").textContent = getCategoryPath(selectedCatId);
    };

    window.__catAddChild = function(){
        if (!selectedCatId){ showToast("Select a category first.", "error"); return; }
        const name = prompt("Child category name:");
        if (!name || !name.trim()) return;
        const newCat = { id: generateId("cat"), name: name.trim(), parentId: selectedCatId };
        db.categories.push(newCat);
        selectedCatId = newCat.id;
        markChanged();
        document.getElementById("catTreeContainer").innerHTML = renderTree();
        updateCatButtons();
        document.getElementById("catSelectedLabel").textContent = getCategoryPath(selectedCatId);
    };

    function updateCatButtons(){
        document.getElementById("addSisterBtn").disabled = !selectedCatId;
        document.getElementById("addChildBtn").disabled = false;
    }
}

function assignTagFromInput(noteId){

    const note = getNote(noteId);
    if (!note) return;
    const tags = parseTags(value);

        if (!db.tags.includes(t)) db.tags.push(t);
    });
    note.modifiedAt = new Date().toISOString();
    input.value = "";
    markChanged();
    renderDetail();
    renderSidebar();
}

function removeTagFromNoteById(noteId, tag){
    const note = getNote(noteId);
    if (!note) return;
    note.tags = note.tags.filter(t => t !== tag);
    note.modifiedAt = new Date().toISOString();
    markChanged();
    renderDetail();
    renderSidebar();
}

function parseTags(text){
    return [...new Set(text.split(",").map(x => x.trim()).filter(Boolean))];
}

                        <td class="value">${note.favorite ? "Yes" : "No"}</td>

                    <tr>
                        <td class="label">Note ID</td>
                        <td class="value">${escapeHtml(note.id.slice(0,12))}</td>

                    <tr>

                        <td class="value">${lines}</td>
                    </tr>
                    <tr>
                        <td class="label">Last Viewed</td>
                        <td class="value">${note.lastViewedAt ? escapeHtml(formatFullDateTime(note.lastViewedAt)) : "Never"}</td>
                        <td class="label">View Count</td>

                    </tr>
                    <tr>
                        <td class="label">Synced</td>

function toggleMetadata(){
    db.settings.metadataCollapsed = !db.settings.metadataCollapsed;
    const body = document.getElementById("metaBody");
    const icon = document.getElementById("metaToggleIcon");
    if (db.settings.metadataCollapsed){
        body.classList.add("collapsed");
        if (icon) icon.textContent = "▸";
    } else {
        body.classList.remove("collapsed");
        if (icon) icon.textContent = "▾";
    }
    markChanged();
}

function resetViewCount(noteId){
    const note = getNote(noteId);
    if (!note) return;
    if (!confirm("Reset view count to 0?")) return;
    note.viewCount = 0;
    note.modifiedAt = new Date().toISOString();
    markChanged();
    renderDetail();
    showToast("View count reset.", "success");
}

function countWords(text){
    if (!text) return 0;
    return text.trim().split(/\s+/).filter(Boolean).length;
}

function countSiblingNotes(noteId, categoryId){
    let count = 0;
    db.notes.forEach(n => {
        if (!n.deleted && n.id !== noteId && n.categoryId === categoryId) count++;
    });
    return count;
}

function getCategoryDepth(catId){
    let depth = 0;
    let current = db.categories.find(c => c.id === catId);
    const guard = new Set();
    while (current && !guard.has(current.id)){
        guard.add(current.id);
        depth++;
        current = current.parentId ? db.categories.find(c => c.id === current.parentId) : null;
    }
    return depth;
}

function daysBetween(d1, d2){
    const ms = Math.abs(d2 - d1);
    return Math.floor(ms / (1000 * 60 * 60 * 24));
}

function relativeTime(value){
    if (!value) return "—";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "—";
    const sec = Math.floor((Date.now() - date.getTime()) / 1000);
    if (sec < 5) return "just now";
    if (sec < 60) return sec + " sec ago";
    const min = Math.floor(sec / 60);
    if (min < 60) return min + " min ago";
    const hrs = Math.floor(min / 60);
    if (hrs < 24) return hrs + " hr ago";
    const days = Math.floor(hrs / 24);
    if (days < 30) return days + " days ago";
    const months = Math.floor(days / 30);
    if (months < 12) return months + " mo ago";
    const years = Math.floor(months / 12);
    return years + " yr ago";
}

function openExportDialog(noteId){
    const note = getNote(noteId);

    openPopup({
        title: "Export Note",

                <button class="popup-btn" onclick="__expQR()">📱 QR Code</button>
            </div>
        `,
        footerHTML: `<button class="popup-btn" onclick="closePopup()">Close</button>`,
        onSave: null
    });

    window.__expCopy = () => {
        navigator.clipboard.writeText(note.title + "\n\n" + note.content).then(() => {
            showToast("Copied.", "success");
            closePopup();
        });
    };
    window.__expPrint = () => {
        const w = window.open("", "_blank");
        w.document.write(`<pre style="font-family:Arial;padding:20px;white-space:pre-wrap;">${escapeHtml(note.title)}\n\n${escapeHtml(note.content)}</pre>`);
        w.document.close();
        w.print();

        const w = window.open("", "_blank");
        w.document.write(`<pre style="font-family:Arial;padding:20px;white-space:pre-wrap;">${escapeHtml(note.title)}\n\n${escapeHtml(note.content)}</pre>`);
        w.document.close();
        setTimeout(() => w.print(), 300);
        closePopup();
    };
    window.__expQR = () => {
        const url = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(note.title + "\n" + note.content.slice(0, 500));
        window.open(url, "_blank");
