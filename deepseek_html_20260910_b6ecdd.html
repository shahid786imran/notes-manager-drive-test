/* =========================================================
   SIDEBAR
   ========================================================= */
function toggleSidebar(){
    sidebarOpen = !sidebarOpen;
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebarOverlay");
    const btn = document.getElementById("floatingToggle");
    if (sidebarOpen){
        sidebar.classList.add("open");
        overlay.classList.add("open");
        btn.innerHTML = `<span class="arrow-icon">◀</span>`;
    } else {
        sidebar.classList.remove("open");
        overlay.classList.remove("open");
        btn.innerHTML = `<span class="hamburger"><span></span><span></span><span></span></span>`;
    }
}

function renderSidebar(){
    const activeNotes = db.notes.filter(n => !n.deleted);
    const catNotes = activeNotes.filter(n => n.categoryId);
    const uncatNotes = activeNotes.filter(n => !n.categoryId);
    const trashCount = db.notes.filter(n => n.deleted && !n.trashHidden).length;

    document.getElementById("allCount").textContent = activeNotes.length;
    document.getElementById("favoriteCount").textContent = activeNotes.filter(n => n.favorite).length;
    document.getElementById("catCount").textContent = catNotes.length;
    document.getElementById("uncatCount").textContent = uncatNotes.length;

    const badge = document.getElementById("binBadge");
    if (trashCount > 0){
        badge.style.display = "inline-block";
        badge.textContent = trashCount;
    } else {
        badge.style.display = "none";
    }

    renderCategories();
    renderTags();
    renderGlobalLinks();
}

function renderCategories(){
    const container = document.getElementById("categoryList");
    const usedIds = new Set();
    db.notes.forEach(note => {
        if (note.deleted) return;
        if (note.categoryId){
            let current = db.categories.find(c => c.id === note.categoryId);
            const guard = new Set();
            while (current && !guard.has(current.id)){
                guard.add(current.id);
                usedIds.add(current.id);
                current = db.categories.find(c => c.id === current.parentId);
            }
        }
    });
    const roots = db.categories.filter(c => !c.parentId && usedIds.has(c.id));
    if (!roots.length){
        container.innerHTML = `<div class="sidebar-subtitle">No categories in use</div>`;
        return;
    }
    container.innerHTML = roots.map(cat => renderCategoryTree(cat, usedIds)).join("");
}

function renderCategoryTree(cat, usedIds){
    if (!usedIds.has(cat.id)) return "";
    const children = db.categories.filter(c => c.parentId === cat.id && usedIds.has(c.id));
    const count = countCategoryNotes(cat.id);
    const hasChildren = children.length > 0;
    const collapsed = db.settings.categoriesCollapsed;
    const childrenHtml = hasChildren
        ? `<div class="tree-children" style="margin-left:14px;display:${collapsed ? 'none':'block'};" id="catChildren-${cat.id}">${children.map(c => renderCategoryTree(c, usedIds)).join("")}</div>`
        : "";
    const expander = hasChildren
        ? `<button class="cat-expander" onclick="event.stopPropagation(); toggleCatNode('${cat.id}', this)">${collapsed ? "+" : "−"}</button>`
        : `<span style="width:18px;display:inline-block;"></span>`;

    return `
        <div class="cat-row" style="padding-left:22px;">
            ${expander}
            <span class="sidebar-icon">📁</span>
            <span class="sidebar-label" onclick="setCategoryView('${cat.id}')" style="cursor:pointer;">${escapeHtml(cat.name)}</span>
            <span class="sidebar-count">${count}</span>
            <div class="cat-row-btns">
                <button class="sidebar-ctrl" title="Rename" onclick="event.stopPropagation(); renameCategory('${cat.id}')">✎</button>
                <button class="sidebar-ctrl danger" title="Remove" onclick="event.stopPropagation(); removeCategory('${cat.id}')">🗑</button>
            </div>
        </div>
        ${childrenHtml}
    `;
}

function toggleCatNode(catId, btn){
    const el = document.getElementById("catChildren-" + catId);
    if (!el) return;
    if (el.style.display === "none"){
        el.style.display = "block";
        btn.textContent = "−";
    } else {
        el.style.display = "none";
        btn.textContent = "+";
    }
}

function countCategoryNotes(catId){
    let count = 0;
    db.notes.forEach(note => {
        if (note.deleted || !note.categoryId) return;
        if (note.categoryId === catId){ count++; return; }
        if (isDescendantOf(note.categoryId, catId)) count++;
    });
    return count;
}

function isDescendantOf(catId, ancestorId){
    let current = db.categories.find(c => c.id === catId);
    const guard = new Set();
    while (current && current.parentId && !guard.has(current.id)){
        guard.add(current.id);
        if (current.parentId === ancestorId) return true;
        current = db.categories.find(c => c.id === current.parentId);
    }
    return false;
}

function getCategoryPath(catId){
    if (!catId) return "";
    const parts = [];
    let current = db.categories.find(c => c.id === catId);
    const guard = new Set();
    while (current && !guard.has(current.id)){
        guard.add(current.id);
        parts.unshift(current.name);
        current = db.categories.find(c => c.id === current.parentId);
    }
    return parts.join(" / ");
}

function renameCategory(id){
    const cat = db.categories.find(c => c.id === id);
    if (!cat) return;
    const name = prompt("Rename category:", cat.name);
    if (!name || !name.trim()) return;
    cat.name = name.trim();
    markChanged();
    renderSidebar();
    refreshUI();
}

function removeCategory(id){
    const cat = db.categories.find(c => c.id === id);
    if (!cat) return;
    if (!confirm("Remove this category? Its notes will be reassigned to the parent category (or Uncat).")) return;
    const parentId = cat.parentId || null;
    db.notes.forEach(note => {
        if (note.categoryId === id){
            note.categoryId = parentId;
            note.modifiedAt = new Date().toISOString();
        }
    });
    const toRemove = new Set([id]);
    let changed = true;
    while (changed){
        changed = false;
        db.categories.forEach(c => {
            if (c.parentId && toRemove.has(c.parentId) && !toRemove.has(c.id)){
                toRemove.add(c.id);
                changed = true;
            }
        });
    }
    db.categories = db.categories.filter(c => !toRemove.has(c.id));
    markChanged();
    renderSidebar();
    refreshUI();
    showToast("Category removed. Notes kept.", "success");
}

function renderTags(){
    const container = document.getElementById("tagList");
    const used = new Set();
    db.notes.forEach(note => {
        if (note.deleted) return;
        note.tags.forEach(t => {
            if (t === "Bin") return;
            used.add(t);
        });
    });
    const sorted = [...used].sort((a,b) => a.localeCompare(b));
    document.getElementById("tagCountTotal").textContent = sorted.length;
    if (!sorted.length){
        container.innerHTML = "";
        return;
    }
    container.innerHTML = sorted.map(tag => {
        const count = db.notes.filter(n => !n.deleted && n.tags.includes(tag)).length;
        return `
            <div class="sidebar-item" style="padding-left:22px;">
                <span class="sidebar-icon">🏷️</span>
                <span class="sidebar-label" onclick="setTagView('${escapeAttribute(tag)}')" style="cursor:pointer;">${escapeHtml(tag)}</span>
                <span class="sidebar-count">${count}</span>
                <div class="sidebar-controls">
                    <button class="sidebar-ctrl" title="Rename" onclick="event.stopPropagation(); renameTag('${escapeAttribute(tag)}')">✎</button>
                    <button class="sidebar-ctrl danger" title="Remove" onclick="event.stopPropagation(); removeTagEverywhere('${escapeAttribute(tag)}')">🗑</button>
                </div>
            </div>
        `;
    }).join("");
}

function renameTag(tag){
    const newName = prompt("Rename tag:", tag);
    if (!newName || !newName.trim()) return;
    const clean = newName.trim();
    db.notes.forEach(note => {
        note.tags = note.tags.map(t => t === tag ? clean : t);
        note.modifiedAt = new Date().toISOString();
    });
    db.tags = db.tags.map(t => t === tag ? clean : t);
    markChanged();
    refreshUI();
    showToast("Tag renamed.", "success");
}

function removeTagEverywhere(tag){
    if (!confirm("Remove tag '" + tag + "' from all notes? Notes will NOT be deleted.")) return;
    db.notes.forEach(note => {
        if (note.tags.includes(tag)){
            note.tags = note.tags.filter(t => t !== tag);
            note.modifiedAt = new Date().toISOString();
        }
    });
    db.tags = db.tags.filter(t => t !== tag);
    markChanged();
    refreshUI();
    showToast("Tag removed. Notes kept.", "success");
}

/* =========================================================
   VIEWS
   ========================================================= */
function setView(view){
    currentView = view;
    currentCategoryId = null;
    currentTagName = null;
    currentPage = 1;
    selectedIds.clear();
    updateSidebarActive();
    renderListTitle();
    renderNoteList();
    renderBinToolbar();
    updateDeleteButton();
}

function setCategoryView(id){
    currentView = "category";
    currentCategoryId = id;
    currentTagName = null;
    currentPage = 1;
    selectedIds.clear();
    updateSidebarActive();
    renderListTitle();
    renderNoteList();
    renderBinToolbar();
    updateDeleteButton();
}

function setTagView(tag){
    currentView = "tag";
    currentTagName = tag;
    currentCategoryId = null;
    currentPage = 1;
    selectedIds.clear();
    updateSidebarActive();
    renderListTitle();
    renderNoteList();
    renderBinToolbar();
    updateDeleteButton();
}

function updateSidebarActive(){
    document.querySelectorAll(".sidebar-item[data-view]").forEach(item => {
        item.classList.toggle("active", item.dataset.view === currentView);
    });
}

function renderListTitle(){
    const title = document.getElementById("listTitle");
    if (currentView === "all") title.textContent = "All Notes";
    else if (currentView === "favorites") title.textContent = "Favorites";
    else if (currentView === "cat") title.textContent = "Cat";
    else if (currentView === "uncat") title.textContent = "Uncat";
    else if (currentView === "trash") title.textContent = db.trash.label || "Recycle Bin";
    else if (currentView === "category"){
        const cat = db.categories.find(c => c.id === currentCategoryId);
        title.textContent = cat ? cat.name : "Category";
    }
    else if (currentView === "tag") title.textContent = "Tag: " + currentTagName;
}

/* =========================================================
   FILTER / SORT
   ========================================================= */
function getVisibleNotes(){
    let notes = [...db.notes];
    if (currentView === "trash"){
        notes = notes.filter(n => n.deleted && !n.trashHidden);
    } else {
        notes = notes.filter(n => !n.deleted);
    }
    if (currentView === "favorites") notes = notes.filter(n => n.favorite);
    if (currentView === "cat") notes = notes.filter(n => n.categoryId);
    if (currentView === "uncat") notes = notes.filter(n => !n.categoryId);
    if (currentView === "category"){
        notes = notes.filter(n =>
            n.categoryId === currentCategoryId ||
            (n.categoryId && isDescendantOf(n.categoryId, currentCategoryId))
        );
    }
    if (currentView === "tag") notes = notes.filter(n => n.tags.includes(currentTagName));
    if (searchText){
        const q = searchText.toLowerCase();
        notes = notes.filter(n => {
            const cat = getCategoryPath(n.categoryId);
            return (
                n.title.toLowerCase().includes(q) ||
                n.content.toLowerCase().includes(q) ||
                cat.toLowerCase().includes(q) ||
                n.tags.join(" ").toLowerCase().includes(q)
            );
        });
    }
    return sortNotes(notes);
}

function sortNotes(notes){
    const s = db.settings.sorting;
    if (s === "Alphabetical") return notes.sort((a,b) => a.title.localeCompare(b.title));
    if (s === "Newest") return notes.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
    if (s === "Oldest") return notes.sort((a,b) => new Date(a.createdAt) - new Date(b.createdAt));
    return notes.sort((a,b) => new Date(b.modifiedAt) - new Date(a.modifiedAt));
}

function changeSortFromBar(value){
    db.settings.sorting = value;
    markChanged();
    renderNoteList();
}

/* =========================================================
   RENDER NOTE LIST
   ========================================================= */
function renderNoteList(){
    const container = document.getElementById("noteList");
    let notes = getVisibleNotes();
    document.getElementById("listCount").textContent = notes.length;

    const perPage = db.settings.notesPerPage;
    let pages = 1;
    if (perPage !== "All"){
        const n = Number(perPage);
        pages = Math.max(1, Math.ceil(notes.length / n));
        currentPage = Math.min(currentPage, pages);
        const start = (currentPage - 1) * n;
        notes = notes.slice(start, start + n);
    } else {
        currentPage = 1;
    }

    if (!notes.length){
        container.innerHTML = `<div class="empty">No notes found.</div>`;
        renderPagination(1);
        return;
    }

    container.innerHTML = notes.map(note => renderNoteRow(note)).join("");
    renderPagination(pages);
}

function renderNoteRow(note){
    const previewLen = db.settings.contentPreviewLength || 60;
    const contentPreview = note.content.replace(/\s+/g, " ").trim().slice(0, previewLen);
    const lastCat = note.categoryId ? (db.categories.find(c => c.id === note.categoryId) || {}).name || "" : "";
    const date = formatFullDateTime(note.modifiedAt);
    const relTime = relativeTime(note.modifiedAt);
    const isMs = selectedIds.has(note.id);
    const isTrash = currentView === "trash";
    const filteredTags = note.tags.filter(t => t !== "Bin");
    const tagsShown = filteredTags.slice(0, 5);
    const tagsMore = filteredTags.length > 5 ? " ..." : "";
    const tagsPreview = tagsShown.map(t => `<span class="meta-chip">🏷️ ${escapeHtml(t)}</span>`).join(" ");
    const lineCount = db.settings.noteLineCount || 3;

    if (isTrash){
        return `
            <div class="note-row has-checkbox ${isMs ? "ms-selected" : ""}" onclick="selectNote('${note.id}')">
                <div class="note-marker" style="--note-color:${escapeAttribute(note.color)}"></div>
                <div class="note-row-body">
                    <div class="note-line1">
                        <span class="note-line1-title">${escapeHtml(note.title)}</span>
                        ${lineCount >= 2 ? `<span class="note-line1-content">${escapeHtml(contentPreview || "No content")}</span>` : ""}
                    </div>
                    ${lineCount >= 3 ? `<div class="note-line2">
                        ${lastCat ? `<span class="meta-chip">📁 ${escapeHtml(lastCat)}</span>` : `<span class="meta-chip" style="color:var(--muted);">📁 Uncat</span>`}
                        ${tagsPreview}${tagsMore}
                    </div>` : ""}
                    ${lineCount >= 3 ? `<div class="note-line3">🕒 ${escapeHtml(date)} (${escapeHtml(relTime)})</div>` : ""}
                </div>
                <div class="note-row-right">
                    <button class="row-icon-btn success" title="Restore" onclick="event.stopPropagation(); restoreNote('${note.id}')">↩ Restore</button>
                    <button class="row-icon-btn danger" title="Permanent Delete" onclick="event.stopPropagation(); permanentDeleteNote('${note.id}')">🗑 Delete</button>
                </div>
            </div>
        `;
    }

    return `
        <div class="note-row has-checkbox ${selectedNoteId === note.id ? "active" : ""} ${isMs ? "ms-selected" : ""}"
             onclick="selectNote('${note.id}')"
             oncontextmenu="event.preventDefault(); showContextMenu(event, '${note.id}');">
            <div class="note-marker" style="--note-color:${escapeAttribute(note.color)}"></div>
            <div class="note-row-body">
                <div class="note-line1">
                    <span class="note-line1-title">${escapeHtml(note.title)}</span>
                    ${lineCount >= 2 ? `<span class="note-line1-content">${escapeHtml(contentPreview || "No content")}</span>` : ""}
                </div>
                ${lineCount >= 3 ? `<div class="note-line2">
                    ${lastCat ? `<span class="meta-chip">📁 ${escapeHtml(lastCat)}</span>` : `<span class="meta-chip" style="color:var(--muted);">📁 Uncat</span>`}
                    ${tagsPreview}${tagsMore}
                </div>` : ""}
                ${lineCount >= 3 ? `<div class="note-line3">🕒 ${escapeHtml(date)} (${escapeHtml(relTime)})</div>` : ""}
            </div>
            <div class="note-row-right">
                <button class="row-icon-btn ${note.pinned ? "pin-on" : ""}" title="Pin/Unpin" onclick="event.stopPropagation(); togglePinned('${note.id}')">📌 ${note.pinned ? "Pinned" : "Pin"}</button>
                <button class="row-icon-btn ${note.favorite ? "fav-on" : ""}" title="Favorite" onclick="event.stopPropagation(); toggleFavorite('${note.id}')">${note.favorite ? "★ Fav" : "☆ Fav"}</button>
                <button class="row-icon-btn edit-btn" title="Edit" onclick="event.stopPropagation(); editingNoteId='${note.id}'; selectedNoteId='${note.id}'; renderDetail();">✎ Edit</button>
                <button class="row-icon-btn danger" title="Delete" onclick="event.stopPropagation(); deleteNoteWithConfirm('${note.id}')">🗑 Delete</button>
            </div>
        </div>
    `;
}

/* =========================================================
   CONTEXT MENU
   ========================================================= */
function showContextMenu(event, noteId){
    event.preventDefault();
    const menu = document.getElementById("contextMenu");
    menu.innerHTML = `
        <button onclick="ctxDuplicate('${noteId}')">⎘ Duplicate</button>
        <button onclick="ctxTogglePin('${noteId}')">📌 Toggle Pin</button>
        <button onclick="ctxToggleFav('${noteId}')">⭐ Toggle Favorite</button>
        <button onclick="ctxExport('${noteId}')">↗ Export</button>
        <button style="color:#dc2626;" onclick="ctxDelete('${noteId}')">🗑 Delete</button>
    `;
    const x = event.touches ? event.touches[0].clientX : event.clientX;
    const y = event.touches ? event.touches[0].clientY : event.clientY;
    menu.style.left = Math.min(x, window.innerWidth - 200) + "px";
    menu.style.top = Math.min(y, window.innerHeight - 200) + "px";
    menu.classList.add("show");
}

function ctxDuplicate(id){ duplicateNote(id); closeCtx(); }
function ctxTogglePin(id){ togglePinned(id); closeCtx(); }
function ctxToggleFav(id){ toggleFavorite(id); closeCtx(); }
function ctxExport(id){ openExportDialog(id); closeCtx(); }
function ctxDelete(id){ deleteNoteWithConfirm(id); closeCtx(); }
function closeCtx(){ document.getElementById("contextMenu").classList.remove("show"); }

/* Long press */
let noteLongPressTimer = null;
document.addEventListener("touchstart", (e) => {
    const row = e.target.closest(".note-row");
    if (!row) return;
    noteLongPressTimer = setTimeout(() => {
        const noteId = row.getAttribute("onclick")?.match(/'([^']+)'/)?.[1];
        if (noteId) showContextMenu(e, noteId);
    }, 600);
});
document.addEventListener("touchend", () => clearTimeout(noteLongPressTimer));
document.addEventListener("touchmove", () => clearTimeout(noteLongPressTimer));

/* =========================================================
   PAGINATION
   ========================================================= */
function renderPagination(pages){
    const container = document.getElementById("pagination");
    if (pages <= 1){ container.style.display = "none"; return; }
    container.style.display = "flex";
    container.innerHTML = `
        <button onclick="changePage(-1)" ${currentPage <= 1 ? "disabled" : ""}>Prev</button>
        <span style="font-size:12px;">${currentPage} / ${pages}</span>
        <button onclick="changePage(1)" ${currentPage >= pages ? "disabled" : ""}>Next</button>
    `;
}

function changePage(delta){
    currentPage += delta;
    renderNoteList();
}

/* =========================================================
   RECYCLE BIN ACTIONS
   ========================================================= */
function renderBinToolbar(){
    const wrap = document.getElementById("binToolbarWrap");
    if (!wrap) return;
    if (currentView !== "trash"){
        wrap.innerHTML = "";
        return;
    }
    const total = db.notes.filter(n => n.deleted && !n.trashHidden).length;
    const selCount = selectedIds.size;
    wrap.innerHTML = `
        <div class="bin-toolbar">
            <button class="ctrl-btn success" onclick="binRestoreSelected()" ${selCount ? "" : "disabled"}>↩ Restore</button>
            <button class="ctrl-btn danger" onclick="binPermanentDeleteSelected()" ${selCount ? "" : "disabled"}>🗑 Delete</button>
            <button class="ctrl-btn danger" onclick="emptyBin()" ${total ? "" : "disabled"}>Empty Bin</button>
            <span class="bin-toolbar-info">${selCount} of ${total} selected</span>
        </div>
    `;
}

function restoreNote(id){
    const note = getNote(id);
    if (!note) return;
    note.deleted = false;
    note.trashHidden = false;
    note.restoredCount = Number(note.restoredCount || 0) + 1;
    note.lastRestoredAt = new Date().toISOString();
    note.modifiedAt = new Date().toISOString();
    markChanged();
    refreshUI();
    showToast("Note restored.", "success");
}

function permanentDeleteNote(id){
    const note = getNote(id);
    if (!note) return;
    if (!confirm("Permanently delete '" + note.title + "'? This cannot be undone.")) return;
    db.notes = db.notes.filter(n => n.id !== id);
    selectedIds.delete(id);
    markChanged();
    refreshUI();
    showToast("Permanently deleted.", "success");
}

function binRestoreSelected(){
    if (!selectedIds.size){ showToast("Select notes first.", "normal"); return; }
    selectedIds.forEach(id => {
        const note = getNote(id);
        if (note){
            note.deleted = false;
            note.trashHidden = false;
            note.restoredCount = Number(note.restoredCount || 0) + 1;
            note.lastRestoredAt = new Date().toISOString();
            note.modifiedAt = new Date().toISOString();
        }
    });
    selectedIds.clear();
    markChanged();
    refreshUI();
    showToast("Selected notes restored.", "success");
}

function binPermanentDeleteSelected(){
    if (!selectedIds.size){ showToast("Select notes first.", "normal"); return; }
    if (!confirm("Permanently delete " + selectedIds.size + " note(s)? This cannot be undone.")) return;
    db.notes = db.notes.filter(n => !selectedIds.has(n.id));
    selectedIds.clear();
    markChanged();
    refreshUI();
    showToast("Selected notes permanently deleted.", "success");
}

function emptyBin(){
    const deleted = db.notes.filter(n => n.deleted && !n.trashHidden);
    if (!deleted.length){ showToast("Recycle Bin is empty.", "normal"); return; }
    if (!confirm("Empty Recycle Bin? All " + deleted.length + " notes will be PERMANENTLY deleted.")) return;
    db.notes = db.notes.filter(n => !(n.deleted && !n.trashHidden));
    selectedIds.clear();
    markChanged();
    refreshUI();
    showToast("Recycle Bin emptied permanently.", "success");
}

function deleteSelected(){
    if (!selectedIds.size){ showToast("No notes selected.", "normal"); return; }
    if (currentView === "trash"){ binPermanentDeleteSelected(); return; }
    if (!confirm("Move " + selectedIds.size + " note(s) to Recycle Bin?")) return;
    selectedIds.forEach(id => {
        const note = getNote(id);
        if (note){
            note.deleted = true;
            note.trashHidden = false;
            note.deletedAt = new Date().toISOString();
            if (db.settings.autoAssignBinTag && !note.tags.includes("Bin")) note.tags.push("Bin");
            note.modifiedAt = new Date().toISOString();
        }
    });
    selectedIds.clear();
    markChanged();
    refreshUI();
    showToast("Selected notes moved to Recycle Bin.", "success");
}

   SETTINGS
   ========================================================= */

    currentView = "settings";
    document.getElementById("listTitle").textContent = "Settings";
    document.getElementById("listCount").textContent = "";
    document.getElementById("noteList").innerHTML = "";
    document.getElementById("binToolbarWrap").innerHTML = "";
    document.getElementById("pagination").style.display = "none";
    const detail = document.getElementById("detailBody");
    detail.innerHTML = renderSettings();
    selectedNoteId = null;
    editingNoteId = null;
}

        <div style="padding:14px;">

            <div class="settings-grid">
                <div class="setting">
                    <label>Theme</label>
                    <select onchange="saveSetting('theme',this.value)">
                        ${option("Day", s.theme)}${option("Night", s.theme)}${option("System", s.theme)}
                    </select>
                </div>
                <div class="setting">
                    <label>Font Size</label>
                    <select onchange="saveSetting('fontSize',this.value)">
                        ${option("Small", s.fontSize)}${option("Normal", s.fontSize)}${option("Large", s.fontSize)}${option("Extra Large", s.fontSize)}
                    </select>
                </div>
                <div class="setting">
                    <label>Sorting</label>
                    <select onchange="saveSetting('sorting',this.value)">
                        ${option("Last Modified First", s.sorting)}${option("Newest", s.sorting)}${option("Oldest", s.sorting)}${option("Alphabetical", s.sorting)}
                    </select>
                </div>
                <div class="setting">
                    <label>Notes Per Page</label>
                    <select onchange="saveSetting('notesPerPage', this.value === 'All' ? 'All' : Number(this.value))">
                        ${["5","10","20","50","100","All"].map(x => `<option value="${x}" ${String(s.notesPerPage) === x ? "selected" : ""}>${x}</option>`).join("")}
                    </select>
                </div>
                <div class="setting">
                    <label>Note List Height</label>
                    <select onchange="saveSetting('notesVisibleNoScroll', this.value === 'All' ? 'All' : Number(this.value))">
                        ${["3","5","10","15","20","All"].map(x => `<option value="${x}" ${String(s.notesVisibleNoScroll) === x ? "selected" : ""}>${x === "All" ? "All" : x + " notes"}</option>`).join("")}
                    </select>
                </div>
                <div class="setting">
                    <label>Note Line Count</label>
                    <select onchange="saveSetting('noteLineCount',Number(this.value))">
                        ${[2,3,4].map(x => `<option value="${x}" ${s.noteLineCount === x ? "selected" : ""}>${x} lines</option>`).join("")}
                    </select>
                </div>
                <div class="setting">
                    <label>Content Preview Length</label>
                    <select onchange="saveSetting('contentPreviewLength',Number(this.value))">
                        ${[40,60,100,150].map(x => `<option value="${x}" ${Number(s.contentPreviewLength) === x ? "selected" : ""}>${x} chars</option>`).join("")}
                    </select>
                </div>
                <div class="setting">
                    <label>Sidebar Width</label>
                    <select onchange="saveSetting('sidebarWidth', Number(this.value))">
                        <option value="240" ${s.sidebarWidth === 240 ? "selected" : ""}>Narrow (240px)</option>
                        <option value="290" ${s.sidebarWidth === 290 ? "selected" : ""}>Normal (290px)</option>
                        <option value="340" ${s.sidebarWidth === 340 ? "selected" : ""}>Wide (340px)</option>
                        <option value="400" ${s.sidebarWidth === 400 ? "selected" : ""}>Extra Wide (400px)</option>
                    </select>
                </div>
                <div class="setting">
                    <label>Sidebar Border</label>
                    <select onchange="saveSetting('sidebarBorder',Number(this.value))">
                        ${[0,1,2,3].map(x => `<option value="${x}" ${Number(s.sidebarBorder) === x ? "selected" : ""}>${x}px</option>`).join("")}
                    </select>
                </div>
                <div class="setting">
                    <label>Section Height</label>
                    <select onchange="saveSetting('sectionHeight',Number(this.value))">
                        ${[32,38,44,50].map(x => `<option value="${x}" ${Number(s.sectionHeight) === x ? "selected" : ""}>${x}px</option>`).join("")}
                    </select>
                </div>
                <div class="setting">
                    <label>Note List Background</label>
                    <input type="color" value="${escapeAttribute(s.noteListBg || '#ffffff')}" onchange="saveSetting('noteListBg',this.value)">
                </div>
                <div class="setting">
                    <label>Note Panel Background</label>
                    <input type="color" value="${escapeAttribute(s.notePanelBg || '#ffffff')}" onchange="saveSetting('notePanelBg',this.value)">
                </div>
                <div class="setting">
                    <label>Autosave</label>
                    <select onchange="saveSetting('autosave',this.value === 'true')">
                        <option value="true" ${s.autosave ? "selected" : ""}>On</option>
                        <option value="false" ${!s.autosave ? "selected" : ""}>Off</option>
                    </select>
                </div>
                <div class="setting">
                    <label>Autosave Interval</label>
                    <select onchange="saveSetting('autosaveInterval',Number(this.value))">
                        ${[5,10,15,30,60].map(x => `<option value="${x}" ${Number(s.autosaveInterval) === x ? "selected" : ""}>${x} sec</option>`).join("")}
                    </select>
                </div>
                <div class="setting">
                    <label>Delete Confirmation</label>
                    <select onchange="saveSetting('deleteConfirmation',this.value === 'true')">
                        <option value="true" ${s.deleteConfirmation ? "selected" : ""}>On</option>
                        <option value="false" ${!s.deleteConfirmation ? "selected" : ""}>Off</option>
                    </select>
                </div>
                <div class="setting">
                    <label>Date / Time Format</label>
                    <select onchange="saveSetting('dateTimeFormat',this.value)">
                        ${option("Local", s.dateTimeFormat)}${option("12 Hour", s.dateTimeFormat)}${option("24 Hour", s.dateTimeFormat)}
                    </select>
                </div>
                <div class="setting">
                    <label>Default Note Colour</label>
                    <input type="color" value="${escapeAttribute(s.defaultNoteColor || '#64748b')}" onchange="saveSetting('defaultNoteColor',this.value)">
                </div>
                <div class="setting">
                    <label>Auto-assign "Bin" tag</label>
                    <select onchange="saveSetting('autoAssignBinTag',this.value === 'true')">
                        <option value="true" ${s.autoAssignBinTag ? "selected" : ""}>On</option>
                        <option value="false" ${!s.autoAssignBinTag ? "selected" : ""}>Off</option>
                    </select>
                </div>
                <div class="setting">
                    <label>Metadata Default</label>
                    <select onchange="saveSetting('metadataCollapsed',this.value === 'true')">
                        <option value="true" ${s.metadataCollapsed ? "selected" : ""}>Collapsed</option>
                        <option value="false" ${!s.metadataCollapsed ? "selected" : ""}>Expanded</option>
                    </select>
                </div>
                <div class="setting">
                    <label>Categories Default</label>
                    <select onchange="saveSetting('categoriesCollapsed',this.value === 'true')">
                        <option value="true" ${s.categoriesCollapsed ? "selected" : ""}>Collapsed</option>
                        <option value="false" ${!s.categoriesCollapsed ? "selected" : ""}>Expanded</option>
                    </select>
                </div>
                <div class="setting">
                    <label>Recycle Bin Name</label>
                    <select onchange="changeTrashLabel(this.value)">
                        ${["Recycle Bin","Trash","Dustbin","Deleted Items","Bin","Waste Bin"].map(x => `<option ${x === db.trash.label ? "selected" : ""}>${escapeHtml(x)}</option>`).join("")}
                    </select>
                </div>
            </div>

            <div style="margin-top:18px;display:flex;gap:6px;flex-wrap:wrap;">
                <button class="ctrl-btn" onclick="exportDatabaseJSON()">Export JSON</button>
                <button class="ctrl-btn" onclick="showDatabaseStats()">Show Stats</button>
            </div>

            <div style="margin-top:20px;padding:12px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);font-size:11px;color:var(--muted);">
                <strong style="color:var(--text);">Database File:</strong> ${escapeHtml(DATABASE_NAME)}<br>
                <strong style="color:var(--text);">Drive Link:</strong> 
                ${databaseFolderId ? `<a href="https://drive.google.com/drive/folders/${databaseFolderId}" target="_blank" style="color:var(--primary);">Open Folder</a>` : 
                  databaseFileId ? `<a href="https://drive.google.com/file/d/${databaseFileId}/view" target="_blank" style="color:var(--primary);">Open File</a>` : "Not connected"}
            </div>
        </div>
    `;
}

function option(value, selected){
    return `<option value="${escapeAttribute(value)}" ${value === selected ? "selected" : ""}>${escapeHtml(value)}</option>`;
}

function saveSetting(key, value){
    db.settings[key] = value;
    applySettings();
    markChanged();
    showToast("Setting saved.", "success");
}

function changeTrashLabel(value){
    db.trash.label = value;
    markChanged();
    document.getElementById("trashLabel").textContent = value;
    renderListTitle();
}

function exportDatabaseJSON(){
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "NotesManagerDB_export_" + Date.now() + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
    showToast("Exported.", "success");
}

function showDatabaseStats(){
    const active = db.notes.filter(n => !n.deleted).length;
    const deleted = db.notes.filter(n => n.deleted).length;
    const cats = db.categories.length;
    const tags = new Set();
    db.notes.forEach(n => n.tags.forEach(t => { if (t !== "Bin") tags.add(t); }));
    alert(
        "Database Stats:\n\n" +
        "Active Notes: " + active + "\n" +
        "Deleted Notes: " + deleted + "\n" +
        "Categories: " + cats + "\n" +
        "Unique Tags: " + tags.size + "\n" +
        "Global Links: " + globalLinks.length
    );
}

/* =========================================================
   APPLY SETTINGS
   ========================================================= */
function applySettings(){
    const theme = db.settings.theme;
    document.body.classList.remove("night");
    if (theme === "Night"){
        document.body.classList.add("night");
    } else if (theme === "System"){
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){
            document.body.classList.add("night");
        }
    }
    const fontSizes = { "Small":"13px", "Normal":"15px", "Large":"17px", "Extra Large":"19px" };
    document.documentElement.style.setProperty("--font-size", fontSizes[db.settings.fontSize] || "15px");
    if (db.settings.sidebarWidth) document.documentElement.style.setProperty("--sidebar-width", db.settings.sidebarWidth + "px");
    if (db.settings.sidebarBorder !== undefined) document.documentElement.style.setProperty("--sidebar-border", db.settings.sidebarBorder + "px");
    if (db.settings.sectionHeight) document.documentElement.style.setProperty("--section-height", db.settings.sectionHeight + "px");
    if (db.settings.noteListBg) document.documentElement.style.setProperty("--note-list-bg", db.settings.noteListBg);
    if (db.settings.notePanelBg) document.documentElement.style.setProperty("--note-panel-bg", db.settings.notePanelBg);

    /* Note list fixed height based on setting */
    const listEl = document.getElementById("noteList");
    if (listEl){
        const visible = db.settings.notesVisibleNoScroll;
        const rowHeight = 88;
        if (visible === "All"){
            listEl.style.height = "auto";
            listEl.style.maxHeight = "calc(100vh - 240px)";
        } else {
            const h = (Number(visible) * rowHeight) + "px";
            listEl.style.height = h;
            listEl.style.maxHeight = h;
        }
    }

    document.getElementById("trashLabel").textContent = db.trash.label || "Recycle Bin";
    updateFooter();
}

/* =========================================================
   REFRESH
   ========================================================= */
function refreshUI(){
    if (currentView === "settings"){ openSettings(); return; }
    renderSidebar();
    renderListTitle();
    renderNoteList();
    renderBinToolbar();
    renderDetail();
    updateDeleteButton();
    const sf = document.getElementById("sortFilter");

}

document.getElementById("searchInput").addEventListener("input", function(){

document.addEventListener("keydown", function(e){

/* =========================================================
   DATE / TIME FORMATTING
   ========================================================= */
function formatFullDateTime(value){
    if (!value) return "—";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "—";
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const d = date.getDate();
    const m = months[date.getMonth()];
    const y = date.getFullYear();
    let h = date.getHours();
    const min = String(date.getMinutes()).padStart(2,"0");
    const s = String(date.getSeconds()).padStart(2,"0");
    const ampm = h >= 12 ? "AM" : "PM";
    h = h % 12; if (h === 0) h = 12;
    const hh = String(h).padStart(2,"0");
    return `${d}-${m}-${y}, ${hh}:${min}:${s} ${ampm}`;
}

function formatShortTime(value){
    if (!value) return "—";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "—";
    return date.toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit", hour12:true });
}

/* =========================================================
   UTILITIES
   ========================================================= */
function generateId(prefix){
    return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
}

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value){ return escapeHtml(value); }

function showToast(message, type = "normal"){
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove("show"), 2500);
}

/* =========================================================
   INIT
   ========================================================= */
function initializeApp(){
    sidebarOpen = false;
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("open");
    db = normalizeDatabase(db);
    globalLinks = Array.isArray(db.globalLinks) ? db.globalLinks : [];
    applySettings();
    renderSidebar();
    renderListTitle();
    renderNoteList();
    renderBinToolbar();
    renderDetail();
    updateSyncStatus();
    updateFooter();
    updateLastSyncDisplay();
    updateLastChangeDisplay();
    startRelTimeTicker();
    initializeGoogle();
}

if (window.matchMedia){
    const media = window.matchMedia("(prefers-color-scheme: dark)");
    media.addEventListener("change", () => {
        if (db.settings.theme === "System") applySettings();
    });
}

initializeApp();
</script>
